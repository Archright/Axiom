# license-attribution — audited detection attributions for the
# publication-integrity license-scan (tools/ci/publication_license_eval.nim).
#
# WHY THIS EXISTS: a text-pattern scanner cannot distinguish a license
# GRANT (the file is shipped under that license) from a license MENTION
# (a document that names licenses, quotes a notice, or lists subject
# paths). This file records the audited conclusion for each such
# detection, per (file, license-atom) and (file, copyright-holder) —
# the ORT/ScanCode "license conclusions" idiom, grounded in the audited
# evidence docs:
#   - docs/evidence/sal10_publication/B1_third_party_inventory.md (what is
#     third-party, and what each file's license IS)
#   - docs/evidence/sal10_publication/B2_copyright_report.md (the copyright
#     line inventory)
#
# FAIL-CLOSED PROPERTY: entries are EXACT (file, atom) and (file, holder)
# pairs — there is NO file glob, NO license glob, NO catch-all. A NEW
# detection has no entry here and FAILS the gate. Adding an entry is a
# visible, reviewed act (a diff in this file), never a silent rule
# weakening (AGENTS.md §0.9).
#
# REVIEW RULE: an attribution for an atom of a DENIED license family
# (license-policy.yml deniedLicenseFamilies) must use classification
# "documentary-mention" — the reviewer explicitly asserts the text is
# ABOUT the license, not a grant of it.
#
# Classification vocabulary (closed set, enforced by the evaluator):
#   self-license-text        — the SAL-1.0 / CLA legal text itself
#                              (ScanCode has no SAL rule, so it decomposes
#                              into clause-level rule matches)
#   documentary-mention      — a document naming/quoting licenses or
#                              copyright lines (incl. the policy and
#                              notices that list DENIED family names)
#   subject-manifest-record  — a manifest/blob listing of third-party
#                              subject files (paths only, no grant)
#   upstream-header          — a real upstream header inside an
#                              already-declared THIRD_PARTY file
#   spurious-scanner-match   — a rule false-positive on path/comment
#                              tokens (e.g. 2-token rules matching
#                              "json/LICENSE-APACHE" path components)
#
# Stale entries (detection no longer occurs) are counted as unused in the
# report — a cleanup signal, not a failure.
#
# Format contract: restricted YAML subset consumed by
# tools/ci/publication_yaml.nim (flat mappings, quoted strings, `- ` lists,
# 2-space indent).

schemaVersion: "1"
policyId: "axiom-license-attribution-v1"
basis: "docs/evidence/sal10_publication/B1_third_party_inventory.md + B2_copyright_report.md"

attributions:
  # ── self-license-text ──────────────────────────────────────────────────
  - file: "LICENSE"
    classification: "self-license-text"
    evidence: "the SAL 1.0 text itself; ScanCode has no SAL rule so it decomposes into clause refs (Apache-2.0-derived sections + generic clauses); B2 §1"
    licenses:
      - "Apache-2.0"
      - "LicenseRef-scancode-generic-cla"
      - "LicenseRef-scancode-other-permissive"
      - "LicenseRef-scancode-proprietary-license"
      - "LicenseRef-scancode-unknown-license-reference"
      - "LicenseRef-scancode-warranty-disclaimer"
    copyrights:
      - "Copyright in Third-Party Materials"
  - file: "README.md"
    classification: "self-license-text"
    evidence: "README license section quotes the SAL notice; same clause-level decomposition as LICENSE"
    licenses:
      - "Apache-2.0"
      - "LicenseRef-scancode-generic-cla"
      - "LicenseRef-scancode-other-permissive"
      - "LicenseRef-scancode-proprietary-license"
      - "LicenseRef-scancode-unknown-license-reference"
      - "LicenseRef-scancode-warranty-disclaimer"
  - file: "CLA/Corporate-CLA.md"
    classification: "self-license-text"
    evidence: "Axiom's own Corporate CLA legal text; scancode CLA rules match the contribution terms"
    licenses:
      - "LicenseRef-scancode-generic-cla"
      - "LicenseRef-scancode-unknown"
      - "LicenseRef-scancode-unknown-license-reference"
  - file: "CLA/Individual-CLA.md"
    classification: "self-license-text"
    evidence: "Axiom's own Individual CLA legal text; scancode CLA rules match the contribution terms"
    licenses:
      - "LicenseRef-scancode-generic-cla"
      - "LicenseRef-scancode-unknown"
      - "LicenseRef-scancode-unknown-license-reference"

  # ── documentary-mention ────────────────────────────────────────────────
  - file: "THIRD-PARTY-NOTICES.md"
    classification: "documentary-mention"
    evidence: "the distribution notices quote third-party license/copyright lines verbatim (B1 §1-§7), including the LibTomCrypt header line quoted in §1's embedded-header note for sha512.c"
    licenses:
      - "Apache-2.0"
      - "CC-BY-4.0"
      - "JSON"
      - "LicenseRef-scancode-public-domain-disclaimer"
      - "LicenseRef-scancode-unknown-license-reference"
      - "MIT"
      - "Zlib"
    copyrights:
