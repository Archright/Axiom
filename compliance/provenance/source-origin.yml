# source-origin — the per-path origin declarations for the whole tracked
# tree (publication-integrity provenance-validate input).
#
# Authority: docs/evidence/sal10_publication/B1_third_party_inventory.md
# (the audited inventory) + THIRD-PARTY-NOTICES.md (distribution notices).
# Every tracked file MUST be covered by at least one declaration; there is
# NO catch-all glob, so a file in an undeclared scope fails
# provenance-validation (fail-closed by construction — a new top-level file
# must be declared to pass).
#
# Matching semantics (tools/ci/publication_provenance_validator.nim):
#   - "dir/**" matches the directory itself and everything under it;
#   - an exact path matches exactly that file;
#   - a declaration's "exclude" list (exact paths) removes those files from
#     that declaration's scope — an excluded file must be covered by another
#     declaration or it is UNDECLARED (exclusion without re-declaration
#     stays a hole, never a pass);
#   - a file MAY match several rules only if ALL matching rules agree on
#     (origin, license) — a disagreement is an INCONSISTENT verdict (FAIL),
#     never silently resolved by specificity.
#
# Format contract: restricted YAML subset consumed by
# tools/ci/publication_yaml.nim (flat mappings, quoted strings, `- ` lists,
# 2-space indent).

schemaVersion: "1"
policyId: "axiom-source-origin-v1"
basis: "docs/evidence/sal10_publication/B1_third_party_inventory.md + THIRD-PARTY-NOTICES.md"

