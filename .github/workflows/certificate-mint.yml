          app_out="$(cd "$B_CHECKOUT_DIR" && GITHUB_TOKEN="$GITHUB_TOKEN" \
            "$ax" evidence ledger-append "$rec_file")" \
            || fail "judgment ledger-append failed (transport/validation)"
          if printf '%s' "$app_out" | grep -q "no-op"; then
            CJT=0
            echo "MINT_JUDGAPPEND: OK — idempotent no-op (judgment key ${ev_key:0:12} already stored, append exactly-once: 0)"
          else
            CJT=1
            echo "MINT_JUDGAPPEND: OK — judgment record appended (key ${ev_key:0:12}, append exactly-once: 1)"
          fi
          [ "$CJT" = "0" ] || [ "$CJT" = "1" ] || fail "exactly-once assertion: judgment append count '$CJT' not in {0,1}"
          echo "MINT_JUDGAPPEND_COUNT=$CJT"
          echo "MINT_JUDGAPPEND_COUNT=$CJT" >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────────────────────
      # (P7c-x) [SL-15] extension judgment records (proof_integrity /
      #      d2_golden / d2_persist) → judgment CAS ledger append
      #      (exactly-once per evidenceKey — the s1a P7c pattern applied to
      #      the other three GO-critical subjects; contract §5 per-unit
      #      independence — each subject's record is bound and appended on
      #      its own key):
      #      A. retrieval — the SAME `judgment-record-<H>-<attempt>` artifact
      #         (per-subject record files) + the witness source artifact.
      #      B. binding — per subject: the witness `.semantic.judgments[]`
      #         element naming THAT subject (exactly one; absence of a
      #         binding for an armed subject is fail-closed), basis ∈
      #         {EXECUTED,REUSED}, evidenceKey == record evidenceKey,
      #         witness projection == record payload BYTES, sha256 ==
      #         projectionSha256 (the same §5-(d) byte-level binding).
      #      C. append — `ax evidence ledger-append <record>`; per-subject
      #         exactly-once 0/1 (no-op → 0, append → 1), else fail-closed.
      # ────────────────────────────────────────────────────────────────
      - name: "(P7c-x) [SL-15] extension judgment records → judgment CAS ledger append (exactly-once ×3)"
        # ADR-0032 (b),(f): 원장 append는 landing 전용 — preflight는 정본 증거를
        # 발행하지 않으며 B-built bin/ax가 없다(venue-gate 누락 결함 수선).
        if: steps.slice-engine.outputs.scope_sl15 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          B_CHECKOUT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          fail() { echo "MINT_JUDGAPPENDX: FAIL — $1 (fail-closed)" >&2; exit 1; }
          : "${B:?B not set}"; : "${H:?H not set}"; : "${RUN_ID:?RUN_ID not set}"; : "${RUN_ATTEMPT:?RUN_ATTEMPT not set}"
          ax="$B_CHECKOUT_DIR/bin/ax"
          [ -x "$ax" ] || fail "B-built bin/ax missing at $ax"
          # (A) retrieval — exactly-one + unexpired for BOTH artifacts (the
          # s1a P7c pattern, RUN-scoped).
          want_rec="judgment-record-$H-$RUN_ATTEMPT"
          want_adm="admission-check-$H-$RUN_ATTEMPT"
          # DEBT#474 — bounded transport retry (P3 Tier-2 site-group): the
          # LANDED generalized fetch_bounded (P3 first-site-group, PR #850)
          # REUSED verbatim — 4 attempts, 5s/10s/20s backoff; transient =
          # curl transport rc != 0 or final HTTP 5xx; permanent = final
          # HTTP 4xx incl. 429 — contract alignment 2026-10-15: NO 429
          # retry. These [SL-15] retrieval legs are read-path fetches: a
          # transport failure here converted fully-green runs to red
          # (fail-closed with zero retry budget). Each attempt re-fetches
          # the SAME run-scoped URL; the bodies are still fully re-parsed
          # and bound below (record identity + payloadSha256 + per-subject
          # witness byte binding). Final failure prints HTTP code / curl rc
          # (rearm TRANSIENT (b) anchor format). Fetch-scoped ONLY: the
          # per-subject judgment ledger-appends in the loop below are NOT
          # wrapped — a retry can never re-drive an append.
          fetch_bounded() {
            local url="$1" out="$2" tag="$3" a rc code
            local accept="${4:-application/vnd.github+json}"
            for a in 1 2 3 4; do
              code="$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: $accept" \
                -o "$out" -w '%{http_code}' "$url")" \
                && rc=0 || rc=$?
              code="${code:-000}"
              if [ "$rc" -eq 0 ] && [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                return 0
              elif [ "$rc" -eq 0 ]; then
                case "$code" in
                  5*)
                    echo "MINT_FETCH_RETRY: $tag attempt $a/4 — HTTP $code (transient)" >&2 ;;
                  *)
                    echo "MINT_FETCH_RETRY: $tag — HTTP $code (permanent — not retried)" >&2
                    return 2 ;;
                esac
              else
                echo "MINT_FETCH_RETRY: $tag attempt $a/4 — transport error (curl rc=$rc, http_code=$code) (transient)" >&2
              fi
              [ "$a" -lt 4 ] || break
              case "$a" in 1) sleep 5 ;; 2) sleep 10 ;; 3) sleep 20 ;; esac
            done
            return 1
          }
          arts_f="$RUNNER_TEMP/mint_p7cx_artifacts.json"
          fetch_bounded \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            "$arts_f" "P7c-x artifacts-list artifact download (JSON GET)" \
            || fail "GET runs/$RUN_ID/artifacts failed (bounded retry exhausted or permanent failure — DEBT#474 transport policy)"
          arts="$(cat "$arts_f")"
          lookup_one() {
            local want="$1"
            local count id expired
            count="$(printf '%s' "$arts" | jq --arg n "$want" '[.artifacts[] | select(.name == $n)] | length')" \
              || fail "cannot count artifacts named '$want'"
            [ "$count" = "1" ] || fail "expected exactly one artifact named '$want', found $count"
            id="$(printf '%s' "$arts" | jq --arg n "$want" -r '.artifacts[] | select(.name == $n) | .id')"
            expired="$(printf '%s' "$arts" | jq --arg n "$want" -r '.artifacts[] | select(.name == $n) | .expired')"
            [ "$expired" = "false" ] || fail "artifact '$want' is expired (fail-closed)"
            printf '%s' "$id"
          }
          rec_id="$(lookup_one "$want_rec")"
          adm_id="$(lookup_one "$want_adm")"
          fetch_bounded \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$rec_id/zip" \
            "$RUNNER_TEMP/judgmentx-record.zip" "P7c-x judgment-record zip download (artifact)" \
            || fail "judgment-record artifact zip download failed (bounded retry exhausted or permanent failure — DEBT#474 transport policy)"
          fetch_bounded \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$adm_id/zip" \
            "$RUNNER_TEMP/judgmentx-admission.zip" "P7c-x admission zip download (artifact)" \
            || fail "admission artifact zip download failed (bounded retry exhausted or permanent failure — DEBT#474 transport policy)"
          mkdir -p "$RUNNER_TEMP/judgmentx-record" "$RUNNER_TEMP/judgmentx-admission"
          (cd "$RUNNER_TEMP/judgmentx-record" && unzip -o -q "$RUNNER_TEMP/judgmentx-record.zip") \
            || fail "judgment-record artifact zip extraction failed"
          (cd "$RUNNER_TEMP/judgmentx-admission" && unzip -o -q "$RUNNER_TEMP/judgmentx-admission.zip") \
            || fail "admission artifact zip extraction failed"
          wit_file="$RUNNER_TEMP/judgmentx-admission/witness.json"
          [ -f "$wit_file" ] || fail "no witness.json inside '$want_adm'"
          CJTX=0
          for s in proof_integrity d2_golden d2_persist; do
            # Record files are staged with HYPHENATED subject suffixes
            # (judgment-record-proof-integrity.json — admission-check upload
            # convention), while witness .subject tags are UNDERSCORED
            # (proof_integrity — judgment_cas.subjectName). Map, don't rename.
            rec_file="$RUNNER_TEMP/judgmentx-record/judgment-record-$(printf '%s' "$s" | tr '_' '-').json"
            [ -f "$rec_file" ] || fail "no judgment-record-$(printf '%s' "$s" | tr '_' '-').json inside '$want_rec'"
            ev_key="$(jq -r '.evidenceKey' "$rec_file")"
            printf '%s' "$ev_key" | grep -qE '^[0-9a-f]{64}$' \
              || fail "[$s] record evidenceKey '$ev_key' not 64-hex"
            payload="$(jq -j '.payload' "$rec_file")"
            [ -n "$payload" ] || fail "[$s] record payload empty"
            p_sha="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
            [ "$p_sha" = "$(jq -r '.payloadSha256' "$rec_file")" ] \
              || fail "[$s] sha256(payload) '$p_sha' != record payloadSha256 (tampered record?)"
            # The witness `.semantic.judgments[]` element naming THIS subject
            # — exactly one (an armed attest binds every subject; absence or
            # duplication is fail-closed).
            w_node="$(jq -c --arg s "$s" '[.semantic.judgments[]? | select(.subject == $s)]' "$wit_file")"
            [ "$(printf '%s' "$w_node" | jq 'length')" = "1" ] \
              || fail "[$s] witness .semantic.judgments[] binding for subject '$s' is not exactly-one (an armed attest must bind every subject — fail-closed)"
            w_basis="$(printf '%s' "$w_node" | jq -r '.[0].basis // empty')"
            [ "$w_basis" = "EXECUTED" ] || [ "$w_basis" = "REUSED" ] \
              || fail "[$s] witness judgment basis '$w_basis' not EXECUTED/REUSED (fail-closed)"
            w_key="$(printf '%s' "$w_node" | jq -r '.[0].evidenceKey // empty')"
            [ "$w_key" = "$ev_key" ] \
              || fail "[$s] witness judgment evidenceKey != record evidenceKey (identity divergence — fail-closed)"
            w_proj="$(printf '%s' "$w_node" | jq -j '.[0].projection // empty')"
            [ -n "$w_proj" ] || fail "[$s] witness judgment projection missing"
            [ "$w_proj" = "$payload" ] \
              || fail "[$s] witness judgment projection != record payload bytes (byte binding broken — fail-closed)"
            w_psha="$(printf '%s' "$w_proj" | sha256sum | awk '{print $1}')"
            [ "$w_psha" = "$(printf '%s' "$w_node" | jq -r '.[0].projectionSha256 // empty')" ] \
              || fail "[$s] sha256(projection) != witness projectionSha256 (binding broken — fail-closed)"
            # (C) append — idempotent exactly-once per subject key.
            app_out="$(cd "$B_CHECKOUT_DIR" && GITHUB_TOKEN="$GITHUB_TOKEN" \
              "$ax" evidence ledger-append "$rec_file")" \
              || fail "[$s] judgment ledger-append failed (transport/validation)"
            if printf '%s' "$app_out" | grep -q "no-op"; then
              APP=0
              echo "MINT_JUDGAPPENDX: OK — idempotent no-op (judgment[$s] key ${ev_key:0:12} already stored, append exactly-once: 0)"
            else
              APP=1
              echo "MINT_JUDGAPPENDX: OK — judgment record appended [$s] (key ${ev_key:0:12}, append exactly-once: 1)"
            fi
            [ "$APP" = "0" ] || [ "$APP" = "1" ] || fail "exactly-once assertion [$s]: append count '$APP' not in {0,1}"
            CJTX=$((CJTX + APP))
          done
          [ "$CJTX" -ge 0 ] && [ "$CJTX" -le 3 ] || fail "exactly-once assertion: extension append total '$CJTX' not in {0..3}"
          echo "MINT_JUDGAPPENDX_COUNT=$CJTX"
          echo "MINT_JUDGAPPENDX_COUNT=$CJTX" >> "$GITHUB_ENV"