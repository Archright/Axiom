          w_psha="$(printf '%s' "$w_proj" | sha256sum | awk '{print $1}')"
          [ "$w_psha" = "$(jq -r '.semantic.judgment.projectionSha256 // empty' "$wit_file" 2>/dev/null)" ] \
            || fail "sha256(projection) != witness projectionSha256 (binding broken — fail-closed)"
          # (C) append — idempotent exactly-once (default ref =
