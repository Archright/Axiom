name: gateway-jobs-measure

# S2 (AXIOM_JOBS tuning) single-factor measurement plane — CI Pareto v13.
# Owner 결정 #14: experiment workflows live in the same-repo non-authoritative
# measurement plane. This workflow is: workflow_dispatch ONLY, NOT a required
# check, never referenced by admission/mint (no push/PR triggers).
#
# Design (docs/evidence/s2_protocol.md):
#   - One dispatch = ONE measured run for ONE config (jobs) at ONE pre-registered
#     pair slot (iter) — one GitHub run -> exactly one harness observation.
#   - Every measured run checks out the SAME fixed ref (input `ref`, REQUIRED —
#     supply the pre-registered SHA explicitly; there is no default) ->
#     byte-identical workload across configs (single factor = AXIOM_JOBS only).
#   - Initial state: A-layer toolchain restore (identical warm toolchain) +
#     B-layer RESTORE ONLY (cache-save-enabled 'false') of the payload saved by
#     a prior `warm: true` dispatch -> every measured run starts from the same
#     restored binaries/nimcache/.axiom-cache, and gateway test binaries
#     (build/gateway-tests/*, never B-cached) compile native-cold identically.
#   - `warm: true` = provisioning dispatch: builds the 4 ci-bootstrap binaries
#     + ircheck (the complete 5-member B payload, DEBT#502)
#     + runs one real `ax prove` (materializes .axiom/cache/lean_verify_hash.txt
#     so measured runs get the lean-verify hash-hit, exactly like production
#     gateway shards) + writes the B fingerprint manifest + SAVES the B-layer
#     entry. A warm run is NEVER ingested (its initial state differs by
#     construction). Requires actions: write (cache save) — granted ONLY at
#     job level on the provision job; the measure job keeps workflow-level
#     least privilege.
#   - Measured command replicates Makefile:762-773 `test-gateway` recipe at
#     SHARD_COUNT=1 SHARD_INDEX=0 but invokes ./bin/all_gateway_runner DIRECTLY
#     with AXIOM_JOBS=<inputs.jobs> (the recipe inlines the env var, so neither
#     a make command-line var nor an env var can override it — see
#     s2_protocol.md §recipe-faithfulness for the exact argv diff).
#   - Runner worker cap: all_gateway_runner caps workers at cpuinfo
#     countProcessors() (tests/gateway/all_gateway_runner.nim configuredWorkers)
#     — on ubuntu-24.04 (nproc=4) jobs=8 is capped to 4 workers; the run logs
#     `nproc` + the runner's `workers=` INFO line as provenance.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: AXIOM_JOBS value (the single measured factor)
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '2'
      iter:
        description: Pre-registered pair slot this run fills (1..n, per s2_protocol.md mapping)
        type: number
        default: 1
      ref:
        description: 'Fixed measurement ref (SHA) — identical workload for every measured run. REQUIRED: supply the pre-registered SHA explicitly (there is no default; the former default was a pre-recreation branch tip that no longer resolves).'
        type: string
        required: true
      warm:
        description: 'true = provisioning dispatch (B-layer save; never ingested). false = measured run.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    if: ${{ inputs.warm == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Job-level override: cache SAVE requires actions: write (restore only
    # needs actions: read). This job is provisioning-only, never measured.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          clean: true

      # Designated B-layer ONE-WRITER for THIS ref's cache key. A-layer save is
      # unconditional inside the composite (lock-complete guarded).
      # NOTE: cache-build-source는 `exp-` 네임스페이스 — production runner-pool이
      # github.sha로 저장하는 동일 B-key와 레이스 방지 (실측: warm save가
      # "another job may be creating this cache"로 거부되어 production 페이로드가
      # 복원됨 → lean_verify_hash 누락). experiment는 자기 key만 쓴다.
      - uses: ./.github/actions/setup-axiom-toolchain
        id: setup-tc
        with:
          cache-save-enabled: 'true'
          cache-build-source: exp-${{ inputs.ref }}

      - name: Compile bootstrap artifacts (gate_hook, precompile_gates, ax, install_ax_cas)
        run: make ci-compile
        timeout-minutes: 20

      # B payload 5th member (DEBT#502). `lake build` with no target builds
      # lean_libs only, so the lean_exe must be named explicitly.
      - name: Build ircheck (Lean reference extractor — B payload 5th member, DEBT#502)
        run: |
          set -euo pipefail
          cd proofs && lake build ircheck && cd ..
          [ -x proofs/.lake/build/bin/ircheck ] \
            || { echo "FAIL-CLOSED: ircheck missing after build (proofs/.lake/build/bin/ircheck)" >&2; exit 1; }
        timeout-minutes: 10

      # Bake the recipe-compile state into build/nimcache so measured runs
      # restore it and only re-link (identical state, less wall).
      - name: Compile gateway execution binaries (recipe precedent, warm nimcache)
        run: |
          set -euo pipefail
          mkdir -p bin build
          nim c --hints:off -d:release -o:bin/run_gate src/cli/run_gate.nim
          nim c --hints:off -d:release -o:bin/nimtry src/gate/nimtry.nim
          nim c --hints:off -d:release -o:build/git_wrapper src/gate/utils/git_wrapper.nim
          nim c --hints:off -d:release -o:build/command_policy_gate src/gate/utils/command_policy_gate.nim
          nim c --hints:off -d:release -o:bin/hotspot_coverage_gate src/gate/runners/hotspot_coverage_gate.nim
          nim c --hints:off -d:release -o:bin/conflict_marker_gate src/gate/runners/conflict_marker_gate.nim
          nim c --hints:off -d:release -o:bin/golden_master_gate src/gate/runners/golden_master_gate.nim
          nim c --hints:off -d:release -o:bin/all_gateway_runner tests/gateway/all_gateway_runner.nim
        timeout-minutes: 15

      - name: Provision cheap bootstrap tail (CAS install, hooks, scope, baseline)
        run: make ci-bootstrap-cheap
        timeout-minutes: 10

      # Materialize .axiom/cache/lean_verify_hash.txt via the REAL verify path:
      # lean-verify runs a sandbox lake build on hash mismatch and then saves the
      # hash; measured runs (same ref, restored .axiom/cache) then take the
      # hash-hit skip — identical to production gateway shards.
      - name: One real prove run (materialize lean-verify hash cache)
        env:
          AXIOM_PROVE_WORKERS: '1'
        run: |
          set -euo pipefail
          test -f .axiom/cache/lean_verify_hash.txt && { echo "lean_verify_hash.txt already present — byte-hash must equal computed"; }
          bin/ax prove --target normalizeMaxWorkers
          test -f .axiom/cache/lean_verify_hash.txt || { echo "FAIL: lean_verify_hash.txt not materialized"; exit 1; }
          echo "lean-verify hash cache: $(cat .axiom/cache/lean_verify_hash.txt)"
        timeout-minutes: 10

      # Cache save requires every listed path to exist (actions/cache tar
      # semantics). proofs/.lake is materialized by the ircheck build above
      # (DEBT#502); proofs/build stays empty and is saved/restored harmlessly.
      # .axiom/cache is produced by ax prove.
      - name: Ensure B payload paths exist
        run: mkdir -p build/nimcache .axiom/cache proofs/.lake proofs/build

      - name: B-layer fingerprint manifest (save-side, in-payload)
        run: |
          set -euo pipefail
          for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas proofs/.lake/build/bin/ircheck; do
            [ -f "$f" ] || { echo "FAIL: $f missing — cannot snapshot B payload" >&2; exit 1; }
          done
          jq -n --arg bsha "exp-${{ inputs.ref }}" \
            --arg bkey "${{ steps.setup-tc.outputs.b-key }}" \
            --arg ax "$(sha256sum bin/ax | cut -d' ' -f1)" \
            --arg gh "$(sha256sum bin/gate_hook | cut -d' ' -f1)" \
            --arg pg "$(sha256sum bin/precompile_gates | cut -d' ' -f1)" \
            --arg ica "$(sha256sum bin/install_ax_cas | cut -d' ' -f1)" \
            --arg ir "$(sha256sum proofs/.lake/build/bin/ircheck | cut -d' ' -f1)" \
            --arg nimcache "$(sha256sum build/nimcache/*.json 2>/dev/null | head -1 | awk '{print $1}' || true)" \
            '{schema: "axiom-b-fingerprint-v1", buildSha: $bsha, bKey: $bkey,
              files: {"bin/ax": $ax, "bin/gate_hook": $gh,
                      "bin/precompile_gates": $pg, "bin/install_ax_cas": $ica,
                      "proofs/.lake/build/bin/ircheck": $ir}}' \
            > build/.axiom-b-fingerprint.json
          echo "AXIOM_CACHE_B_MANIFEST: written build/.axiom-b-fingerprint.json ($(jq '.files | length' build/.axiom-b-fingerprint.json) entries)"
          jq -r '.files | to_entries[] | "\(.key) \(.value[0:16])"' build/.axiom-b-fingerprint.json

      - name: B-layer cache save (exact key, this ref's ONE-WRITER)
        if: steps.setup-tc.outputs.b-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/nimcache
            .axiom/cache
            proofs/.lake
            proofs/build
            build/.axiom-b-fingerprint.json
            bin/ax
            bin/gate_hook
            bin/precompile_gates
            bin/install_ax_cas
          key: ${{ steps.setup-tc.outputs.b-key }}

  measure:
    if: ${{ inputs.warm != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AXIOM_PROVE_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          clean: true

      # Restore-only B reader (no B save post-step). A-layer save may still
      # fire inside the composite (continue-on-error, non-fatal).
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          cache-save-enabled: 'false'
          cache-build-source: exp-${{ inputs.ref }}

      # Identical-initial-state gate: the measured run depends on the B payload
      # provisioned by a prior warm dispatch. Missing payload = fail closed
      # (a native-cold build would deviate from the measured initial state).
      - name: Verify B-layer provisioned prerequisites (fail-closed)
        run: |
          set -euo pipefail
          test -x bin/ax || { echo "FAIL: bin/ax missing after B-layer restore — the payload was either not provisioned or DISCARDED by the composite's 5-member completeness gate (see the 'B-layer fingerprint verify' step above for the AXIOM_CACHE_B_VERIFY verdict)." >&2; exit 1; }
          test -x bin/gate_hook -a -x bin/precompile_gates -a -x bin/install_ax_cas || { echo "FAIL: ci-bootstrap binaries incomplete after restore" >&2; exit 1; }
          test -x proofs/.lake/build/bin/ircheck || { echo "FAIL: proofs/.lake/build/bin/ircheck missing after B-layer restore — the payload is not a complete 5-member supply (DEBT#502)." >&2; exit 1; }
          test -f .axiom/cache/lean_verify_hash.txt || { echo "FAIL: lean-verify hash cache missing (warm run did not materialize it)" >&2; exit 1; }
          echo "B payload restored — identical initial state for every measured run"

      - name: Measurement provenance (hardware + factor)
        run: |
          echo "nproc=$(nproc)"
          echo "AXIOM_JOBS=${{ inputs.jobs }}"
          echo "ref=${{ inputs.ref }}"
          echo "iter=${{ inputs.iter }}"
          echo "runner=$(uname -m)"
          /proc/cpuinfo >/dev/null 2>&1 && grep -c '^processor' /proc/cpuinfo | sed 's/^/cpuinfo_processors=/' || true

      # Reference recipe parity (runner-pool-acceptance.yml gateway-shard):
      # bootstrap-cheap tail + partition audit run before the measured command.
      - name: Provision cheap bootstrap tail (CAS install, hooks, scope, baseline)
        run: make ci-bootstrap-cheap
        timeout-minutes: 10

      - name: Partition audit (union == full list, pairwise disjoint — fail-closed; SHARD_COUNT=1)
        run: make test-gateway-shard-audit SHARD_COUNT=1

      # MEASURED COMMAND — faithful replication of `make test-gateway
      # SHARD_COUNT=1 SHARD_INDEX=0` (Makefile:762-773), except AXIOM_JOBS is
      # set from the dispatch input instead of the recipe's inline
      # `$(if $(filter $(AXIOM_CI),1),2,$(shell nproc))`. Same binaries, same
      # flags, same argv, same junit path, same shard file selection
      # (awk 'NR % 1 == 0' == all files). The runner emits `workers=N` in its
      # INFO line (capped at countProcessors()).
      - name: Measured — full gateway suite with AXIOM_JOBS=${{ inputs.jobs }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p bin build
          nim c --hints:off -d:release -o:bin/run_gate src/cli/run_gate.nim
          nim c --hints:off -d:release -o:bin/nimtry src/gate/nimtry.nim
          nim c --hints:off -d:release -o:build/git_wrapper src/gate/utils/git_wrapper.nim
          nim c --hints:off -d:release -o:build/command_policy_gate src/gate/utils/command_policy_gate.nim
          nim c --hints:off -d:release -o:bin/hotspot_coverage_gate src/gate/runners/hotspot_coverage_gate.nim
          nim c --hints:off -d:release -o:bin/conflict_marker_gate src/gate/runners/conflict_marker_gate.nim
          nim c --hints:off -d:release -o:bin/golden_master_gate src/gate/runners/golden_master_gate.nim
          nim c --hints:off -d:release -o:bin/all_gateway_runner tests/gateway/all_gateway_runner.nim
          mapfile -t FILES < <(ls tests/gateway/*_feature_test.nim | sort | awk -v s=0 -v n=1 'NR % n == s')
          echo "shard_files=${#FILES[@]}"
          AXIOM_JOBS=${{ inputs.jobs }} ./bin/all_gateway_runner --skip-known-failing=config/known_failing_gateway.txt --probe-known-failing --junit-output=build/gateway-junit.xml "${FILES[@]}"

      - name: Upload gateway junit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-jobs-junit-j${{ inputs.jobs }}-i${{ inputs.iter }}
          path: build/gateway-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Dump gateway test run logs on failure
        if: failure()
        run: |
          for f in build/gateway-tests/logs/*.run.log; do
            echo "=== $f"
            tail -n 150 "$f"
          done