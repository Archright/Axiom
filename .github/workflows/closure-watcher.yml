# closure-watcher — S4' 신뢰 루트 상시 감시자 (P4 R2 운영 배선)
# 근거: docs/evidence/trust_root_reaudit_2026-10-10.md §7.3 + 승인 계획(2026-10-10) S4'
#
# [표면] config/repository_surface.json CONTROLLED 등록(v73 선등록, 본 수정 시점
# policyVersion 74). 등급·규칙표상 CONTROLLED MODIFY = PASS
# (docs/spec/repository_surface_contract.md)이므로 본문 PR 단독으로 착지한다 —
# 별도 정책 PR 불요. 신설(ADD)이 아니므로 v52~v72의 2단 선등록 절차 대상이 아니다.
#
# 목적: main HEAD의 실측 검증기 closure(derive_checker_closure --ref HEAD)을
# 핀(config/trusted_writer_set.json의 trustedCheckerTreeClosure)과 6시간마다
# 재대조한다. 불일치 = (a) 핀 진부, (b) 트리 드리프트, (c) 정규 구멍 S1-C/D
# (재감사 문서 §6 — pin 내용만 변조한 PR이 NORMAL로 착지하는 벡터)에 의한 핀
# 변조. 세 경우 모두 동일 시그널이며, 본 워크플로는 fail-closed(exit 1)로
# 적색이 되고 추적 이슈를 생성한다. 수선 회전 PR(§5-1)이 착지하기 전까지 이
# 감시자가 탐지 간격을 시간 수준으로 축소하는 유일한 완화 장치다.
#
# [authority — 값 생성 단일] tools/ci/derive_checker_closure.nim 단일 (재구현·손편집
# 없음 — ADR-0025 파생 authority; #666의 in-place 컴파일 레시피를 그대로 재사용).
# 핀 파싱은 src/cli/merge_cli.nim stripJsoncComments/pinClosureLineSet의 1:1 이식
# (§1 측정과 동일) — 정준 함수가 바뀌면 본 스크립트도 같은 커밋 범위에서 갱신한다.
#
# [failure semantics — 본 감시자에게 merge authority는 없다]
# - 탐지(drift) 실패든 발행(issue publish) 실패든 본 워크플로는 적색이 된다
#   (탐지 관점 fail-closed). 그 적색은 merge admission을 막지 않는다 — 본
#   워크플로는 required check가 아니며 어떤 머지도 차단하지 않는다(R2 무권한).
# - 본 감시자는 정책 SSOT(config/ 핀)을 절대 수정하지 않는다 — 탐지·보고만 하며,
#   수복 판단은 부채/오너 authority의 몫이다(reaudit 문서 §6.4 절차).
# - 취소(cancelled) 런은 drift 증거가 아니다 — concurrency 대기열에서 새 pending이
#   이전 pending을 대체한 것이며, 원장(slot ledger)에서 별도 계수한다.
#
# [detect/report 권한 분리 — GitHub 공식 지원 job-level permissions]
# - 워크플로 기본: contents: read 단독(탐지 최소권한).
# - detect: 읽기 전용 — 클로저 재유도·대조. 결과는 artifact(closure-drift-findings,
#   drift 시에만 존재)와 outputs.head_sha로 report에 전달한다.
# - report: needs: [detect] + if: failure() — issues: write 단독(job-level 선언;
#   job-level permissions은 미지정 권한을 전부 none으로 만드는 완전 대체다).
# - sweep-test-issues: needs: [detect, report] + if: always() — issues: write 단독.
#   테스트 이슈 마커 정리. crash-safe: 마커가 붙은 열린 이슈만 닫으므로 재실행 멱등
#   (런 중단으로 남은 이슈는 다음 런의 sweep이 수렴 정리한다).
#
# [controlled drift test — fixture 주입, live config 편집 금지]
# - workflow_dispatch inputs.drift_test=true 또는 repo Actions 변수
#   CLOSURE_WATCHER_DRIFT_TEST=1로 가동한다. 적색 런 자체가 시험의 정상 완료다.
#   역방향 계약: drift_test=true dispatch가 녹색으로 끝나면 시험 성공이 아니라
#   스위치 실패다 — 시험 실패로 취급하고 원인을 찾는다(2026-10-11 실측:
#   github.event.inputs 문자열 비교 버그 — quirks Q7 — 로 fixture를 건너뛴
#   조용한 녹색 런 38130258653).
# - 변수 경로의 존재 이유: dispatch는 schedule을 증명하지 않는다 — GITHUB_TOKEN
#   권한은 이벤트별로 다를 수 있고(issues: write가 dispatch에선 통과하고 schedule에선
#   실패할 수 있다), 실 schedule 문맥에서의 발행 경로·권한 동등성은 schedule 런으로만
#   검증된다. 절차: 변수 1 설정 → 다음 슬롯 런이 fixture로 탐지·발행·sweep →
#   원장·로그 수집 → 변수 해제. 설정 잊음의 실패 모드는 조용한 녹색이 아니라
#   반복되는 적색+마커 이슈라 즉시 가시다(fail-closed).
# - 합성 입력은 tests/fixtures/closure_watcher_drift/ 파일로의 경로 파라미터
#   전용이다. config/ 편집·복구는 금지이며 본 워크플로는 어떤 분기로도 config/를
#   쓰지 않는다. 대조 코드 경로는 fixture/실측 양 모드에서 동일하다(입력 경로만 다름).
# - 테스트 이슈는 제목 마커 [closure-watcher-test]로 격리한다 — 실드리프트 이슈
#   제목과 검색 토큰이 겹치지 않아 dedup·sweep의 상호 오염이 없다.
#
# [latency 계약 — GitHub는 schedule 지연 SLA를 두지 않는다(공식 문서)]
# - 슬롯 = cron 격자의 UTC 시각. 본 저장소의 계약: 슬롯 +60분 내 시작 = on-time,
#   초과 = late, 슬롯 +6h(1주기) 내 무관측 = missed 확정. +6h 컷오프 근거: 2026-10-10
#   원장 관측 최대 지연 5.5h — 지연 창을 닫기에 충분한 최소 주기 수.
# - 원장 수집: tools/ci/closure_watcher_slot_ledger.py → docs/evidence/ 원장.
#   "0 missed" 주장의 95% 신뢰 규칙상 3(rule of three)은 N>=60 슬롯(4슬롯/일 x 15일)
#   을 요구한다 — 그 전의 원장은 진행 중 창이지 증명이 아니다.
# - queue: max 미채택 판정(2026-10-11 실측 — 원장 결손 2건 진단): 결손 슬롯
#   (10-10·10-11 06:17Z)은 모두 **high-load drop** 클래스다. 전 이벤트 전수
#   census(total_count=9)에서 런 기록 전무, 슬롯 시점 동시성 그룹 유휴(직전 런
#   종료가 슬롯 24/31분 전), cancelled 런 0건 — 공식 문서상 pending 대체는
#   cancelled 기록을 남기므로 pending-replacement는 기각된다. 공식 문서는
#   고부하에서 scheduled 실행이 지연·폐기("some queued jobs may be dropped")될 수
#   있음을 명시하고 SLA를 두지 않는다. queue: max는 pending 대체(cancellation)만
#   방지하므로 본 결손 클래스에 무효다 — 채택하지 않고, 잔여 리스크(고부하 드롭
#   재발 가능, 완화 = :17 off-hour cron 유지 + 원장 W=60 완료 조건 — N>=60 슬롯
#   = 15일 x 4슬롯; 기존 14일/W=56 목표는 정확 이항 산술상 95% 기준 미달로 정정,
#   진단 문서 §5 산술 참조)은 원장으로 계속 관측한다. 진단 근거:
#   docs/evidence/closure_watcher_miss_diagnosis_2026-10-11.md
#
# quirk Q4(docs/spec/gh_run_observation_quirks.md): run: 블록 전체(주석 포함)에
# GitHub 표현식 보간 토큰을 기술하지 않는다 — 보간은 셸보다 먼저 일어나고 주석
# 만으로도 워크플로 파싱 실패(0-job dispatch failure)가 난다(2026-10-09 실측).
# 동적 값은 env: 블록으로만 주입한다. 본 파일의 모든 보간 토큰은 식 컨텍스트
# (env/with/if/outputs 매핑)에만 존재한다.
#
# 알림 공식: schedule 워크플로의 실패 알림 수신자 = 이 파일의 cron을 마지막으로
# 수정한 계정(현재 wintrover) — 1인 고정. 절차적 보강으로 불일치 시 추적 이슈를
# 자동 생성한다(report job, issues: write). TWS(ADR-0022 §4)는 contents:write 보유
# 워크플로만 규율하므로 본 워크플로(contents: read)는 TWS 대상 외 신규
# authority가 아니며, actions: write는 부여하지 않는다.
#
# [신규 — drift schedule freshness watchdog (2026-10-22, SUSTAIN 세대)]
# 목적: admission-ssot-drift의 **schedule 실행** 신선도를 독립 cron(본 파일의
#   17 */6 * * *)이 검사하고, cron이 발화하지 않았으면(누락) 운영자 수신 신호
#   (issue)를 만든다. drift RED 감지(관측)와 cron 누락 감지(부재)는 **다른
#   사건**이다 — RED는 drift-signal.yml(workflow_run)이 담당하고, 본 감시자는
#   그와 중복 보고하지 않는다. 그래서 schedule 실행의 conclusion은 판정 입력이
#   아니다: 실행이 있었고 RED라면 drift-signal이 신호를 낸다.
# - 대상: workflow id 391703936 (admission-ssot-drift — gh api 실측 2026-10-22:
#   id/name/path/state 확인. numeric id는 파일 경로와 무관한 repo 고정 식별자).
#   drift cron = 매일 04:37 UTC (37 4 * * *).
# - 임계: 26h (하루 주기 + 2h 유예). GitHub는 schedule 지연 SLA를 두지 않는다
#   (공식 문서) — 본 저장소 자체 관측 최대 지연 5.5h(원장, 위 latency 계약)가
#   있으므로 유예를 둔다. STALE 판정은 fail-closed(적색)이며 동시에 issue를
#   발행한다.
# - 권한(추가 이유 명시): 신규 잡 drift-freshness는 actions: read(대상 워크플로의
#   실행 이력 조회 — 이 읽기가 없으면 신선도를 확정할 수 없다) + issues: write
#   (신호 이슈 발행·종결)만 선언한다. contents: read는 체크아웃하지 않으므로
#   불필요하다 — job-level permissions는 미지정 권한을 전부 none으로 만드는
#   완전 대체다. 워크플로 기본 permissions(contents: read)와 기존 detect/report/
#   sweep 잡의 권한은 **변경하지 않는다** — 기존 기능에 영향 없음.
# - 라벨/검색: drift-signal.yml과 **같은 라벨**(drift-signal)과 **같은 dedup
#   패턴**(제목 토큰 검색 → 있으면 코멘트 추가, 없으면 생성)을 쓴다. 제목
#   토큰은 drift-red(RED 신호)와 drift-stale(누락 신호)로 분리한다 — 두 계열이
#   서로를 오염시키지 않기 위해서다(라벨은 "drift 계열"이라는 공통 표식).
# - 종결(resolve) 반쪽: 신선도가 회복(FRESH)되면 같은 계열의 열린 이슈를
#   자동 닫는다(멱등 — 재실행 안전). 감지 녹색 = 라이브 부재의 종결.
#
# [watchdog의 재귀 한계 — 정직한 선언]
# **본 감시자 자신은 schedule 기반이므로 자신의 미발화를 감지하지 못한다.**
# cron이 멈추면 본 감시자도 함께 멈춘다 — 독립 주체 없이는 구조적으로 제거할
# 수 없는 한계다(계획 §6.3 "cron은 자기 미발화를 감지할 수 없다"). 이 한계를
# 임의로 좁혀 "누락 자동 감지"를 주장하지 않는다.
#
# [착지 직후 첫 실행의 예상 동작 — STALE이 정상]
# 실측(2026-10-22, gh run list -R Archright/Axiom --workflow=391703936 -L 10):
#   최근 실행 4건이 **전부 workflow_dispatch**이고 schedule 실행은 **하나도
#   없다**. 따라서 본 감시자가 착지 직후 처음 도는 시점에는 마지막 schedule
#   실행이 존재하지 않아 **STALE 판정이 정상 동작**이다(발행 경로의 첫 실측).
#   drift의 cron이 최초로 04:37 UTC에 발화한 뒤부터 FRESH로 전환된다.
#   이 예상 동작은 계약이지 버그가 아니다 — 감지기가 아직 대상 사건을 만나지
#   못한 상태다.
#
# 파생 안전: 본 파일은 클로저 멤버가 아니다(재감사 문서 §7.3 실측 — deriver는
# runner-pool-acceptance.yml과 ci/checker.mk만 걷는다). 본 수정으로 Δ 변동 없음.

name: closure-watcher

on:
  schedule:
    - cron: '17 */6 * * *'   # 6시간 주기, 정각 회피 — GitHub 공식 고부하 완화
  workflow_dispatch:
    inputs:
      drift_test:
        description: '합성 드리프트 fixture로 탐지·발행 경로를 시험한다(적색 런이 정상)'
        type: boolean
        default: false
      runner_probe:
        description: >-
          비권위 러너 생존 진단(required check 아님, schedule 경로에서는 비활성).
          none = 기존 동작. diagnose = 게스트 상태 읽기 전용 스냅샷.
          reinstall = diagnose + `apt-get install --reinstall -y libc6` 1회
          (파괴적 — ephemeral 러너 전용, 잡 중단 자체가 신호다).
        type: choice
        options:
          - none
          - diagnose
          - reinstall
        default: none

# 탐지 최소권한. issues: write는 report·sweep 잡에 job-level로만 부여한다.
permissions:
  contents: read

# 기본 동시성: 1 running + 1 pending, 신규 pending이 이전 pending을 대체한다.
# cancel-in-progress: false는 running만 보호한다 — 대체된 pending은 원장에서
# cancelled로 계수된다(above latency 계약 참조).
concurrency:
  group: closure-watcher
  cancel-in-progress: false

env:
  # 합성 fixture 모드 스위치 — dispatch+input 또는 schedule+변수. 보간 토큰은
  # 식 컨텍스트에만 존재한다(Q4 — run: 블록은 셸 변수만 쓴다).
  # inputs 컨텍스트(형식화 boolean)를 쓴다 — github.event.inputs는 workflow_dispatch
  # 페이로드에서 문자열이므로 "true" == true는 항상 거짓이다(2026-10-11 실측:
  # 문자열 비교 버그로 drift-test dispatch가 fixture를 건너뛰고 녹색 — run
  # 38130258653; quirks Q7).
  DRIFT_TEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.drift_test == true) || vars.CLOSURE_WATCHER_DRIFT_TEST == '1' }}

jobs:
  detect:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
    steps:
      - name: Check out watched tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 실측 감시 대상은 항상 main HEAD다. 단, fixture 모드 dispatch는 체크아웃
          # 대상을 발화 ref로 옮긴다 — 착지 전 브랜치에서 fixture 자체를 시험하기 위함.
          # 형식화 inputs 컨텍스트 사용 이유는 위 DRIFT_TEST 주석(Q7)과 같다.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.drift_test && github.ref || 'main' }}

      - name: Record watched HEAD
        id: meta
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "watching HEAD=${HEAD_SHA}"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      # 핀 통일 — 인라인 choosenim 금지. provision-scope: full = deriver의
      # in-place nim c에 nim 컴파일러 필수(#666에서 실측된 결속 — z3+jq만으로는
      # "nim: command not found" fail-closed). cache-build-source는 필수 입력 —
      # 이 잡이 빌드하는 트리는 main HEAD 그 자체다.
      # fixture 모드에서는 deriver를 실행하지 않으므로 프로비전·유도를 건너뛴다 —
      # 스킵 사유는 아래 inject 스텝의 모드 판정 라인으로 명시된다(은닉 스킵 금지).
      - name: Provision pinned toolchain
        if: env.DRIFT_TEST != 'true'
        uses: ./.github/actions/setup-axiom-toolchain
        with:
          cache-save-enabled: 'false'
          cache-build-source: ${{ github.sha }}
          provision-scope: 'full'

      - name: Derive closure at HEAD and extract the pin (fail-closed)
        if: env.DRIFT_TEST != 'true'
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          # deriver in-place 컴파일 — #666 레시피 그대로 (값 생성 authority 단일)
          nim c --hints:off --skipParentCfg --skipProjCfg --skipUserCfg \
            --noNimblePath --path:src \
            -o:bin/derive_checker_closure tools/ci/derive_checker_closure.nim
          # H는 ref(git 객체)로만 분석 — 워킹 트리 무관 (ADR C2 파생 원칙)
          bin/derive_checker_closure --ref "${HEAD_SHA}" > /tmp/derived.txt
          test -s /tmp/derived.txt || {
            echo "FAIL: derived closure is empty — deriver fail-closed" >&2
            exit 1
          }
          # 핀도 HEAD 객체에서 읽는다 (clean checkout이지만 동일 근거 유지)
          git show "${HEAD_SHA}:config/trusted_writer_set.json" > /tmp/pin.json

      - name: Inject synthetic drift fixture (controlled drift test)
        if: env.DRIFT_TEST == 'true'
        run: |
          set -euo pipefail
          echo "MODE JUDGMENT: DRIFT TEST — detection input is redirected to the checked-in fixture"
          PIN="tests/fixtures/closure_watcher_drift/pin_drift.json"
          # 확장자 없는 데이터 파일 — nimtry SAFETY-language-ban의 tests/ 허용
          # 확장자 집합(.nim/.lean/.md/.toml/.nims/.lock/.feature/.json/무확장자) 내
          DER="tests/fixtures/closure_watcher_drift/derived_drift"
          test -f "${PIN}" || { echo "FAIL: fixture pin missing" >&2; exit 1; }
          test -f "${DER}" || { echo "FAIL: fixture derived missing" >&2; exit 1; }
          # 경로 파라미터 주입 — /tmp 복사도, config/ 접촉도 없다 (합성 입력 전용)
          echo "PIN_FILE=${PIN}" >> "$GITHUB_ENV"
          echo "DERIVED_FILE=${DER}" >> "$GITHUB_ENV"
          # 방향 증거: fixture는 의도적 불일치(derived-only 1건)를 닫지 않고 연다
          echo "fixture: derived has $(grep -c . "${DER}") lines (drift expected)"

      - name: Compare closure against the pin (fail-closed)
        run: |
          set -euo pipefail
          PIN_FILE="${PIN_FILE:-/tmp/pin.json}"
          DERIVED_FILE="${DERIVED_FILE:-/tmp/derived.txt}"
          FINDINGS_FILE="${FINDINGS_FILE:-/tmp/drift_findings.txt}"
          export PIN_FILE DERIVED_FILE FINDINGS_FILE
          python3 - <<'PYEOF'
          import json
          import os
          import sys


          def strip_jsonc(text):
              # 1:1 port of src/cli/merge_cli.nim stripJsoncComments —
              # string-aware state machine; keep in lockstep with that func.
              out = []
              i = 0
              n = len(text)
              in_str = False
              while i < n:
                  c = text[i]
                  if in_str:
                      out.append(c)
                      if c == '\\' and i + 1 < n:
                          out.append(text[i + 1])
                          i += 1
                      elif c == '"':
                          in_str = False
                  else:
                      if c == '"':
                          in_str = True
                          out.append(c)
                      elif c == '/' and i + 1 < n and text[i + 1] == '/':
                          while i < n and text[i] not in '\r\n':
                              i += 1
                          i -= 1
                      else:
                          out.append(c)
                  i += 1
              return ''.join(out)


          pin_path = os.environ.get('PIN_FILE') or '/tmp/pin.json'
          derived_path = os.environ.get('DERIVED_FILE') or '/tmp/derived.txt'
          findings_path = os.environ.get('FINDINGS_FILE') or '/tmp/drift_findings.txt'

          pin = json.loads(strip_jsonc(open(pin_path, encoding='utf-8').read()))
          key = pin.get('trustedCheckerTreeClosure')
          if not isinstance(key, dict):
              print('FAIL: trustedCheckerTreeClosure absent or malformed — fail-closed',
                    file=sys.stderr)
              sys.exit(1)
          # merge_cli.nim pinClosureLineSet 투영과 동일: "<mode> <type> <sha>\t<path>"
          pin_lines = set()
          for path, entry in key.items():
              if not isinstance(entry, dict):
                  print(f'FAIL: malformed pin entry: {path}', file=sys.stderr)
                  sys.exit(1)
              mode = entry.get('mode')
              typ = entry.get('type')
              sha = entry.get('sha')
              if not (isinstance(mode, str) and mode and
                      isinstance(typ, str) and typ and
                      isinstance(sha, str) and sha):
                  print(f'FAIL: pin entry missing mode/type/sha: {path}', file=sys.stderr)
                  sys.exit(1)
              pin_lines.add(f'{mode} {typ} {sha}\t{path}')

          derived_lines = {
              ln for ln in open(derived_path, encoding='utf-8').read().splitlines() if ln
          }

          only_pin = sorted(pin_lines - derived_lines)
          only_der = sorted(derived_lines - pin_lines)
          if only_pin or only_der:
              print(f'FAIL: closure drift — only-in-pin={len(only_pin)} '
                    f'only-in-derived={len(only_der)}', file=sys.stderr)
              for ln in only_pin[:20]:
                  print(f'  pin-only: {ln}', file=sys.stderr)
              for ln in only_der[:20]:
                  print(f'  derived-only: {ln}', file=sys.stderr)
              with open(findings_path, 'w', encoding='utf-8') as fh:
                  fh.write(f'only-in-pin={len(only_pin)} only-in-derived={len(only_der)}\n')
                  for ln in only_pin:
                      fh.write(f'pin-only: {ln}\n')
                  for ln in only_der:
                      fh.write(f'derived-only: {ln}\n')
              sys.exit(1)
          print(f'OK: line-set(pin) == set(derived) — {len(derived_lines)} members')
          PYEOF
          echo "closure watcher: green"

      - name: Upload drift findings artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (repo sha-pin)
        with:
          name: closure-drift-findings
          path: /tmp/drift_findings.txt
          if-no-files-found: ignore

  report:
    # 절차적 알림 보강 — cron 실패 메일 수신자(마지막 cron 수정자) 1인 고정의 완화책.
    # 멱등 upsert 상태 기계(OPEN 추적 이슈 ⇔ 라이브 드리프트)의 적층 반쪽 — 실/시험
    # 양 모드가 동일 분기를 통과한다(모드별 차이는 TITLE/SEARCH/가이드뿐): 동일
    # 계열의 열린 이슈가 있으면 새 이슈를 만들지 않고 관측을 코멘트로 덧붙인다
    # (구 동작인 "존재 시 생성 생략"은 후속 관측을 조용히 소실시키는 마스킹이었다).
    # 동일 런 재시도는 run URL로 중복 억제(멱등 no-op). 종결 반쪽은 sweep의
    # resolve 스텝(실)·동일 런 sweep(시험)이다. 검색 토큰 분리: 실드리프트
    # 'closure mismatch' vs 테스트 'closure-watcher-test' — 상호 오염 없음.
    # 테스트 이슈 마커 + crash-safe sweep 계약은 유지(regress 금지).
    needs: detect
    if: failure()
    permissions:
      issues: write
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.detect.outputs.head_sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download drift findings artifact
        # 탐지가 대조 이전 단계(툴체인 등)에서 실패하면 산출물이 없다 — 발행은
        # 계속하되 본문에 결손을 명기한다(continue-on-error는 스킵 은닉이 아니라
        # 결손 표시 후 진행이다).
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: closure-drift-findings
          path: findings

      - name: Upsert tracking issue on closure drift (create or append, idempotent)
        run: |
          set -euo pipefail
          if [ "${DRIFT_TEST}" = "true" ]; then
            TITLE="[closure-watcher-test] synthetic drift publish-path probe (run ${GITHUB_RUN_ID})"
            SEARCH="closure-watcher-test in:title"
          else
            TITLE="closure-watcher: pin/derived closure mismatch at ${HEAD_SHA}"
            SEARCH="closure mismatch in:title"
          fi
          EXISTING_NUM="$(gh issue list --state open --search "${SEARCH}" --json number --limit 1 --jq '.[0].number // empty' || true)"
          if [ -n "${EXISTING_NUM}" ]; then
            if gh issue view "${EXISTING_NUM}" --json comments --jq '.comments[].body' | grep -qF "${RUN_URL}"; then
              echo "upsert: issue #${EXISTING_NUM} already records run ${GITHUB_RUN_ID} — idempotent no-op"
              exit 0
            fi
            OBS="$(mktemp)"
            {
              echo "동일 드리프트 계열의 후속 관측을 기록한다 (upsert — 이슈 중복 생성 억제)."
              echo
              echo "- HEAD: ${HEAD_SHA}"
              echo "- run: ${RUN_URL}"
              echo "- 관측 시각: $(date -u +%Y-%m-%dT%H:%M:%SZ) (UTC)"
              echo
              if [ -f findings/drift_findings.txt ]; then
                echo "## 차집합 (pin-only / derived-only)"
                echo
                echo '```'
                cat findings/drift_findings.txt
                echo '```'
              else
                echo "findings artifact 부재 — detect 잡이 대조 이전 단계에서 실패했다(런 로그 참조)."
              fi
            } > "${OBS}"
            gh issue comment "${EXISTING_NUM}" --body-file "${OBS}"
            echo "upsert: observation appended to #${EXISTING_NUM}"
            exit 0
          fi
          BODY="$(mktemp)"
          GUIDE="$(mktemp)"
          if [ "${DRIFT_TEST}" = "true" ]; then
            cat > "${GUIDE}" <<'TESTGUIDE'
          합성 드리프트 fixture 주입 시험이다 — 탐지·발행 경로의 제어된 적색 런이 정상
          완료를 뜻한다. 본 이슈는 [closure-watcher-test] 마커로 격리되며 sweep 잡이
          닫는다(멱등 — 재실행 안전).
          TESTGUIDE
          else
            cat > "${GUIDE}" <<'REALGUIDE'
          수복 절차(docs/evidence/trust_root_reaudit_2026-10-10.md §6.4):
          1. 본 워크플로 로그의 pin-only/derived-only 차집합을 정안/침해 판별 근거로 사용
          2. 긴급 수복 = 정안값으로 main 직접 푸시 재앵커 (S1-C/D 동결 시 유일 경로)
          3. 구조 수복 = 후속 회전 PR(NORMAL에서도 ④ 평가) — §5-1 등록 항목

          참고: 알림 수신자 = 이 워크플로 cron의 마지막 수정 계정(현재 wintrover).
          본 감시자는 merge authority가 없다 — 적색은 머지를 막지 않으며 수복 판단은
          부채/오너 authority의 몫이다. 본 감시자는 config/ 정책 SSOT을 수정하지 않는다.
          REALGUIDE
          fi
          {
            echo "신뢰 루트 감시자가 pin/derived closure 불일치를 실측했다 (fail-closed)."
            echo
            echo "- HEAD: ${HEAD_SHA}"
            echo "- run: ${RUN_URL}"
            echo "- 유도 authority: tools/ci/derive_checker_closure (in-place 컴파일, --ref HEAD)"
            echo "- 대조 대상: config/trusted_writer_set.json 의 trustedCheckerTreeClosure"
            echo
            if [ -f findings/drift_findings.txt ]; then
              echo "## 차집합 (pin-only / derived-only)"
              echo
              echo '```'
              cat findings/drift_findings.txt
              echo '```'
            else
              echo "findings artifact 부재 — detect 잡이 대조 이전 단계에서 실패했다(런 로그 참조)."
            fi
            echo
            cat "${GUIDE}"
          } > "${BODY}"
          gh issue create --title "${TITLE}" --body-file "${BODY}"
          echo "tracking issue created"

  sweep-test-issues:
    # 테스트 이슈 정리 + 드리프트 해결 종결 — 멱등 upsert 상태 기계(OPEN 추적
    # 이슈 ⇔ 라이브 드리프트)의 종결 반쪽. crash-safe 원칙은 두 스텝 모두 동일:
    # 열린 이슈 검색 기반이므로 재실행 멱등(이미 닫힌 이슈는 검색에서 제외)이고,
    # 런 중단으로 남은 이슈는 다음 런(모드 무관 — if: always())이 수렴 정리한다.
    # - 스텝 1: [closure-watcher-test] 마커가 붙은 열린 이슈 종결. 실드리프트
    #   이슈는 마커가 없어 대상이 되지 않는다.
    # - 스텝 2(detect 녹색에서만): 'closure mismatch' 계열 열린 추적 이슈를 해결
    #   코멘트와 함께 종결 — 탐지 녹색 = 라이브 드리프트 부재. 적층 반쪽(생성·
    #   관측 추가)은 report 잡이다. detect 실패 시 스텝 2는 발화하지 않는다(라이브
    #   드리프트 유지). fixture 시험 런은 detect가 적색이므로 스텝 2 불발이 보장.
    needs: [detect, report]
    if: always()
    permissions:
      issues: write
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.detect.outputs.head_sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Sweep leftover test issues (idempotent, marker-scoped)
        run: |
          set -euo pipefail
          OPEN="$(gh issue list --state open --search "closure-watcher-test in:title" --json number --jq '.[].number' || true)"
          if [ -z "${OPEN}" ]; then
            echo "sweep: no open closure-watcher-test issues — no-op"
            exit 0
          fi
          RC=0
          for N in ${OPEN}; do
            echo "sweep: closing test issue #${N}"
            gh issue close "${N}" --comment "sweep: closure-watcher 테스트 이슈 정리(멱등 — 재실행 안전)" || RC=1
          done
          exit "${RC}"

      - name: Close resolved drift tracking issues (detect green = no live drift)
        if: needs.detect.result == 'success'
        run: |
          set -euo pipefail
          OPEN="$(gh issue list --state open --search "closure mismatch in:title" --json number --jq '.[].number' || true)"
          if [ -z "${OPEN}" ]; then
            echo "resolve: no open drift tracking issues — no-op"
            exit 0
          fi
          RC=0
          for N in ${OPEN}; do
            echo "resolve: closing drift tracking issue #${N}"
            RESOLVE_BODY="$(mktemp)"
            {
              echo "resolved: closure-watcher detect가 녹색으로 완료했다 — 라이브 드리프트 부재."
              echo "상태 기계: OPEN 추적 이슈 ⇔ 라이브 드리프트 (탐지 녹색 = 종결)."
              echo
              echo "- HEAD: ${HEAD_SHA}"
              echo "- run: ${RUN_URL}"
              echo
              echo "재발 시 동일 계열 검색 토큰(closure mismatch)으로 새 관측이 재생성된다."
              echo "본 종결은 관측 신호일 뿐이다 — 본 감시자는 merge authority가 없으며"
              echo "config/ 정책 SSOT을 수정하지 않는다."
            } > "${RESOLVE_BODY}"
            gh issue close "${N}" --comment "$(cat "${RESOLVE_BODY}")" || RC=1
            rm -f "${RESOLVE_BODY}"
          done
          exit "${RC}"

  # ── drift schedule 신선도 감시(신규 잡) ────────────────────────────────────
  # detect 잡과 독립이다 — 클로저 대조와 schedule 신선도는 서로 다른 대상이고,
  # 한쪽의 실패가 다른 쪽의 판정을 막지 않는다. 기존 detect/report/sweep
  # 잡은 **수정하지 않았다**(needs·권한·조건 모두 그대로 — 기존 기능 영향 없음).
  drift-freshness:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 10
    # 최소 권한 선언(추가 이유: 실행 이력 조회에 actions: read, 신호 발행·종결에
    # issues: write가 필요하다. 체크아웃하지 않으므로 contents는 불필요 —
    # job-level permissions는 미지정 권한을 전부 none으로 만든다).
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # admission-ssot-drift의 workflow id (gh api 실측 2026-10-22:
      # id=391703936, name=admission-ssot-drift, state=active).
      DRIFT_WORKFLOW_ID: '391703936'
      # drift cron은 매일 04:37 UTC — 하루 주기에 2h 유예를 더한 임계.
      DRIFT_FRESHNESS_MAX_AGE_HOURS: '26'
    steps:
      - name: "[freshness] admission-ssot-drift schedule 실행 신선도 검사 + 신호 발행"
        run: |
          set -euo pipefail
          MAX_AGE_HOURS="${DRIFT_FRESHNESS_MAX_AGE_HOURS}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"

          # ── schedule 실행 이력 조회 (event=schedule 로 한정) ──
          # 조회가 실패하면 신선도를 확정할 수 없으므로 적색으로 남긴다
          # (fail-closed — 확인 못 한 것을 FRESH로 위장하지 않는다).
          if ! gh api "repos/${GH_REPO}/actions/workflows/${DRIFT_WORKFLOW_ID}/runs?event=schedule&per_page=20" > /tmp/drift_schedule_runs.json 2>/tmp/drift_schedule_runs.err; then
            echo "::error::closure-watcher: drift schedule 실행 이력을 읽지 못했다 — 신선도를 확정할 수 없으므로 적색으로 남긴다(fail-closed)."
            cat /tmp/drift_schedule_runs.err >&2
            exit 1
          fi
          SCHEDULE_COUNT="$(python3 -c "import json;print(len(json.load(open('/tmp/drift_schedule_runs.json')).get('workflow_runs') or []))")"

          STATE=""
          REASON=""
          AGE_HOURS=""
          LAST_RUN_ID=""
          LAST_CREATED_AT=""
          LAST_URL=""
          python3 - "${MAX_AGE_HOURS}" <<'PYEOF' > /tmp/drift_freshness.env
          import json
          import shlex
          import sys
          from datetime import datetime, timezone

          max_age_hours = float(sys.argv[1])
          now = datetime.now(timezone.utc)
          try:
              with open('/tmp/drift_schedule_runs.json', encoding='utf-8') as fh:
                  data = json.load(fh)
          except Exception:
              data = {}

          def parse_ts(raw):
              try:
                  return datetime.fromisoformat(str(raw).replace('Z', '+00:00'))
              except Exception:
                  return None

          dated = []
          for run in (data.get('workflow_runs') or []):
              moment = parse_ts(run.get('created_at'))
              if moment is not None:
                  dated.append((moment, run))
          dated.sort(key=lambda item: item[0], reverse=True)

          if not dated:
              state = 'STALE'
              reason = 'schedule 실행이 하나도 없다 — admission-ssot-drift의 cron이 발화한 적이 없다(이력 부재)'
              age_hours = ''
              last_id = ''
              last_created = ''
              last_url = ''
          else:
              moment, run = dated[0]
              age = (now - moment).total_seconds() / 3600.0
              age_hours = f'{age:.1f}'
              last_id = str(run.get('id', ''))
              last_created = str(run.get('created_at', ''))
              last_url = str(run.get('html_url', ''))
              if age > max_age_hours:
                  state = 'STALE'
                  reason = f'마지막 schedule 실행이 {age:.1f}h 경과했다 (임계 {max_age_hours:g}h)'
              else:
                  state = 'FRESH'
                  reason = f'마지막 schedule 실행이 {age:.1f}h 경과했다 (임계 {max_age_hours:g}h)'

          print('STATE=' + shlex.quote(state))
          print('REASON=' + shlex.quote(reason))
          print('AGE_HOURS=' + shlex.quote(age_hours))
          print('LAST_RUN_ID=' + shlex.quote(last_id))
          print('LAST_CREATED_AT=' + shlex.quote(last_created))
          print('LAST_URL=' + shlex.quote(last_url))
          PYEOF
          # shellcheck disable=SC1091
          source /tmp/drift_freshness.env

          {
            echo "## drift schedule freshness"
            echo "- 대상 워크플로: admission-ssot-drift (workflow id ${DRIFT_WORKFLOW_ID})"
            echo "- 대상 cron: 매일 04:37 UTC (37 4 * * *)"
            echo "- 임계: ${MAX_AGE_HOURS}h (마지막 schedule 실행의 경과 시간)"
            echo "- 판정 시각: ${NOW} (UTC)"
            echo "- 상태: ${STATE}"
            echo "- 사유: ${REASON}"
            echo "- 마지막 schedule 실행: id=${LAST_RUN_ID:-n/a} created_at=${LAST_CREATED_AT:-n/a}"
            echo "- 마지막 schedule 실행 URL: ${LAST_URL:-n/a}"
            echo "- 조회된 schedule 실행 건수: ${SCHEDULE_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── FRESH — 종결(resolve) 반쪽: 같은 계열의 열린 신호 이슈를 닫는다 ──
          if [ "${STATE}" != "STALE" ]; then
            OPEN="$(gh issue list --state open --search "drift-stale in:title" --json number --jq '.[].number')"
            for N in ${OPEN}; do
              RESOLVE_BODY="$(mktemp)"
              {
                echo "resolved: drift schedule 신선도가 회복했다 — 마지막 schedule 실행 ${AGE_HOURS}h 경과 (임계 ${MAX_AGE_HOURS}h)."
                echo
                echo "- 판정 시각: ${NOW} (UTC)"
                echo "- 마지막 schedule 실행: ${LAST_URL:-n/a}"
                echo "- 사유: ${REASON}"
                echo
                echo "재발 시 동일 계열 검색 토큰(drift-stale)으로 새 관측이 재생성된다."
                echo "본 감시자는 merge authority가 없으며 어떤 정책 SSOT도 수정하지 않는다."
              } > "${RESOLVE_BODY}"
              gh issue close "${N}" --comment "$(cat "${RESOLVE_BODY}")"
              rm -f "${RESOLVE_BODY}"
            done
            echo "freshness: FRESH — ${REASON}"
            exit 0
          fi

          # ── STALE — 신호 발행(중복 억제: 제목 토큰 검색 → 있으면 코멘트 추가) ──
          if [ -n "${AGE_HOURS}" ]; then
            TITLE="drift-stale: admission-ssot-drift schedule 실행 노후 (${AGE_HOURS}h 경과, 임계 ${MAX_AGE_HOURS}h)"
          else
            TITLE="drift-stale: admission-ssot-drift schedule 실행 이력 없음 (누락)"
          fi
          TOKEN="drift-stale"
          SEARCH="${TOKEN} in:title"

          # 라벨: 존재할 때만 적용 (라벨 생성은 repo admin 권한 필요 — workflow
          # GITHUB_TOKEN으로는 만들 수 없다. 부재/조회 실패는 조용히 넘기지 않고
          # 본문에 명시한다).
          LABEL_REASON=""
          if LABEL_LIST="$(gh label list --limit 200 --json name --jq '.[].name' 2>/tmp/drift_label.err)"; then
            if printf '%s\n' "${LABEL_LIST}" | grep -qx "drift-signal"; then
              LABEL_STATE="applied"
            else
              LABEL_STATE="absent"
              LABEL_REASON="저장소에 drift-signal 라벨이 없다 (생성은 repo admin 권한 필요)"
            fi
          else
            LABEL_STATE="absent"
            LABEL_REASON="라벨 목록 조회 실패 — $(tr '\n' ' ' < /tmp/drift_label.err | head -c 200)"
          fi

          # dedup 검색: 조회 실패 시 생성하지 않는다(중복 발행 방지 우선).
          if EXISTING_NUM="$(gh issue list --state open --search "${SEARCH}" --json number --limit 1 --jq '.[0].number // empty' 2>/tmp/drift_search.err)"; then
            :
          else
            echo "::error::closure-watcher: 기존 신호 이슈 검색에 실패했다 — 중복 발행 방지를 위해 생성하지 않는다(fail-closed)."
            cat /tmp/drift_search.err >&2
            exit 1
          fi

          BODY="$(mktemp)"
          {
            echo "## drift schedule STALE — admission-ssot-drift cron 누락/노후"
            echo
            echo "closure-watcher(독립 cron)가 admission-ssot-drift의 schedule 실행 신선도를 검사했고, 임계치를 초과했다."
            echo
            echo "### 1. 발생 대상"
            echo
            echo "- 대상 워크플로: \`admission-ssot-drift\` (workflow id \`${DRIFT_WORKFLOW_ID}\`)"
            echo "- 대상 cron: 매일 04:37 UTC (\`37 4 * * *\`)"
            echo "- 감시자: \`closure-watcher\` (cron \`17 */6 * * *\`)"
            echo "- 감시자 run: ${RUN_URL}"
            echo "- 판정 시각: ${NOW} (UTC)"
            echo
            echo "### 2. 기대값 vs 실제값"
            echo
            echo "**기대값**"
            echo
            echo "- 매일 04:37 UTC에 schedule 실행이 발생하고, 마지막 schedule 실행의 경과 시간이 ${MAX_AGE_HOURS}h 이하"
            echo
            echo "**실제값**"
            echo
            echo "- 상태: \`STALE\`"
            echo "- 사유: ${REASON}"
            echo "- 마지막 schedule 실행: id=${LAST_RUN_ID:-n/a} created_at=${LAST_CREATED_AT:-n/a} (${AGE_HOURS:-n/a}h 경과)"
            echo "- 마지막 schedule 실행 URL: ${LAST_URL:-n/a}"
            echo "- 조회된 schedule 실행 건수(범위 20건): ${SCHEDULE_COUNT}"
            echo
            echo "### 3. 다음 조치"
            echo
            echo "- 수동 확인: \`gh run list -R ${GH_REPO} --workflow=${DRIFT_WORKFLOW_ID} -L 10\` — schedule 실행이 실제로 없는지 확인"
            echo "- 주의: 수동 dispatch는 cron 누락의 대체가 아니다 — 누락의 원인(큐 적체·runner 부재·마감)을 먼저 본다"
            echo "- 수동 진단 runbook: **아직 없음** — \`docs/spec/rearm_recovery_status.md\`는 현재 저장소에 존재하지 않는다. 다음 조치는 \`operator triage\`다(임의의 링크를 만들지 않는다)."
            echo
            echo "### 4. 감시자의 한계 (정직한 선언)"
            echo
            echo "- **본 감시자 자신은 schedule 기반이므로 자신의 미발화를 감지하지 못한다(재귀 한계).** cron이 멈추면 본 감시자도 함께 멈춘다 — 독립 주체 없이는 구조적으로 제거할 수 없는 한계다."
            echo "- 본 감시자가 감지하는 것은 **다른 워크플로의 schedule 누락**뿐이다."
            echo "- schedule 실행의 conclusion은 판정 입력이 아니다 — 실행이 있었고 RED인 경우는 drift-signal.yml이 별도로 신호를 낸다(이 잡은 중복 보고하지 않는다)."
            echo
            echo "### 5. 라벨·멱등성"
            echo
            echo "- 라벨: \`drift-signal\` — ${LABEL_STATE}${LABEL_REASON:+ — ${LABEL_REASON}}"
            echo "- dedup 키: \`${TOKEN} in:title\` — 동일 계열의 열린 이슈가 있으면 새 이슈를 만들지 않고 관측을 코멘트로 덧붙인다."
            echo "- 신선도가 회복(FRESH)되면 같은 계열의 열린 이슈를 자동 종결한다(멱등 — 재실행 안전)."
          } > "${BODY}"

          if [ -n "${EXISTING_NUM}" ]; then
            COMMENTS="$(gh issue view "${EXISTING_NUM}" --json comments --jq '.comments[].body')"
            if printf '%s\n' "${COMMENTS}" | grep -qF "${RUN_URL}"; then
              echo "upsert: issue #${EXISTING_NUM} already records run ${GITHUB_RUN_ID} — idempotent no-op"
            else
              OBS="$(mktemp)"
              {
                echo "동일 drift 누락 계열의 후속 관측을 기록한다 (upsert — 이슈 중복 생성 억제)."
                echo
                echo "- 판정 시각: ${NOW} (UTC)"
                echo "- 마지막 schedule 실행: ${LAST_RUN_ID:-n/a} created_at=${LAST_CREATED_AT:-n/a} (${AGE_HOURS:-n/a}h 경과)"
                echo "- 감시자 run: ${RUN_URL}"
                echo "- 사유: ${REASON}"
              } > "${OBS}"
              gh issue comment "${EXISTING_NUM}" --body-file "${OBS}"
              echo "upsert: observation appended to #${EXISTING_NUM}"
            fi
          elif [ "${LABEL_STATE}" = "applied" ]; then
            gh issue create --title "${TITLE}" --body-file "${BODY}" --label "drift-signal"
            echo "tracking issue created (token=${TOKEN})"
          else
            gh issue create --title "${TITLE}" --body-file "${BODY}"
            echo "tracking issue created (token=${TOKEN}, label absent)"
          fi

          echo "::error::closure-watcher: drift schedule이 STALE이다 — ${REASON}"
          exit 1

  # ── runner-liveness (비권위 진단 — required check 아님) ──────────────────────
  # 이 잡은 workflow_dispatch + runner_probe∈{diagnose,reinstall}에서만 실행된다.
  # schedule 경로에서는 inputs.runner_probe가 없고 event_name 가드가 먼저
  # 평가되므로 구조적으로 비활성이다 — 기존 6시간 감시 계약에 영향 0.
  # 러너 수퍼바이저의 러너는 ephemeral(1 job/VM)이므로 reinstall 잡이 중단되면 그 자체가
  # 신호이며 성공으로 집계하지 않는다. 종료 코드는 삼키지 않는다(*_EXIT 출력).
  runner-liveness:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner_probe == 'diagnose' || inputs.runner_probe == 'reinstall') }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 15
    concurrency:
      group: runner-liveness-diagnostic
      cancel-in-progress: false
    steps:
      - name: "Layer 1-2: host, supervisor, Runner process, needrestart policy"
        env:
          LIVENESS_MODE: ${{ inputs.runner_probe }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # shell: bash 주입 -eo pipefail 을 되돌린다. 진단 스냅샷은 각 명령의 실패를
          # 그 자체로 관측 대상으로 삼으므로, 첫 비영(非零)에서 잡을 중단하면 증거를
          # 잃는다(2026-10-28 run 40649267706: systemd-cgls 실패로 전체 진단 절단).
          set +e
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

          echo "=== identity ==="
          date -u +%FT%TZ
          hostname
          id
          uname -srm
          echo "MODE=$LIVENESS_MODE RUN_ID=$RUN_ID ATTEMPT=$RUN_ATTEMPT SHA=$SHA"
          echo "WORKFLOW_REF=$WORKFLOW_REF"
          IID="$(cloud-init query instance_id 2>/dev/null)"
          if [ -z "$IID" ]; then IID="$(cat /var/lib/cloud/data/instance-id 2>/dev/null)"; fi
          if [ -z "$IID" ]; then IID=UNKNOWN; fi
          echo "INSTANCE_ID=$IID"
          echo "UPTIME_SECONDS=$(cut -d' ' -f1 /proc/uptime)"
          echo "BOOT_TIME=$(uptime -s)"

          echo "=== runner process ==="
          pgrep -af 'Runner.Listener'
          echo "PGREP_EXIT=$?"
          RPID="$(pgrep -f 'Runner.Listener' | head -1)"
          PPID_OF_RUNNER=""
          if [ -n "${RPID:-}" ]; then
            ps -o pid,ppid,lstart,etimes,cmd -p "$RPID"
            echo "PS_EXIT=$?"
            PPID_OF_RUNNER="$(ps -o ppid= -p "$RPID" | tr -d ' ')"
            echo "RUNNER_PID=$RPID RUNNER_PPID=$PPID_OF_RUNNER"
            if [ -n "$PPID_OF_RUNNER" ]; then
              ps -o pid,ppid,lstart,etimes,cmd -p "$PPID_OF_RUNNER"
              echo "PARENT_PS_EXIT=$?"
            fi
          fi

          echo "=== supervisor unit discovery (러너 수퍼바이저 에이전트 단위명을 가정하지 않는다) ==="
          for u in garm-agent garm-agent.service; do
            printf 'PROBE %s:\n' "$u"
            systemctl show -p Id -p LoadState -p ActiveState -p SubState -p InvocationID -p NRestarts -p ActiveEnterTimestamp -p MainPID -p KillMode "$u"
            echo "PROBE_${u}_EXIT=$?"
          done
          echo "--- units matching runner|garm|actions ---"
          systemctl list-units --all --type=service --no-legend --no-pager 2>&1 | grep -Ei 'runner|garm|actions' | head -20
          echo "UNITS_GREP_EXIT=${PIPESTATUS[1]}"
          echo "--- unit files matching runner|garm ---"
          systemctl list-unit-files --type=service --no-legend --no-pager 2>&1 | grep -Ei 'runner|garm|actions' | head -20
          echo "UNITFILES_GREP_EXIT=${PIPESTATUS[1]}"
          if [ -n "${PPID_OF_RUNNER:-}" ]; then
            echo "--- cgroup of the runner's parent ---"
            cat "/proc/$PPID_OF_RUNNER/cgroup"
            echo "PARENT_CGROUP_EXIT=$?"
            echo "--- unit owning that cgroup (systemctl status on parent pid) ---"
            systemctl status "$PPID_OF_RUNNER" --no-pager 2>&1 | head -20
            echo "STATUS_PID_EXIT=${PIPESTATUS[0]}"
          fi
          echo "--- parent-of-parent chain (max 4) ---"
          walk="$PPID_OF_RUNNER"
          i=0
          while [ -n "$walk" ] && [ "$walk" != "0" ] && [ "$walk" != "1" ] && [ "$i" -lt 4 ]; do
            ps -o pid,ppid,cmd -p "$walk"
            walk="$(ps -o ppid= -p "$walk" | tr -d ' ')"
            i=$((i + 1))
          done
          echo "CHAIN_EXIT=$?"

          echo "=== needrestart package ==="
          dpkg-query -W -f='${Package} ${Version}\n' needrestart
          echo "DPKG_QUERY_EXIT=$?"
          echo "--- conf.d ---"
          ls -la /etc/needrestart/conf.d/
          echo "CONF_D_LS_EXIT=$?"
          echo "--- ci policy file ---"
          cat /etc/needrestart/conf.d/90-ci-no-autorestart.conf 2>/dev/null
          echo "CI_POLICY_CAT_EXIT=$?"

          echo "=== apt periodic policy ==="
          cat /etc/apt/apt.conf.d/99-ci-no-auto-upgrade 2>/dev/null
          echo "APT_CI_POLICY_CAT_EXIT=$?"
          apt-config dump 2>/dev/null | grep -E '^APT::Periodic::(Update-Package-Lists|Unattended-Upgrade)'
          echo "APT_PERIODIC_GREP_EXIT=${PIPESTATUS[1]}"

          echo "=== apt timers/services ==="
          for u in apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service; do
            printf '%s enabled=%s active=%s\n' "$u" \
              "$(systemctl is-enabled "$u" 2>&1)" \
              "$(systemctl is-active "$u" 2>&1)"
          done

          echo "=== dpkg/apt lock holders ==="
          $SUDO fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock
          echo "FUSER_EXIT=$?"

          echo "=== needrestart candidates (diagnostic only — NOT proof the policy applied) ==="
          echo "--- apt hook wiring ---"
          ls -la /etc/apt/apt.conf.d/99needrestart /usr/lib/needrestart/apt-pinvoke 2>&1
          echo "APT_HOOK_LS_EXIT=$?"
          grep -rs "needrestart" /etc/apt/apt.conf.d/ 2>&1 | head -5
          echo "APT_HOOK_GREP_EXIT=$?"
          echo "NEEDRESTART_SUSPEND=${NEEDRESTART_SUSPEND:-<unset>}"
          NR_OUT="$($SUDO needrestart -r l -b 2>&1)"
          NR_RC=$?
          printf '%s\n' "$NR_OUT" | head -60
          echo "NEEDRESTART_EXIT=$NR_RC"
          echo "--- unit restart candidates only ---"
          printf '%s\n' "$NR_OUT" | grep -E '^NEEDRESTART-SVC:' | head -20
          echo "NEEDRESTART_SVC_EXIT=$?"

          echo "=== runner _diag (file names only) ==="
          for d in /root/_diag /home/*/_diag; do
            if [ -d "$d" ]; then
              echo "--- $d ---"
              ls -t "$d" 2>/dev/null | head -10
              echo "DIAG_LS_EXIT=$?"
            fi
          done

      - name: "Layer 3: destructive trigger (reinstall libc6) — only when runner_probe=reinstall"
        if: ${{ inputs.runner_probe == 'reinstall' }}
        run: |
          set -uo pipefail
          # shell: bash 주입 -e 를 되돌린다 — 스냅샷은 각 실패를 그대로 관측한다.
          set +e
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

          # 단위 이름을 가정하지 않는다. 2026-10-28 실측(run 40650533997): 이
          # 이미지의 감독 단위는 러너 수퍼바이저 에이전트 단위가 아니라
          # actions.runner.Archright.service (enabled, active, KillMode=control-group,
          # MainPID=runsvc.sh)이고, 그 cgroup 이 Runner.Listener/Worker 를 소유한다.
          # 따라서 대상 단위는 러너 부모의 /proc/<ppid>/cgroup 에서 역산한다 —
          # 이름 하드코딩은 이미지 교체 시 조용히 빗나간다.
          RUNNER_UNIT=""
          RPID="$(pgrep -f 'Runner.Listener' | head -1)"
          if [ -n "${RPID:-}" ]; then
            PPID_OF_RUNNER="$(ps -o ppid= -p "$RPID" | tr -d ' ')"
            if [ -n "${PPID_OF_RUNNER:-}" ]; then
              RUNNER_UNIT="$(awk -F/ '/\.service$/ {print $NF; exit}' "/proc/$PPID_OF_RUNNER/cgroup" 2>/dev/null)"
            fi
          fi
          echo "RUNNER_UNIT=${RUNNER_UNIT:-UNRESOLVED}"

          snap() {
            echo "--- $1 @ $(date -u +%FT%TZ) ---"
            echo "UPTIME_SECONDS=$(cut -d' ' -f1 /proc/uptime)"
            pgrep -af 'Runner.Listener'
            echo "PGREP_EXIT=$?"
            RPID="$(pgrep -f 'Runner.Listener' | head -1)"
            if [ -n "${RPID:-}" ]; then
              ps -o pid,ppid,lstart,etimes,cmd -p "$RPID"
              echo "PS_EXIT=$?"
            fi
            if [ -n "${RUNNER_UNIT:-}" ]; then
              printf 'RUNNER_UNIT_STATE %s|' "$RUNNER_UNIT"
              systemctl show -p ActiveState -p InvocationID -p NRestarts -p ActiveEnterTimestamp -p MainPID --value "$RUNNER_UNIT" 2>&1 | tr '\n' '|'
              echo
              echo "UNIT_SNAP_EXIT=$?"
            else
              echo "UNIT_SNAP_EXIT=SKIPPED_NO_UNIT"
            fi
            echo "--- runner-ish units (id|state|invocation|restarts|entered) ---"
            for u in $(systemctl list-units --all --type=service --no-legend --no-pager 2>/dev/null \
                        | awk '{print $1}' | grep -Ei 'runner|garm|actions'); do
              printf '%s|' "$u"
              systemctl show -p ActiveState -p InvocationID -p NRestarts -p ActiveEnterTimestamp --value "$u" 2>&1 | tr '\n' '|'
              echo
            done
            echo "UNITSNAP_EXIT=$?"
          }

          snap PRE
          echo "=== reinstall libc6 ==="
          # 출력을 자르지 않는다 — needrestart의 APT 훅(DPkg::Post-Invoke →
          # apt-pinvoke -m u)의 NEEDRESTART-* 라인이 이 트랜잭션 출력 안에 남고,
          # 그게 "정책이 실제로 발동했는가"의 유일한 직접 증거다.
          $SUDO apt-get install --reinstall -y libc6 > /tmp/apt-libc6.out 2>&1
          RC=$?
          echo "APT_EXIT=$RC"
          echo "--- apt output: needrestart hook lines ---"
          grep -nE 'NEEDRESTART|needrestart|Setting up|Preparing to unpack' /tmp/apt-libc6.out | head -30
          echo "APT_NEEDRESTART_GREP_EXIT=$?"
          echo "--- apt output tail ---"
          tail -20 /tmp/apt-libc6.out
          sleep 5
          snap POST
          echo "--- journal tail for the runner unit (restart evidence) ---"
          if [ -n "${RUNNER_UNIT:-}" ]; then
            $SUDO journalctl -b --no-pager -u "$RUNNER_UNIT" 2>&1 | tail -30
            echo "JOURNAL_EXIT=$?"
          else
            echo "JOURNAL_EXIT=SKIPPED_NO_UNIT"
          fi
          echo "=== needrestart candidates after reinstall ==="
          NR_OUT="$($SUDO needrestart -r l -b 2>&1)"
          NR_RC=$?
          printf '%s\n' "$NR_OUT" | grep -E 'SVC:|SESS:|Runner'
          echo "CANDIDATE_GREP_EXIT=${PIPESTATUS[1]}"
          echo "NEEDRESTART_EXIT=$NR_RC"
          exit "$RC"
