# ci-cache-publisher — 신뢰 캐시 퍼블리셔 (ADR-0025 Amendment B)
#
# 역할: 게이트(admission-gate) run이 성공적으로 끝나면, 그 run이 이미 계산한
# ci-bootstrap-artifacts를 검증해 default-branch 스코프의 B-캐시로 재발행하는
# 단일 최소 writer다. 계산(build/test/판정)은 이 워크플로에서 0회 —
# 머지(push) 이벤트에는 아무것도 발화하지 않으며(착지 = 순수 ref 이동),
# 씨딩 시점은 PR 게이트 완료 직후로 앞당겨진다.
#
# 시딩 경로 3개 (2026-10-01 — 머지 사이클 빌드 identity census
# docs/evidence/ci_structural_duplicate_census_2026-09-30.md §5.1):
#   lane 경로: gate lane이 계산한 ci-bootstrap-artifacts를 lane b-key로 재발행.
#     DEBT#502 수정(2026-10-10): lane 페이로드는 ircheck를 포함한 완전
#     5파일 집합이 필수다(verify 루프 fail-closed; upstream runner-pool
#     ci-bootstrap이 `lake build ircheck`로 생산). ircheck-less 부분 엔트리는
#     이 키에 저장 자체가 불가능하며 — 구세대에 저장된 부분 엔트리는 소비자
#     b-verify 5파일 필수 집합에서 DISCARD된다(base-verified-complete 우선
#     규칙, base lookup 주석 참조).
#   base 경로: gate job1(build-base-artifacts)이 계산한
#     admission-check-base-artifacts를 base b-key로 재발행 — base-트리 키는
#     이전에 어떤 주체도 씨딩하지 않아 base 빌드가 구조적으로 항상 콜드였음.
#     앵커 = 플랫폼 진실(PR 유형 런: workflow_run 페이로드
#     pull_request.base.sha, merge_group 유형 런: git/commits/{head_sha}의
#     parents[0]) — manifest의 self-claim은 앵커가 되지 않으며, 도출 base sha와
#     manifest build_sha가 정확 일치할 때만 진행(불일치 = fail-closed skip).
#     base 페이로드 = 코어 아티팩트(bin/ax·install_ax_cas·ircheck·
#     gate_hook·precompile_gates·manifest.txt) + 전용 nimcache 캐리어
#     (admission-check-base-nimcache — job1이 post-build build/nimcache를
#     별도 업로드). 역사: nimcache는 PR-415 874a0b482 때 코어 아티팩트에
#     포함됐다가 54aac2d11(SL-15)의 "do not re-add nimcache" 제거로 캐리어가
#     소실 — save path 목록은 9경로 그대로 선언되었으므로 actions/cache 부분
#     저장 의미론상 nimcache 성분만 조용히 빠진 base 엔트리가 재발행됐고,
#     base-key 복원 시 Nim 컴파일이 구조적으로 콜드로 돌아갔다(2026-10-07
#     복원). 캐리어 부재 = 8경로 부분 저장으로 J3 퇴화(fail-open). base 캐시도
#     소비자 9경로 전체 온기. J3: 가속일 뿐 증거 아님, 정확성 무관 (R9).
#   A 경로 (2026-10-07 — merge_group 벽시계 지배 병목 제거): gate job1의
#     in-job A-save(action.yml:647-666)는 gh-readonly-queue/main/pr-NNN-*
#     브랜치 스코프에 기록되고, GitHub 캐시 복원 규칙(현재 브랜치 ∪ default
#     branch에서만 복원)상 다음 merge_group 런은 복원 불가 — 매 그룹 A-cold
#     setup ~131s가 반복됐다(실측: 설치 ~90s + nimble ~46s + elan ~27s +
#     save ~21s). publisher는 workflow_run으로 default-branch 컨텍스트에서
#     실행되므로 checkout(head_sha)에서 setup 액션을 full scope로 실행하면
#     그 내부 A-save가 default-branch 스코프에 착지한다 — B 경로와 동일한
#     스코프 위임 패턴이며 새 캐시 authority가 아니다(저장 메커니즘 = action
#     내부 기존 A-save 스텝 그대로: lock-completeness 가드·first-save-wins·
#     continue-on-error·exact-key). 키 도메인 불변: a-key = OS+gcc_fp+
#     glibc_fp+script_hash(action.yml+nimble.lock)(action.yml:163-173) —
#     synthetic merge commit과 landed merge commit은 트리를 공유하므로
#     checkout(head_sha)에서 산출한 키는 다음 사이클 소비자와 바이트-동일.
#     PR이 action.yml/nimble.lock을 바꾸면 1회 콜드(문서화된 one-shot cold,
#     action.yml:34-36). merge_group 유형 런에서만 시딩 — 실패 도메인이
#     merge_group(큐 스코프 갇힘)이고 착지되지 않을 PR-트리 키의 낭비 시딩을
#     피한다. in-job A-save는 유지한다: seed 존재 시 소비자 A-restore가
#     exact HIT하고 action.yml:662의 cache-hit 조건이 save를 자동 생략하므로
#     큐 런의 ~21s save 낭비는 소멸한다(잔여 = 키 세대당 첫 콜드 런 21s).
#     J3: A-시딩 실패/부재 = 성능 저하(fail-open), red 아님.
#
# 단일-flight 직렬화 (2026-10-07 — Phase 1: Canonical Build Reuse, 씨딩 결정론화):
#   관측 피해: 동일 머지 사이클이 발화 2회(PR 게이트 완료 + merge_group 게이트
#   완료)를 내고 그 2발화가 동시 실행되며 같은 트리 B키를 놓고 저장 예약 경쟁 →
#   패자 레그 "Unable to reserve cache" 비침명 실패(publisher 5레그 중 3 저장
#   실패 실측) + 4분 간격 동일 트리 콜드 2회(씨딩 공백 → 후속 런 콜드). 캐시
#   서비스에는 잠금 API가 없으므로(공식) 단일화는 2겹으로 만든다:
#     (1) 워크플로 단위 concurrency 직렬화(키 단위 아님): 동시 발화가 순차
#         처리되면 예약 경쟁 구조 자체가 소멸한다. cancel-in-progress: false —
#         진행 중 publisher(A-seed·저장 완주)를 죽이지 않는다. 플랫폼 규칙상
#         그룹당 pending은 최신 1개만 보존되고 초과 대기 런은 취소되지만,
#         생존 런의 (2) 사전조회가 dedup을 보장하므로 저장 중복은 여전히 0
#         (취소된 발화의 A-seed만 성능 저하 가능 — J3 fail-open).
#     (2) 저장 직전 exact-key lookup-only 사전조회(공식 skip-save 패턴): 캐시
#         키는 불변이므로 존재 확인 = 저장 불필요. HIT → 저장 생략 + [publish-
#         skip] key exists(동일 사이클 후행 발화의 전형 경로) / MISS → 유일
#         writer로서 저장. 저장 실패(reservation lost 포함)는 verdict의 outcome
#         로그로 정직화하고(비침명 금지) red로 만들지 않는다(J3) — 후행 발화의
#         lookup-only가 자동 재발화 가드로 보완한다.
#   소비자 계약 불변: publisher가 유일 B writer(action.yml:57-62), 호출자
#   cache-save-enabled:false, 키 도메인·저장 path 목록 무변경. 이 직렬화는
#   publisher 런만 지연시킬 뿐 게이트·큐·병합 동작과 무관하다.
#
# J3 계약: 캐시는 가속일 뿐 증거가 아니며 실행-의미론 입력도 아니다
# (docs/spec/ci_optimization_tcb_judgments.md). 이 퍼블리셔는 어떤 증거
# 주장도 하지 않는다 — 검증 실패 = 기록 생략(fail-closed skip), run은 red로
# 만들지 않는다.
#
# 검증 체인 — lane 경로 (전 단계 실패 = log + skip):
#   1. triggering run conclusion == success (job if) + run.path == admission-gate
#   2. fork run 금지 (default-branch cache write는 동일 저장소 PR 한정)
#   3. ci-bootstrap-artifacts 존재 (mode=none 게이트는 아티팩트 부재 → skip;
#      2026-10-09: lane verify 스텝도 guard.proceed에 결속 — 이전엔 아티팩트
#      부재 사이클마다 verify가 미다운로드 페이로드를 검증하려 실행되어
#      `manifest.txt missing after download` 유령 skip + verify=false 판정을
#      냈다 (T1이 base 저장 skip으로 오독). 부재 사이클 = lane 체인 미실행이며
#      verdict 로그가 이유를 명시한다. lane 아티팩트 존재 시 행동 불변)
#   4. GitHub 사실 기반 **실행 주제 identity 결속** (R10 재범위화 — 2026-10-08,
#      ADR-0025 Amendment D): manifest build_sha가 **이 run이 실제로 빌드한
#      주제**임을 Git Data API 사실로 결속한다 —
#        · merge_group: build_sha == run.head_sha (큐 커밋 G — 동일 객체)
#        · pull_request: run.head_sha ∈ parents(build_sha) (합성 병합 커밋의
#          parent가 PR head)
#      내용 키(tree OID)는 아티팩트의 자기 주장이 아니라 Git Data API에서
#      도출한다. **최신성(landable/ahead) 판정은 이 게이트의 소관이 아니다** —
#      착지 가능성은 GitHub ruleset/merge queue의 권한이며, 메모 계층이 이를
#      재구현하면 authority leakage가 된다. 이 게이트는 lane 페이로드의
#      **크로스-트리 오염 방어**로만 남는다 — 무력화 금지(공격-등가 설계):
#      기준점을 "landable content"에서 "executed subject"로 바꾼 것이며 방어
#      자체는 유지.
#   5. manifest.txt per-file sha256 대조 (전송 무결성)
#   6. b_key는 setup-axiom-toolchain keygen-only로 생성 — cache-build-source =
#      **manifest build_sha**(키 파생을 빌드-소스 정체성에 정렬). 레시피/script
#      파일 해시의 바이트 동일성은 **checkout 전환**으로 보장한다 — build_sha
#      트리로 detach checkout 후 keygen하므로 소비자(게이트 lane: cache-
#      build-source = merge ref/queue head = 동일 트리)와 키가 바이트-동일
#      (base 경로의 "switch checkout to build tree"와 동일 패턴). keygen
#      fail-closed 객체 요구(40-hex 소스의 커밋 객체가 checkout에 있어야 함)는
#      build_sha 객체를 depth-1 fetch로 충족한다.
#
# 검증 체인 — base 경로 (전 단계 실패 = log + skip, :52-53와 동일 방어선):
#   1. path 게이트 통과(guard.proceed_path — run path == admission-gate ∧
#      fork 아님, 아티팩트 무관) 후 admission-check-base-artifacts 존재 확인.
#      mode=none 사이클(ci-bootstrap 없음)도 base는 gate job1이 빌드하므로
#      아티팩트가 존재하면 base 시드는 진행된다 — R6("nothing built")와의
#      차이: base built but lane absent → base만 시드 / 빌드 전무 시만 미발행.
#      lane 체인 불변(아티팩트 존재 게이트)은 guard.proceed가 유지한다
#      (2026-10-01 fix/ci-publisher-base-guard-decouple — 결함: 기존 guard가
#      base 경로를 lane 아티팩트 존재에 결속해 mode=none에서 base 아티팩트가
#      있어도 시드 불가 — 동일 T2 base b-key 2회 콜드 실측, S #409·D #410).
#   2. 플랫폼 진실 앵커(위) == manifest build_sha 정확 일치 — 불일치 =
#      크로스-트리 내용 차단 (lane identity 게이트와 동일 의도, R9)
#   3. per-file sha256 대조 (아티팩트 5개 파일)
#   4. b_key = keygen-only, cache-build-source = manifest build_sha(== base.sha)
#      — checkout을 base 트리로 전환한 뒤 계산해 소비자(admission job1/job2:
#      cache-build-source = base.sha)와 바이트-동일 키를 보장
#   5. cache-version 규칙 (GitHub 공식 — actions/cache: version은 cache inputs
#      (compression + path 목록)에서 유도): 복원 매칭 = key ∧ version. base save
#      path는 소비자 b-restore와 바이트-동일한 9행 목록 필수 (2026-10-01 실측:
#      T1 lane 9경로 version c0438c13… 복원 성공 / T2 base 4경로 version
#      6a4c304a… 복원 실패 — REST에는 키 존재). lane save 동일 목록.
#
# 잔여 위협(공식 cache-poisoning 경고 포함)은 docs/spec/github_delegation_residuals.md
# R3–R6·R9 참조. 트리 OID content-addressing: 내용을 바꾸려면 트리 충돌이 필요.
# B 캐시 키 identity는 2026-10-09부터 트리 OID가 아닌 컴파일 참여 입력 폐쇄
# digest다(R3 — docs-only 트리 전진은 무효화하지 않음); 실행 주체 identity 게이트
# (위 4항)는 여전히 커밋/트리 identity로 결속된다 — 서로 다른 계층, 혼용 금지.

name: ci-cache-publisher

# 발화 필터 (2026-11-02 — WP-B3 게이트-완료 전용 화이트리스트; B2 선정 계약
# docs/evidence/ci_cost_b2_selection_b4_prereg_2026-11-02.md §3.1·§5):
#   이 퍼블리셔의 유일 재료는 게이트 run의 산출물이다(헤더 상단 역할 규정) —
#   그럼에도 2026-10-15부터 발화 우주가 `*`(모든 타 워크플로 완료)였고, 관측
#   A(2026-10 freeze 원장)의 publisher 런 8,762건 중 ~71.4%가 비게이트 완료
#   발화였다(31일 실측 — ci_epoch_record_2026-10-25-publisher-job-if.md 부록
#   A; B2 §2.1 후보 (a)). 발화 우주를 게이트 완료로 한정한다:
#     workflows: ['admission-gate', 'admission-gate-v2']
#   이름 근거(라이브 판독, 2026-11-02): org ruleset 주입 게이트의 완료 run은
#   GitHub 기록 name='admission-gate' · path='.github/workflows/admission-gate-v2.yml'
#   (run 39893960477). 이름 매칭의 현재 유효성 실측: 같은 날 router run
#   41404148309의 guard가 게이트 런 41403237625 완료의 workflow_run 이벤트를
#   수신했다 — ci-provider-router.yml이 동일 이름 화이트리스트를 failover
#   권위로 상용 중이므로 두 소비자가 같은 플랫폼 사실에 의존한다.
#   'admission-gate-v2' 제2항은 등록 세대 드리프트 예비 항이다(2026-10-12→
#   10-16 실측: 등록 세대 전환이 해석 가능 identity를 변동시켰다) — 존재하지
#   않는 이름 항은 매칭에 영향이 없다. 실패 방향 규율(J3): 이름 해석이 다시
#   깨지면 발화 0 = 시딩 공백 = 성능 저하(fail-open, red 아님) — B4 기능
#   계약(A-cache HIT 급락 관측, B2 §4.5)으로 탐지하고 복구는 롤백 유형 4(새
#   PR, B2 §5.3)다. 자기-연쇄는 화이트리스트가 구조적으로 배제한다(publisher
#   이름 미포함 — 구 `!ci-cache-publisher` 위생 항 소멸). 게이트 신원의 최종
#   authority는 in-job guard(run.path — 아래 유지)이며 이름 항은 넓은 그물이다.
#   (역사: 2026-10-12 ruleset-required 전환 때 구 등록 세대의 이름 필터가
#   0발화가 되어 2026-10-15 `*` 완화로 전환됐다. G1 Lever-B 2026-10-16
#   repository_id+path 재등록 이후 이름 해석이 회복됐다 — 2026-11-02 상기
#   실측으로 확정. 상세 전환 기록: ci_epoch_record_2026-10-25-publisher-job-if.md
#   및 본 파일 git 이력.)
#   실행 pre-filter (2026-10-25): 성공 conclusion + 게이트 path인 완료에만 publish
#   잡의 러너를 할당한다(job-level if) — 그 외 완료는 guard API 조회 0회, 러너 0으로
#   생략된다. 비성공 완료는 path와 무관하게 skip-report 잡이 계속 발화한다 —
#   E4/E5 계측의 UNKNOWN-seed 의미를 보존하기 위한 **의도적 비대칭**이다(path
#   조건은 publish.if에만; 2026-11-02 이후 발화 우주가 게이트 완료로 한정되므로
#   실질 = 게이트 비성공 완료 — 수집기의 prefiltered 술어 동치성은 존재하는 모든
#   런에서 불변). in-job guard는 게시 판정 authority로 존속하며, pre-filter는
#   conservative selector(admission superset)일 뿐이다.
on:
  workflow_run:
    workflows: ['admission-gate', 'admission-gate-v2']
    types: [completed]

permissions:
  contents: read
  actions: read

# 단일-flight 직렬화 (헤더 참조): 워크플로 단위(키 단위 아님) 직렬 — 동시
# 발화가 순차 처리되면 저장 예약 경쟁이 구조적으로 소멸하고 후행 발화는 저장
# 전 lookup-only 사전조회(HIT)로 저장을 생략한다. cancel-in-progress: false —
# 진행 중 publisher를 취소하지 않는다(A-seed·저장 완주 보장). 이 그룹은
# publisher 런만 지연시킨다 — 게이트·큐·병합 동작과 무관(이 워크플로는
# admission-gate의 required check가 아니다).
concurrency:
  group: ci-cache-publisher-single-flight
  cancel-in-progress: false

jobs:
  publish:
    # 스케줄러 단계 pre-filter — 성공 conclusion + 게이트 path일 때만 러너를 할당한다.
    # path 술어는 Q6(@ref suffix) 정규화의 **표현식 등가형**이다:
    #   strip(@ref) == bare  ⇔  path == bare  ∨  path startsWith(bare + '@')
    # GitHub 표현식의 ==/startsWith는 대소문자를 무시하므로 이 술어는 conservative
    # selector(admission superset)다 — 최종 게시 판정은 아래 in-job guard(대소문자
    # 구분, 페이로드 run.path)가 그대로 유지한다. fail-closed: 빈/미인식 path → skip.
    # skip-report는 비성공 결론에서 path와 무관하게 계속 발화한다(E4/E5 UNKNOWN-seed
    # 의미 보존) — job-level 조건 변경은 이 job 하나뿐이다.
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.path == '.github/workflows/admission-gate-v2.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/admission-gate-v2.yml@')) }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 15
    # low-trust 트리거(workflow_run) 기본값은 read-only — 단일 최소 publisher
    # 에 한해 명시적으로 write를 선언한다 (공식 경고 및 완화: 파일 헤더 + residuals R3).
    cache-mode: write
    steps:
      - name: "Guard: run identity + fork (path gate) / lane artifact presence (lane gate) — fail-closed → skip"
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          RUN_FORK: ${{ github.event.workflow_run.head_repository.fork }}
        run: |
          set -euo pipefail
          proceed=false
          proceed_path=false
          # path·fork 데이터 원천 = 서버 생성 workflow_run 이벤트 페이로드 — job-if(위)가
          # 이미 신뢰하는 동일 필드다(2026-11-14 — REST GET /actions/runs/{RUN_ID} 재조회
          # 제거, API 호출 2→1; 아티팩트 열거만 API에 남는다). 판정은 셸 비교를 그대로
          # 쓴다(대소문자 구분 — GitHub 표현식 ==는 대소문자를 무시하므로 표현식 비교로
          # 전환하지 않는다). 페이로드 필드 부재·빈 path = fail-closed skip(종전 동일:
          # 빈 문자열은 아래 정확 일치 비교에서 거짓). fork 판정의 빈 값 폴백(→false)
          # 는 종전 jq `// false`와 동일 의미다.
          if [ "$RUN_PATH" != ".github/workflows/admission-gate-v2.yml" ]; then
            echo "[publish-skip] run path '$RUN_PATH' != .github/workflows/admission-gate-v2.yml (orchestrator identity)"
          elif [ "${RUN_FORK:-false}" != "false" ]; then
            echo "[publish-skip] fork-triggered run — default-branch cache write withheld (residuals R4)"
          else
            # path 게이트 — 아티팩트와 무관. mode=none 사이클(ci-bootstrap 없음)도
            # base(admission-check-base-artifacts)는 gate job1이 빌드하므로 base
            # 시드는 이 출력만으로 진행한다 (lane 경로는 proceed로 유지 — lane
            # 아티팩트 부재 시 계속 skip). R6("nothing built")와의 차이: base
            # built but lane absent → base 시드 진행.
            proceed_path=true
            ARTS="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
            ART="$(jq -c --arg n ci-bootstrap-artifacts '.artifacts[]? | select(.name == $n and (.expired | not))' <<<"$ARTS" | head -n1)"
            if [ -z "$ART" ]; then
              echo "[publish-skip] ci-bootstrap-artifacts absent (mode=none gate — nothing built, nothing to publish; residuals R6)"
            else
              echo "artifact_id=$(jq -r '.id' <<<"$ART")" >> "$GITHUB_OUTPUT"
              proceed=true
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "proceed_path=$proceed_path" >> "$GITHUB_OUTPUT"

      # run.head_sha를 Git Data API 사실로 도출 — 아티팩트의 주장은 키로 쓰지
      # 않고, API 사실만 채택한다. tree_head는 관측용 보조 출력이다(verify의
      # identity 판정은 head_sha/parents 기준 — R10 재범위화).
      # path 게이트(proceed_path)로 실행 — verify-base의 merge_group 앵커
      # (git/commits/{head_sha} parents[0])가 HEAD_SHA를 여기서 받는다.
      # lane 아티팩트 부재(mode=none)여도 head_sha/tree_head는 도출된다.
      - name: "Derive run head identity as GitHub truth"
        id: trees
        if: steps.guard.outputs.proceed_path == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "[publish-skip] head_sha '$HEAD_SHA' not 40-hex"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          tree_of() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$1" | jq -r '.tree.sha // empty'
          }
          TREE_HEAD="$(tree_of "$HEAD_SHA")"
          printf '%s' "$TREE_HEAD" | grep -qE '^[0-9a-f]{40}$' || { echo "[publish-skip] cannot derive tree($HEAD_SHA)"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "tree_head=$TREE_HEAD" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.trees.outputs.proceed == 'true'
        with:
          ref: ${{ steps.trees.outputs.head_sha }}
          fetch-depth: 1
          clean: false

      # ────────────────────────────────────────────────────────────────────────
      # A-cache seeding path (헤더 A 경로 참조): setup 액션을 full scope로
      # 1회 실행 — A-restore(HIT이면 설치 전체 생략) 후 lock-complete
      # materialization을 거쳐 액션 내부의 기존 A-save가 default-branch 스코프에
      # 기록한다. checkout(head_sha) 직후·lane 다운로드 전 배치: 이 위치에서
      # 액션 내부 B-restore(b-key = 입력 폐쇄 digest(head_sha 트리))는 publisher가 유일한 B
      # writer(게이트는 B를 쓰지 않음)이므로 통상 MISS(~1s) — 동일 트리 재시드
      # 시 HIT해도 트리-일관 내용이라 lane 다운로드가 덮어쓰고 sha256 검증이
      # 바인딩한다. 워크스페이스 오염 없이 lane/base 체인을 그대로 유지.
      # 프로비저닝 실패 = 시딩 생략(fail-open, J3) — publisher를 red로 만들지
      # 않는다(continue-on-error).
      - name: "A seed: provision toolchain (full scope; installs only on A-miss)"
        id: a-seed
        if: steps.trees.outputs.proceed == 'true' && github.event.workflow_run.event == 'merge_group'
        continue-on-error: true
        uses: ./.github/actions/setup-axiom-toolchain
        with:
          cache-build-source: ${{ steps.trees.outputs.head_sha }}

      - name: "Download gate artifact (cross-run, actions:read)"
        # lane 전용 — guard.proceed(ci-bootstrap 아티팩트 존재)가 lane 체인 진입
        # 조건. mode=none 사이클(아티팩트 부재)에서는 skip — 부재 아티팩트
        # 다운로드가 red를 만들지 않도록 lane 존재 조건을 명시 결속한다.
        if: steps.guard.outputs.proceed == 'true' && steps.trees.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-bootstrap-artifacts
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Verify manifest (executed-subject identity + per-file sha256) — fail-closed skip"
        id: verify
        # guard.proceed 결속 (2026-10-09 — T1 base-seed 침묵 skip 근본 수정):
        # lane 다운로드 스텝은 guard.proceed로 게이트되는데 이 verify 스텝만
        # trees.proceed에만 묶여 있었다. mode=none 사이클(게이트가 lane 아티팩트를
        # 만들지 않음 → 다운로드 스킵)마다 이 스텝이 다운로드된 적 없는 페이로드를
        # 검증하려 실행되어 `[publish-skip] manifest.txt missing after download`를
        # 내고 verify=false로 판정됐다 — 아티팩트 부재는 manifest 결핍이 아니라
        # "만들 것 자체가 없었음"이며, T1이 이 판정선을 base 저장 skip으로 오독한
        # 것이 `manifest.txt missing` 침묵 skip 실측의 근본 원인이다. lane 다운로드와
        # 동일 게이트에 결속시켜 부재 사이클에서는 스텝이 미실행(non-execution)이 되고
        # 아래 verdict 로그가 이유를 명시한다. lane 아티팩트가 실제로 있을 때
        # (guard.proceed=true) 행동은 불변이다.
        if: steps.guard.outputs.proceed == 'true' && steps.trees.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.trees.outputs.head_sha }}
        run: |
          set -euo pipefail
          proceed=false
          skip() { echo "[publish-skip] $1"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -f manifest.txt ] || skip "manifest.txt missing after download"
          BUILD_SHA="$(sed -n 's/^build_sha = //p' manifest.txt | head -n1)"
          printf '%s' "$BUILD_SHA" | grep -qE '^[0-9a-f]{40}$' || skip "manifest build_sha malformed: '$BUILD_SHA'"
          COMMIT_JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$BUILD_SHA")"
          TREE_BUILD="$(jq -r '.tree.sha // empty' <<<"$COMMIT_JSON")"
          PARENTS="$(jq -r '[.parents[].sha] | join(" ")' <<<"$COMMIT_JSON")"
          printf '%s' "$TREE_BUILD" | grep -qE '^[0-9a-f]{40}$' || skip "cannot derive tree($BUILD_SHA)"
          # 실행 주제 identity 결속 (R10 재범위화 — ADR-0025 Amendment D): manifest
          # build_sha가 **이 run이 실제로 빌드한 주제**임을 GitHub 사실로 결속한다.
          #   merge_group:  build_sha == head_sha (큐 커밋 G)
          #   pull_request: head_sha ∈ parents(build_sha) (합성 병합 커밋의 parent)
          # 최신성(landable/ahead) 판정 없음 — 착지 가능성은 GitHub ruleset/merge
          # queue의 권한이며 메모 계층이 재구현하면 authority leakage다.
          identity_ok=false
          if [ "$BUILD_SHA" = "$HEAD_SHA" ]; then
            identity_ok=true
          else
            for p in $PARENTS; do
              if [ "$p" = "$HEAD_SHA" ]; then identity_ok=true; fi
            done
          fi
          if [ "$identity_ok" != true ]; then
            skip "content identity not bound to executed subject: build_sha=$BUILD_SHA (parents: $PARENTS) neither equals nor parents head_sha=$HEAD_SHA (cross-tree content withheld)"
          fi
          # DEBT#502: ircheck 포함 — lane manifest는 runner-pool ci-bootstrap이
          # 바인딩한 완전 5파일 집합이며, 하나라도 결측·불일치하면 lane 체인은
          # fail-closed skip (부분 페이로드는 이 키에 저장될 수 없다).
          for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas \
                   proofs/.lake/build/bin/ircheck; do
            expect="$(awk -v f="$f" '$2 == f {print $1}' manifest.txt)"
            [ -n "$expect" ] || skip "$f missing from manifest.txt"
            [ -f "$f" ] || skip "$f missing after download"
            actual="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$actual" = "$expect" ] || skip "$f sha256 mismatch (manifest=${expect:0:16} actual=${actual:0:16})"
            chmod +x "$f"
          done
          echo "tree_build=$TREE_BUILD" >> "$GITHUB_OUTPUT"
          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # b_key = setup-axiom-toolchain keygen-only — cache-build-source =
      # manifest build_sha (키 파생을 빌드-소스 정체성에 정렬). 레시피/script
      # 해시의 바이트 동일성은 **checkout 전환**으로 보장한다 — 소비자(게이트
      # lane: cache-build-source = merge ref/queue head = build_sha와 동일 트리)
      # 는 target 트리에서 keygen하므로, publisher도 build_sha 트리로 detach
      # checkout한 뒤 keygen해야 키가 바이트-동일하다(base 경로의 "switch
      # checkout to build tree"와 동일 패턴 — R10 재범위화로 트리 등식이 더는
      # 보장하지 않음). keygen fail-closed 객체 요구(40-hex 소스의 커밋 객체가
      # checkout에 있어야 함)는 동일한 depth-1 fetch로 충족한다 (fetch 실패 =
      # red — trees/verify의 API 실패와 동일 취급).
      - name: "Switch checkout to build_sha tree (byte-identical key inputs)"
        if: steps.verify.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags --force origin "${{ steps.verify.outputs.build_sha }}"
          git checkout -f --detach "${{ steps.verify.outputs.build_sha }}"

      - name: "Derive b-key (keygen-only, byte-identical formula)"
        id: keygen
        if: steps.verify.outputs.proceed == 'true'
        uses: ./.github/actions/setup-axiom-toolchain
        with:
          keygen-only: 'true'
          cache-build-source: ${{ steps.verify.outputs.build_sha }}

      - name: "Write B fingerprint manifest (identity unit = input-closure digest)"
        # §2.5 identity cohort: buildSha MUST be the keygen's b-identity (the
        # same derivation that composed the b-key above) — the upstream
        # verify step's tree_build is a DIFFERENT identity unit (whole-tree
        # OID) and would fail every b-verify re-derivation in the new
        # generation. One writer formula, one identity unit.
        if: steps.verify.outputs.proceed == 'true'
        env:
          B_IDENTITY: ${{ steps.keygen.outputs.b-identity }}
          B_KEY: ${{ steps.keygen.outputs.b-key }}
        run: |
          set -euo pipefail
          mkdir -p build
          # DEBT#502: lane fingerprint도 완전 5파일 집합을 기록한다 (기존 4파일은
          # ircheck 결손 — 소비자 b-verify가 4/4를 완전 판정으로 수용하는 결함).
          # base 경로 fingerprint(아래)는 착지 시부터 ircheck를 포함해 왔다.
          AX_SHA="$(sha256sum bin/ax | cut -d' ' -f1)"
          GH_SHA="$(sha256sum bin/gate_hook | cut -d' ' -f1)"
          PG_SHA="$(sha256sum bin/precompile_gates | cut -d' ' -f1)"
          ICA_SHA="$(sha256sum bin/install_ax_cas | cut -d' ' -f1)"
          IR_SHA="$(sha256sum proofs/.lake/build/bin/ircheck | cut -d' ' -f1)"
          jq -n --arg bsha "$B_IDENTITY" --arg bkey "$B_KEY" \
            --arg ax "$AX_SHA" --arg gh "$GH_SHA" --arg pg "$PG_SHA" --arg ica "$ICA_SHA" \
            --arg ir "$IR_SHA" \
            '{schema: "axiom-b-fingerprint-v1", buildSha: $bsha, bKey: $bkey,
              files: {"bin/ax": $ax, "bin/gate_hook": $gh,
                      "bin/precompile_gates": $pg, "bin/install_ax_cas": $ica,
                      "proofs/.lake/build/bin/ircheck": $ir}}' \
            > build/.axiom-b-fingerprint.json
          echo "[publish] fingerprint manifest written (buildSha=$B_IDENTITY, 5 files — DEBT#502 lane supply completion)"

      # 단일-flight 사전조회 (공식 skip-save 패턴 — actions/cache): 캐시 키는
      # 불변 → exact-key 존재 확인 = 저장 불필요. HIT = 같은 트리가 이미
      # 씨딩됨(동일 머지 사이클 후행 발화의 전형) → save 생략 + [publish-skip].
      # MISS = 유일 writer로서 저장 진행. 조회 자체의 transient 실패 =
      # fail-open(출력 공백 → save 조건 true, 종전과 동일하게 저장 시도 —
      # red 없음, J3). path 목록은 아래 save와 바이트-동일이어야 한다(캐시
      # version = path 목록에서 유도 — 동일 입력 없이는 HIT/MISS 판정 자체가
      # 소비자 version과 어긋난다).
      - name: "Single-flight: lane exact-key lookup-only (save gate)"
        id: lane-lookup
        if: steps.verify.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/nimcache
            .axiom/cache
            proofs/.lake
            proofs/build
            build/.axiom-b-fingerprint.json
            bin/ax
            bin/gate_hook
            bin/precompile_gates
            bin/install_ax_cas
          key: ${{ steps.keygen.outputs.b-key }}
          lookup-only: true

      # 단일 씨딩 write — lane-lookup HIT(동일 키 이미 존재) 시 생략, MISS 시
      # 유일 writer로서 저장. 실패(reservation lost 포함)는 J3 fail-open:
      # continue-on-error로 red를 만들지 않고 verdict의 outcome 로그로 정직화
      # 된다 — 후행 발화의 lookup-only가 재발화 가드로 보완. 경로는
      # setup-axiom-toolchain B-restore와 동일해야 한다 (부분 페이로드 = 부분 온기).
      - name: "Publish B-cache (sole writer, default-branch scope; single-flight gated)"
        id: lane-save
        if: steps.verify.outputs.proceed == 'true' && steps.lane-lookup.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/nimcache
            .axiom/cache
            proofs/.lake
            proofs/build
            build/.axiom-b-fingerprint.json
            bin/ax
            bin/gate_hook
            bin/precompile_gates
            bin/install_ax_cas
          key: ${{ steps.keygen.outputs.b-key }}

      # ────────────────────────────────────────────────────────────────────────
      # Base-artifact seeding path (2026-10-01 — census §4/§5.1: base-트리
      # b-key는 어떤 주체도 씨딩한 적이 없어 base 빌드가 구조적으로 항상
      # 콜드). admission-check-base-artifacts = gate job1(build-base-artifacts)
      # 가 base.sha에서 만든 산출물. 이를 base b-key로 재발행하면 다음
      # 사이클의 base 복원(admission job1/job2 — cache-build-source = base.sha)
      # 이 MISS 대신 HIT한다.
      # 앵커 = 플랫폼 진실만 (manifest의 self-claim은 앵커가 아님):
      #   pull_request 유형 런 → workflow_run 페이로드 pull_requests[0].base.sha
      #   merge_group 유형 런 → git/commits/{head_sha} parents[0] (Git Data API)
      # 도출 base sha와 manifest build_sha가 **정확 일치**할 때만 진행 —
      # 불일치 = fail-closed skip. 이것이 base 경로의 크로스-트리 오염 방어다
      # (lane identity 게이트와 동일 의도 — R9).
      # 페이로드 = 코어 아티팩트(bin/ax·bin/install_ax_cas·
      # proofs/.lake/build/bin/ircheck·bin/gate_hook·bin/precompile_gates·
      # manifest.txt) + 전용 nimcache 캐리어(admission-check-base-nimcache
      # — 아래 다운로드 스텝; gate 바이너리 2개는 V1 아티팩트 자급 강화부터
      # 포함). 코어 아티팩트는 gate-attest 사슬(job2 staging + certificate-mint
      # fail-closed 전체 zip 다운로드)이 소비하므로 일부러 evidence-lean을
      # 유지하고, build/nimcache는 게이트가 읽지 않는 성분이므로 캐리어로
      # 분리해 운반한다 — 부재 시 8경로 부분 저장(J3 fail-open). base 캐시도
      # 소비자 9경로 전체 온기. J3: 캐시는 가속일 뿐 증거 아님 — 정확성 무관.
      - name: "Base seed: artifact presence (fail-closed → skip)"
        id: base-check
        # path 게이트(proceed_path)로 진입 — mode=none 사이클도 base는
        # gate job1이 빌드하므로(admission-check-base-artifacts) 아티팩트가
        # 존재하면 시딩한다. 미발행 조건 = base 아티팩트 자체 부재(빌드 전무)
        # 시에만 (residuals R9 (a)). lane 체인 불변은 guard.proceed가 유지.
        if: steps.guard.outputs.proceed_path == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          proceed=false
          ARTS="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
          ART="$(jq -c --arg n admission-check-base-artifacts '.artifacts[]? | select(.name == $n and (.expired | not))' <<<"$ARTS" | head -n1)"
          if [ -z "$ART" ]; then
            echo "[publish-skip] base: admission-check-base-artifacts absent (nothing base-built; residuals R9)"
          else
            proceed=true
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: "Base seed: download base artifacts (cross-run, actions:read)"
        if: steps.base-check.outputs.proceed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-check-base-artifacts
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Base seed: verify manifest (platform-truth anchor + per-file sha256) — fail-closed skip"
        id: verify-base
        if: steps.base-check.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.trees.outputs.head_sha }}
        run: |
          set -euo pipefail
          proceed=false
          skip() { echo "[publish-skip] base: $1"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -f manifest.txt ] || skip "manifest.txt missing after download"
          BUILD_SHA="$(sed -n 's/^build_sha = //p' manifest.txt | head -n1)"
          printf '%s' "$BUILD_SHA" | grep -qE '^[0-9a-f]{40}$' || skip "manifest build_sha malformed: '$BUILD_SHA'"
          EVENT="${{ github.event.workflow_run.event }}"
          if [ "$EVENT" = "pull_request" ]; then
            # workflow_run 페이로드는 플랫폼이 서버 측에서 채운 PR 객체 —
            # base.sha 진실 (manifest 자기 주장 아님).
            BASE_SHA="$(jq -r '.workflow_run.pull_requests[0].base.sha // empty' "$GITHUB_EVENT_PATH")"
            printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' || skip "pull_request anchor base.sha unavailable in workflow_run payload"
          elif [ "$EVENT" = "merge_group" ]; then
            # merge_group 런: head_sha = 큐 커밋 G, parents[0] = base (α-shape —
            # admission-check.yml identity 단계와 동일한 플랫폼 사실).
            printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' || skip "head_sha unavailable (trees step skipped?)"
            COMMIT_JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA")"
            BASE_SHA="$(jq -r '.parents[0].sha // empty' <<<"$COMMIT_JSON")"
            printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' || skip "cannot derive parents[0] of head_sha=$HEAD_SHA"
          else
            skip "unhandled trigger event '$EVENT' — base anchor undefinable (fail-closed)"
          fi
          [ "$BASE_SHA" = "$BUILD_SHA" ] || skip "base anchor mismatch: platform base.sha=$BASE_SHA != manifest build_sha=$BUILD_SHA (cross-tree content withheld — residuals R9)"
          for f in bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck \
                   bin/gate_hook bin/precompile_gates; do
            expect="$(awk -v f="$f" '$2 == f {print $1}' manifest.txt)"
            [ -n "$expect" ] || skip "$f missing from manifest.txt"
            [ -f "$f" ] || skip "$f missing after download"
            actual="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$actual" = "$expect" ] || skip "$f sha256 mismatch (manifest=${expect:0:16} actual=${actual:0:16})"
            chmod +x "$f"
          done
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: "Base seed: switch checkout to base tree (byte-identical key inputs)"
        if: steps.verify-base.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # keygen은 workspace의 레시피/script 파일(Makefile·config.nims·
          # config/effects.nims·src/gate/config.nims·action.yml·nimble.lock)을
          # 해시한다 — base 소비자(admission job1: base.sha checkout)와
          # 바이트-동일 키가 되려면 base 트리에서 계산해야 한다. lane 체인이
          # 이미 끝난 뒤이므로 workspace 전환은 lane 세이브 아카이브에 영향을
          # 주지 않는다 (untracked 다운로드 파일은 유지).
          git fetch --depth=1 --no-tags --force origin "${{ steps.verify-base.outputs.base_sha }}"
          git checkout -f --detach "${{ steps.verify-base.outputs.base_sha }}"

      - name: "Base seed: derive base b-key (keygen-only, cache-build-source = manifest build_sha)"
        id: base-keygen
        if: steps.verify-base.outputs.proceed == 'true'
        uses: ./.github/actions/setup-axiom-toolchain
        with:
          keygen-only: 'true'
          cache-build-source: ${{ steps.verify-base.outputs.base_sha }}

      - name: "Base seed: write base B fingerprint manifest (identity unit = input-closure digest)"
        if: steps.verify-base.outputs.proceed == 'true'
        env:
          B_IDENTITY: ${{ steps.base-keygen.outputs.b-identity }}
          B_KEY: ${{ steps.base-keygen.outputs.b-key }}
        run: |
          set -euo pipefail
          mkdir -p build
          AX_SHA="$(sha256sum bin/ax | cut -d' ' -f1)"
          ICA_SHA="$(sha256sum bin/install_ax_cas | cut -d' ' -f1)"
          IR_SHA="$(sha256sum proofs/.lake/build/bin/ircheck | cut -d' ' -f1)"
          GH_SHA="$(sha256sum bin/gate_hook | cut -d' ' -f1)"
          PG_SHA="$(sha256sum bin/precompile_gates | cut -d' ' -f1)"
          jq -n --arg bsha "$B_IDENTITY" --arg bkey "$B_KEY" \
            --arg ax "$AX_SHA" --arg ica "$ICA_SHA" --arg ir "$IR_SHA" \
            --arg gh "$GH_SHA" --arg pg "$PG_SHA" \
            '{schema: "axiom-b-fingerprint-v1", buildSha: $bsha, bKey: $bkey,
              files: {"bin/ax": $ax, "bin/install_ax_cas": $ica,
                      "proofs/.lake/build/bin/ircheck": $ir,
                      "bin/gate_hook": $gh, "bin/precompile_gates": $pg}}' \
            > build/.axiom-b-fingerprint.json
          echo "[publish] base fingerprint manifest written (buildSha=$B_IDENTITY)"

      # Base nimcache carrier (J3 acceleration — optional): the core base
      # artifact intentionally omits build/nimcache (its consumers — job2
      # staging + certificate-mint fail-closed full-zip download — are the
      # evidence chain and never read the cache), so the warm-build component
      # arrives here separately from job1. Single-path upload ⇒ artifact root
      # is build/nimcache itself (upload-artifact v4 LCA rule), so extracting
      # with path: build/nimcache restores the canonical layout. Absent
      # carrier (probe-discarded cache, older in-flight runs) fails this
      # lookup — continue-on-error downgrades it to the partial-payload save
      # (8 paths, pre-fix behavior): J3 fail-open, never red. The save path
      # list below stays byte-identical to the consumer b-restore regardless
      # (cache version = hash of the declared path list — GitHub official).
      - name: "Base seed: download base nimcache carrier (J3 acceleration — optional)"
        id: base-nimcache-dl
        if: steps.verify-base.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-check-base-nimcache
          path: build/nimcache
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Test-supply fold (2026-10-30 — moved OUT of the gate's attest job,
      # pre-registration:
      # docs/evidence/mg_folding_separation_prereg_2026-10-30.md): the lane
      # jobs' build/nimcache artifacts (test-mode compile supply,
      # admission-check.yml [lane] Upload nimcache) are merged into the same
      # workspace the carrier above populated, so the save below publishes
      # the SAME union the attest job's fold uploaded before the separation
      # — same artifact names (workflow_run.head_sha / run_attempt are the
      # server-truth reconstruction of the gate-side
      # `pull_request.head.sha || merge_group.head_sha || sha` +
      # run_attempt expression in the lane upload name), same
      # download-into-build/nimcache union in the same order (carrier →
      # lane-0 → lane-1), same degrade-tolerant absence semantics: absence
      # of a lane artifact (PR-venue runs, where the lanes legitimately
      # skip, publish no lane artifacts; mode=none cycles) = union degrades
      # to what arrived — J3 fail-open, never red. B-restore contributor
      # resolution: the old attest fold could also see the attest stage's
      # restore-only B-cache content, but that contributor is non-empty
      # ONLY when the exact b-key already exists, and the single-flight
      # lookup gate (below) withholds the save in exactly those cases —
      # so no b-restore is added here (content-neutral, dead download).
      - name: "Base seed: fold lane-0 nimcache (test supply — J3 acceleration, degrade-tolerant)"
        id: base-lane0-nimcache-dl
        if: steps.verify-base.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-nimcache-lane-0-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: build/nimcache
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Base seed: fold lane-1 nimcache (test supply — J3 acceleration, degrade-tolerant)"
        id: base-lane1-nimcache-dl
        if: steps.verify-base.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-nimcache-lane-1-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: build/nimcache
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 단일-flight 사전조회 — base 경로 (lane과 동일 패턴·동일 근거): 동일 머지
      # 사이클의 후행 발화는 동일 base 트리 키를 HIT하고 저장을 생략한다
      # (실측 피해: 4분 간격 동일 base 키 콜드 2회). 조회 실패 = fail-open(저장
      # 시도 유지, red 없음 — J3). path 목록은 아래 save와 바이트-동일.
      #
      # DEBT#502 — base-verified-complete 우선 규칙 (부분→완전 승격):
      #   재액터: lane이 같은 키에 ircheck-less 부분 엔트리를 먼저 저장하면
      #   base의 검증-완전 페이로드 저장이 이 lookup HIT로 영구 보류됐다 —
      #   GitHub 캐시 키는 불변이므로 동일 키 대체(overwrite)는 플랫폼상
      #   불가능하고, 부분 엔트리가 키를 영구 선점했다.
      #   규칙의 실행 형태(3겹 — 키 불변성 하에서의 유일한 정직한 승격):
      #     (a) complete-by-construction writer: lane·base 양 경로의 verify
      #         루프가 5파일(ircheck 포함)을 fail-closed 대조 — 불완전
      #         페이로드는 어떤 키에도 저장 자체가 불가능하다.
      #     (b) 소비자 완전성 게이트: setup-axiom-toolchain b-verify가
      #         manifest 5파일 필수 집합을 강제 — 복원된 부분 엔트리(구세대)
      #         는 DISCARD되어 정상 HIT로 취급되지 않는다 (S5 공급 X).
      #     (c) 세대 전환: 본 슬라이스의 action.yml script_hash 변경이 a_fp를
      #         회전시켜 선점된 구세대 키를 전량 무효화한다 (문서화된 원샷
      #         콜드 — action.yml:34-36).
      #   이후 single-flight 보류는 동일 세대의 완전 엔트리에만 발생한다
      #   (중복 저장 생략 — 본래 목적대로).
      - name: "Single-flight: base exact-key lookup-only (save gate)"
        id: base-lookup
        if: steps.verify-base.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/nimcache
            .axiom/cache
            proofs/.lake
            proofs/build
            build/.axiom-b-fingerprint.json
            bin/ax
            bin/gate_hook
            bin/precompile_gates
            bin/install_ax_cas
          key: ${{ steps.base-keygen.outputs.b-key }}
          lookup-only: true

      # Base seed: publish base B-cache (partial payload = partial warmth).
      # cache-version 규칙 (GitHub 공식 문서 — actions/cache v4: 캐시 version은
      # "cache inputs"(compression + path 목록)에서 유도됨): 복원은 key 문자열뿐
      # 아니라 **version**(=저장 시 path 목록)까지 일치해야 매칭된다. 실측 확정:
      # T1 키(lane 9경로 저장) version=c0438c13… / T2 키(base 4경로 저장)
      # version=6a4c304a… — 키는 동일해도 version이 달라 소비자(9경로 b-restore,
      # action.yml:294-303)가 T2를 매칭 못함 → "Cache not found"(REST에는 키
      # 존재, 2026-10-01 실측). 따라서 base save path는 소비자 b-restore와
      # **바이트-동일한 이 9행 목록**이어야 한다 (동일 입력 = 동일 version).
      # 존재하지 않는 경로는 아카이브에서 빠지고, 일부 존재만으로 저장됨
      # (actions/cache 공식: 전부 부재 시에만 no-save 경고) — R9 부분 온기
      # 의미론과 정합. gate_hook·precompile_gates는 V1 아티팩트 자급 강화부터,
      # build/nimcache는 전용 캐리어(위 다운로드 스텝)가 존재할 때 저장된다
      # — 캐리어 존재 시 9경로 전체, 부재 시 8경로 부분 저장(2026-10-07
      # 캐리어 복원 이전에는 nimcache가 구조적으로 항상 빠졌다). verify(sha256)
      # 대상 5파일은 manifest와 1:1 결속; nimcache는 소비자 측 기능 프로브
      # (admission-check nimcache functional probe)가 무결성을 검증한다.
      - name: "Base seed: publish base B-cache (partial payload = partial warmth; version-matched 9-path list; single-flight gated)"
        id: base-save
        if: steps.verify-base.outputs.proceed == 'true' && steps.base-lookup.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/nimcache
            .axiom/cache
            proofs/.lake
            proofs/build
            build/.axiom-b-fingerprint.json
            bin/ax
            bin/gate_hook
            bin/precompile_gates
            bin/install_ax_cas
          key: ${{ steps.base-keygen.outputs.b-key }}

      - name: "Publish verdict log (acceleration only — no evidence claim)"
        if: always()
        run: |
          echo "[publish] guard=${{ steps.guard.outputs.proceed }} trees=${{ steps.trees.outputs.proceed }} verify=${{ steps.verify.outputs.proceed }} key=${{ steps.keygen.outputs.b-key }}"
          if [ "${{ steps.guard.outputs.proceed }}" != "true" ] && [ "${{ steps.trees.outputs.proceed }}" = "true" ]; then
            echo "[publish-skip] lane chain non-executed — triggering run has no ci-bootstrap-artifacts (mode=none/fork): nothing lane-side to verify or seed (R6); base path governs"
          fi
          echo "[publish] base-guard=${{ steps.base-check.outputs.proceed }} base-verify=${{ steps.verify-base.outputs.proceed }} base-key=${{ steps.base-keygen.outputs.b-key }}"
          echo "[publish] base-nimcache-carrier: outcome=${{ steps.base-nimcache-dl.outcome }} (failure = carrier absent → partial 8-path base entry, J3 fail-open)"
          echo "[publish] base-fold: lane0=${{ steps.base-lane0-nimcache-dl.outcome }} lane1=${{ steps.base-lane1-nimcache-dl.outcome }} (failure = lane artifact absent → fold union degrades to what arrived, J3 fail-open)"
          echo "[publish] a-seed: hit=${{ steps.a-seed.outputs.a-cache-hit }} (merge_group-only; empty = skipped or fail-open)"
          echo "[publish] lane-lookup: outcome=${{ steps.lane-lookup.outcome }} hit=${{ steps.lane-lookup.outputs.cache-hit }} (hit=true → save withheld, single-flight)"
          echo "[publish] lane-save: outcome=${{ steps.lane-save.outcome }} (skipped=single-flight skip / failure=reservation lost or save error, J3 fail-open — next firing re-emits via lookup-only)"
          echo "[publish] base-lookup: outcome=${{ steps.base-lookup.outcome }} hit=${{ steps.base-lookup.outputs.cache-hit }} (hit=true → save withheld, single-flight)"
          echo "[publish] base-save: outcome=${{ steps.base-save.outcome }} (same semantics as lane-save)"
          if [ "${{ steps.lane-lookup.outputs.cache-hit }}" = "true" ]; then
            echo "[publish-skip] lane key exists — save withheld (single-flight): ${{ steps.keygen.outputs.b-key }}"
          fi
          if [ "${{ steps.lane-save.outcome }}" = "failure" ]; then
            echo "[publish-fail] lane reservation lost — save outcome=failure (J3 fail-open; next firing re-emits via lookup-only)"
          fi
          if [ "${{ steps.base-lookup.outputs.cache-hit }}" = "true" ]; then
            echo "[publish-skip] base key exists — save withheld (single-flight): ${{ steps.base-keygen.outputs.b-key }}"
          fi
          if [ "${{ steps.base-save.outcome }}" = "failure" ]; then
            echo "[publish-fail] base reservation lost — save outcome=failure (J3 fail-open; next firing re-emits via lookup-only)"
          fi
          echo "[publish] J3: cache is acceleration, never evidence"

  # Gap 2 계측 (docs/evidence/duplicate_computation_survey_2026-10-09.md §7 갭 2):
  # publish.if가 비성공 결론에서 잡을 skip할 때 로그 라인이 0개였던 문제를 이 잡이
  # 구조 라인 1개로 보완한다. 2026-10-25 pre-filter 도입 후에도 **비성공 결론에서는
  # path와 무관하게 발화**한다 — path 조건은 publish.if에만 붙었으므로 이 잡은 더
  # 이상 publish.if의 정확한 보완은 아니지만, E4/E5 collector의 UNKNOWN-seed 의미
  # (publish 로그 부재 = 비성공 완료)를 보존하는 의도적 비대칭이다. 성공한 비게이트
  # 완료는 두 잡 모두 skipped이며 로그가 없다(collector가 prefiltered로 계수 —
  # 2026-11-02 트리거 화이트리스트 이후 비게이트 완료는 발화 자체가 없어 이 조합은
  # 신규 발생하지 않는다; 게이트 비성공 완료의 UNKNOWN-seed 의미는 불변).
  # 이 잡은 구조 라인 1개만 출력하고 그 외에는 아무것도 하지 않는다. 라인 형태는
  # 기존 [publish-skip] 런타임 마커와 동일하다(GitHub이 타임스탬프를 접두한다 —
  # 스크립트 소스 echo 아닌 실행 출력).
  skip-report:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 5
    steps:
      - name: "Report job-if skip reason (structured line — survey gap 2)"
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
        run: |
          echo "[publish-skip] reason=gate-conclusion-not-success workflow_run.conclusion=$CONCLUSION path=$RUN_PATH"
