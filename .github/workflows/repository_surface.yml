# repository-surface — Product Surface 판정 관측 전용 check (required check 아님;
# merge authority 변경 없음). 판정 정책은 PR의 정책이 아니라 BASE_SHA(main 쪽)의
# 정책을 사용한다 — self-modifying loophole 차단. 부트스트랩: base에 정책이 없는
# 최초 rollout PR은 POLICY_MISSING FAIL이 예상 동작이며 merge 가능(필수 체크 아님).
# axiom-ci 러너 풀에서 실행(GitHub 호스팅 러너 과금 한도와 무관 — 관측
# 가용성은 러너 플릿 가용성에만 의존). Nim 2.2.10은 setup-axiom-toolchain 액션이
# PATH에 주입(호스트 시스템 PATH에 없음 — 16샤드 관례와 동일한 공급 경로).
# 버전 단언은 grep이 마지막 명령이라 nim 부재 시 반드시 실패한다(fail-closed).
# authority-first Phase6 probe: trusted definition change path
# v99 (2026-11-16, SL-20 / VS-1 Surface Truth Epoch): Gate A 정합 — 판정기
# 바이너리를 BASE 트리(worktree @BASE_SHA)에서 컴파일한다(후보 PR 트리가 판정기를
# 공급하지 못한다 — admission-check SL-20과 동일 계약, 결정 #21). diff는
# -c core.quotepath=false로 비-ASCII 경로의 git 인용 변형을 차단하고, HEAD에 정책이
# 존재하며 BASE 컴파일 가드가 v99+(selfAmendment 지원)일 때만 --head-policy로
# 전달한다(guard v2 — 전이 창의 v1 base 가드는 base 세대 판정을 그대로 낸다).
#
# PR 자동 관측이 복원되었다(2026-09-22): pull_request(main) 트리거로 발화된
# repository-surface 판정이 관측된다. 이 job은 조언적 관측(advvisory)이며 required
# check가 아니다 — FAIL 관측은 PR에 남지만 merge를 닫지 않는다. merge authority는
# GitHub ruleset(CODEOWNERS + required checks + merge queue)이고, 로컬 pre-push
# 게이트(Makefile: check-repository-surface ← push-admissibility)도 우회 가능한
# preflight일 뿐 집행점이 아니다.
name: repository-surface

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-surface-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  repository-surface:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Restore-only cache reader (no save post-step) — no cache-write races.
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope — the stdlib-only guard is compiled with the full
          # hermetic flag set below, so no project bootstrap runs and lean/lake
          # are never invoked. skip-nimble-install stays 'false': the action's
          # nim-scope verification stamp structurally requires the lockfile
          # package closure in ~/.nimble/pkgs2, so a cold A-cache must be able
          # to materialize it deterministically instead of relying on a
          # previous run's cache.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-save-enabled: 'false'
          cache-build-source: ${{ github.sha }}

      - name: Verify pinned Nim 2.2.10 (fail-closed)
        run: nim --version | grep -F '2.2.10'

      - name: Resolve BASE_SHA (merge-base with main)
        run: |
          BASE_SHA=$(git merge-base origin/main HEAD)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA"

      - name: Extract base policy (base-policy binding)
        run: git show "$BASE_SHA:config/repository_surface.json" > /tmp/base_policy.json

      - name: Build surface guard from BASE tree (Gate A)
        # Full hermetic flag set: --skipProjCfg prevents config.nims /
        # config/integrity.nims from firing, whose manifest bootstrap compiled
        # tools/feature_manifest_generator.nim (and needed checksums) on every
        # `nim c`. surface_guard imports std/* only, so no path/package is
        # required — the flags narrow the compile to exactly its declared
        # dependencies. Measured cold: 2.55s (was ~11s through the bootstrap).
        # v99 Gate A (decision #21): the verifier binary compiles from the
        # BASE tree (detached worktree at BASE_SHA) — never from the PR tree;
        # --path flags point at /tmp/btree so candidate-tree imports cannot
        # supply the adjudicator.
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/btree "$BASE_SHA" \
            || { echo "worktree add @BASE_SHA failed (Gate A: verifier from base)"; exit 1; }
          mkdir -p build
          nim c --hints:off -d:release \
            --skipParentCfg --skipProjCfg --skipUserCfg --noNimblePath \
            --path:/tmp/btree --path:/tmp/btree/src \
            --nimcache:.nimcache_surface_guard \
            -o:build/surface_guard /tmp/btree/tools/surface_guard.nim

      - name: Extract head policy (selfAmendment, if present)
        # v99: head policy participates only when present at HEAD (guard v2
        # selfAmendment contract); an absent/deleted policy degrades to
        # base-only judgment.
        run: |
          if git show "HEAD:config/repository_surface.json" > /tmp/head_policy.json 2>/dev/null; then
            echo "HEAD_POLICY=/tmp/head_policy.json" >> "$GITHUB_ENV"
          else
            echo "HEAD_POLICY=" >> "$GITHUB_ENV"
          fi

      - name: Classify PR diff (BASE_SHA...HEAD)
        run: |
          git -c core.quotepath=false diff --name-status "$BASE_SHA...HEAD" | tee /tmp/changes.name-status
          # Gate A: the adjudicator is BASE-compiled — pass --head-policy only
          # when the BASE generation's guard supports it (v99+). A v1 base
          # guard has no selfAmendment contract; its verdict is the base
          # generation's honest judgment of this diff. (Feature probe is
          # content-derived from the compiled binary's own usage surface —
          # no version parsing. SL-20 needs no probe: its scope gate is
          # manifest-coupled, so a base manifest that includes SL-20 implies
          # a base tree with the v2 guard.)
          if build/surface_guard 2>&1 | grep -q -- --head-policy && [ -n "${HEAD_POLICY:-}" ]; then
            build/surface_guard --policy /tmp/base_policy.json --head-policy "$HEAD_POLICY" --diff /tmp/changes.name-status
          else
            build/surface_guard --policy /tmp/base_policy.json --diff /tmp/changes.name-status
          fi
