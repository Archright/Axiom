name: publication-integrity

# publication-integrity — the single-verdict publication readiness gate.
#
# POLICY (machine-readable SSOT):
#   compliance/policy/license-policy.yml       (license allowlist + denied families)
#   compliance/policy/security-policy.yml      (secret/dependency/sbom tool pins
#                                               + verdict semantics)
#   compliance/policy/provenance-policy.yml    (origin-class semantics)
#   compliance/policy/secret-scan-baseline.json (audited secret fingerprints)
#   compliance/provenance/source-origin.yml     (per-path origin declarations)
#   compliance/provenance/license-attribution.yml (audited detection attributions)
# SPEC: docs/spec/publication_integrity_gate.md
#
# REQUIRED-CHECK POSTURE: this workflow is bound by the repo ruleset as the
# `publication-integrity` context. Therefore — NO path filters, NO
# conditional job skips, NO concurrency cancellation: every event runs every
# sub-job, and the aggregation job runs with `if: !cancelled()` so the
# check-run ALWAYS reports the real conclusion (a skipped sub-job is a
# MISSING verdict: the aggregator treats skipped/cancelled as UNKNOWN —
# never success).
#
# The license-scan dimension runs as an internal 2-shard matrix
# (license-scan-shards) feeding the single adjudicating license-scan job: the
# shards run on every event under the same NO-skip posture, and the dimension
# verdict stays one evaluator over one set-checked merged report (a lost
# shard is fail-closed, never a quiet partial pass).
#
# The aggregation job id MUST stay `publication-integrity` (ruleset
# required_status_checks + merge_admission.json RequiredChecks bind this
# exact context).

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  schedule:
    # Nightly re-run on the default branch (off-minute by repo convention —
    # cf. admission-ssot-drift '37 4 * * *'). Keeps the gate live between
    # landings: baseline/DB/tool drift surfaces as a FAILED run, never as a
    # silently green stale pass.
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── dimension: secret-scan ────────────────────────────────────────────
  secret-scan:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "[scope] fetch the declared publication-surface refspecs"
        # security-policy.yml secretScan.fetchRefspecs — the scan scope is
        # EXACTLY the refs that belong to the publication surface (branches +
        # tags + HEAD). Closed/unmerged PR refs (refs/pull/*/head) are outside
        # the publication surface and are audited separately in the
        # non-blocking informational step on workflow_dispatch/schedule.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HDR="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH_HDR" fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
      - name: "[tool] gitleaks 8.30.1 (release tarball + sha256 verification)"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "$expected  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: "[scan] history leg — the declared publication surface"
        run: |
          set -euo pipefail
          # --exit-code 1 makes gitleaks exit nonzero on findings; the
          # fingerprints, not the exit code, are the verdict input (the
          # baseline owns the triage), so `|| true` here is NOT a bypass:
          # the evaluator below fails on any fingerprint outside the
          # baseline and UNKNOWNs on a missing/unparsable report.
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git \
            --redact=100 \
            --log-opts "--branches --tags --remotes=origin HEAD" \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks_history.json" \
            --no-banner --exit-code 1 . || true
          test -s "$RUNNER_TEMP/gitleaks_history.json"
      - name: "[scan] tree leg — the current working tree"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir \
            --redact=100 \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks_tree.json" \
            --no-banner --exit-code 1 . || true
          test -s "$RUNNER_TEMP/gitleaks_tree.json"
      - name: "[audit] informational closed-PR ref scan (non-blocking)"
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HDR="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH_HDR" fetch --no-tags --prune origin \
            '+refs/pull/*/head:refs/remotes/pr/*' || true
          if git for-each-ref --format='%(refname)' refs/remotes/pr/ | grep -q .; then
            "$RUNNER_TEMP/gitleaks-bin/gitleaks" git \
              --redact=100 \
              --log-opts "--glob=refs/remotes/pr/* --not --branches --tags --remotes=origin" \
              --report-format json \
              --report-path "$RUNNER_TEMP/gitleaks_pr_audit.json" \
              --no-banner --exit-code 1 . || true
            if [ -s "$RUNNER_TEMP/gitleaks_pr_audit.json" ]; then
              pr_findings="$(jq 'length' "$RUNNER_TEMP/gitleaks_pr_audit.json" 2>/dev/null || echo 0)"
              if [ "${pr_findings:-0}" -gt 0 ]; then
                echo "::warning::Unmerged/closed PR refs (refs/pull/*/head) outside the publication surface contain ${pr_findings} redacted finding(s). Run tools/ci/publication_self_heal.sh --audit-refs and --support-bundle to remediate."
              fi
            fi
            rm -f "$RUNNER_TEMP/gitleaks_pr_audit.json"
            git for-each-ref --format='%(refname)' refs/remotes/pr/ | xargs -r -n1 git update-ref -d || true
          fi
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope: these jobs run `nim c` over stdlib + in-repo modules and
          # never invoke lean/lake. The action still provisions + pins z3/jq
          # (its scope contract), and the nimble package closure stays in the
          # payload because config/integrity.nims' manifest bootstrap compiles
          # feature_manifest_generator (import checksums/sha2) on every compile.
          # ~/.elan is the only dropped path — it dominates the 1.16GB full
          # payload. Exact-key restore + fingerprint verify + fail-closed
          # install are unchanged; only the payload's scope is narrower.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-build-source: ${{ github.sha }}
      - name: "[adjudicate] publication_secret_eval"
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:off --path:. --path:src \
            --nimcache:build/nimcache/vsi_secret_eval \
            -o:build/vsi_secret_eval tools/ci/publication_secret_eval.nim
          ./build/vsi_secret_eval \
            --history "$RUNNER_TEMP/gitleaks_history.json" \
            --tree "$RUNNER_TEMP/gitleaks_tree.json" \
            --baseline compliance/policy/secret-scan-baseline.json \
            --policy compliance/policy/security-policy.yml \
            --out "$RUNNER_TEMP/report_secret.json"
      - name: "[evidence] upload dimension report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-report-secret-scan
          path: |
            ${{ runner.temp }}/report_secret.json
          retention-days: 30
          if-no-files-found: error

  # ── dimension: license-scan ──────────────────────────────────────────
  # Internal execution structure (epoch ci-frozen-2026-11-10-pi-shard,
  # restructured same day — epoch_record §2.6): the deterministic scan
  # surface (HEAD tree blobs, minus the basenames ScanCode default-ignores)
  # is split by a size-greedy 2-partition; each leg stages its file set
  # under a root named like the workspace and scans that ONE root — the only
  # input form ScanCode handles correctly (spec §5). The adjudicating
  # license-scan job below merges the (path-deduped) shard reports into ONE
  # report — single evaluator, single dimension verdict.
  license-scan-shards:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          persist-credentials: false
      - name: "[tool] scancode-toolkit 32.5.0 + pluggy 1.5.0 (venv, pinned)"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scancode-venv"
          "$RUNNER_TEMP/scancode-venv/bin/pip" install --quiet \
            'scancode-toolkit==32.5.0' 'pluggy==1.5.0'
          "$RUNNER_TEMP/scancode-venv/bin/scancode" --version
      - name: "[scan] license + copyright detection over the staged shard (single-root)"
        run: |
          set -euo pipefail
          SHARD="${{ matrix.shard }}"
          # Deterministic split, bound to the HEAD tree (not the checkout
          # index): a size-greedy 2-partition over `git ls-tree -r -l HEAD`
          # blobs (fields: mode, type, sha, size, path), largest-first with
          # path tiebreak — same tree → same split (AGENTS.md §0.2
          # determinism), and size-greedy balances the scan work between the
          # two legs. Tracked paths with spaces/non-ASCII would break the
          # field split — measured: none (NF!=5 over ls-tree output is
          # empty).
          # The VCS-name filter mirrors ScanCode's own walk ignore so the
          # scan surface is exactly what the scanner can emit:
          # commoncode/ignore.py `ignores_VCS` (scancode-toolkit 32.5.0
          # lines 157-175, applied by commoncode/resource.py skip_ignored
          # during the walk), lowercased basename matching at any depth —
          # the plain file names of that list are mirrored here; its three
          # "*/"-prefixed entries match VCS metadata DIRECTORIES (not file
          # names) and no tracked path matches them. The merge job derives
          # its expected set with the IDENTICAL filter — the two derivations
          # must stay in lockstep (spec §3.2, §5).
          git ls-tree -r -l HEAD \
            | awk 'tolower($5) !~ /(^|\/)(\.bzr|\.bzrignore|\.git|\.gitignore|\.gitattributes|\.hg|\.hgignore|\.repo|\.svn|\.svnignore|\.tfignore|vssver\.scc|cvs|\.cvsignore)$/ {print $4, $5}' \
            | LC_ALL=C sort -k1,1rn -k2,2 \
            | awk -v s="$SHARD" 'BEGIN{w0=0; w1=0} { if (w0 <= w1) { w0 += $1; t=0 } else { w1 += $1; t=1 } if (t == s) print $2 }' \
            | LC_ALL=C sort > "$RUNNER_TEMP/shard_files.txt"
          test -s "$RUNNER_TEMP/shard_files.txt"
          # Stage the shard under a root named EXACTLY like the workspace
          # basename, then scan that ONE directory: a single directory
          # argument is the only input form ScanCode 32.5 handles correctly
          # (spec §5) — the argument string becomes the scan root and every
          # file is emitted as '<root>/<repo-relative>', the same path shape
          # the frozen single-root '.' scan produced (cwd-basename prefix),
          # so prefix stripping, merge, and adjudication all stay valid. A
          # multi-file argument list is silently rewritten to a common-root
          # include-pattern scan that drops all subdirectory files (J1
          # defect 1) — file-list scans are retired for good.
          PFX="$(basename "$GITHUB_WORKSPACE")"
          STAGE="$RUNNER_TEMP/shard-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE/$PFX"
          tar -C "$GITHUB_WORKSPACE" -cf - -T "$RUNNER_TEMP/shard_files.txt" \
            | tar -C "$STAGE/$PFX" -xf -
          ( cd "$STAGE" && "$RUNNER_TEMP/scancode-venv/bin/scancode" \
              --license --copyright --processes 4 \
              --json-pp "$RUNNER_TEMP/scancode_shard.json" "$PFX" ) || {
              echo "scancode exited nonzero on a completed shard — report may be incomplete" >&2
              exit 1
            }
          test -s "$RUNNER_TEMP/scancode_shard.json"
          # Per-shard set self-check — the scan surface must match the input
          # list EXACTLY (failure localization; the regression net for the
          # retired file-list scan defect). Scan paths are emitted as
          # '<workspace-basename>/<repo-relative>' (measured) — compare after
          # stripping the prefix.
          jq -r '.files[] | select(.type=="file") | .path' "$RUNNER_TEMP/scancode_shard.json" \
            | sed "s|^${PFX}/||" | LC_ALL=C sort > "$RUNNER_TEMP/report_paths.txt"
          if LC_ALL=C comm -3 "$RUNNER_TEMP/shard_files.txt" "$RUNNER_TEMP/report_paths.txt" | grep -q .; then
            echo "shard $SHARD scan surface mismatch — missing or unexpected paths:" >&2
            LC_ALL=C comm -3 "$RUNNER_TEMP/shard_files.txt" "$RUNNER_TEMP/report_paths.txt" | head -20 >&2
            exit 1
          fi
      - name: "[evidence] upload shard report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-scan-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/scancode_shard.json
            ${{ runner.temp }}/shard_files.txt
          retention-days: 3
          if-no-files-found: error

  license-scan:
    needs: [license-scan-shards]
    # Always runs: a failed/cancelled shard leg leaves a shard-count mismatch
    # below and this job reports the real FAIL conclusion — a skipped
    # adjudication would surface as UNKNOWN downstream (fail-closed).
    if: ${{ !cancelled() }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          persist-credentials: false
      - name: "[evidence] download the shard scans"
        # Pattern download extracts each artifact into its own subdirectory
        # (license-scan-shard-0/, license-scan-shard-1/). A shard that failed
        # before uploading leaves a count mismatch — the merge step below
        # FAILS closed, it never adjudicates a partial scan surface.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: license-scan-shard-*
          path: ${{ runner.temp }}/shards
      - name: "[merge] deterministic shard report merge + set completeness"
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/shards"
          # Exactly 2 shard reports must be present — a missing leg is
          # fail-closed: never adjudicate over a partial scan surface.
          SHARD_REPORTS=$(find "$S" -name scancode_shard.json | LC_ALL=C sort)
          SHARD_COUNT=$(printf '%s\n' "$SHARD_REPORTS" | grep -c .)
          [ "$SHARD_COUNT" -eq 2 ] || { echo "expected 2 shard reports, found $SHARD_COUNT" >&2; exit 1; }
          # Deterministic merge: files = concat + sort_by(.path) + per-path
          # dedup; top-level license_detections = per-identifier
          # detection_count re-aggregation (the evaluator consumes only
          # per-file inline fields — measured; the key is preserved for
          # shape); headers from shard 0. Same input → same output.
          # The per-path dedup exists for DIRECTORY entries: each shard
          # stages its own tree, so every directory holding files of BOTH
          # legs is emitted once per shard report (group_by needs sorted
          # input — the preceding sort_by provides it). FILE entries are
          # disjoint by the partition, so the dedup is a shape no-op for
          # files and the duplicate-file check below remains the fail-closed
          # net.
          jq -s '{
            headers: .[0].headers,
            files: (map(.files) | add | sort_by(.path)
              | group_by(.path) | map(.[0])),
            license_detections: (map(.license_detections) | add
              | group_by(.identifier)
              | map(.[0] + {detection_count: (map(.detection_count) | add)}))
          }' $SHARD_REPORTS > "$RUNNER_TEMP/scancode.json"
          test -s "$RUNNER_TEMP/scancode.json"
          # Global completeness — SET equality (not a count): merged file
          # path set == expected scannable set, no duplicate paths. Missing,
          # duplicated, or unexpected files all FAIL. The expected set is
          # derived from the HEAD tree EXACTLY like the shard partition in
          # the scan step (ls-tree blobs minus the ScanCode ignores_VCS
          # basenames — identical filter, keep in lockstep): a raw
          # 'git ls-files' set would additionally contain the
          # .gitignore/.gitattributes files ScanCode never emits in ANY
          # topology (its walk default-ignores them — spec §5), making the
          # check unpassable; the expectation must be the scannable set.
          PFX="$(basename "$GITHUB_WORKSPACE")"
          jq -r '.files[] | select(.type=="file") | .path' "$RUNNER_TEMP/scancode.json" \
            | sed "s|^${PFX}/||" > "$RUNNER_TEMP/merged_paths.txt"
          if [ "$(LC_ALL=C sort "$RUNNER_TEMP/merged_paths.txt" | uniq -d | wc -l)" -ne 0 ]; then
            echo "duplicate paths in merged report:" >&2
            LC_ALL=C sort "$RUNNER_TEMP/merged_paths.txt" | uniq -d | head >&2
            exit 1
          fi
          LC_ALL=C sort -u "$RUNNER_TEMP/merged_paths.txt" > "$RUNNER_TEMP/merged_set.txt"
          git ls-tree -r -l HEAD \
            | awk 'tolower($5) !~ /(^|\/)(\.bzr|\.bzrignore|\.git|\.gitignore|\.gitattributes|\.hg|\.hgignore|\.repo|\.svn|\.svnignore|\.tfignore|vssver\.scc|cvs|\.cvsignore)$/ {print $5}' \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected_set.txt"
          if LC_ALL=C comm -3 "$RUNNER_TEMP/expected_set.txt" "$RUNNER_TEMP/merged_set.txt" | grep -q .; then
            echo "completeness FAIL — merged file set != expected scannable set (HEAD tree blobs minus ScanCode ignores_VCS):" >&2
            LC_ALL=C comm -3 "$RUNNER_TEMP/expected_set.txt" "$RUNNER_TEMP/merged_set.txt" | head -20 >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope: these jobs run `nim c` over stdlib + in-repo modules and
          # never invoke lean/lake. The action still provisions + pins z3/jq
          # (its scope contract), and the nimble package closure stays in the
          # payload because config/integrity.nims' manifest bootstrap compiles
          # feature_manifest_generator (import checksums/sha2) on every compile.
          # ~/.elan is the only dropped path — it dominates the 1.16GB full
          # payload. Exact-key restore + fingerprint verify + fail-closed
          # install are unchanged; only the payload's scope is narrower.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-build-source: ${{ github.sha }}
      - name: "[adjudicate] publication_license_eval"
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:off --path:. --path:src \
            --nimcache:build/nimcache/vsi_license_eval \
            -o:build/vsi_license_eval tools/ci/publication_license_eval.nim
          # ScanCode prefixes emitted paths with the scan-root directory NAME
          # (measured: scanning '.' emits '<cwd-basename>/<repo-relative>'), so
          # the evaluator gets the same prefix to strip — repo-relative paths
          # are the declaration namespace.
          ./build/vsi_license_eval \
            --scan "$RUNNER_TEMP/scancode.json" \
            --policy compliance/policy/license-policy.yml \
            --origin compliance/provenance/source-origin.yml \
            --attribution compliance/provenance/license-attribution.yml \
            --strip-prefix "$(basename "$GITHUB_WORKSPACE")" \
            --out "$RUNNER_TEMP/report_license.json"
      - name: "[evidence] upload dimension report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-report-license-scan
          path: |
            ${{ runner.temp }}/report_license.json
            ${{ runner.temp }}/scancode.json
          retention-days: 30
          if-no-files-found: error

  # ── dimension: dependency-scan ───────────────────────────────────────
  dependency-scan:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          persist-credentials: false
      - name: "[tool] osv-scanner v2.7.1 (release binary + sha256 verification)"
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64"
          expected="fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" "$url"
          echo "$expected  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version
      - name: "[scan] osv scan (exit code captured, never a bypass)"
        run: |
          set -uo pipefail
          # The exit code IS the verdict input (security-policy.yml
          # dependencyScan.exitCodeAdjudication). 128 = completed scan, no
          # OSV-indexed package sources — PASS with declared limitations.
          # QUIRK (docs/spec/publication_integrity_gate.md): GitHub runs
          # run: scripts under 'bash -e' — 'set -uo pipefail' does NOT
          # disable that inherited errexit, so a bare scan line aborts the
          # step before code=$? can capture. Capture with '|| code=$?'
          # (a || list never triggers -e); never let the step itself fail.
          code=0
          "$RUNNER_TEMP/osv-scanner" scan --format json . \
            > "$RUNNER_TEMP/osv.json" 2> "$RUNNER_TEMP/osv_stderr.txt" || code=$?
          echo "OSV_EXIT=$code" >> "$GITHUB_ENV"
          echo "osv-scanner exited $code (see security-policy.yml exitCodeAdjudication)"
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope: these jobs run `nim c` over stdlib + in-repo modules and
          # never invoke lean/lake. The action still provisions + pins z3/jq
          # (its scope contract), and the nimble package closure stays in the
          # payload because config/integrity.nims' manifest bootstrap compiles
          # feature_manifest_generator (import checksums/sha2) on every compile.
          # ~/.elan is the only dropped path — it dominates the 1.16GB full
          # payload. Exact-key restore + fingerprint verify + fail-closed
          # install are unchanged; only the payload's scope is narrower.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-build-source: ${{ github.sha }}
      - name: "[adjudicate] publication_dependency_eval"
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:off --path:. --path:src \
            --nimcache:build/nimcache/vsi_dependency_eval \
            -o:build/vsi_dependency_eval tools/ci/publication_dependency_eval.nim
          ./build/vsi_dependency_eval \
            --exit-code "$OSV_EXIT" \
            --report "$RUNNER_TEMP/osv.json" \
            --policy compliance/policy/security-policy.yml \
            --out "$RUNNER_TEMP/report_dependency.json"
      - name: "[evidence] upload dimension report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-report-dependency-scan
          path: |
            ${{ runner.temp }}/report_dependency.json
            ${{ runner.temp }}/osv.json
          retention-days: 30
          if-no-files-found: error

  # ── dimension: provenance ─────────────────────────────────────────────
  provenance:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope: these jobs run `nim c` over stdlib + in-repo modules and
          # never invoke lean/lake. The action still provisions + pins z3/jq
          # (its scope contract), and the nimble package closure stays in the
          # payload because config/integrity.nims' manifest bootstrap compiles
          # feature_manifest_generator (import checksums/sha2) on every compile.
          # ~/.elan is the only dropped path — it dominates the 1.16GB full
          # payload. Exact-key restore + fingerprint verify + fail-closed
          # install are unchanged; only the payload's scope is narrower.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-build-source: ${{ github.sha }}
      - name: "[adjudicate] publication_provenance_validator"
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:off --path:. --path:src \
            --nimcache:build/nimcache/vsi_provenance \
            -o:build/vsi_provenance tools/ci/publication_provenance_validator.nim
          ./build/vsi_provenance --out "$RUNNER_TEMP/report_provenance.json"
      - name: "[evidence] upload dimension report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-report-provenance
          path: ${{ runner.temp }}/report_provenance.json
          retention-days: 30
          if-no-files-found: error

  # ── dimension: sbom ────────────────────────────────────────────────────
  sbom:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          persist-credentials: false
      - name: "[tool] syft v1.57.0 (release tarball + sha256 verification)"
        run: |
          set -euo pipefail
          url="https://github.com/anchore/syft/releases/download/v1.57.0/syft_1.57.0_linux_amd64.tar.gz"
          expected="9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/syft.tar.gz" "$url"
          echo "$expected  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/syft-bin"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/syft-bin"
          "$RUNNER_TEMP/syft-bin/syft" version
      - name: "[scan] SPDX-2.3 JSON SBOM of the checkout"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/syft-bin/syft" scan . -o spdx-json \
            > "$RUNNER_TEMP/sbom.json" 2> "$RUNNER_TEMP/syft_stderr.txt"
          test -s "$RUNNER_TEMP/sbom.json"
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope: these jobs run `nim c` over stdlib + in-repo modules and
          # never invoke lean/lake. The action still provisions + pins z3/jq
          # (its scope contract), and the nimble package closure stays in the
          # payload because config/integrity.nims' manifest bootstrap compiles
          # feature_manifest_generator (import checksums/sha2) on every compile.
          # ~/.elan is the only dropped path — it dominates the 1.16GB full
          # payload. Exact-key restore + fingerprint verify + fail-closed
          # install are unchanged; only the payload's scope is narrower.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-build-source: ${{ github.sha }}
      - name: "[adjudicate] publication_sbom_eval"
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:off --path:. --path:src \
            --nimcache:build/nimcache/vsi_sbom_eval \
            -o:build/vsi_sbom_eval tools/ci/publication_sbom_eval.nim
          ./build/vsi_sbom_eval \
            --report "$RUNNER_TEMP/sbom.json" \
            --policy compliance/policy/security-policy.yml \
            --out "$RUNNER_TEMP/report_sbom.json"
      - name: "[evidence] upload SBOM artifact (Capsule input)"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-sbom-spdx-json
          path: |
            ${{ runner.temp }}/sbom.json
            ${{ runner.temp }}/report_sbom.json
          retention-days: 30
          if-no-files-found: error

  # ── the single bound verdict ──────────────────────────────────────────
  publication-integrity:
    needs: [secret-scan, license-scan, dependency-scan, provenance, sbom]
    # Always runs: a skipped/cancelled sub-job is a MISSING verdict, and the
    # skipped-is-success platform trap must surface as UNKNOWN here, not as
    # a green check-run (fail-closed).
    if: ${{ !cancelled() }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          persist-credentials: false
      - name: "[evidence] download the five dimension reports"
        # A sub-job that failed before uploading its report leaves a MISSING
        # artifact — continue-on-error turns that into an UNKNOWN verdict in
        # the aggregator (never a pass). NOT a bypass: the aggregator reads
        # every verdict from the reports, not from this step's status.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publication-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/dims
      - name: "[evidence] download the SBOM bundle (report_sbom.json rides in publication-sbom-spdx-json)"
        # QUIRK (docs/spec/publication_integrity_gate.md): the SBOM dimension
        # uploads its report inside the Capsule-input artifact
        # publication-sbom-spdx-json (sbom.json + report_sbom.json), which the
        # publication-report-* glob does NOT match — without this explicit
        # download the aggregator reads report_sbom.json as MISSING and the
        # single verdict degrades to UNKNOWN (fail-closed), measured run
        # 42602859044 job 129124683461 (2026-11-09). Continue-on-error keeps
        # the same MISSING→UNKNOWN semantics for a failed-before-upload job.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-sbom-spdx-json
          path: ${{ runner.temp }}/dims
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          # nim scope: these jobs run `nim c` over stdlib + in-repo modules and
          # never invoke lean/lake. The action still provisions + pins z3/jq
          # (its scope contract), and the nimble package closure stays in the
          # payload because config/integrity.nims' manifest bootstrap compiles
          # feature_manifest_generator (import checksums/sha2) on every compile.
          # ~/.elan is the only dropped path — it dominates the 1.16GB full
          # payload. Exact-key restore + fingerprint verify + fail-closed
          # install are unchanged; only the payload's scope is narrower.
          provision-scope: nim
          skip-nimble-install: 'false'
          cache-build-source: ${{ github.sha }}
      - name: "[verdict] publication_report — the single bound conclusion"
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:off --path:. --path:src \
            --nimcache:build/nimcache/vsi_report \
            -o:build/vsi_report tools/ci/publication_report.nim
          D="$RUNNER_TEMP/dims"
          ./build/vsi_report \
            --out "$RUNNER_TEMP/publication-integrity-report.json" \
            --head-sha "${{ github.sha }}" \
            --tree-sha "$(git rev-parse '${{ github.sha }}^{tree}')" \
            --job secret-scan=${{ needs.secret-scan.result }} \
            --job license-scan=${{ needs.license-scan.result }} \
            --job dependency-scan=${{ needs.dependency-scan.result }} \
            --job provenance=${{ needs.provenance.result }} \
            --job sbom=${{ needs.sbom.result }} \
            --report secret-scan="$D/report_secret.json" \
            --report license-scan="$D/report_license.json" \
            --report dependency-scan="$D/report_dependency.json" \
            --report provenance="$D/report_provenance.json" \
            --report sbom="$D/report_sbom.json" \
            --policy-file compliance/policy/license-policy.yml \
            --policy-file compliance/policy/security-policy.yml \
            --policy-file compliance/policy/provenance-policy.yml \
            --policy-file compliance/policy/secret-scan-baseline.json \
            --policy-file compliance/provenance/source-origin.yml \
            --policy-file compliance/provenance/license-attribution.yml
      - name: "[summary] surface the verdict"
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/publication-integrity-report.json" ]; then
            {
              echo "## publication-integrity"
              echo '```json'
              cat "$RUNNER_TEMP/publication-integrity-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## publication-integrity — NO REPORT PRODUCED (UNKNOWN)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "[evidence] upload the gate report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-integrity-report
          path: ${{ runner.temp }}/publication-integrity-report.json
          retention-days: 30
          if-no-files-found: warn
