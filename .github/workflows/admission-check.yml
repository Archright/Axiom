# =============================================================================
# pin-generation-marker: dependabot-probe-2026-10-07
# admission-check — B-pinned check producer (GATE A)  [Phase B draft]
#
# GATE A: verifier program is built from BASE; PR tree is data only.
#
# The remaining CI hole this workflow closes: pinning a workflow FILE to BASE
# is not enough if that workflow builds/runs the PR's `ax`/verifier — then the
# PR supplies the verdict program. Pattern provenance (approved migration
# plan — study before editing, do not reinvent):
#   (1) certificate-mint.yml (deleted in the CI=0 cutover, ce92fc2d1):
#       "Checkout B only" + "[mint] Build bin/ax from B" — the verifier is
#       compiled from PR.base.sha, never from M/H.
#   (2) admission_producer.yml (deleted, ce92fc2d1) witness job:
#       primary checkout = B (workspace root), secondary checkout of PR head
#       into `_candidate/` — the H tree is a DATA SOURCE ONLY path.
#   The archived producer's OTHER jobs (verify-static / verify-integration-* /
#   r1-gateway-shards) ran `make ci-bootstrap` / `nimble build` from the PR
#   tree, producing PR-tree bin/ax that reported conclusion=success. That is
#   the hole. This workflow generalizes (1)+(2) so Gate A holds everywhere.
#
# Structural Gate A rules (fail-closed):
#   * Job build-base-artifacts compiles bin/ax + harness + ircheck from
#     `ref = pr.base.sha` (B) ONLY. Job 2 never rebuilds from the PR tree.
#   * Job admission-check executes ONLY the base-built binaries / the base
#     tree. The PR head lives at `_candidate/` and is consumed as DATA.
#   * Post-cutover the workflow FILE executes from the org ruleset's SHA pin
#     (admission-gate calls this file @<EXACT SHA> — a PR cannot influence
#     the definition). Gate A still pins every verifier construction to
#     `pr.base.sha` INSIDE this file; defense-in-depth: `.github/` is
#     CODEOWNERS-protected at @Archright/architect (a PR tampering with this
#     file is TrustSurface-modified → merge_cli.nim Pass 2.8 manual-merge
#     path).
#
# SLICE ENGINE EXECUTION SCOPE GATE (CI Quantization prefix construction,
# S0-d): every semantic stage below fires ONLY when the current epoch
# manifest (config/policy/epoch_manifest.json @B — a git object, never a
# workspace file, never the PR tree) lists the stage's slice in
# `implementedSlices`. A slice absent from the manifest = its steps DO NOT
# fire (no executed record — no claim can rest on them; the I-5
# claimed==proven comparison stays fail-closed). The manifest is the SOLE
# authority: no slice id is hardcoded in any `if:` — each `if:` consumes a
# `steps.slice-engine.outputs.scope_<slice>` boolean derived from
# implementedSlices. Unreadable/malformed manifest = fail-closed (job
# failure). Interim stage↔slice mapping (reconcile against
# src/gate/slice_catalog.nim verificationSteps once it lands; Q0 Semantic
# Slice Catalog 2026-09-28):
#   SL-08 B/H binding       → job1 build-base-artifacts + job2 manifest verify
#   SL-01 identity          → job2 admission identity re-derivation
#   SL-02 closure           → job2 derived-closure load
#   SL-03 evidence validity → job2 D9 staging + subject register + witness
#   SL-05 verdict           → job2 admission predicate evaluation (dry-run)
# Non-slice steps (checkouts, toolchain, download/upload)
# stay ungated — provisioning/observation, not verification slices.
# NOTE: when implementedSlices ⊉ all five, the artifact contract
# (admission-check-<candidate head>-<run_attempt>, uploaded always() —
# ADR-0027 P2: candidate head = pull_request.head.sha | merge_group.head_sha
# | github.sha; the run_attempt suffix mirrors the certificate artifact's
# `subject-certificate-<run_attempt>` — attempts of one run share run_id, so an
# unsuffixed name collides across re-runs and the exactly-one check sees N>1)
# holds only the files the fired slices produced — the org gate verdict job
# fail-closes on the absent ones, which is the intended migration-mode
# fail-closed path.
#
# CHECK NAMES vs RequiredChecks (merge_cli.nim:60–67):
#   This DRAFT emits ONE observation check, `admission-check`. It maps to NONE
#   of the five required names (verify-static / check-readiness-start /
#   verify-integration-r1 / verify-integration-r2-unit /
#   verify-integration-r2-proof) — see the Phase B report mapping section.
#   The predicate (MergeAdmissible) stays fail-closed: requiredValidations is
#   VACATED (config/policy/merge_admission.json v1.5.0) and RequiredWorkflowIds
#   still pins the deleted admission_producer.yml id 359582573, so this
#   workflow's runs cannot admit anything until it is re-registered post-push.
#   DO NOT re-register the required names until each full validation suite is
#   itself B-pinned (subject-path tooling — see TODO list in the report).
#
# Queue-event support (ADR-0027): merge-queue candidates are admitted by the
# org gate on the `merge_group` event (delegation of the legacy queue-event
# trigger — no native queue-event trigger here; the sole execution path stays
# the org ruleset's workflow_call@SHA, ADR-0023 updateRefs landing actuator
# unchanged). On merge_group the org gate supplies prNumber=0 (P1 — no PR
# object; verification_subject.nim: "0 = no PR context"):
#   P1  never parse a PR number from head_ref; prNumber := 0 on merge_group
#   P2  artifact identity = admission-check-<candidate head>-<run_attempt>
#       (candidate head = pull_request.head.sha | merge_group.head_sha |
#       github.sha) — the mint mirrors the same expression via its headSha
#       and runAttempt inputs, so upload and lookup stay equal on BOTH events
#       AND on every re-run attempt of the same run_id
#   P3  the SL-05 dry-run predicate (`ax merge <N> --dry-run`) is scoped-skipped
#       on merge_group (queue-path admission = required check verdict; trust
#       surface covered by member PR-event checks + runner-pool Δ)
#
# Token posture: read-only. `permissions: contents: read` (minimal) +
# pull-requests: read (PR API as the single trusted identity source for the
# B/H re-derivation — data comparison, archived pattern). `actions: read`
# (was findRunsForHead → GET /actions/runs; HTTP 403 evidence run
# 35960687933) and `checks: write` (was the landing-trigger POST) were
# removed together with their consumers in the P12 delegation deletion — no
# /actions or check-runs API call remains in this workflow. Platform setting
# `can_approve_pull_request_reviews` must be `false` (report-only — see
# report section 5; this workflow does not set it).
# =============================================================================
name: admission-check

on:
  # Cutover: 레거시 native pull_request 트리거 제거 — 유일 실행 경로는 조직
  # 필수 워크플로(admission-gate)의 workflow_call@SHA. caller는 pull_request
  # 이벤트를 받으며 callee github context가 caller를 상속하므로
  # event_name/pull_request 페이로드가 그대로 전파되어 아래 모든 B/H/PR 유도가
  # 동일하게 해석된다. 오케스트레이션은 여기에 없다 — gateway 호출·DAG·verdict는
  # 게이트(org ruleset SHA pin) 소관.
  #
  # ADR-0025 Amendment A2 동반 (2026-09-27): 회전 allowlist 개정(PR-α)과
  # 원자 페어 — tws의 trustedAdmissionWorkflowSha는 이 파일 blob sha와
  # 동일 diff에서 갱신된다 (landing-integrity ATOMICITY). 본 파일의 blob
  # 변경은 A2 회전 동반 허용 집합에 속한다 (A2 최소 정합 집합).
  #
  # ORCHESTRATOR CONTRACT — final qualification artifact: the admission-check
  # job uploads `admission-check-<candidate head>-<run_attempt>` (candidate head
  # = pull_request.head.sha | merge_group.head_sha | github.sha — ADR-0027 P2;
  # run_attempt = github.run_attempt, which for a called workflow is the CALLER
  # run's attempt — the org gate passes the identical value as runAttempt;
  # witness.json + witness.sha256 + admission-verdict.log +
  # admission-gate-history.txt, retention 30d). The mint consumes exactly that
  # artifact name via run-scoped API (its want_name mirrors the same candidate
  # head expression through the headSha input and the same attempt through the
  # runAttempt input — the certificate artifact's
  # `subject-certificate-<run_attempt>` convention). The suffix is what keeps
  # re-runs of one run_id from stacking artifacts under one name and tripping
  # the exactly-one check.
  #
  # STAGE DISPATCH (TRUST ORDER — the caller runs this file TWICE). The
  # certificate the admission predicate demands (certRequired, merge_cli.nim
  # CertRequired) is produced by a DIFFERENT callee (certificate-mint). A single
  # invocation that both produces the witness and evaluates the predicate forces
  # the verdict to run BEFORE the mint has published, so every run evaluated a
  # certificate that cannot exist yet — NO_CERT on the first attempt, and a
  # second full run to converge. Stage selection moves the ordering into the
  # caller's `needs:` graph, where the DAG is declared:
  #   stage: attest  → B build · B/H identity re-derivation · D9 staging ·
  #                    subject register · witness (`cert attest --witness-only`)
  #                    · the `admission-check-<head>-<attempt>` upload
  #   stage: verdict → derived-closure + `subject-certificate-<attempt>` soft
  #                    download (ADR-0022 §D5-3 `--cert` handoff) ·
  #                    `ax merge --dry-run --json` — this stage's exit IS the
  #                    verdict the required check consumes
  # Caller order (Trust order, not control order): attest → mint-publish →
  # verdict. Job ordering is the caller's `needs:`, never anything inside this
  # file; a caller that wires them in the old order reproduces the NO_CERT
  # first attempt (fail-closed, not a silent green).
  #
  # `stage` is REQUIRED. An absent or unrecognised value skips the job, and the
  # caller's verdict (every needed job must be `success`) turns that skip into a
  # red required check — fail-closed, never a vacuously green check.
  workflow_call:
    inputs:
      stage:
        description: "Pipeline stage to execute — 'attest' (witness production) or 'verdict' (certificate-consuming admission predicate)."
        required: true
        type: string
      baseSha:
        description: "Optional run-scoped admission anchor B* — the live main ref tip the caller resolved ONCE before dispatch (Stage 2). Consumed FIRST on the pull_request venue; the event payload remains the fallback so callers that do not pass it behave exactly as before. Empty (the default) on merge_group, whose anchor stays event-frozen (ADR-0027 P4). Candidate preparation only — never a landing-judgment input."
        required: false
        default: ''
        type: string

# B3 (2026-09-27, 4/4 결정론): 이 파일의 레거시 top-level concurrency 블록은
# 게이트(workflow_call) 컨텍스트에서 결정적 job-kill을 유발한다. 공식 문서
# (Reusing workflow configurations — github.com actions reference)에 따르면
# called workflow의 ${{ github.workflow }} = CALLER 이름으로 평가된다 —
# admission-gate 안에서 본 그룹과 runner-pool-acceptance.yml의 그룹이 모두
# `admission-gate-<PR>`로 수렴하고, 양쪽 cancel-in-progress: true이므로 두
# callee가 동시 발화할 때 먼저 생성된 callee invocation의 job들이 생성
# 시점에 0-step 취소된다 (runner 미할당; 실측: epoch N+6 acceptance 1차 런
# 36487512164 gateway/select·proof-reconcile cancelled — "higher priority
# waiting request", 및 동일 구성에서 select PASS 46s — 비결정적 레이스).
# 같은 PR 재실행 취소(archived producer pattern)는 cutover #287 이후 네이티브
# pull_request 트리거가 제거되어 죽은 경로 — 유일 실행 경로는 org 게이트의
# workflow_call이며, 그 컨텍스트에서 이 블록은 아무 권한도 만들지 않고
# B3 킬러만 만든다. 따라서 제거한다 (runner-pool-acceptance.yml은 push@main
# 네이티브 실행의 동일-SHA 재실행 취소를 위해 유지 — 그룹 키에 event_name
# 스코프 추가로 게이트 컨텍스트 충돌 원천 차단).

permissions:
  contents: read
  pull-requests: read

env:
  # src/gate/config.nims bootstrap-sandbox marker — the B-tree ci-bootstrap
  # must run in the sanctioned bootstrap sandbox (absence fail-closes gate
  # compiles on a fresh checkout; transplanted from the archived workflows).
  AXIOM_CI_PRESERVE_CACHE: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Job 1 — trusted build: the ONLY build site. Everything the admission
  # check will run is compiled from BASE (pr.base.sha = B). H is never
  # checked out here; bin/ax + harness + ircheck all come from B.
  # ───────────────────────────────────────────────────────────────────────
  build-base-artifacts:
    # Stage dispatch (see the STAGE DISPATCH contract in the header): the B
    # build is the ATTEST stage's. The verdict stage consumes the artifact this
    # job publishes instead of rebuilding it — same run, same name
    # (`admission-check-base-artifacts`, `overwrite: true` keeps it unique
    # across re-runs), and the consumer's `build_sha == B` manifest check is
    # what binds it fail-closed. Building twice per run would pay the
    # ci-bootstrap + ircheck cost a second time for bytes the first build
    # already published.
    if: inputs.stage == 'attest'
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 30
    steps:
      # ────────────────────────────────────────────────────────────────
      # [venue] Execution-venue split (ADR-0032). FIRST step of every job:
      # pull_request = preflight (fast static/structural checks only,
      # 4-min budget), merge_group|workflow_call = landing (the full
      # canonical verification, byte-identical to the pre-split pipeline).
      # Any other event = fail-closed exit 1 — no venue, no run. Heavy
      # steps below carry `steps.venue.outputs.venue == 'landing'` so the
      # MG pipeline is unchanged and the PR venue pays provisioning +
      # preflight only. In THIS job the landing-gated steps are exactly
      # the slice-engine sl08 build/upload set; a preflight PASS is NOT
      # landing evidence (ADR-0032 (f)).
      # ────────────────────────────────────────────────────────────────
      - name: "[venue] Resolve execution venue (PR=preflight / MG+call=landing)"
        id: venue
        run: |
          set -euo pipefail
          fail() { echo "[venue] FAIL — $1 (fail-closed, ADR-0032)" >&2; exit 1; }
          case "${{ github.event_name }}" in
            pull_request)
              echo "venue=preflight" >> "$GITHUB_OUTPUT"
              echo "[venue] venue=preflight — fast static preflight only; landing verification is the merge_group venue (ADR-0032 (a),(b))"
              ;;
            merge_group|workflow_call)
              echo "venue=landing" >> "$GITHUB_OUTPUT"
              echo "[venue] venue=landing — full canonical verification (ADR-0032 (a))"
              ;;
            *)
              fail "unrecognized event_name '${{ github.event_name }}' — venue undeterminable (no venue, no run)"
              ;;
          esac

      # B checkout — ref = PR base sha (NOT the merge ref, NOT the PR head).
      # Mirror of certificate-mint.yml's "Checkout B only". fetch-depth 1:
      # the executed git access (rev-parse HEAD^{tree} / show $SHA:path /
      # ls-tree -r HEAD / rev-parse HEAD / hash-object) is fully covered by
      # the depth-1 object set (tip commit + full tree graph — audit table in
      # the L3-d1 PR). History/parent access here is a depth-1 invariant
      # violation (tools/ci/git_access_scan.sh, fail-closed).
      - name: "[build] Checkout B only (base.sha — verifier source)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stage 2: PR venue consumes the orchestrator's run-scoped anchor
          # inputs.baseSha FIRST; empty (legacy callers / merge_group) falls
          # through to the frozen payload expression — evaluation identical.
          ref: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 1

      # ────────────────────────────────────────────────────────────────
      # SLICE ENGINE (execution scope authority — CI Quantization prefix
      # construction, S0-d). The epoch manifest's implementedSlices is the
      # SOLE authority for which semantic slices of the old CI may fire in
      # this epoch. A slice absent from implementedSlices = its steps do
      # NOT fire (no executed record — no claim can rest on it; I-5
      # claimed==proven stays fail-closed). The manifest is read via `git
      # show $B:<path>` — a git object of the B tree, never a workspace
      # file, never the PR/H tree (Gate A: B is the executor authority).
      # Unreadable/malformed manifest = fail-closed (job failure).
      # INTERIM stage↔slice mapping (reconcile against
      # src/gate/slice_catalog.nim verificationSteps once it lands; source:
      # Q0 Semantic Slice Catalog, 2026-09-28):
      #   job1 build-base-artifacts (build+emit+upload) → SL-08 B/H binding
      #   job2 manifest verify                        → SL-08 B/H binding
      #   job2 identity re-derivation                 → SL-01 identity
      #   job2 derived-closure load                   → SL-02 closure
      #   job2 D9 staging + subject + witness         → SL-03 evidence validity
      #   job2 verdict predicate evaluation           → SL-05 verdict
      # ────────────────────────────────────────────────────────────────
      - name: "[slice-engine] Load epoch manifest implementedSlices (B tree — scope authority)"
        id: slice-engine
        run: |
          set -euo pipefail
          fail() { echo "[slice-engine] FAIL — $1 (fail-closed)" >&2; exit 1; }
          B="${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}"
          printf '%s' "$B" | grep -qE '^[0-9a-f]{40}$' || fail "B='$B' not a 40-hex OID"
          MANIFEST="$(git -C "$GITHUB_WORKSPACE" show "$B:config/policy/epoch_manifest.json")" \
            || fail "config/policy/epoch_manifest.json unreadable at B=$B — engine execution scope undeterminable (manifest must land on main with the promotion PR)"
          parsed="$(printf '%s' "$MANIFEST" | jq -e . 2>/dev/null)" \
            || fail "epoch manifest unparsable at B=$B"
          printf '%s' "$parsed" | jq -e '(.ciEpochId? // "") | (type == "string") and (length > 0) and (test("^[A-Za-z0-9][A-Za-z0-9._+-]*$"))' >/dev/null \
            || fail "ciEpochId missing/malformed at B=$B"
          printf '%s' "$parsed" | jq -e '(.implementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "implementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e '(.notYetImplementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "notYetImplementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e 'all(.implementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "implementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e 'all(.notYetImplementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "notYetImplementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e '(([.implementedSlices[]] - [.notYetImplementedSlices[]]) | length) == (.implementedSlices | length)' >/dev/null \
            || fail "implementedSlices ∩ notYetImplementedSlices ≠ ∅ at B=$B"
          printf '%s' "$parsed" | jq -e '(.productionExecutionPin? // "") | (type == "string") and (length > 0)' >/dev/null \
            || fail "productionExecutionPin missing/empty at B=$B"
          printf '%s' "$parsed" | jq -e '((.mode? // "") as $m | ($m == "ci-migration") or ($m == "normal"))' >/dev/null \
            || fail "mode must be 'ci-migration' or 'normal' at B=$B"
          EPOCH="$(printf '%s' "$parsed" | jq -r '.ciEpochId')"
          IMPL="$(printf '%s' "$parsed" | jq -c '.implementedSlices')"
          echo "epoch_id=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "implemented_slices=$IMPL" >> "$GITHUB_OUTPUT"
          # scope_<slice> outputs — derived from implementedSlices ONLY. No
          # slice id is hardcoded in any `if:` below; each `if:` consumes
          # these booleans. Slice absent from manifest = NO-FIRE.
          # NOTE: id regex allows SL-NN and SL-NNNN — SL-0713 is a SINGLE
          # catalog entry (SL-07 + SL-13 merged, slice_catalog rules) and
          # must never be rejected as malformed (4-digit id).
          RPT="[slice-engine] epoch=$EPOCH implemented=$IMPL"
          for spec in "sl08=SL-08" "sl01=SL-01" "sl02=SL-02" "sl03=SL-03" "sl05=SL-05"; do
            key="${spec%%=*}"
            slice="${spec##*=}"
            if printf '%s' "$parsed" | jq -e --arg s "$slice" '.implementedSlices | index($s) != null' >/dev/null 2>&1; then
              echo "scope_$key=true" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=fire"
            else
              echo "scope_$key=false" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=NO-FIRE"
            fi
          done
          echo "$RPT"

      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          cache-save-enabled: 'false'
          cache-build-source: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}

      # ────────────────────────────────────────────────────────────────
      # [s5] Supply-mode judgment (S5 build-skip — J3 §3.1 supply reuse,
      # ADR-0032 landing venue). The composite toolchain action above ran
      # the B-restore chain: exact-key restore → trusted-input fingerprint
      # verify (re-derived identity + per-entry digests) → semantic
      # provenance probe over ALL FOUR restored ci-compile binaries. Its
      # fail-closed discard paths (b-verify FAIL, probe FAIL) delete the
      # binaries and the nimcache; a B miss never materializes them. So the
      # on-disk state after the action IS the verified-supply verdict:
      # every payload member present (4 binaries + ircheck + fingerprint
      # manifest + the nimcache class, all executable) = the restore was a
      # verified HIT — S5 then SKIPS the compile block (probe/smoke/build
      # below, gated on mode == 'build') and the manifest emit binds the
      # restored verified binaries as the supply (J3 §3.1: reuse of
      # verified supply, never a re-adjudication — judgments still run in
      # job2). ANY absence/exec-loss = cold build (fail-closed fallback,
      # byte-identical to the pre-S5 MISS path). The explicit judgment
      # lines below are mandatory: platform counts skipped steps as
      # success, so a silent skip would be theater (§0.9).
      # ────────────────────────────────────────────────────────────────
      - name: "[s5] Supply-mode judgment (verified-payload HIT = supply reuse / else cold build)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        id: s5-supply
        run: |
          set -euo pipefail
          MISS=0
          for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas \
                   proofs/.lake/build/bin/ircheck build/.axiom-b-fingerprint.json; do
            [ -f "$f" ] || { echo "[s5] verified supply absent: $f"; MISS=1; }
          done
          for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas \
                   proofs/.lake/build/bin/ircheck; do
            [ -x "$f" ] || { echo "[s5] verified supply not executable: $f"; MISS=1; }
          done
          [ -d build/nimcache ] || { echo "[s5] verified supply absent: build/nimcache"; MISS=1; }
          if [ "$MISS" != 0 ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "S5 COLD BUILD — verified supply absent (B-cache miss, or restore discarded by verify/probe FAIL: fail-closed); compiling from B (cache is acceleration, never evidence)"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "SUPPLY REUSE — verified payload restored; compile skipped (ADR-0032/J3 §3.1)"
          fi

      # ────────────────────────────────────────────────────────────────
      # nimcache functional probe (J3 §3.4 — class-scoped, restored
      # build/nimcache payload class). The B-layer fingerprint verify binds
      # digest lists, but a corrupt-but-present class (the Lake.olean
      # incident family: file exists, functionally broken) is not
      # distinguishable by digest presence alone — the restored class must
      # be probed before the build silently leans on it. Class-scoped =
      # the whole restored class is enumerated (no empty file, every JSON
      # record parseable) + one `nim check --nimcache:build/nimcache`
      # consuming the restored tree (bin/ax entry module — the payload
      # class the build consumes). PROBE FAIL → the restored class is
      # discarded (fail-closed, A-layer pattern action.yml:155-159) and the
      # job fails. B miss (no restored payload) → SKIP: no restore, no
      # claim. build_env.nim self-provision: a fresh checkout lacks the
      # hermetic-generated file; the static .default template is the same
      # fallback config.nims intends (observed: the NimScript template
      # write is skipped in check mode, so the probe materializes it).
      # S5: the probe guards the WARM path only — it runs exactly when the
      # build will lean on a restored nimcache (mode == 'build': payload
      # partially present). On the verified-HIT skip path nothing compiles,
      # so nothing consumes the class (the restored binaries themselves
      # were already digest-bound + provenance-probed by the action above).
      - name: "[build] nimcache functional probe (restored build/nimcache class — J3 §3.4)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing' && steps.s5-supply.outputs.mode == 'build'
        run: |
          set -euo pipefail
          if [ ! -d build/nimcache ]; then
            echo "AXIOM_NIMCACHE_PROBE: SKIP — no restored build/nimcache (B miss or payload discarded): nothing restored, nothing probed"
            exit 0
          fi
          BROKEN=0
          while IFS= read -r f; do
            [ -s "$f" ] || { echo "AXIOM_NIMCACHE_PROBE: FAIL — zero-size restored nimcache file: $f" >&2; BROKEN=1; }
            case "$f" in
              *.json)
                jq -e . "$f" >/dev/null 2>&1 || { echo "AXIOM_NIMCACHE_PROBE: FAIL — unparseable restored nimcache JSON record: $f" >&2; BROKEN=1; }
                ;;
            esac
          done < <(find build/nimcache -type f | sort)
          if [ "$BROKEN" != 0 ]; then
            echo "AXIOM_NIMCACHE_PROBE: FAIL — restored nimcache class corrupt; discarding payload (fail-closed)" >&2
            rm -rf build/nimcache
            exit 1
          fi
          N_ENTRIES=$(find build/nimcache -type f | wc -l)
          [ -f src/generated/build_env.nim ] || cp src/generated/build_env.nim.default src/generated/build_env.nim
          if ! nim check --hints:off --nimcache:build/nimcache src/cli/main.nim; then
            echo "AXIOM_NIMCACHE_PROBE: FAIL — nim check could not consume the restored nimcache class; discarding payload (fail-closed)" >&2
            rm -rf build/nimcache
            exit 1
          fi
          echo "AXIOM_NIMCACHE_PROBE: PASS — restored nimcache class functionally sound ($N_ENTRIES entries, nim check consumed the restored tree)"

      # Lake build smoke before broadcasting artifacts (runner-pool-acceptance
      # pattern): a broken Lake module passes `lean --version`/`lake --version`
      # but breaks the sandbox `lake build` inside ax prove (fail-closed).
      # S5: guards the compile path only (mode == 'build') — the skip path
      # runs no lake build here.
      - name: "[build] Lake build smoke (fail-closed)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing' && steps.s5-supply.outputs.mode == 'build'
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          printf 'leanprover/lean4:v4.33.0\n' > "$SMOKE_DIR/lean-toolchain"
          cat > "$SMOKE_DIR/lakefile.lean" <<'EOF'
          import Lake
          open Lake DSL
          package leanSmoke

          @[default_target]
          lean_lib LeanSmoke where
            srcDir := "."
          EOF
          printf 'import Lake\n' > "$SMOKE_DIR/LeanSmoke.lean"
          cd "$SMOKE_DIR"
          lake build

      # B-built bin/ax + harness (mirror of certificate-mint "[mint] Build
      # bin/ax from B"; bin/ax, gate_hook, precompile_gates, install_ax_cas
      # come from `make ci-bootstrap`).
      # S5 (J3 §3.1 supply reuse): this compile block runs ONLY when the
      # verified supply is absent (mode == 'build' — B miss or a discarded
      # restore). On a verified HIT (mode == 'skip') the restored payload —
      # exact-key restored, trusted-input fingerprint-verified, provenance-
      # probed — IS the supply: the compile is skipped and the manifest emit
      # below binds the restored binaries for every downstream consumer
      # (job2 manifest verify, mint MINT_BASEART, publisher base-seed — all
      # re-verify build_sha == B + per-file sha256 themselves). The judgment
      # steps downstream are never skipped: only the compile supply is.
      - name: "[build] Build bin/ax + harness from B"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing' && steps.s5-supply.outputs.mode == 'build'
        run: |
          set -euo pipefail
          make ci-bootstrap
          # plain make = 정본 진입점: main의 Makefile이 `include ci/checker.mk`로
          # Tier C 단일 정의를 흡수한다 (전환기 #274 이전 B에는 ci/checker.mk가
          # 없어 `make -f ci/checker.mk`가 fail했음 — 2026-09-26 실측; plain make는
          # 옛 Makefile 인라인·신 include 양쪽에서 성립).
          # ircheck is the reference extractor for the attest chain's
          # stage-b extraction-agreement; `lake build` (default targets)
          # builds lean_libs only, so build the lean_exe explicitly
          # (canonical invocation per runbook + lakefile comment).
          cd proofs && lake build ircheck && cd ..
          [ -x proofs/.lake/build/bin/ircheck ] \
            || { echo "[build] FAIL-CLOSED: ircheck missing after build (proofs/.lake/build/bin/ircheck)" >&2; exit 1; }
          # install_ax_cas is needed by job 2's scope/baseline provisioning
          # (the CAS-index step ci-bootstrap-cheap runs before `ax scope
          # hash` — archived runner-pool-acceptance order).
          [ -x bin/install_ax_cas ] \
            || { echo "[build] FAIL-CLOSED: install_ax_cas missing after ci-bootstrap" >&2; exit 1; }

      # ────────────────────────────────────────────────────────────────
      # Verdict-predicate payload members (toolchain-handoff 2026-10-12 —
      # docs/evidence/verdict_payload_gate_2026-10-12.md GO scope (a')).
      # The landing verdict runs WITHOUT setup-axiom-toolchain; its entire
      # A-layer consumption (deriver compiler + jq) is supplied HERE, from B,
      # so the artifact replaces the provisioning on the consumer side:
      #   * derive_checker_closure — same hermetic recipe the verdict leg
      #     used to compile in place (determinism contract F1–F3, ADR-0033
      #     §E: B source + --path:src + --skipParentCfg/--skipProjCfg).
      #   * jq — pinned 1.7.1 release asset, sha256-pinned below (runner jq
      #     absence measured 2026-09-08, axiom-ci runner-3).
      # Both steps run in BOTH S5 supply modes: the S5 skip path reuses only
      # the four ci-compile binaries + ircheck, never these members, so they
      # are produced fresh every landing run and the manifest emit below
      # digest-binds them like every other member.
      # ────────────────────────────────────────────────────────────────
      - name: "[build] Compile derived-closure deriver from B (verdict predicate judge input)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        run: |
          set -euo pipefail
          nim c --hints:off --skipParentCfg --skipProjCfg --path:src \
            -o:bin/derive_checker_closure tools/ci/derive_checker_closure.nim
          test -x bin/derive_checker_closure

      - name: "[build] Fetch pinned jq 1.7.1 (verdict predicate consumer)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        run: |
          set -euo pipefail
          mkdir -p bin
          # --retry-all-errors: --retry alone never retries transient transport
          # failures (exit 35/52/56 — SSL connect / empty reply / recv reset;
          # curl's transient list is timeout/408/429/5xx only) — the same
          # release-asset layer that 504'd on 2026-11-08 and stranded the merge
          # queue: docs/evidence/vst_dependency_authority_handoff_2026-11-08.md
          # §13.1. Requires curl >= 7.71.0.
          curl -fsSL --retry 3 --retry-all-errors -o bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux64
          # Fail-closed upstream-drift tripwire — the verdict leg re-binds
          # these bytes through the artifact manifest digest.
          echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  bin/jq" | sha256sum -c -
          chmod +x bin/jq

      # Emit fail-closed artifact manifest — runs in BOTH supply modes. On
      # the S5 skip path it binds the RESTORED verified binaries (the
      # supply, per J3 §3.1); on the cold path it binds the fresh build
      # products. Either way the artifact carries per-file sha256 + build_sha
      # for the fail-closed re-verification by job2, the mint, and the
      # publisher base-seed — and `test -x` here blocks any absent/quiet
      # supply from riding the artifact.
      - name: "[build] Emit fail-closed artifact manifest (bind to B)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        run: |
          set -euo pipefail
          : > manifest.txt
          {
            echo "# Axiom admission-check base-built artifact manifest"
            echo "build_sha = ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}"
            echo "recipe_id = ci-bootstrap@$(sha256sum Makefile | cut -d' ' -f1)"
          } >> manifest.txt
          for f in bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck \
                   bin/gate_hook bin/precompile_gates \
                   bin/derive_checker_closure bin/jq; do
            test -x "$f" || { echo "FAIL: $f missing or not executable"; exit 1; }
            sha256sum "$f" >> manifest.txt
          done
          cat manifest.txt

      - name: "[build] Upload base-built artifacts"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-base-artifacts
        with:
          name: admission-check-base-artifacts
          retention-days: 3
          path: |
            bin/ax
            bin/install_ax_cas
            proofs/.lake/build/bin/ircheck
            bin/gate_hook
            bin/precompile_gates
            bin/derive_checker_closure
            bin/jq
            manifest.txt
          # build/nimcache is NOT in this payload: this artifact is consumed
          # by the gate-attest chain (job2 staging download + certificate-mint
          # MINT_BASEART fail-closed full-zip download) and must stay
          # evidence-lean. The base-tree nimcache — the component that makes
          # the next cycle's base build warm — travels in the DEDICATED
          # acceleration carrier below (admission-check-base-nimcache), whose
          # sole consumer is the B-layer sole writer (ci-cache-publisher
          # base-seed). Manifest covers exactly the 7 members: the 5 attest
          # binaries (the two gate binaries make the artifact self-sufficient
          # for the attest 6-binary set — core_purity_gate is built by job2
          # itself from B) + the 2 verdict-predicate payload members
          # (toolchain-handoff 2026-10-12: deriver + pinned jq — they replace
          # the landing verdict leg's setup-axiom-toolchain provisioning; the
          # DEBT#502 5-member contract is the B-layer CACHE payload, this
          # artifact-channel extension is a separate surface).
          if-no-files-found: error
          # overwrite (NOT an attempt suffix): this artifact is a cache
          # acceleration payload (J3 — cache is acceleration, never
          # evidence), so it carries no attempt-binding contract. Its
          # consumers resolve it by stable name — certificate-mint.yml
          # MINT_BASEART exactly-one and ci-cache-publisher.yml's
          # run-scoped name lookup — and must see exactly one across
          # re-runs. upload-artifact@v4 artifacts are immutable;
          # overwrite deletes the previous same-name artifact inside the
          # run (attempts share run_id), so a "re-run all jobs" can no
          # longer fail that exactly-one check. The witness artifact is
          # the opposite case and stays attempt-scoped (ADR-0027 P2).
          overwrite: true

      - name: "[build] Record base-built artifact history (AXIOM_ARTIFACT_RECORD)"
        # Post-expiry history record — GitHub hides expired artifacts from the
        # API, so retention history must survive in run logs + step summary.
        # Gated on the upload's own artifact-id output (fires iff an artifact
        # exists to record — skipped upload ⇒ no record). The REST enrichment
        # is best-effort: failure degrades loudly and NEVER fails the job.
        if: steps.upload-base-artifacts.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload-base-artifacts.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-base-artifacts.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_retention_days="${{ github.retention_days }}"
          if [ -z "$expected_retention_days" ]; then expected_retention_days=unknown; fi
          record="AXIOM_ARTIFACT_RECORD v1 name=admission-check-base-artifacts run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }} artifact_id=${ARTIFACT_ID} digest=${ARTIFACT_DIGEST} requested_retention_days=3 expected_retention_days=${expected_retention_days} metadata_status=partial"
          echo "$record" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/${ARTIFACT_ID}" --jq '"observed_expires_at=\(.expires_at) size_in_bytes=\(.size_in_bytes) created_at=\(.created_at)"' \
            || echo "size_in_bytes=unknown observed_expires_at=unknown metadata_status=degraded" # {.bestEffort("""REST artifact metadata is best-effort by contract: a REST failure degrades loudly (this logged line) and NEVER fails the job — the retention record above is context-derived and already emitted.""").}

      # Base-tree nimcache acceleration carrier (J3 — cache is acceleration,
      # never evidence): `make ci-bootstrap` above leaves the post-build
      # build/nimcache in this workspace, and this is the ONLY channel by
      # which it reaches the B-layer sole writer (ci-cache-publisher
      # base-seed re-publishes it under the base b-key). Without it the
      # base-seed entry silently degrades to a partial save (actions/cache
      # omits non-existent declared paths) and every base-key restore runs
      # the Nim compile cold. Deliberately NOT part of
      # admission-check-base-artifacts — that payload feeds the attest chain
      # (job2 staging + certificate-mint fail-closed download) and must not
      # pay ~80MB for a component it never reads. Single search path ⇒
      # artifact root is build/nimcache itself (upload-artifact LCA rule);
      # the publisher extracts with path: build/nimcache to restore the
      # canonical layout. Absence (probe-discarded cache, older in-flight
      # runs) is a J3 degrade, not a failure — hence warn, not error.
      - name: "[build] Upload base-tree nimcache (B-cache carrier — J3 acceleration)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-base-nimcache
        with:
          name: admission-check-base-nimcache
          retention-days: 3
          path: build/nimcache
          if-no-files-found: warn
          overwrite: true

      - name: "[build] Record base-nimcache artifact history (AXIOM_ARTIFACT_RECORD)"
        # Post-expiry history record — see the base-built artifact record above.
        if: steps.upload-base-nimcache.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload-base-nimcache.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-base-nimcache.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_retention_days="${{ github.retention_days }}"
          if [ -z "$expected_retention_days" ]; then expected_retention_days=unknown; fi
          record="AXIOM_ARTIFACT_RECORD v1 name=admission-check-base-nimcache run_id=${{ github.run_id }} run_attempt=${{ github.run_attempt }} artifact_id=${ARTIFACT_ID} digest=${ARTIFACT_DIGEST} requested_retention_days=3 expected_retention_days=${expected_retention_days} metadata_status=partial"
          echo "$record" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/${ARTIFACT_ID}" --jq '"observed_expires_at=\(.expires_at) size_in_bytes=\(.size_in_bytes) created_at=\(.created_at)"' \
            || echo "size_in_bytes=unknown observed_expires_at=unknown metadata_status=degraded" # {.bestEffort("""REST artifact metadata is best-effort by contract: a REST failure degrades loudly (this logged line) and NEVER fails the job — the retention record above is context-derived and already emitted.""").}

  # ───────────────────────────────────────────────────────────────────────
  # Job 2 — admission check (GATE A): base-built verifier, PR tree as DATA
  # ONLY. The H tree is consumed via `_candidate/` by the B-built bin/ax
  # and the B-built ircheck kernel; nothing is ever executed from H.
  # One job, two stages: the caller selects which half runs via
  # `inputs.stage` (header STAGE DISPATCH). The provisioning preamble —
  # B checkout, slice engine, toolchain, base-artifact download + manifest
  # verification — is shared by both stages and stays ungated; only the
  # stage-owning steps carry the stage conjunct.
  # L3 SPLIT (2026-11-04 — pre-registration
  # docs/evidence/l3_go_prereg_2026-11-03.md §7-3): the attest stage's
  # four GO-independent steps (core purity, admission identity, D9
  # staging, subject register) now run in the parallel
  # `admission-independents` job below. This job keeps every GO-lane
  # consumer (lane-handoff downloads, execution-accounting cross-check,
  # witness) and the whole verdict stage. Verification semantics are
  # byte-preserved: the moved steps' bodies are byte-identical in their
  # new job; the identity/register values this job's witness chain
  # consumed from them arrive as job outputs (the env block below); their
  # evidence files arrive as the run-scoped admission-independents
  # artifact (download below); and the [guard] step after [venue] turns
  # every non-success direct need red (fail-closed — prereg §2.4).
  # ───────────────────────────────────────────────────────────────────────
  admission-check:
    # go-critical-lane is the CONSUMPTION EDGE: the armed attest stage below
    # reads the per-lane judgment artifacts, so this job must start only
    # after the lanes have published them (needs-edge ordering, never
    # polling — the mint-prepare needs-rationale pattern).
    # admission-independents is the PRODUCER EDGE for the identity/D9/
    # register values and evidence files the witness chain below consumes
    # (L3 prereg §2.1–§2.3 — the same needs-edge discipline).
    # `!cancelled()` in the `if` keeps this job running when a need
    # legitimately skips (the lanes on the PR preflight; build-base and
    # the independents on the verdict stage) so the [guard] step can
    # judge the needs results explicitly — GitHub's default propagation
    # would skip this job on a failed need, and a skipped job reports
    # Success without blocking merges (prereg §2.4: that is the masked
    # green the guard exists to close).
    needs: [build-base-artifacts, go-critical-lane, admission-independents]
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    # 45 (was 30): the DEBT#432 GO-critical admission tests — now the
    # `go-critical-lane` 2-lane job matrix below (G2 generation,
    # 2026-10-16) — add four test compilations + two real-Lean-kernel E2E
    # chains to the attest stage (locally warm: d2_golden alone ≈ 5 min;
    # CI-cold compiles are several× slower). A budget kill would flip every
    # PR's required check red, so the ceiling moves with the workload.
    # Budget only — no step, gate, or scope surface changes with it.
    timeout-minutes: 45
    # L3 value channel (prereg §2.2): exactly the identity/register values
    # this job consumes (the witness chain below), promoted from the
    # admission-independents job outputs under the SAME names the moved
    # steps wrote to GITHUB_ENV — every `:-` fallback and `:?` guard in
    # the witness reads them unchanged. Empty when the producing step
    # legitimately skipped (scope NO-FIRE); the witness's own guards keep
    # that state red, exactly as pre-split.
    env:
      B: ${{ needs.admission-independents.outputs.b }}
      H: ${{ needs.admission-independents.outputs.h }}
      HEAD_TREE_OID: ${{ needs.admission-independents.outputs.head_tree_oid }}
      MERGE_TREE_OID: ${{ needs.admission-independents.outputs.merge_tree_oid }}
      SUBJECT_HEAD: ${{ needs.admission-independents.outputs.subject_head }}
      SUBJECT_HEAD_TREE_OID: ${{ needs.admission-independents.outputs.subject_head_tree_oid }}
      SUBJECT_ID: ${{ needs.admission-independents.outputs.subject_id }}
    # Cutover 이후: 게이트 호출런만 존재(callee가 caller의 pull_request 컨텍스트
    # 상속 — 동일 유도 경로). ADR-0027: merge_group 호출 상속 — 이벤트 페이로드의
    # pull_request는 비고, merge_group.head_sha/base_sha/base_ref이 identity를
    # 공급한다 (P1/P2). 세 절 모두 거짓이면 skipped → 게이트 verdict가
    # skipped를 FAILURE로 전환 (fail-closed: no run, no verdict).
    # `!cancelled()` (L3 prereg §2.4 — replaces the former `always()`):
    # preserves exactly the survive-on-need-skip/failure behavior the
    # verdict leg depends on (build-base is attest-only, so every VERDICT
    # invocation leaves the need unsatisfied-by-skip; the binding there
    # remains the artifact itself — the download below fails on an absent
    # `admission-check-base-artifacts` and the manifest check fails on a
    # `build_sha != B` payload, so a verdict stage that cannot see the
    # attest stage's B-built verifier is red, not skipped-and-green). The
    # one behavioral delta is deliberate: the job no longer runs while the
    # workflow run itself is being CANCELLED — cancelled ∉ the mergeable
    # success set, so a cancelled batch is unmergeable either way, and a
    # check recorded mid-cancellation would only mask that (prereg §2.4).
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_call' || github.event_name == 'merge_group') &&
      (inputs.stage == 'attest' || inputs.stage == 'verdict')
    steps:
      # ────────────────────────────────────────────────────────────────
      # [venue] Execution-venue split (ADR-0032) — FIRST step of the shared
      # admission-check job. pull_request = preflight (the two PREFLIGHT
      # steps below + the light identity re-derivation; no build, no
      # kernel E2E, no D9/witness, no `ax merge`), merge_group|
      # workflow_call = landing (every heavy step keeps its exact
      # pre-split guard semantics behind the landing conjunct). Any other
      # event = fail-closed exit 1.
      # ────────────────────────────────────────────────────────────────
      - name: "[venue] Resolve execution venue (PR=preflight / MG+call=landing)"
        id: venue
        run: |
          set -euo pipefail
          fail() { echo "[venue] FAIL — $1 (fail-closed, ADR-0032)" >&2; exit 1; }
          case "${{ github.event_name }}" in
            pull_request)
              echo "venue=preflight" >> "$GITHUB_OUTPUT"
              echo "[venue] venue=preflight — fast static preflight only; landing verification is the merge_group venue (ADR-0032 (a),(b))"
              ;;
            merge_group|workflow_call)
              echo "venue=landing" >> "$GITHUB_OUTPUT"
              echo "[venue] venue=landing — full canonical verification (ADR-0032 (a))"
              ;;
            *)
              fail "unrecognized event_name '${{ github.event_name }}' — venue undeterminable (no venue, no run)"
              ;;
          esac
      # ────────────────────────────────────────────────────────────────
      # [guard] L3 needs-result gate (prereg §2.4). Platform semantics:
      # a skipped job reports Success and does not block merges, and the
      # default needs propagation would skip this whole job on a failed
      # need — a masked green. This job survives via `!cancelled()` (job
      # `if` above) so the guard can make the dependency state an
      # EXECUTED, explicit judgment: every direct need must be 'success';
      # failure, cancelled, or skipped each red this job → the required
      # check fails → the merge queue blocks. Additive, not a replacement
      # (prereg §2.4 item 5): the existing fail-closed devices (artifact
      # downloads, decision-file validation, the GO cross-check env
      # forcing) are untouched below. Fires on the attest stage's landing
      # venue only — on the PR preflight the lanes legitimately skip
      # (event gate), and the verdict stage consumes none of the lanes
      # (its binding is the base artifact manifest, unchanged).
      # ────────────────────────────────────────────────────────────────
      - name: "[guard] Every direct need must be success (L3 needs-result gate)"
        if: inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing'
        env:
          NEED_BUILD_BASE: ${{ needs.build-base-artifacts.result }}
          NEED_GO_LANES: ${{ needs.go-critical-lane.result }}
          NEED_INDEPENDENTS: ${{ needs.admission-independents.result }}
        run: |
          set -euo pipefail
          fail() { echo "[guard] FAIL — $1 (fail-closed, ADR-0032 (f))" >&2; exit 1; }
          echo "[guard] needs: build-base-artifacts=$NEED_BUILD_BASE go-critical-lane=$NEED_GO_LANES admission-independents=$NEED_INDEPENDENTS"
          case "$NEED_BUILD_BASE" in
            success) ;;
            *) fail "needs.build-base-artifacts.result='$NEED_BUILD_BASE' != success" ;;
          esac
          case "$NEED_GO_LANES" in
            success) ;;
            *) fail "needs.go-critical-lane.result='$NEED_GO_LANES' != success (a skipped, cancelled, or failed lane is never green)" ;;
          esac
          case "$NEED_INDEPENDENTS" in
            success) ;;
            *) fail "needs.admission-independents.result='$NEED_INDEPENDENTS' != success" ;;
          esac
          echo "[guard] PASS — every direct need success (build-base-artifacts, go-critical-lane, admission-independents)"


      # B checkout at the workspace root = the EXECUTOR tree (policy, vault,
      # data paths, journal — all resolved from B, mirror of the archived
      # witness job's "primary checkout = B (workspace root)").
      - name: "[check] Checkout executor tree = B (base.sha, workspace root)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stage 2: PR venue consumes inputs.baseSha first (empty on
          # merge_group → the frozen payload expression evaluates unchanged).
          ref: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1

      # ────────────────────────────────────────────────────────────────
      # Verdict-leg landing provisioning (toolchain-handoff 2026-10-12 —
      # docs/evidence/verdict_payload_gate_2026-10-12.md GO scope (a')).
      # setup-axiom-toolchain above is SKIPPED on verdict+landing, so the two
      # SYSTEM dependencies a landing verdict consumes BEFORE the base
      # artifact exists are provisioned here, minimally:
      #   1. jq — the slice-engine step below parses the epoch manifest with
      #      it, before any artifact download. Pinned 1.7.1 release asset
      #      (runner jq absence measured 2026-09-08, axiom-ci runner-3),
      #      sha256-verified fail-closed. The artifact carries the same
      #      pinned bytes; the manifest verify below overwrites this copy
      #      and digest-binds it.
      #   2. libpcre3 — bin/ax (Nim `re` module) dlopens libpcre.so.3 at
      #      runtime; a system dependency on BOTH stages (S_net-invariant —
      #      action.yml "Install system deps" parity, fail-closed either way).
      # Preflight + attest keep the composite action's full provisioning —
      # these two steps fire exactly where that action is skipped.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Provision pinned jq (slice-engine consumer — landing verdict)"
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'landing'
        run: |
          set -euo pipefail
          mkdir -p bin
          # --retry-all-errors: --retry alone never retries transient transport
          # failures (exit 35/52/56 — SSL connect / empty reply / recv reset;
          # curl's transient list is timeout/408/429/5xx only) — the same
          # release-asset layer that 504'd on 2026-11-08 and stranded the merge
          # queue: docs/evidence/vst_dependency_authority_handoff_2026-11-08.md
          # §13.1. Requires curl >= 7.71.0.
          curl -fsSL --retry 3 --retry-all-errors -o bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux64
          # Fail-closed upstream-drift tripwire: the bytes the artifact rides
          # are exactly these pinned bytes (the verify step below re-binds
          # them through the artifact manifest digest).
          echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  bin/jq" | sha256sum -c -
          chmod +x bin/jq
          # bin/ joins PATH ahead of the system dirs: the pinned jq is what
          # every later step resolves (GITHUB_PATH entries prepend).
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: "[check] Install libpcre3 (bin/ax dlopen dependency — landing verdict)"
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'landing'
        run: |
          set -euo pipefail
          if ldconfig -p 2>/dev/null | grep -q 'libpcre\.so'; then
            echo "libpcre present — skip install"
          else
            # apt fast-path first (action.yml parity); update+install only
            # when the direct install fails — the || chain keeps the step
            # fail-closed before the ldconfig assertion below.
            sudo apt-get install -y -qq libpcre3 \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq libpcre3; }
          fi
          ldconfig -p | grep 'libpcre\.so\.3'

      # ────────────────────────────────────────────────────────────────
      # SLICE ENGINE (job2) — same authority + mapping as job1's
      # slice-engine step. Manifest @B decides which semantic stages of
      # the admission check fire in this epoch (implementedSlices sole
      # authority; per-slice `if:` conditions consume the scope_<slice>
      # outputs below; slice absent = steps DO NOT fire = no executed
      # record — fail-closed for any claim on that slice).
      # ────────────────────────────────────────────────────────────────
      - name: "[slice-engine] Load epoch manifest implementedSlices (B tree — scope authority)"
        id: slice-engine
        run: |
          set -euo pipefail
          fail() { echo "[slice-engine] FAIL — $1 (fail-closed)" >&2; exit 1; }
          B="${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          printf '%s' "$B" | grep -qE '^[0-9a-f]{40}$' || fail "B='$B' not a 40-hex OID"
          MANIFEST="$(git -C "$GITHUB_WORKSPACE" show "$B:config/policy/epoch_manifest.json")" \
            || fail "config/policy/epoch_manifest.json unreadable at B=$B — engine execution scope undeterminable (manifest must land on main with the promotion PR)"
          parsed="$(printf '%s' "$MANIFEST" | jq -e . 2>/dev/null)" \
            || fail "epoch manifest unparsable at B=$B"
          printf '%s' "$parsed" | jq -e '(.ciEpochId? // "") | (type == "string") and (length > 0) and (test("^[A-Za-z0-9][A-Za-z0-9._+-]*$"))' >/dev/null \
            || fail "ciEpochId missing/malformed at B=$B"
          printf '%s' "$parsed" | jq -e '(.implementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "implementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e '(.notYetImplementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "notYetImplementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e 'all(.implementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "implementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e 'all(.notYetImplementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "notYetImplementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e '(([.implementedSlices[]] - [.notYetImplementedSlices[]]) | length) == (.implementedSlices | length)' >/dev/null \
            || fail "implementedSlices ∩ notYetImplementedSlices ≠ ∅ at B=$B"
          printf '%s' "$parsed" | jq -e '(.productionExecutionPin? // "") | (type == "string") and (length > 0)' >/dev/null \
            || fail "productionExecutionPin missing/empty at B=$B"
          printf '%s' "$parsed" | jq -e '((.mode? // "") as $m | ($m == "ci-migration") or ($m == "normal"))' >/dev/null \
            || fail "mode must be 'ci-migration' or 'normal' at B=$B"
          EPOCH="$(printf '%s' "$parsed" | jq -r '.ciEpochId')"
          IMPL="$(printf '%s' "$parsed" | jq -c '.implementedSlices')"
          echo "epoch_id=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "implemented_slices=$IMPL" >> "$GITHUB_OUTPUT"
          # Interim stage↔slice mapping (Q0 Semantic Slice Catalog; reconcile
          # with src/gate/slice_catalog.nim verificationSteps after it lands):
          #   SL-08 B/H binding → manifest verify below
          #   SL-01 identity    → admission identity re-derivation
          #   SL-02 closure     → derived-closure load
          #   SL-03 evidence    → D9 staging + subject + witness
          #   SL-05 verdict     → predicate evaluation (dry-run)
          #   SL-15 cas-reuse   → evidence-record emission + CAS env arming
          #                       (attest stage only)
          # NOTE: id regex allows SL-NN and SL-NNNN — SL-0713 is a SINGLE
          # catalog entry (SL-07 + SL-13 merged); 4-digit ids are valid.
          RPT="[slice-engine] epoch=$EPOCH implemented=$IMPL"
          for spec in "sl08=SL-08" "sl01=SL-01" "sl02=SL-02" "sl03=SL-03" "sl05=SL-05" "sl15=SL-15"; do
            key="${spec%%=*}"
            slice="${spec##*=}"
            if printf '%s' "$parsed" | jq -e --arg s "$slice" '.implementedSlices | index($s) != null' >/dev/null 2>&1; then
              echo "scope_$key=true" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=fire"
            else
              echo "scope_$key=false" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=NO-FIRE"
            fi
          done
          echo "$RPT"

      # provision-scope is STAGE-GATED, not static. The ATTEST stage builds
      # bin/core_purity_gate from B (`make bin/core_purity_gate`) and needs
      # scope=full. The verdict leg at the LANDING venue no longer provisions
      # at all (toolchain-handoff 2026-10-12 — docs/evidence/
      # verdict_payload_gate_2026-10-12.md GO scope (a')): its entire A-layer
      # consumption was the deriver compiler (nim c) + jq, and both now travel
      # in the base artifact — job1 compiles bin/derive_checker_closure from B
      # with the same hermetic recipe and pins jq 1.7.1, and the artifact
      # manifest verify below materializes + digest-binds both. The landing
      # verdict provisions only SYSTEM deps (pinned jq + libpcre3 — the two
      # steps before the slice engine). The preflight venue keeps provisioning
      # (its contrast steps consume jq before any artifact exists), and the
      # attest half stays the build site. Do NOT flatten this to the static
      # certificate-mint idiom.
      - uses: ./.github/actions/setup-axiom-toolchain
        if: inputs.stage == 'attest' || steps.venue.outputs.venue == 'preflight'
        with:
          cache-save-enabled: 'false'
          cache-build-source: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          provision-scope: 'full'

      # ────────────────────────────────────────────────────────────────
      # `_candidate/` = PR head (H) checkout, consumed as DATA ONLY —
      # "DATA SOURCE ONLY: no make/gate/build/script execution ever runs from the H tree."
      # The B-built verifier reads the H tree state (tree OID, funcSource
      # bytes) but no script, Makefile, gate, or build ever executes from
      # this tree (archived witness-rule verbatim).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Checkout candidate = H (PR head / merge-group head, data-only path)"
        # ATTEST stage only — the H tree is an input to identity re-derivation
        # and D9 staging. The verdict stage evaluates `ax merge` against the B
        # tree and the published artifacts; it reads nothing from H.
        if: inputs.stage == 'attest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ADR-0027 (P2): candidate head = PR head sha, or on merge_group the
          # merge-group head sha (H := G — github.sha == the queue commit).
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: _candidate
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: "[check] Download base-built artifacts (B bin/ax + ircheck)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-check-base-artifacts
          # STAGING dir, NOT the workspace root: bin/gate_hook·
          # bin/precompile_gates are FALLBACK supply — the B-layer restore
          # above may already hold fingerprint-verified copies and a root
          # extraction would clobber them (cache = first supply, artifact =
          # fallback; J3 acceleration). The verify step below materializes
          # the staged files into their canonical paths.
          path: _base-artifacts

      # Layout note: the artifact stages into _base-artifacts and the verify
      # step materializes it into the workspace ROOT, so the attest chain
      # still finds ircheck at the CWD-relative canonical path
      # proofs/.lake/build/bin/ircheck (extraction_agreement.nim falls back to
      # <projectRoot>/proofs/.lake/build/bin/ircheck with CWD = B tree).
      - name: "[check] Verify artifact manifest (fail-closed — build_sha == B)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          EXPECT_BUILD_SHA: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Materialize the staged artifact into the workspace layout (same
          # final paths as the former workspace-root extraction).
          test -f _base-artifacts/manifest.txt || { echo "FAIL: manifest.txt missing in downloaded artifact"; exit 1; }
          mkdir -p bin proofs/.lake/build/bin
          mv -f _base-artifacts/manifest.txt manifest.txt
          mv -f _base-artifacts/bin/ax _base-artifacts/bin/install_ax_cas bin/
          mv -f _base-artifacts/proofs/.lake/build/bin/ircheck proofs/.lake/build/bin/ircheck
          # Verdict-predicate payload members (toolchain-handoff 2026-10-12):
          # on the landing verdict these ARE the supply — the toolchain action
          # is skipped there, so an absent member fails here (fail-closed)
          # instead of surfacing later as "nim: command not found". On attest
          # they ride along harmlessly (the attest chain never executes them;
          # job1 produced them in both S5 supply modes). mv overwrites the
          # pinned copy the early provisioning step fetched — same pinned
          # bytes, and the manifest loop below digest-binds the final state.
          mv -f _base-artifacts/bin/derive_checker_closure _base-artifacts/bin/jq bin/
          # Gate binaries (members of the attest 6-binary set): the artifact
          # is the FALLBACK supply. A valid B-restore leaves its copies in
          # place — restored bytes win and the artifact copy is withheld
          # (cp -n semantics via the existence check); a B-restore MISS and
          # the B-verify discard path (setup-axiom-toolchain discard_b) both
          # leave them absent, and the artifact copy closes the supply. The
          # manifest loop below digest-binds whichever source supplied each
          # file, so the attest kernel never runs an unverified binary.
          for g in gate_hook precompile_gates; do
            if [ -f "bin/$g" ]; then
              echo "gate supply: bin/$g already present (B-restore — artifact copy withheld)"
            else
              test -f "_base-artifacts/bin/$g" \
                || { echo "FAIL: bin/$g absent from B-restore AND base artifact (no supply — fail-closed)"; exit 1; }
              cp "_base-artifacts/bin/$g" "bin/$g"
              echo "gate supply: bin/$g from base artifact (B-restore absent)"
            fi
          done
          rm -rf _base-artifacts
          while IFS=$'\t' read -r f expect; do
            test -f "$f" || { echo "FAIL: artifact file missing: $f"; exit 1; }
            actual=$(sha256sum "$f" | awk '{print $1}')
            if [ "$actual" != "$expect" ]; then
              echo "FAIL: sha256 mismatch for $f (manifest=$expect actual=$actual)"
              exit 1
            fi
            echo "OK: $f (B-built)"
          done < <(awk '/^[0-9a-f]{64}[[:space:]]{2}/{print $2 "\t" $1}' manifest.txt)
          expect_sha=$(awk -F' = ' '/^build_sha =/{print $2; exit}' manifest.txt)
          if [ -z "$expect_sha" ] || [ "$expect_sha" != "$EXPECT_BUILD_SHA" ]; then
            echo "FAIL: manifest build_sha=$expect_sha != B=$EXPECT_BUILD_SHA (verifier is NOT base-built — Gate A violation)"
            exit 1
          fi
          # upload/download-artifact@v4 drops unix executable bits — restore
          # them before any execution (bin/ax, CAS installer, attest kernel,
          # gate binaries — artifact-sourced copies arrive non-executable).
          chmod +x bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck bin/gate_hook bin/precompile_gates bin/derive_checker_closure bin/jq
          echo "MANIFEST VERIFIED: verifier is built from B=$EXPECT_BUILD_SHA"

      # ────────────────────────────────────────────────────────────────
      # GO-critical admission-contract lane handoff (G2 generation,
      # 2026-10-16 — pre-registration:
      # docs/evidence/go_matrix_parallelization_prereg_2026-10-16.md).
      # The DEBT#432 GO-critical admission-contract tests — the ONLY direct
      # tests of the terminal admission machinery —
      #   tests/unit/test_s1a_lean_golden.nim — producer E2E: funcDef → IR →
      #       genuine Lean 4.33 kernel ACCEPT → KAA → vdVerified
      #   tests/unit/proof_integrity_test.nim — isVkdAdmissible (terminal
      #       admission predicate): kernel/empirical set-membership semantics
      #   tests/unit/test_d2_golden.nim — opaque LeanKernelCheckReceipt +
      #       5-fold identity chain through the canonical sink (real kernel)
      #   tests/unit/test_d2_persist.nim — KAA → cert_writer → reader loop
      #       (the only certificate-persistence path test)
      # run as the 2-lane `go-critical-lane` job matrix at the bottom of
      # this file (lane-0 = s1a solo — the critical path; lane-1 =
      # proof_integrity + d2_golden + d2_persist), NOT in this job. Each
      # lane re-derives the same provisioning this job performs (B
      # checkout, slice engine, toolchain, base-artifact manifest verify),
      # arms and plans ONLY its own subjects' Judgment CAS (same env/plan
      # vocabulary the serial step consumed — read-only ledger consult
      # through the B-built bin/ax), runs `make test-fast-one` per subject,
      # and publishes (a) its per-subject judgment decision/record/evidence
      # files and (b) its build/nimcache (test-mode compile supply) as
      # run-scoped artifacts.
      # THIS job consumes (a) below: the armed attest stage re-verifies
      # every subject fail-closed exactly as the serial pipeline did
      # (basis=REUSED → ledger re-fetch + full re-verification inside the
      # attest step; basis=EXECUTED → the loop-staged evidence file is
      # required; an unverifiable reuse can never certify). The decision
      # files land at the workspace-root default paths the armed attest's
      # `${AXIOM_JUDGMENT_CAS_*:-…}` fallbacks resolve to — the serial
      # plan-stage GITHUB_ENV writes are superseded by these downloads, not
      # re-implemented. (b) folds into the published B-cache carrier (J3
      # acceleration, §3.1 — cache is acceleration, never evidence).
      # Ordering is the needs edge (go-critical-lane → admission-check),
      # never polling. Lane stderr is GitHub-native per-job logs;
      # fail-fast: false keeps every lane's transcript alive on partial
      # failure (merge_latency_decision_prereg_2026-10-14.md §8 — the
      # single-step lane pattern whose stderr-loss lineage motivated it
      # does not exist in this structure).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Download lane-0 judgment artifacts (s1a — lane handoff, fail-closed on landing)"
        if: always() && inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-judgment-lane-0-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: .
      - name: "[check] Download lane-1 judgment artifacts (proof_integrity/d2_golden/d2_persist — lane handoff, fail-closed on landing)"
        if: always() && inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-judgment-lane-1-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: .
      # ────────────────────────────────────────────────────────────────
      # [independents] L3 file channel (prereg §2.2): the
      # admission-independents job stages draft-assembled.json + the
      # subject's final evidence record here. Identity re-validation at
      # consumption IS the name (prereg §2.3): the candidate head is
      # re-derived from THIS job's own event context and the attempt from
      # this run — a stale or foreign artifact resolves to a different
      # name and the download fails closed (hard fail, no
      # continue-on-error; v4 artifact names are immutable per run, so a
      # duplicate under one name cannot exist). Run-scoped: `name`+`path`
      # only, never a run-id — same-run binding is the download action's
      # own scoping rule. Fires under the witness's exact scope conjunct:
      # when the witness runs, its evidence input MUST be present.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Download admission-independents evidence (job2a handoff, fail-closed on landing)"
        if: inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl08 == 'true' && steps.slice-engine.outputs.scope_sl03 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-independents-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          # 2026-11-04 subject-store inclusion (§6.5): the producer's
          # multi-path upload roots the artifact at data/trusted (LCA of
          # evidence/ + subjects/), so restoring there lands BOTH the
          # evidence records the --evidence input reads and the subject
          # store findSubjectsByHeadSha scans. The fail-closed stays in
          # the consumer: a missing subject file is red at the witness.
          path: data/trusted


      # Test-mode nimcache fold (base carrier ∪ lane test-supply →
      # `admission-check-base-nimcache` → publisher B-cache) is NO LONGER
      # performed in this job: it is J3 cache investment for a FUTURE run —
      # no judgment step of this run reads build/nimcache — so it moved to
      # the ci-cache-publisher base-seed (2026-10-30) and no longer delays
      # the required check (pre-registration:
      # docs/evidence/mg_folding_separation_prereg_2026-10-30.md).

      # ────────────────────────────────────────────────────────────────
      # [preflight] ATTEST leg, PR venue (ADR-0032 (b),(f)): the fast static
      # contrast this leg performs INSTEAD of the landing chain. Real checks,
      # fail-closed — an always-green branch here would be theater (§0.9):
      #   1. TWS pin pairing — config/trusted_writer_set.json parses, its
      #      trustedAdmissionWorkflowSha is 40-hex and EQUALS the blob sha of
      #      .github/workflows/admission-check.yml in THIS (B) checkout — the
      #      A2 atomic pair (landing-integrity ATOMICITY) observed statically.
      #   2. Policy SSOT — config/policy/merge_admission.json parses and
      #      certRequired is true (the certified-admission posture this file
      #      produces evidence for is intact).
      # The B/H identity re-derivation ran in the parallel
      # admission-independents job (stage attest, unconditional — L3
      # split) and is the preflight's identity content.
      # ────────────────────────────────────────────────────────────────
      - name: "[preflight] Attest-leg static contrast (TWS pin pairing + policy SSOT)"
        if: inputs.stage == 'attest' && steps.venue.outputs.venue == 'preflight'
        run: |
          set -euo pipefail
          fail() { echo "[preflight][attest] FAIL — $1 (fail-closed, ADR-0032)" >&2; exit 1; }
          TWS="config/trusted_writer_set.json"
          POLICY="config/policy/merge_admission.json"
          [ -f "$TWS" ] || fail "trusted_writer_set.json missing at B workspace"
          [ -f "$POLICY" ] || fail "merge_admission.json missing at B workspace"
          stripped="$(sed -E 's|^[[:space:]]*//.*$||' "$TWS")"
          TWS_SHA="$(printf '%s' "$stripped" | jq -er '.trustedAdmissionWorkflowSha')" \
            || fail "trustedAdmissionWorkflowSha missing/malformed in $TWS"
          printf '%s' "$TWS_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "trustedAdmissionWorkflowSha '$TWS_SHA' not 40-hex"
          BLOB_SHA="$(git hash-object .github/workflows/admission-check.yml)"
          [ "$BLOB_SHA" = "$TWS_SHA" ] || fail "admission-check.yml blob $BLOB_SHA != TWS trustedAdmissionWorkflowSha $TWS_SHA (A2 pin pair broken — fail-closed)"
          jq -e '.certRequired == true' "$POLICY" >/dev/null 2>&1 \
            || fail "merge_admission.json certRequired is not true (SSOT posture drift — fail-closed)"
          echo "[preflight][attest] checks: TWS pin pairing (blob@B == trustedAdmissionWorkflowSha) + policy SSOT certRequired=true + identity re-derivation (parallel admission-independents job)"
          echo "PREFLIGHT PASS — attest leg: identity re-derivation + TWS pin pairing + policy SSOT contrast (venue=pull_request; preflight success ≠ landing evidence — ADR-0032 (f))"

      # ────────────────────────────────────────────────────────────────
      # B/M execution accounting — the attest-side fail-closed cross-check
      # of the lanes' execution records against the subjects' decision
      # files. THIS is where a failed lane is prevented from minting a
      # reusable PASS record: the mint's record files are staged by the
      # armed attest branch BELOW, and that branch trusts the decision
      # file's basis; this step proves the basis against the OBSERVED lane
      # outcome first (decision basis=EXECUTED ⇒ the lane's exec record
      # says verdict=PASS; basis=REUSED ⇒ a non-s1a subject with an
      # UNKNOWN/REUSED row). It also re-derives the tested tree + overlay
      # manifest digest from the _candidate checkout and exports the
      # tested-tree identity the armed attest re-derives its closure under
      # — plan (lane) and attest now see the SAME candidate tree, so a
      # record minted under any other tree (the pre-split B-only era
      # included) can never re-verify as THIS computation's fact.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] GO execution accounting cross-check (exec records vs decisions, M-tree identity)"
        if: inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing' && steps.slice-engine.outputs.scope_sl15 == 'true'
        run: |
          set -euo pipefail
          fail() { echo "[go-exec] FAIL — $1 (fail-closed)" >&2; exit 1; }
          M_SHA="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse HEAD)" \
            || fail "_candidate HEAD unresolvable"
          # M's tree must be readable by the workspace object store (the
          # closure derivation shells `git ls-tree` against CWD) — local
          # fetch from the candidate checkout, no network, no credentials.
          git -C "$GITHUB_WORKSPACE" fetch --no-tags "$GITHUB_WORKSPACE/_candidate" "$M_SHA" \
            || fail "cannot fetch M objects into the attest object store"
          M_TREE="$(git -C "$GITHUB_WORKSPACE" rev-parse "${M_SHA}^{tree}")" \
            || fail "M^{tree} unresolvable after fetch"
          B_TREE="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            || fail "B^{tree} unresolvable"
          # OVERLAY INPUT RULE — PER SUBJECT. A lane's exec records carry
          # the digest of THAT lane's overlay inputs (the lane overlays
          # `src` + `tests/golden` + its own matrix test list), so the
          # cross-check must recompute the digest over the SAME list the
          # producing lane overlaid — never over the union of every lane's
          # inputs (that union matches no record: measured on merge-group
          # run 39490305583 — lane-0's s1a record = f2600659…, lane-1's
          # three probe records = a6df97db…). The list lives HERE, never in
          # the record: a record may not nominate the inputs that are meant
          # to justify it. lane-0 = s1a solo; lane-1 = the three probe
          # subjects in ONE overlay (go-critical-lane matrix include).
          declare -A OVERLAY_INPUTS=(
            [s1a]="src tests/golden tests/unit/test_s1a_lean_golden.nim"
            [proof_integrity]="src tests/golden tests/unit/proof_integrity_test.nim tests/unit/test_d2_golden.nim tests/unit/test_d2_persist.nim"
            [d2_golden]="src tests/golden tests/unit/proof_integrity_test.nim tests/unit/test_d2_golden.nim tests/unit/test_d2_persist.nim"
            [d2_persist]="src tests/golden tests/unit/proof_integrity_test.nim tests/unit/test_d2_golden.nim tests/unit/test_d2_persist.nim"
          )
          EXEC_SCHEMA="axiom.judgment.cas.execution.v2"
          declare -A DEC_PATH=(
            [s1a]="judgment-decision.json"
            [proof_integrity]="judgment-decision-proof-integrity.json"
            [d2_golden]="judgment-decision-d2-golden.json"
            [d2_persist]="judgment-decision-d2-persist.json"
          )
          declare -A OVERLAY_DIGESTS=()
          for sub in s1a proof_integrity d2_golden d2_persist; do
            DEC="$GITHUB_WORKSPACE/${DEC_PATH[$sub]}"
            EXEC="$GITHUB_WORKSPACE/go-exec-records/$sub.json"
            [ -f "$EXEC" ] || fail "execution record missing for $sub — the lane's executed accounting is incomplete (fail-closed)"
            [ -f "$DEC" ] || fail "decision file missing for $sub: $DEC (fail-closed)"
            # Record shape (fail-closed): schema, subject identity, verdict
            # and basis vocabularies.
            [ "$(jq -r '.schemaVersion // ""' "$EXEC")" = "$EXEC_SCHEMA" ] \
              || fail "exec record[$sub] schemaVersion mismatch (expected $EXEC_SCHEMA)"
            [ "$(jq -r '.subject // ""' "$EXEC")" = "$sub" ] \
              || fail "exec record[$sub] subject mismatch"
            VERDICT="$(jq -r '.verdict // ""' "$EXEC")"
            BASIS="$(jq -r '.basis // ""' "$EXEC")"
            case "$VERDICT" in PASS|FAIL|UNKNOWN) ;; *) fail "exec record[$sub] verdict='$VERDICT' outside the vocabulary" ;; esac
            case "$BASIS" in EXECUTED|REUSED|OFF) ;; *) fail "exec record[$sub] basis='$BASIS' outside the vocabulary" ;; esac
            # Exact identity set: the record must name THIS run's executor
            # tree, candidate tree, and overlay manifest digest.
            [ "$(jq -r '.identities.executorTreeOid // ""' "$EXEC")" = "$B_TREE" ] \
              || fail "exec record[$sub] executorTreeOid != B^{tree} (the record names another executor, fail-closed)"
            [ "$(jq -r '.identities.candidateTreeOid // ""' "$EXEC")" = "$M_TREE" ] \
              || fail "exec record[$sub] candidateTreeOid != M^{tree} (the record names another candidate, fail-closed)"
            # Overlay manifest digest — recomputed HERE, per subject, over
            # the SAME `git ls-tree -r --full-tree $M_TREE -- src
            # tests/golden <lane tests>` composition the producing lane
            # used (the lane's own overlay inputs).
            OVERLAY_INPUT="${OVERLAY_INPUTS[$sub]:-}"
            [ -n "$OVERLAY_INPUT" ] \
              || fail "no overlay input rule for subject '$sub' — the lane overlay list is undeclared (fail-closed)"
            # shellcheck disable=SC2086
            OVERLAY_LIST="$(git -C "$GITHUB_WORKSPACE/_candidate" ls-tree -r --full-tree "$M_TREE" -- $OVERLAY_INPUT | LC_ALL=C sort)" \
              || fail "overlay manifest list unreadable at attest for subject '$sub'"
            [ -n "$OVERLAY_LIST" ] \
              || fail "overlay manifest list empty at attest for subject '$sub'"
            OVERLAY_DIGEST="$(printf '%s\n' "$OVERLAY_LIST" | sha256sum | awk '{print $1}')"
            OVERLAY_DIGESTS[$sub]="$OVERLAY_DIGEST"
            [ "$(jq -r '.identities.overlayManifestDigest // ""' "$EXEC")" = "$OVERLAY_DIGEST" ] \
              || fail "exec record[$sub] overlayManifestDigest != the digest recomputed over its own lane's overlay inputs (fail-closed)"
            # Decision↔outcome binding: an EXECUTED decision may only rest
            # on an observed PASS — a failed lane's flushed evidence can
            # never mint a reusable PASS record. A REUSED decision is only
            # representable for a non-s1a probe subject, recorded as an
            # UNKNOWN/REUSED row (the reuse authorization itself comes from
            # the ledger record re-verification, never from this row).
            DEC_BASIS="$(jq -r '.basis // ""' "$DEC")"
            case "$DEC_BASIS" in
              EXECUTED)
                [ "$VERDICT" = "PASS" ] || fail "decision[$sub] basis=EXECUTED but the lane observed verdict=$VERDICT — a failed/unknown execution must never mint a reusable record (fail-closed)"
                ;;
              REUSED)
                [ "$VERDICT" = "UNKNOWN" ] || fail "decision[$sub] basis=REUSED but exec verdict=$VERDICT (expected UNKNOWN — a skip is not an outcome, fail-closed)"
                [ "$BASIS" = "REUSED" ] || fail "exec record[$sub] basis inconsistent with the REUSED decision (fail-closed)"
                ;;
              *)
                fail "decision[$sub] basis='$DEC_BASIS' — armed-attest decisions must be EXECUTED or REUSED (fail-closed)"
                ;;
            esac
            echo "[go-exec] exec record[$sub] OK — verdict=$VERDICT basis=$BASIS decision=$DEC_BASIS"
          done
          {
            echo "GO_TESTED_TREE_OID=$M_TREE"
            echo "GO_CANDIDATE_HEAD_SHA=$M_SHA"
            for sub in s1a proof_integrity d2_golden d2_persist; do
              echo "GO_OVERLAY_MANIFEST_DIGEST_${sub^^}=${OVERLAY_DIGESTS[$sub]}"
            done
          } >> "$GITHUB_ENV"
          echo "[go-exec] tested tree = M^{tree} $M_TREE (overlay digests — s1a=${OVERLAY_DIGESTS[s1a]} proof_integrity=${OVERLAY_DIGESTS[proof_integrity]} d2_golden=${OVERLAY_DIGESTS[d2_golden]} d2_persist=${OVERLAY_DIGESTS[d2_persist]} — exported for the armed attest closure)" | tee -a "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────────
      # Continuity witness — B-built ax runs the kernel chain a-f against the
      # staged evidence (H-derived data). lean/z3/ircheck come from the B
      # checkout + B-built artifact (setup-axiom-toolchain pins + ircheck at
      # proofs/.lake/build/bin/ircheck, CWD = B workspace root). The SL-15
      # CAS branch performs one READ-ONLY network consult (evidence ledger
      # side-ref) when armed, which is why GITHUB_TOKEN is provided here;
      # without it the ledger read refuses fail-closed and attest fails.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Attest witness-only (B-built ax kernel, H-derived data)"
        if: inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl08 == 'true' && steps.slice-engine.outputs.scope_sl03 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          SUBJECT_ID: ${{ env.SUBJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          SCOPE_SL15: ${{ steps.slice-engine.outputs.scope_sl15 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BIN_AX="$GITHUB_WORKSPACE/bin/ax"
          [ -x "$BIN_AX" ] || { echo "[check] bin/ax missing — B build failed" >&2; exit 1; }
          : "${SUBJECT_ID:?SUBJECT_ID not set}"
          [ -x "$GITHUB_WORKSPACE/proofs/.lake/build/bin/ircheck" ] \
            || { echo "[check] FAIL-CLOSED: B-built ircheck missing (proofs/.lake/build/bin/ircheck)" >&2; exit 1; }
          # ── SL-15 admission evidence identity reuse (Evidence CAS) ──────
          # scope_sl15=true arms the CAS branch of the B-built ax: the kernel
          # consults the evidence ledger ref (READ-ONLY) and either reuses a
          # stored evidence record (HIT — the sanctioned §15.3 skip of chain
          # stages b+c, after full re-verification) or emits the canonical
          # record file below for the trusted mint's exactly-once append
          # (MISS). Tree OIDs arrive via env — the orchestrator has no git
          # access; the stored subject carries only sha256(OID) (irreversible).
          # NO-FIRE (epoch not implemented / slice absent) = zero behavior
          # change: no CAS env, no record file, byte-identical legacy ax run.
          EVIDENCE_CAS_RECORD="$GITHUB_WORKSPACE/evidence-record.json"
          if [ "${SCOPE_SL15:-false}" = "true" ]; then
            export AXIOM_EVIDENCE_CAS_ENABLED=1
            if ! BASE_TREE_OID="$(git -C "$GITHUB_WORKSPACE" rev-parse "$B^{tree}")"; then
              echo "[check] FAIL-CLOSED: cannot resolve base tree OID from B=${B:0:12}" >&2
              exit 1
            fi
            export AXIOM_EVIDENCE_CAS_BASE_TREE_OID="$BASE_TREE_OID"
            export AXIOM_EVIDENCE_CAS_HEAD_TREE_OID="${SUBJECT_HEAD_TREE_OID:-$HEAD_TREE_OID}"
            export AXIOM_EVIDENCE_CAS_MERGE_TREE_OID="$MERGE_TREE_OID"
            export AXIOM_EVIDENCE_CAS_RECORD_PATH="$EVIDENCE_CAS_RECORD"
            echo "[check] AXIOM_EVIDENCE_CAS armed (base ${BASE_TREE_OID:0:12}, head ${SUBJECT_HEAD_TREE_OID:-$HEAD_TREE_OID}, merge ${MERGE_TREE_OID:0:12})"
            # ── Judgment CAS (GO-critical judgment reuse ×4, contract §5 (d)) ──
            # Same SL-15 scope. Each subject's plan-stage decision file drives
            # its branch: REUSED → the ledger record is re-fetched and fully
            # re-verified (a failure here fails the run — the test was
            # skipped, so an unverifiable reuse can never certify);
            # EXECUTED → the subject's loop-staged evidence file is required.
            # The tested tree OID (contract component ⑤) is the SAME
            # derivation as BASE_TREE_OID above (the workspace root IS the B
            # checkout). s1a keeps its landed unsuffixed env names; the
            # extension subjects are suffixed per subject.
            export AXIOM_JUDGMENT_CAS_ENABLED=1
            # B/M split: the closure re-derivation here uses the CANDIDATE's
            # tree — the same value the lane's plan derived (the cross-check
            # step above re-derived and exported it from _candidate). A
            # decision file whose probe tree differs fails closed below
            # (probeTreeOid binding), and a ledger record minted under any
            # other tested tree can never re-verify as this run's fact.
            GO_TESTED_TREE_OID="${GO_TESTED_TREE_OID:-}"
            printf '%s' "$GO_TESTED_TREE_OID" | grep -qE '^[0-9a-f]{40}$' \
              || { echo "[check] FAIL-CLOSED: GO_TESTED_TREE_OID missing/invalid — the execution-accounting cross-check must run first" >&2; exit 1; }
            export AXIOM_JUDGMENT_CAS_TESTED_TREE_OID="$GO_TESTED_TREE_OID"
            export AXIOM_JUDGMENT_CAS_RECORD_PATH="${AXIOM_JUDGMENT_CAS_RECORD_PATH:-$GITHUB_WORKSPACE/judgment-record.json}"
            export AXIOM_JUDGMENT_CAS_DECISION_PATH="${AXIOM_JUDGMENT_CAS_DECISION_PATH:-$GITHUB_WORKSPACE/judgment-decision.json}"
            export AXIOM_JUDGMENT_CAS_EVIDENCE_PATH="${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH:-$GITHUB_WORKSPACE/judgment-evidence.json}"
            export AXIOM_JUDGMENT_CAS_RECORD_PATH_PROOF_INTEGRITY="${AXIOM_JUDGMENT_CAS_RECORD_PATH_PROOF_INTEGRITY:-$GITHUB_WORKSPACE/judgment-record-proof-integrity.json}"
            export AXIOM_JUDGMENT_CAS_DECISION_PATH_PROOF_INTEGRITY="${AXIOM_JUDGMENT_CAS_DECISION_PATH_PROOF_INTEGRITY:-$GITHUB_WORKSPACE/judgment-decision-proof-integrity.json}"
            export AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_PROOF_INTEGRITY="${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_PROOF_INTEGRITY:-$GITHUB_WORKSPACE/judgment-evidence-proof-integrity.json}"
            export AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_GOLDEN="${AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_GOLDEN:-$GITHUB_WORKSPACE/judgment-record-d2-golden.json}"
            export AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_GOLDEN="${AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_GOLDEN:-$GITHUB_WORKSPACE/judgment-decision-d2-golden.json}"
            export AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_GOLDEN="${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_GOLDEN:-$GITHUB_WORKSPACE/judgment-evidence-d2-golden.json}"
            export AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_PERSIST="${AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_PERSIST:-$GITHUB_WORKSPACE/judgment-record-d2-persist.json}"
            export AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_PERSIST="${AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_PERSIST:-$GITHUB_WORKSPACE/judgment-decision-d2-persist.json}"
            export AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_PERSIST="${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_PERSIST:-$GITHUB_WORKSPACE/judgment-evidence-d2-persist.json}"
            echo "[check] AXIOM_JUDGMENT_CAS armed (tested tree ${BASE_TREE_OID:0:12}, subjects: s1a proof_integrity d2_golden d2_persist)"
          else
            echo "AXIOM_EVIDENCE_CAS: DISABLED (SL-15 NO-FIRE)"
          fi
          # ADR-0027 (P1): --pr is omitted when PR_NUMBER=0 (merge_group — no PR
          # context); the CLI then records prNumber=0 in the witness provenance
          # (--pr requires a value > 0 if given).
          if [ "$PR_NUMBER" = "0" ]; then
            "$BIN_AX" cert attest --witness-only \
              --ref "${SUBJECT_HEAD:-$H}" \
              --evidence "$GITHUB_WORKSPACE/data/trusted/evidence/$SUBJECT_ID.json" \
              --merge-sha "${{ github.sha }}" \
              --merge-tree "$MERGE_TREE_OID" \
              --tool-commit "$B" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --out witness.json
          else
            "$BIN_AX" cert attest --witness-only \
              --ref "${SUBJECT_HEAD:-$H}" \
              --pr "$PR_NUMBER" \
              --evidence "$GITHUB_WORKSPACE/data/trusted/evidence/$SUBJECT_ID.json" \
              --merge-sha "${{ github.sha }}" \
              --merge-tree "$MERGE_TREE_OID" \
              --tool-commit "$B" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --out witness.json
          fi
          sha256sum witness.json | awk '{print $1}' > witness.sha256
          # SL-15 fail-closed: an armed CAS run MUST produce its evidence
          # record — the trusted mint's append (certificate-mint P7b) refuses
          # a run without it, so an absent record must die HERE, not move the
          # failure downstream to a mint that cannot distinguish "no reuse"
          # from "record lost".
          if [ "${SCOPE_SL15:-false}" = "true" ]; then
            [ -f "$EVIDENCE_CAS_RECORD" ] \
              || { echo "[check] FAIL-CLOSED: AXIOM_EVIDENCE_CAS armed but no evidence record at $EVIDENCE_CAS_RECORD" >&2; exit 1; }
            echo "[check] evidence record staged: $EVIDENCE_CAS_RECORD"
            # Judgment CAS fail-closed (contract §6): an armed attest MUST
            # produce EVERY subject's judgment record — absent = the branch
            # never ran (inconsistent arming) and dies HERE, not downstream.
            for judg_rec in \
              "${AXIOM_JUDGMENT_CAS_RECORD_PATH}" \
              "${AXIOM_JUDGMENT_CAS_RECORD_PATH_PROOF_INTEGRITY}" \
              "${AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_GOLDEN}" \
              "${AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_PERSIST}"; do
              [ -f "$judg_rec" ] \
                || { echo "[check] FAIL-CLOSED: AXIOM_JUDGMENT_CAS armed but no judgment record at $judg_rec" >&2; exit 1; }
              echo "[check] judgment record staged: $judg_rec"
            done
            # SSOT subject set-equality (plan §4-2): the B-built ax's
            # judgment-subjects projection IS the subject SSOT; the
            # lane-emitted decision files must cover EXACTLY that set — no
            # missing subject (never planned), no extra/stale decision file.
            # The s1a decision keeps its landed byte shape (no subject field
            # → "s1a"); the extension subjects carry their name.
            SUBJECT_SET_DIR="$(mktemp -d)"
            "$BIN_AX" cert judgment-subjects | sort -u > "$SUBJECT_SET_DIR/expected"
            : > "$SUBJECT_SET_DIR/observed"
            for judg_dec in "$GITHUB_WORKSPACE"/judgment-decision*.json; do
              [ -f "$judg_dec" ] || continue
              jq -r '.subject // "s1a"' "$judg_dec" >> "$SUBJECT_SET_DIR/observed"
            done
            sort -u "$SUBJECT_SET_DIR/observed" -o "$SUBJECT_SET_DIR/observed"
            if [ "$(wc -l < "$SUBJECT_SET_DIR/expected")" -ne "$(wc -l < "$SUBJECT_SET_DIR/observed")" ] \
              || [ -n "$(comm -3 "$SUBJECT_SET_DIR/expected" "$SUBJECT_SET_DIR/observed")" ]; then
              echo "[check] FAIL-CLOSED: judgment decision subject set != SSOT — missing:[$(comm -23 "$SUBJECT_SET_DIR/expected" "$SUBJECT_SET_DIR/observed" | tr '\n' ' ')] extra:[$(comm -13 "$SUBJECT_SET_DIR/expected" "$SUBJECT_SET_DIR/observed" | tr '\n' ' ')] (plan §4-2)" >&2
              exit 1
            fi
            echo "[check] judgment subject set == SSOT: $(tr '\n' ' ' < "$SUBJECT_SET_DIR/observed")($(wc -l < "$SUBJECT_SET_DIR/observed") subjects)"
            # merge_group venue (redecision 2026-10-18 —
            # docs/evidence/mg_reuse_policy_redecision_2026-10-18.md): every
            # subject's basis is EXECUTED **or eligible REUSED** — REUSED is
            # accepted ONLY with a valid rootRecord provenance marker
            # ({evidenceKey 64-hex, payloadSha256 64-hex, executionEpoch
            # non-empty} naming the same-generation pipeline-minted EXECUTED
            # root the skip re-adopts). A REUSED without a valid marker — or
            # any other non-EXECUTED basis — stays fail-closed exit 1.
            if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
              : > "$SUBJECT_SET_DIR/non-executed"
              for judg_dec in "$GITHUB_WORKSPACE"/judgment-decision*.json; do
                [ -f "$judg_dec" ] || continue
                if grep -q '"basis":"EXECUTED"' "$judg_dec"; then continue; fi
                if grep -q '"basis":"REUSED"' "$judg_dec" \
                  && [ "$(jq -r 'if (.rootRecord.evidenceKey // "" | test("^[0-9a-f]{64}$")) and (.rootRecord.payloadSha256 // "" | test("^[0-9a-f]{64}$")) and ((.rootRecord.executionEpoch // "") | length > 0) then "ok" else "bad" end' "$judg_dec")" = "ok" ]; then
                  echo "[check] $(basename "$judg_dec") basis=REUSED — eligible reuse accepted (rootRecord marker $(jq -r '.rootRecord.evidenceKey' "$judg_dec" | cut -c1-12)…)"
                else
                  jq -r '.subject // "s1a"' "$judg_dec" >> "$SUBJECT_SET_DIR/non-executed"
                fi
              done
              if [ -s "$SUBJECT_SET_DIR/non-executed" ]; then
                echo "[check] FAIL-CLOSED: merge_group venue requires basis=EXECUTED or REUSED-with-valid-rootRecord-marker — rejected: $(tr '\n' ' ' < "$SUBJECT_SET_DIR/non-executed")" \
                  "(REUSED-on-MG requires root-EXECUTED provenance — redecision 2026-10-18)" >&2
                exit 1
              fi
              echo "[check] merge_group venue: all $(wc -l < "$SUBJECT_SET_DIR/observed") decision file(s) basis=EXECUTED or eligible-REUSED (rootRecord marker present)"
            else
              echo "[check] preflight venue: judgment ledger reuse preserved (REUSED basis allowed)"
            fi
            rm -rf "$SUBJECT_SET_DIR"
          fi
          # ADR-0027 α: witness prHeadSha binds the SUBJECT head (H_PR on
          # merge_group); mergeSha/mergeTreeDigest bind the RUN head G.
          echo "[check] attest --witness-only PASS (subject head ${SUBJECT_HEAD:-$H}, subject tree ${SUBJECT_HEAD_TREE_OID:-$HEAD_TREE_OID}, merge tree $MERGE_TREE_OID, B ${B:0:12}, run ${{ github.run_id }}/${{ github.run_attempt }})"

      - name: "[check] Upload evidence record (SL-15 admission identity reuse)"
        # ATTEST stage, SL-15 scope only. The evidence record is the trusted
        # mint's (P7b) exactly-once ledger-append input: produced on MISS
        # (fresh evidence) or rebound on HIT (same key + same payload bytes —
        # the append is an idempotent no-op). Cross-runner channel, same
        # conventions as the admission-check artifact above: artifact identity
        # = evidence-record-<candidate head>-<run_attempt> (the mint's
        # want_name mirrors the same expression, so upload and lookup stay
        # equal on BOTH events; the run_attempt suffix keeps re-runs from
        # colliding under one identity — the mint's exactly-one check fails
        # closed with found 2). `always()` keeps the record reachable for
        # post-mortem when the attest chain failed AFTER producing it;
        # if-no-files-found: warn — an unarmed run (SL-15 NO-FIRE) has no
        # record by contract, and the armed-but-missing case already failed
        # closed inside the attest step.
        if: always() && inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl15 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-record-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: evidence-record.json
          if-no-files-found: warn
          retention-days: 30

      - name: "[check] Upload judgment record (s1a judgment CAS reuse)"
        # ATTEST stage, SL-15 scope only. The judgment record is the trusted
        # mint's (contract §7 — P7b-shape binding) exactly-once ledger-append
        # input: produced on EXECUTED (fresh measured judgment) or rebound on
        # REUSED (same key + same payload bytes — the append is an idempotent
        # no-op). The decision file rides along (the honest basis record) and
        # the evidence file (EXECUTED basis). Cross-runner channel, same
        # artifact-identity conventions as the evidence record above.
        if: always() && inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl15 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: judgment-record-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            judgment-record.json
            judgment-decision.json
            judgment-evidence.json
            judgment-record-proof-integrity.json
            judgment-decision-proof-integrity.json
            judgment-evidence-proof-integrity.json
            judgment-record-d2-golden.json
            judgment-decision-d2-golden.json
            judgment-evidence-d2-golden.json
            judgment-record-d2-persist.json
            judgment-decision-d2-persist.json
            judgment-evidence-d2-persist.json
          if-no-files-found: warn
          retention-days: 30

      # ────────────────────────────────────────────────────────────────
      # Admission predicate evaluation — B-built bin/ax runs MergeAdmissible
      # for the PR (collectAdmissionFacts → MergeAdmissible) in DRY-RUN:
      # no server-side merge; the exit contract (dryRunExit — single source)
      # is 0 for admission GO and for TRUST_SURFACE_MODIFIED (policy routes
      # trust-surface changes to the architect manual-merge path — CODEOWNERS
      # + TWS pin ceremony + arm refusal enforce there), and non-zero for
      # every other NOT-ADMIT reasonCode or a run-level failure. The step
      # exit IS the required check's conclusion — a NOT-ADMIT verdict is
      # therefore a failed check and the ruleset blocks the merge.
      # Axiom decides, GitHub enforces: the verdict lands in
      # .axiom/gate_history.jsonl (canonical merge-admission journal) and is
      # captured here as the check record.
      # ────────────────────────────────────────────────────────────────
      # Gate-era rotation closure inputs arrive as the SAME-RUN artifact
      # `derived-closure` (uploaded by the org gate's closure job) — the
      # only cross-runner channel; a repo var cannot carry per-run data
      # (wiring contract fix vs the pre-activation vars draft, 2026-09-26).
      # Pre-gate: artifact absent → rotation Pass skipped → qualification
      # UNSPECIFIED (the gate verdict fail-closes on UNSPECIFIED).
      # Live producer is the IN-PLACE deriver below (ADR C2 recipe): when the
      # artifact is absent/empty, the sets are derived from the tree and
      # pin@H is read via `git show $H:config/trusted_writer_set.json`
      # (tree-bound, unforgeable). The deriver BINARY itself is normally
      # supplied as a base-artifact member (job1, compiled from B —
      # toolchain-handoff 2026-10-12); the derivation execution always runs
      # in this step. The artifact branch above is the retired org-gate
      # channel (L1 proves provenance only — content binding is a named
      # follow-up before any revival).
      - name: "[check] Load derived-closure sets (org gate artifact, pre-gate optional)"
        # VERDICT stage — the closure sets are the rotation Pass' ONLY input
        # (exported as AXIOM_DERIVED_* below, consumed by `ax merge`). Running
        # this download in the attest stage would fetch an artifact no attest
        # step reads, and — the operative cost — attest is the EARLIEST job in
        # the caller's graph, so a producer publishing in parallel would still
        # not have landed. The stage that consumes it is the last to run.
        if: inputs.stage == 'verdict' && steps.slice-engine.outputs.scope_sl02 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: derived-closure
          path: .derived-closure

      # ────────────────────────────────────────────────────────────────
      # Subject-continuity certificate SOURCE handoff (ADR-0022 §D5-3).
      # `ax merge --dry-run --cert <path>` binds the verdict to the
      # attestation tier's artifact instead of the side-ref ledger scan,
      # removing the circular dependency (admission ← ledger ←
      # attest-append). The org DAG runs `admission` with NO `needs:`, so on
      # a fresh run mint-prepare/mint-publish have NOT published yet and the
      # artifact is legitimately absent — ADR-0022 §D5-3: "`--cert`가 있으면
      # artifact가, 없으면 side-ref ledger가 source다 (bootstrap/recovery)".
      # ⇒ SOFT: `continue-on-error` (a missing artifact must never fail the
      # job) and no `if:` (download is provisioning/observation, not a
      # verification slice — ungated like the checkouts/toolchain above).
      # Name mirrors certificate-mint.yml:879 (`subject-certificate-<runAttempt>`);
      # run-scoped identity is the only cross-runner channel — headSha
      # binding is NOT carried by the name, it is re-verified fail-closed by
      # `certificateFactFromPath` (merge_cli.nim) on the `headSha` field.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Fetch subject-certificate artifact (mint handoff — ADR-0022 §D5-3, soft)"
        # VERDICT stage — this is the `--cert` handoff the certificate is
        # consumed through. It must sit AFTER the caller's mint-publish job in
        # the `needs:` graph: on the trust-ordered DAG the artifact is published
        # earlier in the same run, so `--cert` is the source instead of the
        # side-ref ledger scan. ADR-0032: landing venue only — the PR preflight
        # verdict leg runs no `ax merge` and consumes no certificate.
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: subject-certificate-${{ github.run_attempt }}
          path: .subject-certificate

      # ────────────────────────────────────────────────────────────────
      # [preflight] VERDICT leg, PR venue (ADR-0032 (b),(f)): the fast static
      # contrast this leg performs INSTEAD of the `ax merge` predicate. Real
      # checks, fail-closed (§0.9 — no always-green branch):
      #   1. Policy SSOT — merge_admission.json parses and certRequired is
      #      true: the canonical merge_group verdict WILL demand a
      #      subject-continuity certificate (merge_cli.nim CertRequired
      #      mirror).
      #   2. Stage-dispatch structure — this file still declares the
      #      REQUIRED workflow_call `stage` input that selects attest/verdict
      #      (the dispatch this leg's own invocation depends on).
      # No bin/ax is built or executed on the PR venue (ADR-0032 (b)) — the
      # landing-eligibility judgment is exclusively the merge_group verdict.
      # ────────────────────────────────────────────────────────────────
      - name: "[preflight] Verdict-leg static contrast (policy SSOT + stage dispatch structure)"
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'preflight'
        run: |
          set -euo pipefail
          fail() { echo "[preflight][verdict] FAIL — $1 (fail-closed, ADR-0032)" >&2; exit 1; }
          POLICY="config/policy/merge_admission.json"
          [ -f "$POLICY" ] || fail "merge_admission.json missing at B workspace"
          jq -e '.certRequired == true' "$POLICY" >/dev/null 2>&1 \
            || fail "merge_admission.json certRequired is not true (canonical verdict posture drift — fail-closed)"
          WF=".github/workflows/admission-check.yml"
          [ -f "$WF" ] || fail "workflow source missing at B workspace"
          grep -q "required: true" "$WF" || fail "workflow_call stage input no longer required (stage dispatch structure drift)"
          echo "[preflight][verdict] checks: policy SSOT certRequired=true + stage dispatch structure (required stage input)"
          echo "PREFLIGHT PASS — verdict leg: policy SSOT + stage-dispatch structure contrast (venue=pull_request; preflight success ≠ landing evidence — the canonical verdict is the merge_group verdict, ADR-0032 (a),(f))"

      # ────────────────────────────────────────────────────────────────
      # [preflight] VS-1 rotation-pin INPUT — org gate `derived-closure`
      # artifact download, PR venue only (verdict stage). Preflight
      # counterpart of the landing download below: the PR-venue producer
      # contract is the 4-FILE set (derived-H.txt, derived-B.txt,
      # pin-H.json, identity.json — the PR-venue producer emits no
      # derived-M.txt; the candidate-delta M leg is landing-only), so this
      # is a DEDICATED staging dir and a dedicated download — the landing
      # leg's 5-file all-or-none loader is NOT reused. Soft download
      # (continue-on-error): a missing/partial artifact must be CLASSIFIED
      # by the judgment step below (::error NOT_ADMIT_ROT_UNPARSED), not
      # die as an unclassified transport error. The caller's verdict job
      # needs: [mint-prepare, closure-deriver, anchor-resolve] — a producer
      # failure propagates here as an absent artifact and is fail-closed
      # by the judgment step. ARTIFACT-ONLY supply: NO local re-derivation
      # fallback exists on this venue (the in-place deriver branch is
      # landing-scoped and stays landing-scoped — VS-1 contract,
      # docs/evidence/rotation_preflight_prereg_2026-10-20.md).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Download derived-closure (VS-1 preflight rotation-pin input — org gate artifact)"
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'preflight'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: derived-closure
          path: .derived-closure-preflight

      # ────────────────────────────────────────────────────────────────
      # [preflight] VS-1 rotation-pin H2 contrast — pin@H vs derived-H,
      # PR venue (verdict stage). Fail-closed ladder (contract:
      # docs/evidence/rotation_preflight_prereg_2026-10-20.md):
      #   L0  artifact contract — all 4 members present and non-empty;
      #       missing/partial/empty → ::error NOT_ADMIT_ROT_UNPARSED
      #       (artifact-only: NO local re-derivation fallback on this
      #       venue).
      #   L1  identity binding — KEYED ON identity.candidateHeadSha,
      #       never a verdict-JSON headSha (no verdict JSON exists on this
      #       venue): 40-hex format, candidateHeadSha == event PR head,
      #       then (bounded by-object H fetch — the same clause-2
      #       object-set shape as the landing L1 leg; inventoried by
      #       tools/ci/git_access_scan.sh) pinHeadBlobSha ==
      #       git rev-parse H:config/trusted_writer_set.json. The pure
      #       equalities deny tampered identities BEFORE any network.
      #   L2  H2 judgment — tools/ci/rotation_pin_anchor_check.nim,
      #       compiled FROM B (workspace root; Gate A: the PR tree is data
      #       only) with the hermetic recipe, run with --derived-H +
      #       --pin-H (--pin-B NOT passed: the checker reads the same
      #       cwd-default pin@B the classification re-reads). Exit 0 →
      #       PASS + rotation-preflight.json evidence; exit 1 → H2 FAIL
      #       classified by the pin@B closure-key predicate (readable pin
      #       WITH trustedCheckerTreeClosure → ::error
      #       NOT_ADMIT_ROT_NEW_PIN; readable pin WITHOUT the key — the
      #       ADR-0025 §7 genesis state → ::error
      #       NOT_ADMIT_ROT_GENESIS_INVALID; unreadable/unparsable →
      #       ::error NOT_ADMIT_ROT_UNPARSED); the checker reason/differing
      #       paths ride every annotation; exit 2 / any other exit →
      #       ::error NOT_ADMIT_ROT_UNPARSED.
      # SCOPE — deliberately UNGATED: fires on EVERY verdict+preflight
      # invocation with NO scope_sl02/scope_sl05 conjunct. A scope
      # conjunct would let an epoch-manifest omission silently skip the
      # rotation contrast — the exact §0.9 skip-the-check hole this gate
      # exists to close; the VS-1 pre-registration fixes the step as
      # unconditional (the download above is provisioning — the ungated
      # class every artifact download in this file belongs to; THIS step
      # is the judgment, and its unconditional firing is the registered
      # contract, not an oversight). Single judgment implementation: the
      # checker is the sole H2 oracle — no workflow-side re-derivation or
      # second judgment exists here.
      # AUTHORITY — Reporter/adapter (AGENTS.md §2.3): a failure REDS the
      # required check (GitHub enforces); a PASS is still PREFLIGHT —
      # never landing evidence — and the landing `ax merge --dry-run`
      # predicate below is byte-identical to its pre-VS-1 form
      # (ADR-0032 (f)).
      # ────────────────────────────────────────────────────────────────
      - name: "[preflight] Rotation-pin H2 contrast (pin@H vs derived-H — VS-1, fail-closed)"
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'preflight'
        env:
          VS1_H: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          VS1_PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          VS1_RUN_ID: ${{ github.run_id }}
          VS1_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ROT_DIR=".derived-closure-preflight"
          ROT_EV="rotation-preflight.json"
          ROT_OUT=""
          ROT_RC=9
          ROT_ICH=""
          ROT_PIN_BLOB=""
          # Annotation + evidence writers — shared by every terminal path,
          # so a RED preflight always leaves (a) the contracted ::error
          # annotation and (b) the rotation-preflight.json evidence the
          # always() upload below carries.
          note() {
            local title="$1" msg="$2" enc
            enc="${msg//'%'/'%25'}"
            enc="${enc//$'\r'/'%0D'}"
            enc="${enc//$'\n'/'%0A'}"
            echo "::error title=${title}::${enc:0:3000}" >&2
          }
          emit_ev() {
            jq -n --arg result "$1" --arg errorClass "$2" \
              --arg candidateHeadSha "$VS1_H" \
              --arg identityCandidateHeadSha "$ROT_ICH" \
              --arg pinHeadBlobSha "$ROT_PIN_BLOB" \
              --arg checkerOutput "$ROT_OUT" \
              --argjson checkerExit "$ROT_RC" \
              --arg prNumber "$VS1_PR_NUMBER" \
              --arg runId "$VS1_RUN_ID" \
              --arg runAttempt "$VS1_RUN_ATTEMPT" \
              '{check:"vs1-rotation-pin-preflight",
                contract:"docs/evidence/rotation_preflight_prereg_2026-10-20.md",
                stage:"verdict", venue:"preflight",
                result:$result, errorClass:$errorClass,
                eventCandidateHeadSha:$candidateHeadSha,
                identityCandidateHeadSha:$identityCandidateHeadSha,
                pinHeadBlobShaAtH:$pinHeadBlobSha,
                checkerExit:$checkerExit, checkerOutput:$checkerOutput,
                prNumber:$prNumber, runId:$runId, runAttempt:$runAttempt}' > "$ROT_EV"
          }
          fail_unparsed() {
            note "NOT_ADMIT_ROT_UNPARSED" "VS-1 rotation-pin preflight: $1 (input contract violation — fail-closed; contract docs/evidence/rotation_preflight_prereg_2026-10-20.md)"
            emit_ev FAIL ROT_UNPARSED
            exit 1
          }
          printf '%s' "$VS1_H" | grep -qE '^[0-9a-f]{40}$' \
            || fail_unparsed "event candidate head '$VS1_H' not a 40-hex OID"
          # L0 — artifact presence + 4-file non-empty contract.
          for rot_f in derived-H.txt derived-B.txt pin-H.json identity.json; do
            [ -s "$ROT_DIR/$rot_f" ] \
              || fail_unparsed "derived-closure member '$rot_f' missing/empty at $ROT_DIR/ (org gate artifact-only supply — NO local re-derivation fallback on the preflight venue)"
          done
          # L1 — identity binding, keyed on identity.candidateHeadSha.
          ROT_ICH="$(jq -er '.candidateHeadSha // ""' "$ROT_DIR/identity.json" 2>/dev/null)" \
            || fail_unparsed "identity.json unparsable or candidateHeadSha absent"
          printf '%s' "$ROT_ICH" | grep -qE '^[0-9a-f]{40}$' \
            || fail_unparsed "identity.candidateHeadSha '$ROT_ICH' not 40-hex"
          [ "$ROT_ICH" = "$VS1_H" ] \
            || fail_unparsed "identity.candidateHeadSha $ROT_ICH != event PR head $VS1_H (wrong-run closure injection — deny)"
          # L1② — bounded by-object H fetch (clause-2 object-set shape;
          # the pure equalities above denied tampered inputs first).
          git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$VS1_H^{commit}" >/dev/null 2>&1 \
            || git -C "$GITHUB_WORKSPACE" fetch --depth=1 --no-tags --force origin "$VS1_H" \
            || fail_unparsed "cannot fetch candidate head $VS1_H by object (git object access)"
          ROT_PIN_BLOB="$(git -C "$GITHUB_WORKSPACE" rev-parse "$VS1_H:config/trusted_writer_set.json")" \
            || fail_unparsed "cannot resolve pin blob oid at $VS1_H:config/trusted_writer_set.json"
          ROT_IPIN="$(jq -er '.pinHeadBlobSha // ""' "$ROT_DIR/identity.json" 2>/dev/null)" \
            || fail_unparsed "identity.json pinHeadBlobSha absent"
          printf '%s' "$ROT_IPIN" | grep -qE '^[0-9a-f]{40}$' \
            || fail_unparsed "identity.pinHeadBlobSha '$ROT_IPIN' not 40-hex"
          [ "$ROT_IPIN" = "$ROT_PIN_BLOB" ] \
            || fail_unparsed "identity.pinHeadBlobSha $ROT_IPIN != blob@H $ROT_PIN_BLOB (pin@H content mismatch — tampered or stale producer — deny)"
          # L2 — compile the checker FROM B (Gate A) and run the H2
          # judgment (single implementation — the checker is the sole H2
          # oracle; --pin-B is NOT passed: the checker reads the same
          # cwd-default pin@B the exit-1 classification below re-reads, so
          # its own code and the annotation class cannot diverge).
          mkdir -p bin
          nim c --hints:off --skipParentCfg --skipProjCfg --path:src \
            -o:bin/rotation_pin_anchor_check tools/ci/rotation_pin_anchor_check.nim \
            || fail_unparsed "rotation_pin_anchor_check compile failed (checker source absent or uncompilable at B)"
          set +e
          ROT_OUT="$(bin/rotation_pin_anchor_check --derived-H "$ROT_DIR/derived-H.txt" --pin-H "$ROT_DIR/pin-H.json" 2>&1)"
          ROT_RC=$?
          set -e
          echo "$ROT_OUT"
          if [ "$ROT_RC" -eq 0 ]; then
            emit_ev PASS NONE
            # Marker discipline (test_admission_venue_split): the file carries
            # exactly TWO preflight verdict lines (attest leg + verdict leg).
            # This step is a contrast INSIDE a preflight-gated step, so its
            # success line must not read as a third verdict — hence the
            # ROTATION-PIN marker below, which is deliberately not the
            # verdict marker token.
            echo "ROTATION-PIN H2 OK — pin@H anchors derived(H) for candidate head ${VS1_H:0:12} (venue=pull_request; preflight success ≠ landing evidence — ADR-0025 §7 / ADR-0032 (f); the rotation admission verdict remains the merge_group authority)"
            exit 0
          fi
          if [ "$ROT_RC" -eq 1 ]; then
            # Exit-1 classification — the SAME pin@B predicate the checker
            # applied to its cwd-default pin-B read (rotation_closure_facts
            # newAnchorVerdict): a READABLE pin file WITHOUT the
            # trustedCheckerTreeClosure key is the genesis state (ADR-0025
            # §7 one-time genesis exception → ROT_GENESIS_INVALID); the key
            # present = a rotation new-pin subject (ROT_NEW_PIN). An
            # unreadable/unparsable workspace pin at classification time is
            # NO class — the checker's exit 1 implies it read pin-B, so a
            # vanished/malformed file here is inconsistent state →
            # UNPARSED (fail-closed, never a guessed class). JSONC line
            # comments stripped exactly like the attest-leg preflight
            # contrast reads the pin.
            ROT_PIN_B="config/trusted_writer_set.json"
            ROT_PIN_STATE="unreadable"
            if [ -f "$ROT_PIN_B" ]; then
              ROT_TWS_STRIPPED="$(sed -E 's|^[[:space:]]*//.*$||' "$ROT_PIN_B")"
              if printf '%s' "$ROT_TWS_STRIPPED" | jq -e . >/dev/null 2>&1; then
                if printf '%s' "$ROT_TWS_STRIPPED" | jq -e 'has("trustedCheckerTreeClosure") and .trustedCheckerTreeClosure != null' >/dev/null 2>&1; then
                  ROT_PIN_STATE="key_present"
                else
                  ROT_PIN_STATE="key_absent"
                fi
              fi
            fi
            case "$ROT_PIN_STATE" in
              key_present)
                note "NOT_ADMIT_ROT_NEW_PIN" "VS-1 rotation-pin H2 FAIL — pin@H diverges from the derived closure at H; pin@B carries a trustedCheckerTreeClosure pin (rotation new-pin subject — the rotation ceremony, not an ordinary PR, is the admission path). checker: ${ROT_OUT:0:900} (fail-closed)"
                emit_ev FAIL ROT_NEW_PIN
                ;;
              key_absent)
                note "NOT_ADMIT_ROT_GENESIS_INVALID" "VS-1 rotation-pin H2 FAIL — pin@H diverges from the derived closure at H and pin@B carries NO trustedCheckerTreeClosure key (genesis state — the one-time genesis exception cannot be established, ADR-0025 §7). checker: ${ROT_OUT:0:900} (fail-closed)"
                emit_ev FAIL ROT_GENESIS_INVALID
                ;;
              *)
                note "NOT_ADMIT_ROT_UNPARSED" "VS-1 rotation-pin preflight: workspace pin@B unreadable/unparsable at exit-1 classification time (checker exit 1 implies it read pin-B — inconsistent workspace state; fail-closed). checker: ${ROT_OUT:0:900}"
                emit_ev FAIL ROT_UNPARSED
                ;;
            esac
            exit 1
          fi
          emit_ev FAIL ROT_UNPARSED
          note "NOT_ADMIT_ROT_UNPARSED" "VS-1 rotation_pin_anchor_check exited $ROT_RC (contract expects 0/1 — input contract violation or unexpected checker failure). checker: ${ROT_OUT:0:900} (fail-closed)"
          exit 1

      # ────────────────────────────────────────────────────────────────
      # [preflight] VS-1 evidence upload — rotation-preflight.json is
      # written by the judgment step on EVERY terminal path (PASS and all
      # three failure classes), so always() carries a RED preflight's
      # evidence to the artifact the failure annotation points at.
      # if-no-files-found: error — an evidence-less judgment terminal
      # (unexpected pre-write abort) is itself a failure, never a quiet
      # skip (§0.9). Identity mirrors the ADR-0027 P2 convention
      # (<candidate head>-<run_attempt>); the step is preflight-scoped, so
      # attempts of one run never collide on the immutable artifact name.
      # ────────────────────────────────────────────────────────────────
      - name: "[preflight] Upload rotation-preflight evidence (VS-1 — always, pass and fail)"
        if: always() && inputs.stage == 'verdict' && steps.venue.outputs.venue == 'preflight'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rotation-preflight-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: rotation-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: "[check] Admission predicate evaluation (MergeAdmissible verdict → check conclusion)"
        # Landing venue only (ADR-0032): the MergeAdmissible evaluation IS a
        # landing-eligibility judgment, so it never runs on the PR preflight
        # venue — there the required check's conclusion is the job's own
        # success over the preflight contrast steps (PREFLIGHT PASS), which
        # certify structure, not admissibility. On merge_group the PR number
        # is RE-DERIVED from the run head's parent2 → its PR (no head_ref
        # string parsing — ADR-0027 P1); an unresolvable PR context =
        # fail-closed deny, never a skip.
        id: admission-predicate
        if: inputs.stage == 'verdict' && steps.slice-engine.outputs.scope_sl08 == 'true' && steps.slice-engine.outputs.scope_sl05 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AXIOM_MAIN_SHA: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # SL-02 identity contract (ADR-0033 §A): the event-frozen candidate
          # head (pull_request.head.sha, or G = merge_group.head_sha on the
          # queue path) and the caller's run attempt — the values every
          # identity.json MUST bind to, checked by the L1 leg below.
          SL02_EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          # #667 rotation-정합 merge: the SUBJECT head resolved at the event
          # boundary (empty on merge_group — the run body re-derives it as
          # the run head's parent2 there). Env-carried per the ADR-0033 §E
          # no-new-tokens contract (quirk Q4): expression interpolation
          # happens before the shell sees the run body.
          SL02_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SL02_REPOSITORY: ${{ github.repository }}
          SL02_RUN_ATTEMPT: ${{ github.run_attempt }}
          # FULL env-carry (2026-10-13 measured, parse-probe oracle 422):
          # GitHub rejects this step's run scalar — "Exceeded max expression
          # length 21000" — once it carries interpolation tokens and exceeds
          # the limit; a tokenless scalar is a plain string and is exempt
          # (tokenless 25k scalar PASS, tokenized 19.3k generation PASS,
          # tokenized 25.9k FAIL — the limit binds only tokenized scalars).
          # Every event-sourced value the run body needs is carried here;
          # the run body must contain ZERO interpolation tokens (ADR-0033 §E
          # no-new-tokens contract, quirk Q4).
          SL02_EVENT_NAME: ${{ github.event_name }}
          SL02_MG_HEAD: ${{ github.event.merge_group.head_sha }}
          SL02_PR_NUMBER: ${{ github.event.pull_request.number }}
          # Candidate-delta tested-landing identity (tree equality against the
          # recomputed landing candidate in the verdict leg below). Carried by
          # the runner-provided GITHUB_SHA default env — the same value as the
          # github.sha context on both admitted events (pull_request head sha
          # / merge_group head sha). ZERO interpolation tokens for this value:
          # not in the run body AND not in this env mapping (ADR-0033 §E
          # no-new-tokens, quirk Q4 — 2026-10-13 measured: the CD_TESTED_SHA
          # env token alone reproduced the 0-job required-workflow dispatch
          # failure; removing it restores parse).
        run: |
          set -euo pipefail
          fail() { echo "[check] FAIL: $1 (run-level err — fail-closed)" >&2; exit 1; }
          # DERIVED_SETS_DIR from the same-run artifact (all-or-none:
          # absent → derive in-place below; partial → fail-closed corrupt;
          # post-gate a transient download loss still fail-closes at the
          # gate verdict because UNSPECIFIED != NORMAL/ROTATION).
          # SL-02 promotion (ADR-0033): the all-or-none set is FIVE files —
          # derived-H.txt, derived-B.txt, derived-M.txt (the candidate-delta
          # leg, ADR-0025 Amendment F), pin-H.json, identity.json. Partial
          # supply (any 1..4) is a run-level err, never a verdict (the
          # consumer cannot distinguish a torn upload from a tampered one —
          # both fail closed). Empty files are rejected in the same breath
          # (빈 아티팩트 위장 금지 — an empty line-file would digest-match an
          # empty re-derivation and read as a valid empty closure).
          DERIVED_SETS_DIR=""
          if [ -d .derived-closure ]; then
            HAVE=0
            for sl02f in derived-H.txt derived-B.txt derived-M.txt pin-H.json identity.json; do
              [ -f ".derived-closure/$sl02f" ] && HAVE=$((HAVE + 1))
            done
            if [ "$HAVE" -eq 5 ]; then
              for sl02f in derived-H.txt derived-B.txt derived-M.txt pin-H.json identity.json; do
                [ -s ".derived-closure/$sl02f" ] || fail "derived-closure/$sl02f is empty (0-byte member — artifact forgery posture, fail-closed)"
              done
              DERIVED_SETS_DIR="$PWD/.derived-closure"
            elif [ "$HAVE" -gt 0 ]; then
              fail "partial derived-closure artifact ($HAVE/5 files — all-or-none contract; SL-02 identity/derivation pair + candidate-delta leg incomplete)"
            fi
          fi
          # SL-02 — event-frozen identities (ADR-0033 §C): the consumer
          # verifies every supplied closure against the run's OWN event
          # fields. H = the run's SUBJECT head (pull_request.head.sha, or
          # the queue run head's parent2 on merge_group — resolved just
          # below per the #667 rotation-정합 merge), B = event base. HEAD is
          # NOT an identity source in this checkout (the workspace root IS
          # B — HEAD == B would mislabel every set).
          H_EVT="${SL02_EVENT_HEAD:-}"
          B_EVT="$AXIOM_MAIN_SHA"
          printf '%s' "$H_EVT" | grep -qE '^[0-9a-f]{40}$' \
            || fail "event candidate head '$H_EVT' not a 40-hex OID (SL02_EVENT_HEAD)"
          printf '%s' "$B_EVT" | grep -qE '^[0-9a-f]{40}$' \
            || fail "event base '$B_EVT' not a 40-hex OID (AXIOM_MAIN_SHA)"
          # Bounded by-object fetch of H (admission-check.yml identity-step
          # precedent — same clause-2 object-set shape: tip commit + full
          # tree graph, no history; inventoried by tools/ci/
          # git_access_scan.sh). Present locally (tests/sandbox, or a prior
          # call) → no network. Runs only where H's OBJECTS are needed
          # (in-place derivation, L1 pin-blob leg, L2) — the pure L1
          # equality checks below deny tampered identities BEFORE any
          # network access.
          sl02_ensure_head_objects() {
            git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$1^{commit}" >/dev/null 2>&1 && return 0
            git -C "$GITHUB_WORKSPACE" fetch --depth=1 --no-tags --force origin "$1" \
              || fail "cannot fetch candidate head $1 by object (git object access — fail-closed)"
          }
          # H := SUBJECT head (ADR-0027 P2 α-split; #667 rotation-정합 merge).
          # pull_request carries it in the payload (SL02_PR_HEAD env);
          # merge_group re-derives it as the run head's parent2 (the PR head
          # inside the trial merge — P1: no head_ref parsing). The pre-#667
          # `rev-parse HEAD` read the B checkout (workspace root = base.sha)
          # and derived H==B — measured 2026-10-10 (canary/SL-02 runs
          # 37957738444·37959399186·37961274738: "derived in-place: H=<B>
          # B=<B>" against a differing headSha) — poisoning set(H) and the
          # rotation anchors. ADR-0033 §C merge re-anchor: H_EVT is RE-BOUND
          # to the subject head below, so the producer sets AND every
          # consumer leg (L1 blob oid, L2 re-derivation, ls-tree) speak the
          # SAME ref on both artifact paths; G remains only the parent2
          # lookup key. 40-hex only here — NO object access: the pure L1
          # equality checks deny tampered identities BEFORE any network.
          H_SHA="${SL02_PR_HEAD:-}"
          if [ -z "$H_SHA" ]; then
            H_SHA="$(gh api "repos/${SL02_REPOSITORY:?}/commits/$H_EVT" --jq '.parents[1].sha' 2>/dev/null || true)"
          fi
          printf '%s' "$H_SHA" | grep -qE '^[0-9a-f]{40}$' \
            || fail "subject head '$H_SHA' not a 40-hex OID (SL02_PR_HEAD / merge_group parent2)"
          H_EVT="$H_SHA"
          if [ -z "${DERIVED_SETS_DIR:-}" ]; then
            # In-place closure derivation (2026-10-09 queue ROT_UNSPECIFIED
            # fix): the org gate's closure-deriver job was retired with the
            # old 5-job DAG, so the `derived-closure` artifact can no longer
            # exist and every verdict fail-closed on UNSPECIFIED. The
            # derivation authority is IN-REPO (ADR C2:
            # tools/ci/derive_checker_closure.nim — git ls-tree/show only,
            # deterministic, fail-closed on UNRESOLVED), so the verdict stage
            # derives the sets itself from the same event-frozen inputs:
            #   H = the SUBJECT head resolved above (SL02_PR_HEAD, or the
            #   run head's parent2 on merge_group — #667 rotation-정합),
            #   B = AXIOM_MAIN_SHA.
            #   SL-02 correction (ADR-0033 §A): the H source is the event-
            #   resolved subject, NOT `git rev-parse HEAD` — the verdict
            #   checkout IS B (base.sha ref), so HEAD == B and a HEAD-sourced
            #   derivation would mislabel B's closure as H's (false
            #   closureEqual → false NORMAL).
            # A deriver failure exits non-zero (fail-closed) — an absent
            # artifact and a failed derivation are indistinguishable to the
            # gate verdict, exactly as the 2.97 contract demands.
            # Subject objects may be absent on merge_group (the trial
            # checkout holds only B) — #667's bounded fetch, depth-50.
            git -C "$GITHUB_WORKSPACE" cat-file -e "$H_EVT^{commit}" 2>/dev/null \
              || git -C "$GITHUB_WORKSPACE" fetch --depth=50 origin "$H_EVT" \
              || fail "subject head $H_EVT not fetchable (fail-closed)"
            # Deriver supply (toolchain-handoff 2026-10-12 — GO scope (a')):
            # bin/derive_checker_closure is NORMALLY the base-artifact member
            # (job1 compiles it from B; the verify step materialized +
            # digest-bound + chmod'd it) — the compile below is the
            # fail-closed FALLBACK for an absent binary, same recipe as job1:
            # determinism contract F1–F3, ADR-0033 §E (B-workspace source +
            # --path:src + --skipParentCfg/--skipProjCfg,
            # runner-pool-acceptance deriver compile recipe verbatim — no user
            # cfg, no nimble path, working-tree imports structurally absent,
            # nim cwd-first resolution). On the landing verdict the toolchain
            # is no longer provisioned, so a missing binary AND a missing
            # compiler both end in the fail below — never a vacuous pass.
            [ -x bin/derive_checker_closure ] \
              || nim c --hints:off --skipParentCfg --skipProjCfg --path:src \
                   -o:bin/derive_checker_closure tools/ci/derive_checker_closure.nim \
                   || fail "deriver supply absent and fallback compile failed (fail-closed)"
            mkdir -p .derived-closure
            bin/derive_checker_closure --ref "$H_EVT" --repo "$GITHUB_WORKSPACE" \
              > .derived-closure/derived-H.txt \
              || fail "closure derivation @H unresolved (fail-closed)"
            bin/derive_checker_closure --ref "$B_EVT" --repo "$GITHUB_WORKSPACE" \
              > .derived-closure/derived-B.txt \
              || fail "closure derivation @B unresolved (fail-closed)"
            # pin-H := the pin file AT H (the rotation new-anchor subject —
            # ④ line-set(pin@H) == set(H)); the workspace root is the B
            # checkout so a plain `cp` would copy the B pin and make ④
            # unverifiable (ROT_NEW_PIN for every genuine rotation).
            # (#667 rotation-정합 merge — supersedes the pre-merge `cp`.)
            git -C "$GITHUB_WORKSPACE" show "$H_EVT:config/trusted_writer_set.json" > .derived-closure/pin-H.json \
              || fail "pin@H copy failed (fail-closed)"
            SL02_PIN_BLOB="$(git -C "$GITHUB_WORKSPACE" rev-parse "$H_EVT:config/trusted_writer_set.json")" \
              || fail "cannot resolve pin blob oid at $H_EVT:config/trusted_writer_set.json"
            jq -n --arg h "$H_EVT" --arg b "$B_EVT" --arg p "$SL02_PIN_BLOB" --argjson a "${SL02_RUN_ATTEMPT:?}" \
              '{candidateHeadSha:$h, baseSha:$b, pinHeadBlobSha:$p, runAttempt:$a}' \
              > .derived-closure/identity.json \
              || fail "identity.json emission failed (fail-closed)"
            DERIVED_SETS_DIR="$PWD/.derived-closure"
            echo "[check] derived-closure derived in-place: H=$H_EVT B=$B_EVT (the candidate-delta M leg is derived + verified in the consumer block below)"
          fi
          if [ -n "${DERIVED_SETS_DIR:-}" ]; then
            [ -d "$DERIVED_SETS_DIR" ] || {
              fail "DERIVED_SETS_DIR is set but not a directory: $DERIVED_SETS_DIR"
            }
            # ────────────────────────────────────────────────────────────
            # SL-02 consumer verification — L1 identifier binding + L2 set
            # completeness (ADR-0033). Extension of the existing verifier
            # (the rotation Pass' own input gate), not a new authority.
            # Every failure below is a RUN-LEVEL err (same class as a
            # verdict-parsing failure) — the consumer never invents a
            # verdict from unverified inputs.
            # ────────────────────────────────────────────────────────────
            # L1 — identity.json binds the supplied closure to THIS run's
            # event-frozen (H, B, pin, attempt):
            #   ① format: all three SHA fields are 40-hex, runAttempt numeric
            #   ② event comparison: candidateHeadSha == H_EVT and baseSha ==
            #      B_EVT byte-equal. H_EVT is the SUBJECT head (ADR-0027 α;
            #      #667 rotation-정합 merge re-anchor): pull_request's head
            #      sha, or on merge_group the queue run head's parent2
            #      (G² — the PR head the certificate binds via continuity
            #      parent2==headSha), re-derived from the event's G above —
            #      the pre-merge candidateHeadSha=G(run identity) anchoring
            #      is superseded: producer and consumer must speak the SAME
            #      derivation ref, and G's trial-merge tree is neither set(H)
            #      nor set(B) whenever the PR touches closure members.
            #   ③ pinHeadBlobSha == git rev-parse "$H:config/trusted_writer_set.json"
            #      (content-addressed blob oid of the pin AT the derivation
            #      ref — the producer cannot alias another tree's pin)
            #   ④ runAttempt == github.run_attempt (the caller's attempt the
            #      org gate forwards — same-number binding, ADR-0027 P2)
            # Mismatch/missing/format error = run-level err (fail-closed).
            # pin@B is NOT carried in identity.json by contract — the
            # consumer reads the B workspace pin directly (single path, no
            # dual supply).
            SL02_ID="$DERIVED_SETS_DIR/identity.json"
            jq -e '(.candidateHeadSha | type == "string") and (.baseSha | type == "string") and (.pinHeadBlobSha | type == "string") and (.runAttempt | type == "number")' \
              "$SL02_ID" >/dev/null 2>&1 \
              || fail "L1: identity.json unparsable or field type mismatch (schema: candidateHeadSha/baseSha/pinHeadBlobSha 40-hex strings + runAttempt number)"
            SL02_ICH="$(jq -er '.candidateHeadSha' "$SL02_ID")" || fail "L1: candidateHeadSha extraction failed"
            SL02_IBase="$(jq -er '.baseSha' "$SL02_ID")" || fail "L1: baseSha extraction failed"
            SL02_IPIN="$(jq -er '.pinHeadBlobSha' "$SL02_ID")" || fail "L1: pinHeadBlobSha extraction failed"
            SL02_IATT="$(jq -er '.runAttempt | tostring' "$SL02_ID")" || fail "L1: runAttempt extraction failed"
            printf '%s' "$SL02_ICH" | grep -qE '^[0-9a-f]{40}$' || fail "L1: candidateHeadSha '$SL02_ICH' not 40-hex"
            printf '%s' "$SL02_IBase" | grep -qE '^[0-9a-f]{40}$' || fail "L1: baseSha '$SL02_IBase' not 40-hex"
            printf '%s' "$SL02_IPIN" | grep -qE '^[0-9a-f]{40}$' || fail "L1: pinHeadBlobSha '$SL02_IPIN' not 40-hex"
            printf '%s' "$SL02_IATT" | grep -qE '^[0-9]+$' || fail "L1: runAttempt '$SL02_IATT' not a non-negative integer"
            [ "$SL02_ICH" = "$H_EVT" ] || fail "L1: identity.candidateHeadSha $SL02_ICH != resolved head $H_EVT (wrong-run closure injection — deny)"
            [ "$SL02_IBase" = "$B_EVT" ] || fail "L1: identity.baseSha $SL02_IBase != event base $B_EVT (wrong-base closure injection — deny)"
            [ "$SL02_IATT" = "$SL02_RUN_ATTEMPT" ] || fail "L1: identity.runAttempt $SL02_IATT != github.run_attempt $SL02_RUN_ATTEMPT (cross-attempt reuse — deny)"
            # L1 ③ needs H's git objects (blob oid at $H_EVT:...) — fetch
            # bounded, only after the pure identity equalities above denied
            # tampered inputs.
            sl02_ensure_head_objects "$H_EVT"
            SL02_PIN_BLOB="$(git -C "$GITHUB_WORKSPACE" rev-parse "$H_EVT:config/trusted_writer_set.json")" \
              || fail "L1: cannot resolve pin blob oid at $H_EVT:config/trusted_writer_set.json"
            [ "$SL02_IPIN" = "$SL02_PIN_BLOB" ] || fail "L1: identity.pinHeadBlobSha $SL02_IPIN != blob@H $SL02_PIN_BLOB (pin@H content mismatch — tampered or stale producer — deny)"
            echo "[check] SL-02 L1 OK — identity binds candidateHeadSha=$H_EVT baseSha=$B_EVT pinHeadBlobSha=${SL02_PIN_BLOB:0:12} runAttempt=$SL02_RUN_ATTEMPT"
            # L2 — set completeness + blob membership (ADR-0033 §B):
            #   ① deriver re-run digest equality: the B-workspace deriver
            #      (same hermetic recipe as the in-place path) re-runs
            #      --ref H and --ref B in THIS run; sha256 of the byte-sorted
            #      lines (trailing newline normalized away — the
            #      proof_reconcile_gate executionClosure canonicalization)
            #      must equal the artifact files' digests. This is the
            #      reconcile lane's oracle-digest cross-check pattern
            #      connected to the verdict step. It detects BOTH missing
            #      and excess members (any set difference changes the
            #      digest).
            #   ② member-wise cross-check: every derived-H.txt line
            #      '<mode> <type> <sha>\t<path>' must be an exact entry of
            #      `git ls-tree -r H` (membership + blob oid). Limitation
            #      stated by contract: this structural check verifies the
            #      lines PRESENT — a member absent from the file is
            #      detectable only by ① (an excess member that IS a valid
            #      tree entry likewise) — ① is the set-equality half, ② is
            #      the per-member blob binding half.
            #   ③ derived-B.txt gets the same digest equality at --ref B.
            # Any failure = run-level err.
            [ -x bin/derive_checker_closure ] \
              || nim c --hints:off --skipParentCfg --skipProjCfg --path:src \
                   -o:bin/derive_checker_closure tools/ci/derive_checker_closure.nim \
                   || fail "L2: deriver compile failed (fail-closed)"
            sl02_digest_of() { printf '%s' "$(LC_ALL=C sort "$1")" | sha256sum | cut -d' ' -f1; }
            bin/derive_checker_closure --ref "$H_EVT" --repo "$GITHUB_WORKSPACE" > .sl02-rederive-H.txt \
              || fail "L2: deriver re-run @H unresolved (fail-closed)"
            [ -s .sl02-rederive-H.txt ] || fail "L2: deriver re-run @H produced empty output (0 미선언 — fail-closed)"
            SL02_DH_ART="$(sl02_digest_of "$DERIVED_SETS_DIR/derived-H.txt")"
            SL02_DH_RUN="$(printf '%s' "$(LC_ALL=C sort .sl02-rederive-H.txt)" | sha256sum | cut -d' ' -f1)"
            [ "$SL02_DH_ART" = "$SL02_DH_RUN" ] || fail "L2①: derived-H digest mismatch — artifact $SL02_DH_ART != in-run re-derivation $SL02_DH_RUN (member loss/excess — deny)"
            bin/derive_checker_closure --ref "$B_EVT" --repo "$GITHUB_WORKSPACE" > .sl02-rederive-B.txt \
              || fail "L2: deriver re-run @B unresolved (fail-closed)"
            [ -s .sl02-rederive-B.txt ] || fail "L2: deriver re-run @B produced empty output (0 미선언 — fail-closed)"
            SL02_DB_ART="$(sl02_digest_of "$DERIVED_SETS_DIR/derived-B.txt")"
            SL02_DB_RUN="$(printf '%s' "$(LC_ALL=C sort .sl02-rederive-B.txt)" | sha256sum | cut -d' ' -f1)"
            [ "$SL02_DB_ART" = "$SL02_DB_RUN" ] || fail "L2③: derived-B digest mismatch — artifact $SL02_DB_ART != in-run re-derivation $SL02_DB_RUN (member loss/excess — deny)"
            git -C "$GITHUB_WORKSPACE" ls-tree -r "$H_EVT" > .sl02-lstree-H.txt \
              || fail "L2: git ls-tree -r $H_EVT failed (fail-closed)"
            SL02_MEMBER_MISS=0
            while IFS= read -r sl02line; do
              [ -z "$sl02line" ] && continue
              grep -qxF "$sl02line" .sl02-lstree-H.txt \
                || { echo "[check] L2②: closure member not in ls-tree(H): $sl02line" >&2; SL02_MEMBER_MISS=1; }
            done < "$DERIVED_SETS_DIR/derived-H.txt"
            [ "$SL02_MEMBER_MISS" -eq 0 ] || fail "L2②: derived-H member(s) not backed by git ls-tree(H) entries (fabricated member — deny)"
            rm -f .sl02-rederive-H.txt .sl02-rederive-B.txt .sl02-lstree-H.txt
            echo "[check] SL-02 L2 OK — H/B digest equality + member blob cross-check passed ($(wc -l < "$DERIVED_SETS_DIR/derived-H.txt" | tr -d ' ') H members)"
            # Gate contract: derived line-files (deriver format
            # '<mode> <type> <sha>\t<path>', byte-sorted) + H-side pin copy.
            export AXIOM_DERIVED_H_PATH="$DERIVED_SETS_DIR/derived-H.txt"
            export AXIOM_DERIVED_B_PATH="$DERIVED_SETS_DIR/derived-B.txt"
            export AXIOM_DERIVED_M_PATH="$DERIVED_SETS_DIR/derived-M.txt"
            export AXIOM_PIN_H_PATH="$DERIVED_SETS_DIR/pin-H.json"
            # ────────────────────────────────────────────────────────────
            # Candidate-delta leg (S2 — ADR-0025 Amendment F, implemented;
            # supersedes the prework AXIOM_CANDIDATE_TREE_M_PATH design
            # comment: the classifier consumes the DERIVED LINE-SET of M,
            # not the raw tree OID):
            #   M := git merge-tree --write-tree B SUBJECT_HEAD, re-derived
            #   IN THIS STAGE (GITHUB_ENV is job-scoped — the attest
            #   identity step's MERGE_CANDIDATE_TREE_OID cannot cross jobs;
            #   the supply posture is the SAME in-place re-derivation as the
            #   derived-closure set above).
            # The re-derivation reuses the deterministic history-fetch
            # contract from the identity step (shallow probe → by-object
            # side tips → bounded 8x64 deepen → rc-first merge-tree), or the
            # shallow B checkout (fetch-depth: 1) re-creates the measured
            # trap: merge-base unresolvable → merge-tree rc=128. The equality
            # against the TESTED landing candidate — tree(github.sha), the
            # attest step's MERGE_TREE_OID identity — is RE-ESTABLISHED here
            # by object: a mismatch/conflict/merge error is a
            # CANDIDATE_TREE_MISMATCH-class run-level err, so the
            # classification input derived(M) can never be absent AND clean
            # (fail-closed; ladder step 1 of Amendment F). Journal codes:
            # CANDIDATE_* only — the ROT_ prefix is reserved for the closure
            # subject class. G's closure is never classified directly — G is
            # the verification COMPARISON target only (Amendment F §5).
            # ────────────────────────────────────────────────────────────
            CD_REPO="$GITHUB_WORKSPACE"
            CD_SHALLOW="$(git -C "$CD_REPO" rev-parse --is-shallow-repository)" \
              || fail "cannot probe shallow state of the verdict workspace (candidate delta — fail-closed)"
            git -C "$CD_REPO" rev-parse --verify --quiet "$B_EVT^{commit}" >/dev/null 2>&1 \
              || git -C "$CD_REPO" fetch --depth=1 --no-tags --force origin "$B_EVT" \
              || fail "cannot fetch base $B_EVT by object (candidate delta — fail-closed)"
            git -C "$CD_REPO" rev-parse --verify --quiet "$H_EVT^{commit}" >/dev/null 2>&1 \
              || git -C "$CD_REPO" fetch --depth=1 --no-tags --force origin "$H_EVT" \
              || fail "cannot fetch subject head $H_EVT by object (candidate delta — fail-closed)"
            CD_RC=0
            CD_M="$(git -C "$CD_REPO" merge-tree --write-tree "$B_EVT" "$H_EVT" 2>/dev/null)" || CD_RC=$?
            if [ "$CD_RC" -eq 128 ]; then
              if [ "$CD_SHALLOW" != "true" ]; then
                fail "CANDIDATE_MERGE_BASE_UNRESOLVED: ancestry($B_EVT, $H_EVT) unresolved on a full clone (unrelated histories or unusable object graph — fail-closed)"
              fi
              CD_ROUND=0
              while [ "$CD_ROUND" -lt 8 ]; do
                git -C "$CD_REPO" fetch --deepen=64 --no-tags --force origin \
                  || fail "CANDIDATE_MERGE_BASE_UNRESOLVED: history deepen fetch failed (round $((CD_ROUND + 1))/8 — fail-closed)"
                CD_SHALLOW="$(git -C "$CD_REPO" rev-parse --is-shallow-repository)" \
                  || fail "cannot probe shallow state of the verdict workspace (candidate delta — fail-closed)"
                CD_RC=0
                CD_M="$(git -C "$CD_REPO" merge-tree --write-tree "$B_EVT" "$H_EVT" 2>/dev/null)" || CD_RC=$?
                [ "$CD_RC" -ne 128 ] && break
                CD_ROUND=$((CD_ROUND + 1))
              done
              [ "$CD_RC" -ne 128 ] || fail "CANDIDATE_MERGE_BASE_UNRESOLVED: ancestry($B_EVT, $H_EVT) unresolved after 8x64-commit deepening (history cap reached — fail-closed)"
            fi
            if [ "$CD_RC" -eq 1 ]; then
              fail "CANDIDATE_TREE_CONFLICT: merge-tree($B_EVT, $H_EVT) reports conflict (rc=1; conflict output not compared — rc-first contract — fail-closed)"
            fi
            [ "$CD_RC" -eq 0 ] || fail "CANDIDATE_TREE_MERGE_ERROR: merge-tree($B_EVT, $H_EVT) rc=$CD_RC (output unspecified per the git merge-tree contract — fail-closed)"
            printf '%s' "$CD_M" | grep -qE '^[0-9a-f]{40}$' \
              || fail "CANDIDATE_TREE_MERGE_ERROR: merge-tree output '$CD_M' not a 40-hex tree OID (fail-closed)"
            CD_TESTED="${GITHUB_SHA}"
            printf '%s' "$CD_TESTED" | grep -qE '^[0-9a-f]{40}$' \
              || fail "tested candidate commit '$CD_TESTED' not a 40-hex OID (GITHUB_SHA — fail-closed)"
            git -C "$CD_REPO" rev-parse --verify --quiet "$CD_TESTED^{commit}" >/dev/null 2>&1 \
              || git -C "$CD_REPO" fetch --depth=1 --no-tags --force origin "$CD_TESTED" \
              || fail "cannot fetch tested candidate commit $CD_TESTED by object (candidate delta — fail-closed)"
            CD_TESTED_TREE="$(git -C "$CD_REPO" rev-parse "$CD_TESTED^{tree}")" \
              || fail "cannot resolve $CD_TESTED^{tree} (tested landing candidate — fail-closed)"
            printf '%s' "$CD_TESTED_TREE" | grep -qE '^[0-9a-f]{40}$' \
              || fail "malformed tested candidate tree OID: $CD_TESTED_TREE (fail-closed)"
            [ "$CD_M" = "$CD_TESTED_TREE" ] \
              || fail "CANDIDATE_TREE_MISMATCH: merge-tree($B_EVT, $H_EVT) tree $CD_M != tested landing candidate tree $CD_TESTED_TREE (candidate identity broken in the verdict stage — fail-closed)"
            # derived(M) — the deriver's THIRD leg (H, B, M — Amendment F):
            # the deriver is handed the raw candidate TREE (--tree mode; M is
            # a tree, not a commit — the ^{commit} peel cannot apply), so the
            # output is the pure function of the verified tree, byte-identical
            # in format to the H/B legs.
            bin/derive_checker_closure --tree "$CD_M" --repo "$GITHUB_WORKSPACE" > .sl02-rederive-M.txt \
              || fail "CANDIDATE_DERIVE_M_UNRESOLVED: closure derivation @candidate tree $CD_M unresolved (fail-closed)"
            [ -s .sl02-rederive-M.txt ] || fail "CANDIDATE_DERIVE_M_UNRESOLVED: deriver @M produced empty output (0 미선언 — fail-closed)"
            if [ -f "$DERIVED_SETS_DIR/derived-M.txt" ]; then
              # Artifact path (all-or-none 5-file set): the supplied
              # derived-M must equal the in-run re-derivation byte-for-byte —
              # the L2① digest cross-check pattern (member loss/excess deny).
              SL02_DM_ART="$(sl02_digest_of "$DERIVED_SETS_DIR/derived-M.txt")"
              SL02_DM_RUN="$(printf '%s' "$(LC_ALL=C sort .sl02-rederive-M.txt)" | sha256sum | cut -d' ' -f1)"
              [ "$SL02_DM_ART" = "$SL02_DM_RUN" ] \
                || fail "CANDIDATE_M_DIGEST_MISMATCH: derived-M artifact $SL02_DM_ART != in-run re-derivation $SL02_DM_RUN (member loss/excess — fail-closed)"
              rm -f .sl02-rederive-M.txt
            else
              # In-place path: THIS run is the derivation authority —
              # materialize the third leg next to H/B.
              mv .sl02-rederive-M.txt "$DERIVED_SETS_DIR/derived-M.txt"
            fi
            echo "[check] candidate-delta leg OK — M=$CD_M == tree($CD_TESTED) verified, derived-M supplied ($(wc -l < "$DERIVED_SETS_DIR/derived-M.txt" | tr -d ' ') members)"
            echo "[check] rotation closure inputs supplied + L1/L2 verified from DERIVED_SETS_DIR=$DERIVED_SETS_DIR"
          else
            echo "[check] DERIVED_SETS_DIR unset — rotation Pass skipped (pre-gate observation)"
          fi
          # PR CONTEXT resolution — pull_request carries its own number;
          # merge_group does not. Re-derive it from the run head's SECOND
          # parent (the PR head inside the merge commit) → that commit's PR
          # (ADR-0027 P1: head_ref string parsing is forbidden). An
          # unresolvable PR context is fail-closed DENY, not a skip: without
          # a PR the predicate cannot evaluate, and a skipped step would let
          # the required check conclude vacuously.
          PR_NUM="${SL02_PR_NUMBER}"
          if [ -z "$PR_NUM" ]; then
            G="${SL02_MG_HEAD}"
            P2="$(gh api "repos/${SL02_REPOSITORY}/commits/$G" --jq '.parents[1].sha' 2>/dev/null || true)"
            if [ -n "$P2" ]; then
              PR_NUM="$(gh api "repos/${SL02_REPOSITORY}/commits/$P2/pulls" --jq '.[0].number' 2>/dev/null || true)"
            fi
          fi
          if ! printf '%s' "${PR_NUM:-}" | grep -Eq '^[0-9]+$'; then
            echo "::error title=NOT_ADMIT_PR_CONTEXT_UNRESOLVED::admission denied — PR context unresolvable (event ${SL02_EVENT_NAME}) (fail-closed deny)" >&2
            echo "[check] FAIL: PR context unresolvable (event ${SL02_EVENT_NAME}) — admission cannot be evaluated (fail-closed deny)" >&2
            exit 1
          fi
          echo "[check] admission PR context resolved: PR #$PR_NUM (event ${SL02_EVENT_NAME})"
          # Certificate SOURCE selection (ADR-0022 §D5-3) — this step is a
          # TRANSPORT ADAPTER, not an authority (§2.3 Authority ≠ Adapter):
          # it decides ONLY whether the artifact was published, never whether
          # it is valid. `--cert` present ⇒ artifact is the source; absent ⇒
          # the side-ref ledger scan stands, byte-identical to the pre-ADR
          # invocation. No head/digest is re-checked here — `ax` re-verifies
          # Ed25519 attestation + headSha binding fail-closed
          # (certificateFactFromPath → bindCertificateSource), so a wrong-head
          # artifact DENIES rather than silently falling back.
          CERT_ARGS=()
          CERT_FILE="$GITHUB_WORKSPACE/.subject-certificate/certificate.json"
          if [ -f "$CERT_FILE" ]; then
            CERT_ARGS=(--cert "$CERT_FILE")
            echo "[check] certificate source = ARTIFACT subject-certificate-${SL02_RUN_ATTEMPT} (--cert $CERT_FILE)"
          else
            echo "[check] certificate source = SIDE-REF LEDGER scan (subject-certificate-${SL02_RUN_ATTEMPT} not published in this run — pre-gate/ordering, ADR-0022 §D5-3 bootstrap path)"
          fi
          # stdout/stderr 분리 수집 후 결합: `--json` stdout은 8192B 버퍼
          # flush 경계에서 잘리고 stderr 로그([INFO]...)는 unbuffered로 같은
          # 파일 offset에 끼어든다 — 2>&1 단일 수집 시 대형 JSON(~9.5KB,
          # rotationCheck.changed 성장, #303)이 중간에서 분할되어 verdict
          # 파서가 "Unfinished string at EOF"로 죽음 (2026-09-28 실측:
          # offset 8192에 [INFO] 삽입, gate verdict 4연속 실패). 별도 파일
          # 수집(stdout = 순수 단일 라인 JSON) 후 순서대로 결합하면
          # interleave가 원천 차단된다. 파일명/아티팩트 컨트랙트 불변.
          "$GITHUB_WORKSPACE/bin/ax" merge "$PR_NUM" --dry-run --json "${CERT_ARGS[@]}" \
            > .admission.stdout 2> .admission.stderr || {
              echo "[check] admission evaluation FAILED (fail-closed) — stderr:"
              tail -n 20 .admission.stderr
              echo "[check] stdout tail:"
              tail -n 5 .admission.stdout
              # Stage 2 observability: a NOT-ADMIT (or run-level) exit still
              # leaves its evidence — assemble the same verdict log the GO
              # path writes, so the always() upload carries it. No judgment
              # semantics change: the exit contract is untouched.
              cat .admission.stdout > admission-verdict.log
              cat .admission.stderr >> admission-verdict.log
              v_rc="$(jq -r '.verdict.reasonCode // empty' .admission.stdout 2>/dev/null || true)"
              if [ -n "$v_rc" ]; then
                echo "::error title=NOT_ADMIT_${v_rc}::admission verdict NOT-ADMIT (reasonCode=${v_rc}) — evidence: admission-verdict artifact" >&2
              else
                echo "::error title=NOT_ADMIT_UNPARSED::admission evaluation failed without a verdict JSON (run-level err) — evidence: admission-verdict artifact" >&2
              fi
              exit 1
            }
          cat .admission.stdout > admission-verdict.log
          cat .admission.stderr >> admission-verdict.log
          tail -n 20 admission-verdict.log
          # Canonical verdict record from the evidence journal (if written).
          if [ -f .axiom/gate_history.jsonl ]; then
            tail -n 5 .axiom/gate_history.jsonl > admission-gate-history.txt || true
          fi
          echo "[check] admission predicate evaluation complete — reached only on verdict GO (a NOT-ADMIT exit exits above)"

      # ── Fail-closed guard: a SKIPPED step inside a running job still lets the
      # job conclude Success (GitHub: skipped JOBS report Success; a skipped
      # STEP under a green job is the scope-skip hole). If the admission
      # predicate was skipped at the landing venue, the required check would go
      # green with NO admissibility judgment at all — deny that state.
      - name: "[check] FAIL-CLOSED guard — admission predicate must not be skipped at the landing venue"
        if: always() && inputs.stage == 'verdict' && steps.venue.outputs.venue == 'landing' && steps.admission-predicate.outcome == 'skipped'
        run: |
          set -euo pipefail
          echo "[check] FAIL: the admission predicate (MergeAdmissible) was SKIPPED on the landing venue (scope flags not true?) — a skipped step reports Success and would vacuously green the required check (fail-closed, 4-class contract upper boundary)." >&2
          exit 1

      # ── Verdict-log evidence. Stage 2: the log is now assembled on BOTH
      # paths — GO (below) and NOT-ADMIT/run-level err (the failure block of
      # the admission-predicate step) — so the upload below runs with
      # always() and a NOT-ADMIT keeps its evidence instead of losing it.
      # Names are unchanged. The content check stays GO-scoped: existence
      # alone is not evidence, the file carries appended stderr, so the
      # check greps the verdict JSON line. Upload name carries run_attempt
      # because artifact v4 is immutable and attempts share run_id
      # (found-2 convention).
      - name: "[check] Verify verdict log content (evidence exists — not merely the file)"
        if: inputs.stage == 'verdict' && steps.venue.outputs.venue == 'landing'
        run: |
          set -euo pipefail
          test -s admission-verdict.log || { echo "[check] FAIL: admission-verdict.log absent/empty after GO (fail-closed)" >&2; exit 1; }
          grep -q '"verdict"' admission-verdict.log || { echo "[check] FAIL: no verdict JSON line in admission-verdict.log (fail-closed)" >&2; exit 1; }

      - name: "[check] Upload verdict log (judge.source evidence, run-bound)"
        # always() (Stage 2): a NOT-ADMIT exits the predicate step red, which
        # would otherwise skip this upload and lose the verdict evidence —
        # the artifact is exactly what the failure annotation points at.
        if: always() && inputs.stage == 'verdict' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-verdict-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: admission-verdict.log
          if-no-files-found: error
          retention-days: 30

      - name: "[check] Upload admission records (witness + verdict)"
        # ATTEST stage. `always()` is retained verbatim: the witness must reach
        # the mint even when the attestation chain itself failed, because the
        # mint — not this workflow — is the authority that judges it. The verdict
        # records named in `path:` are produced by the verdict stage and are
        # therefore simply absent here (`if-no-files-found: warn`, unchanged) —
        # no consumer reads them (the mint's sole inputs are witness.json +
        # witness.sha256, certificate-mint.yml prepare/publish). ADR-0032: the
        # witness artifact is a landing-venue product — the PR preflight mint
        # leg consumes no witness, so this upload is landing-gated too.
        if: always() && inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # ADR-0027 (P2): artifact identity = admission-check-<candidate
          # head>-<run_attempt> (pull_request.head.sha | merge_group.head_sha |
          # github.sha) — the mint's want_name mirrors inputs.headSha, the org
          # gate passes the same expression, so upload and lookup stay equal on
          # BOTH events. The run_attempt suffix is the certificate artifact's
          # `subject-certificate-<run_attempt>` convention: attempts of one run
          # share run_id, so an unsuffixed name makes every re-run publish a
          # second artifact under the same identity and the mint's
          # exactly-one check fails closed with found 2 (evidence:
          # docs/evidence/org_gate_handoff_2026-10-04.md §5).
          # github.run_attempt here is the CALLER run's attempt (called
          # workflow context), which is the value the org gate forwards as
          # runAttempt — both sides of the equality are the same number.
          name: admission-check-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            witness.json
            witness.sha256
            admission-verdict.log
            admission-gate-history.txt
          if-no-files-found: warn
          retention-days: 30
  # ───────────────────────────────────────────────────────────────────────
  # Job 2a — admission INDEPENDENTS (L3 split, 2026-11-04 — pre-registration
  # docs/evidence/l3_go_prereg_2026-11-03.md §7-3). The four attest-stage
  # steps whose inputs provably include NO GO-lane artifact (audit
  # l3_dependency_audit_20261103T083621Z §3, grep-verified): core purity,
  # admission identity re-derivation, D9 evidence staging, subject
  # register. Running them here — parallel to the GO lanes — removes their
  # serial wait from the admission critical path with zero verification
  # semantics change:
  #   * consumed inputs (prereg §2.1): job1's base artifact, Checkout B/H,
  #     the event payload, B's draft + vault manifest. GO-lane outputs: 0.
  #     The added `needs: [build-base-artifacts]` edge is the data
  #     dependency that was always implicit (bin/ax from the artifact).
  #   * value channel (prereg §2.2): the identity/register values the
  #     remaining job's witness chain consumes, promoted to job outputs
  #     (the [independents] export step) — B/H/tree OIDs, SUBJECT_HEAD*,
  #     SUBJECT_ID.
  #   * file channel: the run-scoped artifact
  #     `admission-independents-<candidate head>-<run_attempt>`
  #     (draft-assembled.json + the subject's final evidence record),
  #     SUCCESS-ONLY upload.
  #   * the remaining job re-validates at consumption (prereg §2.3): its
  #     download name re-derives the candidate head + run attempt from
  #     ITS OWN event context, and the run-scoped download binds same-run
  #     — stale/foreign state resolves to a different name and fails
  #     closed.
  # Moved step bodies are BYTE-IDENTICAL (ADR-0032 (e)). witness and every
  # GO-lane consumer stay in `admission-check` — the witness's GO
  # dependency (GO_TESTED_TREE_OID, judgment decisions) is contract-bound,
  # not movable (prereg §2.5). The common provisioning preamble is
  # re-paid here (checkout / slice-engine / toolchain / artifact verify —
  # the registered runner cost, prereg §5): job2a never consumes a
  # GO-lane artifact, so the lane downloads below do NOT exist here.
  # ───────────────────────────────────────────────────────────────────────
  admission-independents:
    needs: [build-base-artifacts]
    # Venue discipline inherited from `admission-check` (prereg §6):
    # `!cancelled()` keeps this job running when build-base-artifacts
    # fails, so the failure lands as THIS job's red (and the remaining
    # job's [guard]) instead of a silent skip; the event whitelist + the
    # copied [venue] step keep unrecognized events fail-closed exit 1.
    # attest-only: the verdict stage consumes none of this job's outputs
    # (its binding is the base artifact manifest, unchanged) — a skip
    # there preserves the current semantics, and the remaining job's
    # [guard] is attest-gated so the skip can never read as failure.
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_call' || github.event_name == 'merge_group') &&
      inputs.stage == 'attest'
    # L3 value channel (prereg §2.2) — the exact 7 values the remaining
    # job consumes (witness chain), all 40/64-hex.
    outputs:
      b: ${{ steps.independents-export.outputs.b }}
      h: ${{ steps.independents-export.outputs.h }}
      head_tree_oid: ${{ steps.independents-export.outputs.head_tree_oid }}
      merge_tree_oid: ${{ steps.independents-export.outputs.merge_tree_oid }}
      subject_head: ${{ steps.independents-export.outputs.subject_head }}
      subject_head_tree_oid: ${{ steps.independents-export.outputs.subject_head_tree_oid }}
      subject_id: ${{ steps.independents-export.outputs.subject_id }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    # Mirrors `admission-check`'s ceiling (judge compile + identity chain;
    # diagnostic median 87s — prereg §1). Budget only — no contract
    # surface rides on it.
    timeout-minutes: 45
    steps:
      # ────────────────────────────────────────────────────────────────
      # [venue] Execution-venue split (ADR-0032) — FIRST step, copied from
      # `admission-check` (L3 prereg §6: the venue fail-closed dispatch is
      # inherited verbatim). pull_request = preflight (this job runs the
      # light identity re-derivation below; the preflight contrast steps
      # live in `admission-check`), merge_group|workflow_call = landing
      # (each moved step's own conjunct gates it). Any other event =
      # fail-closed exit 1.
      # ────────────────────────────────────────────────────────────────
      - name: "[venue] Resolve execution venue (PR=preflight / MG+call=landing)"
        id: venue
        run: |
          set -euo pipefail
          fail() { echo "[venue] FAIL — $1 (fail-closed, ADR-0032)" >&2; exit 1; }
          case "${{ github.event_name }}" in
            pull_request)
              echo "venue=preflight" >> "$GITHUB_OUTPUT"
              echo "[venue] venue=preflight — fast static preflight only; landing verification is the merge_group venue (ADR-0032 (a),(b))"
              ;;
            merge_group|workflow_call)
              echo "venue=landing" >> "$GITHUB_OUTPUT"
              echo "[venue] venue=landing — full canonical verification (ADR-0032 (a))"
              ;;
            *)
              fail "unrecognized event_name '${{ github.event_name }}' — venue undeterminable (no venue, no run)"
              ;;
          esac

      # B checkout at the workspace root = the EXECUTOR tree (policy, vault,
      # data paths, journal — all resolved from B, mirror of the archived
      # witness job's "primary checkout = B (workspace root)").
      - name: "[check] Checkout executor tree = B (base.sha, workspace root)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Stage 2: PR venue consumes inputs.baseSha first (empty on
          # merge_group → the frozen payload expression evaluates unchanged).
          ref: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1

      # ────────────────────────────────────────────────────────────────
      # SLICE ENGINE (job2) — same authority + mapping as job1's
      # slice-engine step. Manifest @B decides which semantic stages of
      # the admission check fire in this epoch (implementedSlices sole
      # authority; per-slice `if:` conditions consume the scope_<slice>
      # outputs below; slice absent = steps DO NOT fire = no executed
      # record — fail-closed for any claim on that slice).
      # ────────────────────────────────────────────────────────────────
      - name: "[slice-engine] Load epoch manifest implementedSlices (B tree — scope authority)"
        id: slice-engine
        run: |
          set -euo pipefail
          fail() { echo "[slice-engine] FAIL — $1 (fail-closed)" >&2; exit 1; }
          B="${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          printf '%s' "$B" | grep -qE '^[0-9a-f]{40}$' || fail "B='$B' not a 40-hex OID"
          MANIFEST="$(git -C "$GITHUB_WORKSPACE" show "$B:config/policy/epoch_manifest.json")" \
            || fail "config/policy/epoch_manifest.json unreadable at B=$B — engine execution scope undeterminable (manifest must land on main with the promotion PR)"
          parsed="$(printf '%s' "$MANIFEST" | jq -e . 2>/dev/null)" \
            || fail "epoch manifest unparsable at B=$B"
          printf '%s' "$parsed" | jq -e '(.ciEpochId? // "") | (type == "string") and (length > 0) and (test("^[A-Za-z0-9][A-Za-z0-9._+-]*$"))' >/dev/null \
            || fail "ciEpochId missing/malformed at B=$B"
          printf '%s' "$parsed" | jq -e '(.implementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "implementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e '(.notYetImplementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "notYetImplementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e 'all(.implementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "implementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e 'all(.notYetImplementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "notYetImplementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e '(([.implementedSlices[]] - [.notYetImplementedSlices[]]) | length) == (.implementedSlices | length)' >/dev/null \
            || fail "implementedSlices ∩ notYetImplementedSlices ≠ ∅ at B=$B"
          printf '%s' "$parsed" | jq -e '(.productionExecutionPin? // "") | (type == "string") and (length > 0)' >/dev/null \
            || fail "productionExecutionPin missing/empty at B=$B"
          printf '%s' "$parsed" | jq -e '((.mode? // "") as $m | ($m == "ci-migration") or ($m == "normal"))' >/dev/null \
            || fail "mode must be 'ci-migration' or 'normal' at B=$B"
          EPOCH="$(printf '%s' "$parsed" | jq -r '.ciEpochId')"
          IMPL="$(printf '%s' "$parsed" | jq -c '.implementedSlices')"
          echo "epoch_id=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "implemented_slices=$IMPL" >> "$GITHUB_OUTPUT"
          # Interim stage↔slice mapping (Q0 Semantic Slice Catalog; reconcile
          # with src/gate/slice_catalog.nim verificationSteps after it lands):
          #   SL-08 B/H binding → manifest verify below
          #   SL-01 identity    → admission identity re-derivation
          #   SL-02 closure     → derived-closure load
          #   SL-03 evidence    → D9 staging + subject + witness
          #   SL-05 verdict     → predicate evaluation (dry-run)
          #   SL-15 cas-reuse   → evidence-record emission + CAS env arming
          #                       (attest stage only)
          # NOTE: id regex allows SL-NN and SL-NNNN — SL-0713 is a SINGLE
          # catalog entry (SL-07 + SL-13 merged); 4-digit ids are valid.
          RPT="[slice-engine] epoch=$EPOCH implemented=$IMPL"
          for spec in "sl08=SL-08" "sl01=SL-01" "sl02=SL-02" "sl03=SL-03" "sl05=SL-05" "sl15=SL-15"; do
            key="${spec%%=*}"
            slice="${spec##*=}"
            if printf '%s' "$parsed" | jq -e --arg s "$slice" '.implementedSlices | index($s) != null' >/dev/null 2>&1; then
              echo "scope_$key=true" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=fire"
            else
              echo "scope_$key=false" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=NO-FIRE"
            fi
          done
          echo "$RPT"

      # provision-scope is STAGE-GATED, not static. The ATTEST stage builds
      # bin/core_purity_gate from B (`make bin/core_purity_gate`) and needs
      # scope=full. The verdict leg at the LANDING venue no longer provisions
      # at all (toolchain-handoff 2026-10-12 — docs/evidence/
      # verdict_payload_gate_2026-10-12.md GO scope (a')): its entire A-layer
      # consumption was the deriver compiler (nim c) + jq, and both now travel
      # in the base artifact — job1 compiles bin/derive_checker_closure from B
      # with the same hermetic recipe and pins jq 1.7.1, and the artifact
      # manifest verify below materializes + digest-binds both. The landing
      # verdict provisions only SYSTEM deps (pinned jq + libpcre3 — the two
      # steps before the slice engine). The preflight venue keeps provisioning
      # (its contrast steps consume jq before any artifact exists), and the
      # attest half stays the build site. Do NOT flatten this to the static
      # certificate-mint idiom.
      - uses: ./.github/actions/setup-axiom-toolchain
        if: inputs.stage == 'attest' || steps.venue.outputs.venue == 'preflight'
        with:
          cache-save-enabled: 'false'
          cache-build-source: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          provision-scope: 'full'

      # ────────────────────────────────────────────────────────────────
      # `_candidate/` = PR head (H) checkout, consumed as DATA ONLY —
      # "DATA SOURCE ONLY: no make/gate/build/script execution ever runs from the H tree."
      # The B-built verifier reads the H tree state (tree OID, funcSource
      # bytes) but no script, Makefile, gate, or build ever executes from
      # this tree (archived witness-rule verbatim).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Checkout candidate = H (PR head / merge-group head, data-only path)"
        # ATTEST stage only — the H tree is an input to identity re-derivation
        # and D9 staging. The verdict stage evaluates `ax merge` against the B
        # tree and the published artifacts; it reads nothing from H.
        if: inputs.stage == 'attest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ADR-0027 (P2): candidate head = PR head sha, or on merge_group the
          # merge-group head sha (H := G — github.sha == the queue commit).
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: _candidate
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: "[check] Download base-built artifacts (B bin/ax + ircheck)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-check-base-artifacts
          # STAGING dir, NOT the workspace root: bin/gate_hook·
          # bin/precompile_gates are FALLBACK supply — the B-layer restore
          # above may already hold fingerprint-verified copies and a root
          # extraction would clobber them (cache = first supply, artifact =
          # fallback; J3 acceleration). The verify step below materializes
          # the staged files into their canonical paths.
          path: _base-artifacts

      # Layout note: the artifact stages into _base-artifacts and the verify
      # step materializes it into the workspace ROOT, so the attest chain
      # still finds ircheck at the CWD-relative canonical path
      # proofs/.lake/build/bin/ircheck (extraction_agreement.nim falls back to
      # <projectRoot>/proofs/.lake/build/bin/ircheck with CWD = B tree).
      - name: "[check] Verify artifact manifest (fail-closed — build_sha == B)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          EXPECT_BUILD_SHA: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Materialize the staged artifact into the workspace layout (same
          # final paths as the former workspace-root extraction).
          test -f _base-artifacts/manifest.txt || { echo "FAIL: manifest.txt missing in downloaded artifact"; exit 1; }
          mkdir -p bin proofs/.lake/build/bin
          mv -f _base-artifacts/manifest.txt manifest.txt
          mv -f _base-artifacts/bin/ax _base-artifacts/bin/install_ax_cas bin/
          mv -f _base-artifacts/proofs/.lake/build/bin/ircheck proofs/.lake/build/bin/ircheck
          # Verdict-predicate payload members (toolchain-handoff 2026-10-12):
          # on the landing verdict these ARE the supply — the toolchain action
          # is skipped there, so an absent member fails here (fail-closed)
          # instead of surfacing later as "nim: command not found". On attest
          # they ride along harmlessly (the attest chain never executes them;
          # job1 produced them in both S5 supply modes). mv overwrites the
          # pinned copy the early provisioning step fetched — same pinned
          # bytes, and the manifest loop below digest-binds the final state.
          mv -f _base-artifacts/bin/derive_checker_closure _base-artifacts/bin/jq bin/
          # Gate binaries (members of the attest 6-binary set): the artifact
          # is the FALLBACK supply. A valid B-restore leaves its copies in
          # place — restored bytes win and the artifact copy is withheld
          # (cp -n semantics via the existence check); a B-restore MISS and
          # the B-verify discard path (setup-axiom-toolchain discard_b) both
          # leave them absent, and the artifact copy closes the supply. The
          # manifest loop below digest-binds whichever source supplied each
          # file, so the attest kernel never runs an unverified binary.
          for g in gate_hook precompile_gates; do
            if [ -f "bin/$g" ]; then
              echo "gate supply: bin/$g already present (B-restore — artifact copy withheld)"
            else
              test -f "_base-artifacts/bin/$g" \
                || { echo "FAIL: bin/$g absent from B-restore AND base artifact (no supply — fail-closed)"; exit 1; }
              cp "_base-artifacts/bin/$g" "bin/$g"
              echo "gate supply: bin/$g from base artifact (B-restore absent)"
            fi
          done
          rm -rf _base-artifacts
          while IFS=$'\t' read -r f expect; do
            test -f "$f" || { echo "FAIL: artifact file missing: $f"; exit 1; }
            actual=$(sha256sum "$f" | awk '{print $1}')
            if [ "$actual" != "$expect" ]; then
              echo "FAIL: sha256 mismatch for $f (manifest=$expect actual=$actual)"
              exit 1
            fi
            echo "OK: $f (B-built)"
          done < <(awk '/^[0-9a-f]{64}[[:space:]]{2}/{print $2 "\t" $1}' manifest.txt)
          expect_sha=$(awk -F' = ' '/^build_sha =/{print $2; exit}' manifest.txt)
          if [ -z "$expect_sha" ] || [ "$expect_sha" != "$EXPECT_BUILD_SHA" ]; then
            echo "FAIL: manifest build_sha=$expect_sha != B=$EXPECT_BUILD_SHA (verifier is NOT base-built — Gate A violation)"
            exit 1
          fi
          # upload/download-artifact@v4 drops unix executable bits — restore
          # them before any execution (bin/ax, CAS installer, attest kernel,
          # gate binaries — artifact-sourced copies arrive non-executable).
          chmod +x bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck bin/gate_hook bin/precompile_gates bin/derive_checker_closure bin/jq
          echo "MANIFEST VERIFIED: verifier is built from B=$EXPECT_BUILD_SHA"

      # ────────────────────────────────────────────────────────────────
      # Core purity — src/core may not carry unapproved side effects
      # (file/process I/O, console output) nor effect-system escapes that
      # conceal them. Authority split, mirroring Gate A above:
      #   judge  = BUILT FROM B (workspace root = base checkout)
      #   policy = B's data/core_purity_baseline.json (grandfather anchors)
      #   payload= `_candidate/` (H) — read as DATA ONLY, never executed
      # Attest stage only: the H checkout exists solely in this stage. A
      # non-zero exit fails this job → the org gate's `attest` reusable
      # workflow call result != 'success' → aggregate `admission-check`
      # exits 1 → required check FAIL → merge blocked (fail-closed).
      # B without the judge is a FAIL, never a head build: a PR must never
      # grade itself with a judge it ships.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Core purity gate (B-built judge on _candidate tree)"
        if: inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing'
        env:
          CANDIDATE_TREE: ${{ github.workspace }}/_candidate
        run: |
          set -euo pipefail
          fail() { echo "[core-purity] FAIL — $1 (fail-closed)" >&2; exit 1; }
          [ -d "$CANDIDATE_TREE/src/core" ] \
            || fail "candidate tree has no src/core at $CANDIDATE_TREE (attest stage must check out H)"
          test -f tools/ci/core_purity_gate.nim \
            || fail "gate source absent at B (base carries no judge — never build the judge from H)"
          test -f data/core_purity_baseline.json \
            || fail "grandfather baseline absent at B"
          make bin/core_purity_gate >/dev/null || fail "judge build from B failed"
          test -x bin/core_purity_gate || fail "judge binary missing after build"
          bin/core_purity_gate --tree "$CANDIDATE_TREE" \
            || fail "candidate tree carries a new unapproved core side effect"
          echo "[core-purity] PASS — candidate tree carries no new unapproved side effect"

      # ────────────────────────────────────────────────────────────────
      # Root layout — Filesystem Contract V2 closed-by-default root
      # classification (docs/spec/filesystem_contract.md §6 Enforcement
      # Scope: this blocks ADMISSION, never a local write). Authority
      # split mirrors the core purity gate above:
      #   judge  = BUILT FROM B's tracked source (validator binary + its
      #            sandboxed test battery). The bare `make
      #            validate-root-layout` (CWD-root judgment) is NOT run
      #            here: the attest workspace stages its own evidence at
      #            the root (manifest.txt, _candidate/) and a CWD-root
      #            judgment fail-closes on the job's own artifacts
      #            (docs/spec/admission_workspace_pollution_quirk.md);
      #            the bare-root verdict belongs to surfaces that own a
      #            clean tree (local GATES_FAST, pre-push OID snapshot).
      #            A PR never grades itself with a judge it ships.
      #   payload= `_candidate/` (H) — validated as DATA ONLY via --root.
      #            On merge_group H := G (the queue merge commit), so the
      #            tree this gate validates IS the tree that lands.
      # Attest stage + landing venue only (the H checkout exists solely in
      # this stage; the PR preflight venue keeps its light static contrast).
      # Pre-introduction skip (loud), same idiom as check-git-access /
      # check-epoch-transaction: a B predating the VS-1 tracked-content
      # classification cannot judge its own tracked ci/·experiments/·
      # _lto_evidence/ (the old validator marks them UNKNOWN) — the
      # closed-by-default root-layout invariant applies from its
      # introducing commit onward.
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Root layout gate (B-built judge + H payload — Filesystem Contract V2)"
        if: inputs.stage == 'attest' && steps.venue.outputs.venue == 'landing'
        env:
          CANDIDATE_TREE: ${{ github.workspace }}/_candidate
        run: |
          set -euo pipefail
          fail() { echo "[root-layout] FAIL — $1 (fail-closed)" >&2; exit 1; }
          [ -d "$CANDIDATE_TREE" ] \
            || fail "candidate tree missing at $CANDIDATE_TREE (attest stage must check out H)"
          test -f tools/ci/validate_root_manifest.nim \
            || fail "gate source absent at B (base carries no judge — never build the judge from H)"
          if ! grep -q '_lto_evidence' tools/ci/validate_root_manifest.nim; then
            echo "[root-layout] SKIP (loud): V2 tracked-content classification absent at B (pre-VS-1 base) — the closed-by-default root-layout invariant applies from its introducing commit onward"
          else
            mkdir -p build
            nim c --hints:off -o:bin/validate_root_manifest tools/ci/validate_root_manifest.nim \
              || fail "judge build failed at the B executor tree"
            nim c --hints:off -o:build/validate_root_manifest_test tools/tests/validate_root_manifest_test.nim \
              || fail "test battery build failed at the B executor tree"
            AXIOM_PROJECT_ROOT="$GITHUB_WORKSPACE" build/validate_root_manifest_test \
              || fail "root-layout test battery failed at the B executor tree"
            test -x bin/validate_root_manifest || fail "judge binary missing after build"
            bin/validate_root_manifest --root "$CANDIDATE_TREE" \
              || fail "candidate tree violates Filesystem Contract V2 (closed-by-default root layout)"
            echo "[root-layout] PASS — B executor (judge + test battery) + H candidate closed-by-default root layout"
          fi

      # ────────────────────────────────────────────────────────────────
      # Admission identity — B/H re-derivation from the trusted PR API
      # (data comparison only; archived witness (2b) pattern). The event
      # payload's head.sha is re-confirmed against the PR object:
      # head.sha == H ∧ base.ref == main (base moved → fail-closed), plus —
      # Stage 2 — the orchestrator's run-scoped anchor: baseSha input
      # non-empty (PR venue) ⇒ B == inputs.baseSha (B* binding). The PR-API
      # base.sha equality was removed: with B and the snapshot both possibly
      # stale it proved nothing; base.sha is recorded, never re-queried as an
      # anchor source. H tree OID is re-derived from `_candidate/` locally
      # (never trusted from any artifact). The MERGE-candidate tree OID is
      # derived from the merge ref OBJECT (`tree(github.sha)` — github.sha IS
      # the test merge commit for pull_request events) mirroring the org gate's
      # tree-identity job by-object resolution, then recorded in the witness
      # provenance (`mergeTreeDigest`) so the mint can fail-closed cross-check
      # `witness.mergeTreeDigest == tree(mergeSha)` before certTree is signed
      # (identity chain: testedTree == mergeTree == certTree, ADR-0025 §11).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Re-derive admission identity (B/H/treeOID — fail-closed)"
        if: inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl01 == 'true'
        id: identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          # Stage 2: the orchestrator's run-scoped anchor B* (empty when the
          # caller does not pass it — legacy behavior preserved).
          BASE_SHA_INPUT: ${{ inputs.baseSha }}
        run: |
          set -euo pipefail
          # Annotation upgrade (Stage 2 observability): every fail emits a
          # ::error with the stable code (CANDIDATE_* / ANCHOR_INPUT_MISMATCH
          # when the message carries one, ADM_IDENTITY otherwise) in addition
          # to the historical stderr line. Judgment semantics unchanged.
          fail() {
            local msg="$1" code="ADM_IDENTITY" enc
            case "$msg" in
              CANDIDATE_*|ANCHOR_INPUT_MISMATCH:*) code="${msg%%:*}" ;;
            esac
            enc="${msg//'%'/'%25'}"
            enc="${enc//$'\r'/'%0D'}"
            enc="${enc//$'\n'/'%0A'}"
            echo "::error title=$code::ADM_IDENTITY FAIL — $enc (fail-closed)" >&2
            echo "ADM_IDENTITY: FAIL — $msg (fail-closed)" >&2
            exit 1
          }
          # ── Candidate-fetch credential transport (helper) ────────────────
          # The `_candidate` checkout is provisioned with
          # persist-credentials: false → its OWN git config carries NO
          # credentials, so an `origin` fetch issued from it fails with
          # "fatal: could not read Username for 'https://github.com': No
          # such device or address" (measured: run 39429432875, job
          # 118650919196, step "[check] Re-derive admission identity" →
          # ADM_IDENTITY — every PR/merge-group lane stalled).
          # The B checkout at the workspace root keeps the default
          # credential persistence, so ITS local config holds the runner's
          # http.https://github.com/.extraheader. The header is transported
          # EPHEMERALLY: `git -c` injects it into the single fetch process
          # only — it is never written into the candidate repository's
          # config, never echoed, never logged, and the candidate checkout
          # keeps persist-credentials: false (the credential-free candidate
          # invariant is preserved, not weakened).
          cand_fetch() {
            local repo="$1" hdr
            shift
            hdr="$(git -C "$GITHUB_WORKSPACE" config --get 'http.https://github.com/.extraheader' || true)"
            if [ -n "$hdr" ]; then
              git -C "$repo" -c "http.https://github.com/.extraheader=$hdr" fetch "$@"
            else
              git -C "$repo" fetch "$@"
            fi
          }
          # ADR-0027 (P2): event-neutral B/H — pull_request payload, or the
          # merge_group payload (H := G on merge_group — the queue commit).
          # Stage 2: on the PR venue the orchestrator-supplied run-scoped
          # anchor inputs.baseSha is consumed FIRST; the payload remains the
          # fallback (empty input evaluates to the payload term unchanged).
          B="${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          H="${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
          printf '%s' "$B" | grep -qE '^[0-9a-f]{40}$' || fail "B='$B' not a 40-hex OID"
          printf '%s' "$H" | grep -qE '^[0-9a-f]{40}$' || fail "H='$H' not a 40-hex OID"
          [ -d "$GITHUB_WORKSPACE/_candidate/.git" ] || fail "_candidate checkout missing"
          if [ "$PR_NUMBER" = "0" ]; then
            # ADR-0027 (P1): merge_group path — no PR object exists (N=0 honest
            # value); the PR-API leg is N=0-invalid by construction. Identity
            # source = the event payload (server-derived): base.ref from
            # merge_group.base_ref, B as derived above. H is the RUN/CANDIDATE
            # head (= G — the merge-group commit that gets tested and lands);
            # the cert SUBJECT head is derived separately below (α split).
            head_sha="$H"
            base_sha="$B"
            base_ref="${{ github.event.merge_group.base_ref }}"
            base_ref="${base_ref#refs/heads/}"  # full ref → bare — merge_group.base_ref is a FULL ref
            [ "$base_ref" = "main" ] || fail "merge_group.base_ref '$base_ref' != main (base moved — new admission needed)"
          else
            pr="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" \
              || fail "GET pulls/$PR_NUMBER failed"
            head_sha="$(printf '%s' "$pr" | jq -r '.head.sha')"
            base_sha="$(printf '%s' "$pr" | jq -r '.base.sha')"
            base_ref="$(printf '%s' "$pr" | jq -r '.base.ref')"
            [ "$head_sha" = "$H" ] || fail "PR head.sha $head_sha != H $H (PR API trusted source)"
            [ "$base_ref" = "main" ] || fail "PR base.ref '$base_ref' != main (base moved — new admission needed)"
            # Stage 2: the PR-API base.sha == B equality is REMOVED — with the
            # event-frozen B and the PR-API snapshot both possibly stale, that
            # equality no longer proves base freshness (defeatable when both
            # sides agree on an old base). Instead the orchestrator-supplied
            # run-scoped anchor B* (resolved from the LIVE main ref before
            # dispatch) is asserted against the resolved anchor when present.
            # The snapshot is recorded for the journal; it is a non-input
            # (ADR-0027 P4). Residual staleness after B* resolution stays
            # fail-closed via GitHub strict-check invalidation + the documented
            # recovery cycle.
            echo "ADM_IDENTITY: PR API base.sha=$base_sha recorded (non-input — ADR-0027 P4)"
            if [ -n "$BASE_SHA_INPUT" ]; then
              [ "$B" = "$BASE_SHA_INPUT" ] \
                || fail "ANCHOR_INPUT_MISMATCH: resolved anchor B=$B != orchestrator baseSha $BASE_SHA_INPUT (run-scoped single-resolved B* — fail-closed)"
            fi
          fi
          HEAD_TREE_OID="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse 'HEAD^{tree}')" \
            || fail "cannot re-derive H tree OID"
          printf '%s' "$HEAD_TREE_OID" | grep -qE '^[0-9a-f]{40}$' \
            || fail "malformed H tree OID: $HEAD_TREE_OID"
          # Merge-candidate tree (identity chain, ADR-0025 §11): github.sha for
          # pull_request events IS the test merge ref (B⊕H) — the exact landing
          # candidate tree. Mirror of the org gate's tree-identity job
          # (Archright/.github admission-gate.yml): mergeTree = tree(github.sha)
          # resolved BY OBJECT (`git rev-parse $SHA^{tree}`) — never by re-reading
          # the mutable refs/pull/N/merge. The depth-1 B/H checkouts do not
          # contain the merge commit object, so it is fetched depth-1-BOUNDED by
          # OBJECT SHA (same object-set shape as a depth-1 checkout: tip commit +
          # its full tree graph — the L3-d1 clause-2 object set for this added
          # git access; inventoried by tools/ci/git_access_scan.sh, breakers: 0).
          MERGE_SHA="${{ github.sha }}"
          printf '%s' "$MERGE_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "github.sha '$MERGE_SHA' not a 40-hex OID"
          cand_fetch "$GITHUB_WORKSPACE/_candidate" --depth=1 --no-tags --force origin "$MERGE_SHA" \
            || fail "cannot fetch merge-candidate commit $MERGE_SHA (test-merge object missing — fail-closed)"
          MERGE_TREE_OID="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse "$MERGE_SHA^{tree}")" \
            || fail "cannot resolve $MERGE_SHA^{tree}"
          printf '%s' "$MERGE_TREE_OID" | grep -qE '^[0-9a-f]{40}$' \
            || fail "malformed merge-candidate tree OID: $MERGE_TREE_OID"
          # ADR-0027 α subject identity (probe: docs/evidence/
          # merge_queue_probe_2026-09-29.md — measured runs 1/2, 2/2):
          # GitHub's merge queue LANDS the merge-group commit G itself
          # (L == G, tree(L) == tree(G)) with parents(G) = [base_sha, PR head].
          # The cert subject (B, headSha, headTreeDigest) therefore binds the
          # PR head H_PR — NOT G — else C1 continuity's parent2 == cert.headSha
          # fails at E7 (cert.headSha := G ⇒ parent2 == G ≠ H_PR). Split:
          #   * H / MERGE_SHA / MERGE_TREE_OID = RUN/CANDIDATE identity (G) —
          #     checkout, execution, mergeTree == certTree chain (unchanged)
          #   * SUBJECT_HEAD := G^2 (H_PR), SUBJECT_HEAD_TREE_OID := tree(G^2),
          #     G^1 == B cross-check — SUBJECT identity (cert/evidence)
          # Read BY OBJECT via the Git Data API (parents of a commit object
          # are object identities — never the mutable refs; same trust
          # argument as the merge-tree chain; no git history access — the
          # parent fetch below is depth-1-BOUNDED by object SHA, the same
          # clause-2 object-set shape as the merge-tree fetch above).
          # Fewer than 2 parents = the α-shape assumption broke →
          # fail-closed (mechanized γ detector).
          if [ "$PR_NUMBER" = "0" ]; then
            commit_obj="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$MERGE_SHA")" \
              || fail "GET git/commits/$MERGE_SHA failed — merge-group commit object unresolvable"
            n_par="$(printf '%s' "$commit_obj" | jq '.parents | length')" \
              || fail "cannot parse parents of $MERGE_SHA (fail-closed)"
            [ "$n_par" = "2" ] || fail "SUBJECT_HEAD: merge-group commit $MERGE_SHA has $n_par parent(s), expected exactly 2 ([base, PR head]) — α-shape broken (ADR-0027; probe docs/evidence/merge_queue_probe_2026-09-29.md) (fail-closed)"
            SUBJECT_HEAD="$(printf '%s' "$commit_obj" | jq -r '.parents[1].sha // empty')" \
              || fail "cannot parse G^2 of $MERGE_SHA (fail-closed)"
            printf '%s' "$SUBJECT_HEAD" | grep -qE '^[0-9a-f]{40}$' \
              || fail "SUBJECT_HEAD '$SUBJECT_HEAD' not a 40-hex OID (G^2)"
            g_base="$(printf '%s' "$commit_obj" | jq -r '.parents[0].sha // empty')" \
              || fail "cannot parse G^1 of $MERGE_SHA (fail-closed)"
            [ "$g_base" = "$B" ] || fail "SUBJECT_HEAD: G^1 '$g_base' != B '$B' (merge-group base mismatch — fail-closed)"
            cand_fetch "$GITHUB_WORKSPACE/_candidate" --depth=1 --no-tags --force origin "$SUBJECT_HEAD" \
              || fail "cannot fetch subject head $SUBJECT_HEAD by object (fail-closed)"
            SUBJECT_HEAD_TREE_OID="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse "$SUBJECT_HEAD^{tree}")" \
              || fail "cannot resolve $SUBJECT_HEAD^{tree}"
            printf '%s' "$SUBJECT_HEAD_TREE_OID" | grep -qE '^[0-9a-f]{40}$' \
              || fail "malformed subject-head tree OID: $SUBJECT_HEAD_TREE_OID"
          else
            # pull_request path: subject head == PR head == candidate head.
            SUBJECT_HEAD="$H"
            SUBJECT_HEAD_TREE_OID="$HEAD_TREE_OID"
          fi
          # ────────────────────────────────────────────────────────────────
          # Candidate-tree identity (candidate-delta admission prework):
          #   M := git merge-tree --write-tree B SUBJECT_HEAD
          # MUST equal MERGE_TREE_OID == tree(github.sha) — the tree this run
          # actually tested (and the mint re-derives at (3b)). On merge_group
          # the subject head is G^2, so this is the NON-VACUOUS form:
          # merge-tree(B, G) would be a tautology (B is G's first parent —
          # the result is tree(G) for free), which is why the check runs
          # AFTER the α-split, not at the MERGE_TREE_OID resolution above.
          # merge-tree needs merge-base(B, SUBJECT_HEAD), and the depth-1
          # fetches above graft BOTH tips — measured (git 2.43): merge-base
          # exits 1 with empty output and merge-tree exits 128 ("refusing to
          # merge unrelated histories"). The deterministic history-fetch
          # contract below makes that state unreachable before the
          # merge-tree call:
          #   (a) shallow probe — `git rev-parse --is-shallow-repository`,
          #       explicit, never inferred.
          #   (b) side objects — B and SUBJECT_HEAD commit objects ensured BY
          #       OBJECT (depth-1; the same clause-2 object-set shape as the
          #       fetches above). A missing side object makes merge-tree exit
          #       rc=1 with an argument-error line on stdout (measured) —
          #       indistinguishable from a real conflict by rc alone — so
          #       object presence is asserted BEFORE any rc interpretation.
          #   (c) ancestry — the merge-tree rc is the ancestry gate. No
          #       separate ancestry probe: an explicit ancestry-walk command
          #       is a git_access_scan clause-1 breaker and adds no
          #       information — merge-tree computes the merge base itself and
          #       reports unresolvable ancestry as rc=128 (measured on
          #       grafted tips, git 2.43). rc=128 on a shallow repo →
          #       bounded deterministic deepening: `git fetch --deepen=64`,
          #       re-probe, at most 8 rounds (fixed constants — the
          #       procedure is a fixed function of repository state: same
          #       inputs → same outcome, success or explicit failure). Still
          #       rc=128 → CANDIDATE_MERGE_BASE_UNRESOLVED. rc=128 on a FULL
          #       clone = genuinely unrelated histories → the same fail, no
          #       deepening attempted.
          #   (d) merge-tree rc-first contract: 0 = clean (stdout is the tree
          #       OID), 1 = conflict (fail — the conflict output is NEVER
          #       compared), other = fail (output unspecified per the git
          #       merge-tree contract).
          #   (e) equality — M == MERGE_TREE_OID else CANDIDATE_TREE_MISMATCH
          #       (the tested tree is not the recomputed landing candidate —
          #       identity chain broken).
          # Journal codes: CANDIDATE_* only. The ROT_ prefix is reserved for
          # the closure-subject class (merge_cli rotation verdicts) and is
          # not used here.
          # ────────────────────────────────────────────────────────────────
          CAND_REPO="$GITHUB_WORKSPACE/_candidate"
          CAND_SHALLOW="$(git -C "$CAND_REPO" rev-parse --is-shallow-repository)" \
            || fail "cannot probe shallow state of _candidate (fail-closed)"
          git -C "$CAND_REPO" rev-parse --verify --quiet "$B^{commit}" >/dev/null 2>&1 \
            || cand_fetch "$CAND_REPO" --depth=1 --no-tags --force origin "$B" \
            || fail "cannot fetch base $B by object (candidate identity — fail-closed)"
          git -C "$CAND_REPO" rev-parse --verify --quiet "$SUBJECT_HEAD^{commit}" >/dev/null 2>&1 \
            || cand_fetch "$CAND_REPO" --depth=1 --no-tags --force origin "$SUBJECT_HEAD" \
            || fail "cannot fetch subject head $SUBJECT_HEAD by object (candidate identity — fail-closed)"
          CAND_RC=0
          CAND_M="$(git -C "$CAND_REPO" merge-tree --write-tree "$B" "$SUBJECT_HEAD" 2>/dev/null)" || CAND_RC=$?
          if [ "$CAND_RC" -eq 128 ]; then
            if [ "$CAND_SHALLOW" != "true" ]; then
              fail "CANDIDATE_MERGE_BASE_UNRESOLVED: ancestry($B, $SUBJECT_HEAD) unresolved on a full clone (unrelated histories or unusable object graph — fail-closed)"
            fi
            CAND_ROUND=0
            while [ "$CAND_ROUND" -lt 8 ]; do
              cand_fetch "$CAND_REPO" --deepen=64 --no-tags --force origin \
                || fail "CANDIDATE_MERGE_BASE_UNRESOLVED: history deepen fetch failed (round $((CAND_ROUND + 1))/8 — fail-closed)"
              CAND_SHALLOW="$(git -C "$CAND_REPO" rev-parse --is-shallow-repository)" \
                || fail "cannot probe shallow state of _candidate (fail-closed)"
              CAND_RC=0
              CAND_M="$(git -C "$CAND_REPO" merge-tree --write-tree "$B" "$SUBJECT_HEAD" 2>/dev/null)" || CAND_RC=$?
              [ "$CAND_RC" -ne 128 ] && break
              CAND_ROUND=$((CAND_ROUND + 1))
            done
            [ "$CAND_RC" -ne 128 ] || fail "CANDIDATE_MERGE_BASE_UNRESOLVED: ancestry($B, $SUBJECT_HEAD) unresolved after 8x64-commit deepening (history cap reached — fail-closed)"
          fi
          if [ "$CAND_RC" -eq 1 ]; then
            fail "CANDIDATE_TREE_CONFLICT: merge-tree($B, $SUBJECT_HEAD) reports conflict (rc=1; conflict output not compared — rc-first contract — fail-closed)"
          fi
          [ "$CAND_RC" -eq 0 ] || fail "CANDIDATE_TREE_MERGE_ERROR: merge-tree($B, $SUBJECT_HEAD) rc=$CAND_RC (output unspecified per the git merge-tree contract — fail-closed)"
          printf '%s' "$CAND_M" | grep -qE '^[0-9a-f]{40}$' \
            || fail "CANDIDATE_TREE_MERGE_ERROR: merge-tree output '$CAND_M' not a 40-hex tree OID (fail-closed)"
          [ "$CAND_M" = "$MERGE_TREE_OID" ] \
            || fail "CANDIDATE_TREE_MISMATCH: merge-tree($B, $SUBJECT_HEAD) tree $CAND_M != tested landing candidate tree $MERGE_TREE_OID (candidate identity broken — fail-closed)"
          echo "MERGE_CANDIDATE_TREE_OID=$CAND_M" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE_EQUAL=true" >> "$GITHUB_ENV"
          echo "B=$B" >> "$GITHUB_ENV"
          echo "H=$H" >> "$GITHUB_ENV"
          echo "HEAD_TREE_OID=$HEAD_TREE_OID" >> "$GITHUB_ENV"
          echo "MERGE_TREE_OID=$MERGE_TREE_OID" >> "$GITHUB_ENV"
          echo "SUBJECT_HEAD=$SUBJECT_HEAD" >> "$GITHUB_ENV"
          echo "SUBJECT_HEAD_TREE_OID=$SUBJECT_HEAD_TREE_OID" >> "$GITHUB_ENV"
          echo "head_tree_oid=$HEAD_TREE_OID" >> "$GITHUB_OUTPUT"
          echo "ADM_IDENTITY: OK — PR #$PR_NUMBER head==H base==B ref==main tree $HEAD_TREE_OID mergeTree $MERGE_TREE_OID subject $SUBJECT_HEAD candidateTree $CAND_M (merge-tree(B,SUBJECT_HEAD)==MERGE_TREE_OID verified)"

      # ────────────────────────────────────────────────────────────────
      # Stage D9 evidence — INLINE PORT of tools/ci/assemble_d9_evidence.sh
      # (deleted in the CI=0 cutover ce92fc2d1). Pure DATA STAGING — it holds
      # NO verification authority: it fills the canonical evidence record
      # (schema axiom.attestation.evidence.v2) from the B-pinned draft (
      # data/certification/evidence-draft.json) and the H tree (funcSource
      # byte-match vs $FUNC_PATH@H read from `_candidate/` as data). The
      # trusted kernel (B-built bin/ax) re-derives everything downstream.
      # TODO: re-land the assembler as a tracked tool for reuse (Phase B+).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Stage D9 evidence (B draft + H tree as data — fail-closed)"
        if: inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl03 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
        run: |
          set -euo pipefail
          fail() { echo "assemble_d9: FAIL — $1 (fail-closed)" >&2; exit 1; }
          WORK="$GITHUB_WORKSPACE"
          CANDIDATE="$GITHUB_WORKSPACE/_candidate"
          # ADR-0027 α: the evidence subject head = SUBJECT_HEAD (PR head on
          # merge_group = G^2; PR head on pull_request) — NOT the run head G.
          # Fallback to the event expression only if the identity step did not
          # run (scope_sl01 NO-FIRE).
          HEAD_SHA="${SUBJECT_HEAD:-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}}"
          DRAFT="$WORK/data/certification/evidence-draft.json"
          OUT="$WORK/data/trusted/evidence/draft-assembled.json"
          printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$' || fail "HEAD_SHA not 40-hex"
          [ -d "$CANDIDATE/.git" ] || fail "candidate git dir '$CANDIDATE' missing"
          [ -f "$DRAFT" ] || fail "evidence draft missing at $DRAFT — main-pinned draft not present in B (must land on main first)"
          parsed="$(sed -E 's|^[[:space:]]*//.*$||' "$DRAFT" | jq -e . 2>/dev/null)" \
            || fail "evidence draft unparsable: $DRAFT"
          LEAN_SOURCE="$(printf '%s' "$parsed" | jq -r '.leanSource // ""')"
          SMTLIB2="$(printf '%s' "$parsed" | jq -r '.smtlib2 // ""')"
          FUNC_SOURCE="$(printf '%s' "$parsed" | jq -r '.funcSource // ""')"
          FUNC_PATH="$(printf '%s' "$parsed" | jq -r '.funcPath // ""')"
          FUNC_NAME="$(printf '%s' "$parsed" | jq -r '.funcName // ""')"
          TOOLCHAIN_IDENTITY="$(printf '%s' "$parsed" | jq -r '.toolchainIdentity // ""')"
          [ -n "$LEAN_SOURCE" ] || fail "draft leanSource empty"
          [ -n "$SMTLIB2" ] || fail "draft smtlib2 empty"
          [ -n "$FUNC_SOURCE" ] || fail "draft funcSource empty"
          [ -n "$FUNC_PATH" ] || fail "draft funcPath empty"
          [ -n "$FUNC_NAME" ] || fail "draft funcName empty"
          [ -n "$TOOLCHAIN_IDENTITY" ] || fail "draft toolchainIdentity empty"
          # v2 pinned identity form: the charon extraction-pin segment
          # (|charon-pin-<40hex>|charon-<ver>, extraction_provenance
          # charonIdentitySegment) is always appended by the v2
          # pinnedToolchainIdentity — the format gate must accept the exact
          # form stage-e compares against (content is still enforced there,
          # fail-closed).
          printf '%s' "$TOOLCHAIN_IDENTITY" | grep -qE '^nim-[0-9.]+[|]lean-[0-9.]+([|]z3-[0-9.]+)?([|]modelprofile=[0-9a-f]{64}/no-overflow-obligations/coincident-checked-wrap-domain)?([|]charon-pin-[0-9a-f]{40}[|]charon-[0-9.]+)?$' \
            || fail "draft toolchainIdentity '$TOOLCHAIN_IDENTITY' malformed"
          # Vault-cert INPUT PRECONDITION (docs/spec/proof_required_admission_contract.md
          # §4.2): a draft whose (funcPath, funcName) is a vault-manifest target
          # requires the canonical vault certificate to EXIST and its content
          # irHash to MATCH the manifest entry — existence/match failure = attest
          # stage failure (fail-closed). Coexists with admission Pass 2.96b: this
          # binds the attest PRODUCTION input; 2.96b binds the approval-time
          # target — neither replaces the other.
          VAULT_MANIFEST="$WORK/src/verification/certificates/manifest.json"
          [ -f "$VAULT_MANIFEST" ] || fail "vault manifest missing at $VAULT_MANIFEST (B workspace — proof-required admission precondition §4.2, fail-closed)"
          jq -e '.entries | type == "array"' "$VAULT_MANIFEST" >/dev/null 2>&1 \
            || fail "vault manifest unparsable: $VAULT_MANIFEST (§4.2 precondition, fail-closed)"
          VAULT_IRHASH="$(jq -r --arg fp "$FUNC_PATH" --arg fn "$FUNC_NAME" \
            '[.entries[] | select(.modulePath == $fp and .functionName == $fn)][0].irHash // ""' "$VAULT_MANIFEST")"
          if [ -n "$VAULT_IRHASH" ]; then
            VAULT_CERT="$WORK/src/verification/certificates/$VAULT_IRHASH.json"
            [ -f "$VAULT_CERT" ] \
              || fail "vault certificate missing for draft target $FUNC_PATH::$FUNC_NAME (expected $VAULT_CERT) — attest input precondition (§4.2, fail-closed)"
            CERT_IRHASH="$(jq -er '.irHash // ""' "$VAULT_CERT" 2>/dev/null)" \
              || fail "vault certificate unparsable: $VAULT_CERT (§4.2 precondition, fail-closed)"
            [ "$CERT_IRHASH" = "$VAULT_IRHASH" ] \
              || fail "vault certificate irHash $CERT_IRHASH != manifest irHash $VAULT_IRHASH for $FUNC_PATH::$FUNC_NAME — attest input precondition (§4.2, fail-closed)"
            echo "assemble_d9: vault-cert precondition OK — $FUNC_PATH::$FUNC_NAME → ${VAULT_IRHASH:0:12}"
          else
            echo "assemble_d9: vault-cert precondition vacuous — draft target not in vault manifest"
          fi
          # funcSource must byte-match the CANDIDATE (H) tree file — the
          # extraction-agreement input is truthful by construction.
          h_src="$(git -C "$CANDIDATE" show "$HEAD_SHA:$FUNC_PATH" 2>/dev/null)" \
            || fail "cannot read $FUNC_PATH@H (git show $HEAD_SHA:$FUNC_PATH)"
          if [ "$h_src" != "$FUNC_SOURCE" ]; then
            fail "funcSource in draft does not byte-match candidate tree $FUNC_PATH@${HEAD_SHA:0:12}"
          fi
          POLICY_FILE="$WORK/config/policy/merge_admission.json"
          SCOPE_FILE="$WORK/data/verification_scope.lock"
          [ -f "$POLICY_FILE" ] || fail "policy file missing at $POLICY_FILE (B workspace)"
          [ -f "$SCOPE_FILE" ] || fail "scope lock missing at $SCOPE_FILE (B workspace)"
          POLICY_DIGEST="$(sha256sum "$POLICY_FILE" | awk '{print $1}')"
          SCOPE_DIGEST="$(sha256sum "$SCOPE_FILE" | awk '{print $1}')"
          ENV_DIGEST="$(printf 'axiom-attestation-env-v1|%s' "$TOOLCHAIN_IDENTITY" | sha256sum | awk '{print $1}')"
          SUBJECT_ID_PLACEHOLDER="$(printf '0%.0s' {1..64})"
          mkdir -p "$(dirname "$OUT")"
          cat > "$OUT" <<EOF
          {
            "schemaVersion": "axiom.attestation.evidence.v2",
            "subjectId": "$SUBJECT_ID_PLACEHOLDER",
            "prNumber": ${{ github.event.pull_request.number || '0' }},
            "prHeadSha": "$HEAD_SHA",
            "leanSource": $(printf '%s' "$LEAN_SOURCE" | jq -Rs .),
            "smtlib2": $(printf '%s' "$SMTLIB2" | jq -Rs .),
            "funcSource": $(printf '%s' "$FUNC_SOURCE" | jq -Rs .),
            "funcPath": $(printf '%s' "$FUNC_PATH" | jq -Rs .),
            "funcName": $(printf '%s' "$FUNC_NAME" | jq -Rs .),
            "policyDigest": "$POLICY_DIGEST",
            "scopeDigest": "$SCOPE_DIGEST",
            "envDigest": "$ENV_DIGEST",
            "toolchainIdentity": $(printf '%s' "$TOOLCHAIN_IDENTITY" | jq -Rs .)
          }
          EOF
          jq -e . "$OUT" >/dev/null 2>&1 || fail "assembled evidence record malformed: $OUT"
          echo "assemble_d9: OK — staged evidence $OUT (head ${HEAD_SHA:0:12}, PR #${{ github.event.pull_request.number || '0' }}, func $FUNC_NAME)"

      # ────────────────────────────────────────────────────────────────
      # Subject register + final record — B-built ax derives the canonical
      # subjectId from the STAGED evidence (archived witness chain; append-
      # only store under B's data/trusted/evidence, per-run workspace only).
      # No GITHUB_TOKEN: subject-register performs NO network (archived).
      # ────────────────────────────────────────────────────────────────
      - name: "[check] Register subject (B-built ax re-derives subjectId)"
        if: inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl08 == 'true' && steps.slice-engine.outputs.scope_sl03 == 'true' && steps.venue.outputs.venue == 'landing'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
        run: |
          set -euo pipefail
          BIN_AX="$GITHUB_WORKSPACE/bin/ax"
          [ -x "$BIN_AX" ] || { echo "[check] bin/ax missing — B build failed" >&2; exit 1; }
          STAGED="$GITHUB_WORKSPACE/data/trusted/evidence/draft-assembled.json"
          [ -f "$STAGED" ] || { echo "[check] staged evidence missing: $STAGED" >&2; exit 1; }
          # set +e around the capture: under `set -e` a failing command
          # substitution kills the cell AT THE ASSIGNMENT — REG_EXIT/echo
          # never run and ax's fail-closed reason is lost (observed silent
          # exit 1, run 35955557993). Capture first, judge after.
          set +e
          # ADR-0027 (P1): --pr is omitted when PR_NUMBER=0 (merge_group — no PR
          # context); the CLI then defaults prNumber=0 and cross-checks are
          # inactive (--pr requires a value > 0 if given).
          if [ "$PR_NUMBER" = "0" ]; then
            REG_OUT="$("$BIN_AX" cert subject-register \
              --base "$B" \
              --head-tree "${SUBJECT_HEAD_TREE_OID:-$HEAD_TREE_OID}" \
              --evidence "$STAGED" 2>&1)"
          else
            REG_OUT="$("$BIN_AX" cert subject-register \
              --base "$B" \
              --head-tree "${SUBJECT_HEAD_TREE_OID:-$HEAD_TREE_OID}" \
              --pr "$PR_NUMBER" \
              --evidence "$STAGED" 2>&1)"
          fi
          REG_EXIT=$?
          set -e
          echo "$REG_OUT"
          [ "$REG_EXIT" -eq 0 ] || { echo "[check] subject-register FAILED (exit $REG_EXIT)" >&2; exit 1; }
          SUBJECT_ID="$(printf '%s\n' "$REG_OUT" | sed -n 's/.*Subject registered: \([0-9a-f]\{64\}\).*/\1/p')"
          printf '%s' "$SUBJECT_ID" | grep -qE '^[0-9a-f]{64}$' \
            || { echo "[check] could not parse subjectId from register output" >&2; exit 1; }
          echo "SUBJECT_ID=$SUBJECT_ID" >> "$GITHUB_ENV"
          # Fill subjectId into the final record (archived fill step).
          FINAL="$GITHUB_WORKSPACE/data/trusted/evidence/$SUBJECT_ID.json"
          printf '%s' "$(jq --arg sid "$SUBJECT_ID" '.subjectId = $sid' "$STAGED")" > "$FINAL"
          [ "$(jq -r '.subjectId' "$FINAL")" = "$SUBJECT_ID" ] \
            || { echo "[check] subjectId fill failed" >&2; exit 1; }
          jq -e . "$FINAL" >/dev/null 2>&1 || { echo "[check] final evidence unparsable: $FINAL" >&2; exit 1; }
          echo "[check] subject registered + final record staged: ${SUBJECT_ID:0:12}… (B ${B:0:12}, tree $HEAD_TREE_OID)"

      # ────────────────────────────────────────────────────────────────
      # [independents] L3 value channel (prereg §2.2): promote the moved
      # steps' GITHUB_ENV values — exactly the 7 the remaining job's
      # witness chain consumes — to step outputs (→ the job outputs
      # declared above). All 40/64-hex OIDs, far under the 1MB output
      # budget, no multiline risk. Empty when the producing step
      # legitimately skipped (scope NO-FIRE); the remaining job's `:?` /
      # `:-` guards keep the empty case red exactly as pre-split.
      # ────────────────────────────────────────────────────────────────
      - name: "[independents] Export identity values (env → job outputs — L3 value channel)"
        id: independents-export
        run: |
          set -euo pipefail
          {
            echo "b=${B:-}"
            echo "h=${H:-}"
            echo "head_tree_oid=${HEAD_TREE_OID:-}"
            echo "merge_tree_oid=${MERGE_TREE_OID:-}"
            echo "subject_head=${SUBJECT_HEAD:-}"
            echo "subject_head_tree_oid=${SUBJECT_HEAD_TREE_OID:-}"
            echo "subject_id=${SUBJECT_ID:-}"
          } >> "$GITHUB_OUTPUT"
          echo "[independents] value channel: B=${B:-(unset)} H=${H:-(unset)} headTree=${HEAD_TREE_OID:-(unset)} mergeTree=${MERGE_TREE_OID:-(unset)} subjectHead=${SUBJECT_HEAD:-(unset)} subjectHeadTree=${SUBJECT_HEAD_TREE_OID:-(unset)} subjectId=${SUBJECT_ID:-(unset)}"

      # ────────────────────────────────────────────────────────────────
      # [independents] L3 file channel (prereg §2.2 existence contract):
      # SUCCESS-ONLY upload (no `always()`, unlike the lane evidence
      # uploads which stay reachable post-mortem) — this artifact is the
      # REMAINING job's consumption input, not reusable PASS material: a
      # failed run must not hand partial state downstream. Fires under
      # the register/witness scope conjunct (the files exist iff register
      # ran to success — a NO-FIRE epoch is not blocked);
      # `if-no-files-found: error` is the honest fail-closed for the
      # vanished-file anomaly. Name follows the ORCHESTRATOR CONTRACT
      # identity form: <role>-<candidate head>-<run_attempt>
      # (admission-check / go-judgment-lane precedents; run_attempt here
      # is the CALLER run's attempt — the same value the remaining job
      # re-derives at consumption).
      # 2026-11-04 subject-store inclusion (docs/evidence/
      # l3_go_split_impl_2026-11-04.md §6.5): the channel must carry BOTH
      # consumers' inputs of the moved Register-subject step — the
      # evidence record (data/trusted/evidence, the --evidence input) AND
      # the subject store (data/trusted/subjects, the witness's
      # findSubjectsByHeadSha lookup input — SubjectStoreDir). Evidence-only
      # upload made the remaining job's witness fail-closed red on every
      # merge_group ("no stored subject for ref"). Multi-path upload roots
      # the artifact at the LCA data/trusted (evidence/ + subjects/
      # subdirs) — the consumer below restores into data/trusted.
      # ────────────────────────────────────────────────────────────────
      - name: "[independents] Upload evidence chain (success-only — the remaining job's input)"
        if: inputs.stage == 'attest' && steps.slice-engine.outputs.scope_sl08 == 'true' && steps.slice-engine.outputs.scope_sl03 == 'true' && steps.venue.outputs.venue == 'landing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission-independents-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            data/trusted/evidence/*.json
            data/trusted/subjects/*.json
          if-no-files-found: error
          retention-days: 30



  # ────────────────────────────────────────────────────────────────
  # go-critical-lane — the DEBT#432 GO-critical admission-contract tests
  # as a 2-lane job matrix (G2 generation, 2026-10-16; pre-registration:
  # docs/evidence/go_matrix_parallelization_prereg_2026-10-16.md — its
  # §1 partition, §2 entry preconditions, §3 execution semantics are the
  # binding spec of this job; S1 acceptance evidence:
  # docs/evidence/go_matrix_s1_validation_2026-10-16.md).
  #   lane-0 = tests/unit/test_s1a_lean_golden.nim        (solo — critical
  #           path: 56% of the serial step, G-B frozen measurement)
  #   lane-1 = tests/unit/proof_integrity_test.nim
  #            tests/unit/test_d2_golden.nim
  #            tests/unit/test_d2_persist.nim
  # The four tests are the ONLY direct tests of the terminal admission
  # machinery (isVkdAdmissible; producer E2E; opaque receipt 5-fold chain;
  # KAA→cert_writer→reader loop), wired by DEBT#432. Retiring them is
  # illegal — docs/spec/productization_contract_freeze_v1.md (FROZEN, E1–E5)
  # makes an unexecuted test non-evidence and a quiet drop requires a
  # ContractRevision — so INCLUDE is the only path, exercised HERE, one
  # partition half per lane. The existing Makefile runner `test-fast-one`
  # (Makefile:960-963, `$(NIM) c -r …`) is invoked verbatim — the FROZEN
  # Makefile is not modified.
  #
  # Invariants carried from the serial step this matrix replaces:
  #   * VENUE — the job-level `if` mirrors the [venue] step's case arms
  #     exactly: pull_request = preflight → lanes SKIP (the PR venue stays
  #     fast — ADR-0032; the light preflight steps run in the admission-check
  #     job, not here), merge_group|workflow_call + stage=attest = landing →
  #     lanes RUN. An unrecognized event skips this job like every other —
  #     and the caller's aggregate turns any callee skip red (fail-closed:
  #     no venue, no run). The venue branch lives here as a job-level
  #     expression because a matrix cannot consume a step output; the two
  #     disjuncts are a verbatim restatement of the [venue] step's case
  #     arms, and the fail-closed unknown-event path is enforced by the
  #     same-file venue step + the caller's skipped→FAILURE rule.
  #   * GATE A — the workspace root IS the B (base) checkout; the tests
  #     compile and run from B only. `_candidate/` (H) is never checked out
  #     in a lane, never read. bin/ax + ircheck arrive from job1's
  #     manifest-verified artifact — the B-built bin/ax is exactly what
  #     tests/config.nims' integrity guard requires before any test suite
  #     compiles.
  #   * JUDGMENT CAS (SL-15) — each lane arms and plans ONLY its own
  #     subjects, with the same vocabulary the serial step consumed:
  #     AXIOM_JUDGMENT_CAS_ENABLED/TESTED_TREE_OID exported into GITHUB_ENV,
  #     per-subject decision/record/evidence path envs,
  #     read-only ledger consult through the B-built bin/ax (the tested
  #     tree OID is derived HERE from the checkout — the same B^{tree} the
  #     SL-15 CAS derives; the key can never rest on an unmeasured tree).
  #     Fail directions stay asymmetric: every unverifiable state resolves
  #     to EXECUTED — the plan never invents a reuse. basis=REUSED is the
  #     sanctioned skip (the ledger record re-verifies AGAIN inside the
  #     attest job's armed attest — a reuse is never self-certifying);
  #     EXECUTED/OFF/absent runs the original test. Each lane publishes its
  #     subjects' decision/record/evidence files; the attest job downloads
  #     them (consumption needs-edge) and the armed attest re-verifies
  #     every subject fail-closed — the record fail-closed loop there
  #     requires EVERY subject's record, so a lane that skipped its upload
  #     can never green the landing verdict.
  #   * FAILS ACCUMULATION / NON-ZERO PROPAGATION (E3) — per-test failure
  #     → FAILS++ → the lane's fail-closed exit 1 → this job red → callee
  #     workflow red → the caller's `attest` wrapper red → aggregate
  #     required check FAIL → merge blocked — identical path to the serial
  #     step. All four tests run to completion within a lane before the
  #     verdict (accumulation, never fail-on-first).
  #   * fail-fast: false (pre-registration §3-1) — one lane's failure
  #     cancels nothing; every lane runs to completion and leaves its full
  #     GitHub-native job log. The single-step lane pattern whose stderr
  #     loss created the §8 lineage does not exist in this structure — each
  #     lane IS a job; its transcript is the job's native log.
  #   * SKIPPED ≠ GREEN (§2-(v)) — on the landing venue a skipped or
  #     cancelled lane matrix is RED via go-critical-rollup (needs.result
  #     enforcement) and, independently, via the admission-check job's
  #     lane-artifact downloads (a skipped lane publishes no artifact → the
  #     fail-closed download reds the attest stage).
  #   * CACHE ISOLATION (§2-(ii)/(iii), §3-4) — lanes share nothing: each
  #     runs on its own ephemeral runner, restores the read-only B-cache
  #     (publisher remains the sole save authority), and the only
  #     cross-runner channels are run-scoped artifacts of immutable inputs
  #     (judgment files; nimcache content-addressed compile objects folded
  #     by the ci-cache-publisher base-seed into the published B-cache
  #     carrier — the J3 contract of the serial pipeline, supply re-sourced,
  #     semantics unchanged).
  # ────────────────────────────────────────────────────────────────
  go-critical-lane:
    needs: [build-base-artifacts]
    if: >-
      always() &&
      inputs.stage == 'attest' &&
      (github.event_name == 'merge_group' || github.event_name == 'workflow_call')
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [0, 1]
        include:
          - lane: 0
            # G-A critical-path matching: the longest single test runs solo.
            tests: tests/unit/test_s1a_lean_golden.nim
            subjects: s1a
          - lane: 1
            tests: tests/unit/proof_integrity_test.nim tests/unit/test_d2_golden.nim tests/unit/test_d2_persist.nim
            subjects: proof_integrity d2_golden d2_persist
    steps:
      - name: "[lane] Checkout executor tree = B (base.sha, workspace root)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      # ────────────────────────────────────────────────────────────────
      # B/M SPLIT — candidate head resolution (fail-closed venue identity).
      # The candidate M is WHAT THE LANE TESTS (its src/ + the explicit
      # GO-critical test files are overlaid below); B remains the EXECUTOR
      # (workspace root: Makefile, tests/config.nims, toolchain, bin/ax).
      #   merge_group   → M := merge_group.head_sha, and the queue commit
      #                   GITHUB_SHA MUST equal it (a lane that tests
      #                   anything but the queued head is a false GO).
      #   pull_request  → M := pull_request.head.sha (preflight venue —
      #                   the lanes skip here; this arm exists so the job's
      #                   venue expression and the head resolution can
      #                   never drift apart).
      #   workflow_call → M := GITHUB_SHA (the caller-pinned landing sha —
      #                   the org orchestrator dispatches with the same
      #                   identity the merge_group queue recorded).
      # Anything unresolvable or self-inconsistent = exit 1 (fail-closed),
      # never a fallback to B (a B-only lane is exactly the gap this split
      # closes).
      # ────────────────────────────────────────────────────────────────
      - name: "[lane] Resolve candidate head (M — fail-closed venue identity)"
        id: candidate-head
        run: |
          set -euo pipefail
          fail() { echo "[candidate-head] FAIL — $1 (fail-closed)" >&2; exit 1; }
          case "${{ github.event_name }}" in
            merge_group)
              M="${{ github.event.merge_group.head_sha }}"
              printf '%s' "$M" | grep -qE '^[0-9a-f]{40}$' || fail "merge_group.head_sha='$M' not a 40-hex OID"
              if [ "$M" != "${GITHUB_SHA:-}" ]; then
                fail "merge_group.head_sha=$M != GITHUB_SHA=${GITHUB_SHA:-<unset>} — the lane refuses to test a head the queue did not record (fail-closed)"
              fi
              ;;
            pull_request)
              M="${{ github.event.pull_request.head.sha }}"
              printf '%s' "$M" | grep -qE '^[0-9a-f]{40}$' || fail "pull_request.head.sha='$M' not a 40-hex OID"
              ;;
            workflow_call)
              M="${GITHUB_SHA:-}"
              printf '%s' "$M" | grep -qE '^[0-9a-f]{40}$' || fail "workflow_call GITHUB_SHA='$M' not a 40-hex OID (caller must pin the landing sha)"
              ;;
            *)
              fail "unrecognized event_name '${{ github.event_name }}' — candidate head undeterminable (no M, no run)"
              ;;
          esac
          echo "m_sha=$M" >> "$GITHUB_OUTPUT"
          echo "[candidate-head] candidate M=$M (venue=${{ github.event_name }})"

      - name: "[lane] Checkout candidate = M (overlay-only source, no credential persistence)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.candidate-head.outputs.m_sha }}
          path: _candidate
          fetch-depth: 1
          persist-credentials: false

      - name: "[lane] Header — lane/runner identity (isolation observation, evidence not authority)"
        run: |
          set -euo pipefail
          echo "[go-lane] lane=${{ matrix.lane }} runner=${RUNNER_NAME} image=${ImageOS}-${ImageVersion} arch=$(uname -m) nproc=$(nproc)"
          echo "[go-lane] workspace=$GITHUB_WORKSPACE host=$(hostname)"
          echo "[go-lane] subjects=${{ matrix.subjects }}"
          echo "[go-lane] tests=${{ matrix.tests }}"

      # ────────────────────────────────────────────────────────────────
      # SLICE ENGINE — verbatim copy of the admission-check job's step
      # (same authority + mapping). Manifest @B decides which semantic
      # stages fire; scope_sl15 arms the lane's Judgment CAS, scope_sl08
      # gates the base-artifact supply.
      # ────────────────────────────────────────────────────────────────
      - name: "[slice-engine] Load epoch manifest implementedSlices (B tree — scope authority)"
        id: slice-engine
        run: |
          set -euo pipefail
          fail() { echo "[slice-engine] FAIL — $1 (fail-closed)" >&2; exit 1; }
          B="${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          printf '%s' "$B" | grep -qE '^[0-9a-f]{40}$' || fail "B='$B' not a 40-hex OID"
          MANIFEST="$(git -C "$GITHUB_WORKSPACE" show "$B:config/policy/epoch_manifest.json")" \
            || fail "config/policy/epoch_manifest.json unreadable at B=$B — engine execution scope undeterminable (manifest must land on main with the promotion PR)"
          parsed="$(printf '%s' "$MANIFEST" | jq -e . 2>/dev/null)" \
            || fail "epoch manifest unparsable at B=$B"
          printf '%s' "$parsed" | jq -e '(.ciEpochId? // "") | (type == "string") and (length > 0) and (test("^[A-Za-z0-9][A-Za-z0-9._+-]*$"))' >/dev/null \
            || fail "ciEpochId missing/malformed at B=$B"
          printf '%s' "$parsed" | jq -e '(.implementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "implementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e '(.notYetImplementedSlices? // null) | (type == "array") and (all(.[]; type == "string"))' >/dev/null \
            || fail "notYetImplementedSlices missing or not a string array at B=$B"
          printf '%s' "$parsed" | jq -e 'all(.implementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "implementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e 'all(.notYetImplementedSlices[]; test("^SL-[0-9]{2,4}$"))' >/dev/null \
            || fail "notYetImplementedSlices contains malformed slice id (expected SL-NN)"
          printf '%s' "$parsed" | jq -e '(([.implementedSlices[]] - [.notYetImplementedSlices[]]) | length) == (.implementedSlices | length)' >/dev/null \
            || fail "implementedSlices ∩ notYetImplementedSlices ≠ ∅ at B=$B"
          printf '%s' "$parsed" | jq -e '(.productionExecutionPin? // "") | (type == "string") and (length > 0)' >/dev/null \
            || fail "productionExecutionPin missing/empty at B=$B"
          printf '%s' "$parsed" | jq -e '((.mode? // "") as $m | ($m == "ci-migration") or ($m == "normal"))' >/dev/null \
            || fail "mode must be 'ci-migration' or 'normal' at B=$B"
          EPOCH="$(printf '%s' "$parsed" | jq -r '.ciEpochId')"
          IMPL="$(printf '%s' "$parsed" | jq -c '.implementedSlices')"
          echo "epoch_id=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "implemented_slices=$IMPL" >> "$GITHUB_OUTPUT"
          RPT="[slice-engine] epoch=$EPOCH implemented=$IMPL"
          for spec in "sl08=SL-08" "sl15=SL-15"; do
            key="${spec%%=*}"
            slice="${spec##*=}"
            if printf '%s' "$parsed" | jq -e --arg s "$slice" '.implementedSlices | index($s) != null' >/dev/null 2>&1; then
              echo "scope_$key=true" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=fire"
            else
              echo "scope_$key=false" >> "$GITHUB_OUTPUT"
              RPT="$RPT $key=NO-FIRE"
            fi
          done
          echo "$RPT"

      # Same provisioning as the admission-check attest preamble (attest
      # stage ⇒ the toolchain action always provisions here): read-only
      # B-cache restore (the publisher stays the sole save authority) —
      # warm compile supply for the lane's `nim c` runs.
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          cache-save-enabled: 'false'
          cache-build-source: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          provision-scope: 'full'

      - name: "[lane] Download base-built artifacts (B bin/ax + ircheck)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-check-base-artifacts
          # STAGING dir (attest preamble convention): the verify step below
          # materializes into canonical paths.
          path: _base-artifacts

      - name: "[lane] Verify artifact manifest (fail-closed — build_sha == B)"
        if: steps.slice-engine.outputs.scope_sl08 == 'true'
        env:
          EXPECT_BUILD_SHA: ${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          test -f _base-artifacts/manifest.txt || { echo "FAIL: manifest.txt missing in downloaded artifact"; exit 1; }
          mkdir -p bin proofs/.lake/build/bin
          mv -f _base-artifacts/manifest.txt manifest.txt
          mv -f _base-artifacts/bin/ax _base-artifacts/bin/install_ax_cas bin/
          mv -f _base-artifacts/proofs/.lake/build/bin/ircheck proofs/.lake/build/bin/ircheck
          mv -f _base-artifacts/bin/derive_checker_closure _base-artifacts/bin/jq bin/
          # Gate binaries: FALLBACK supply — a valid B-restore already left
          # its copies in place (restored bytes win; attest-preamble
          # convention). The manifest loop below digest-binds whichever
          # source supplied each file.
          for g in gate_hook precompile_gates; do
            if [ -f "bin/$g" ]; then
              echo "gate supply: bin/$g already present (B-restore — artifact copy withheld)"
            else
              test -f "_base-artifacts/bin/$g" \
                || { echo "FAIL: bin/$g absent from B-restore AND base artifact (no supply — fail-closed)"; exit 1; }
              cp "_base-artifacts/bin/$g" "bin/$g"
              echo "gate supply: bin/$g from base artifact (B-restore absent)"
            fi
          done
          rm -rf _base-artifacts
          while IFS=$'\t' read -r f expect; do
            test -f "$f" || { echo "FAIL: artifact file missing: $f"; exit 1; }
            actual=$(sha256sum "$f" | awk '{print $1}')
            if [ "$actual" != "$expect" ]; then
              echo "FAIL: sha256 mismatch for $f (manifest=$expect actual=$actual)"
              exit 1
            fi
            echo "OK: $f (B-built)"
          done < <(awk '/^[0-9a-f]{64}[[:space:]]{2}/{print $2 "\t" $1}' manifest.txt)
          expect_sha=$(awk -F' = ' '/^build_sha =/{print $2; exit}' manifest.txt)
          if [ -z "$expect_sha" ] || [ "$expect_sha" != "$EXPECT_BUILD_SHA" ]; then
            echo "FAIL: manifest build_sha=$expect_sha != B=$EXPECT_BUILD_SHA (verifier is NOT base-built — Gate A violation)"
            exit 1
          fi
          # upload/download-artifact@v4 drops unix executable bits — restore
          # them before any execution (attest-preamble convention).
          chmod +x bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck bin/gate_hook bin/precompile_gates bin/derive_checker_closure bin/jq
          echo "MANIFEST VERIFIED: verifier is built from B=$EXPECT_BUILD_SHA"

      # ────────────────────────────────────────────────────────────────
      # CANDIDATE IDENTITY — the pre-overlay derivation of the lane's
      # identity set (M sha/tree, B tree, overlay manifest digest) and the
      # point where M's tree objects become resolvable in the EXECUTOR's
      # object store.
      #
      # It runs BEFORE the M overlay, and therefore BEFORE the Judgment
      # CAS plan, for two reasons that are fail-closed preconditions and
      # not optimizations:
      #   * the B-built bin/ax self-checks SourceCoherence against the
      #     LIVE src/ (src/cli/main.nim) — once M's src/ is overlaid the
      #     B-built binary refuses to run at all;
      #   * the armed attest re-derives the judgment closure in a
      #     B-pristine workspace, so the plan must observe the SAME
      #     closure — otherwise the two evidence keys differ and the
      #     attest refuses the decision file.
      # The M-object fetch lives here for the same reason: the closure's
      # semantic-set derivation (component 5) shells `git ls-tree -r
      # <tested-tree>` against THIS repository, so M's tree must be
      # resolvable in the executor BEFORE the plan reads it.
      # ────────────────────────────────────────────────────────────────
      - name: "[lane] Candidate identity (M sha/tree, B tree, M objects, overlay digest)"
        id: candidate-identity
        run: |
          set -euo pipefail
          fail() { echo "[candidate-identity] FAIL — $1 (fail-closed)" >&2; exit 1; }
          M_SHA="${{ steps.candidate-head.outputs.m_sha }}"
          printf '%s' "$M_SHA" | grep -qE "^[0-9a-f]{40}\$" \
            || fail "resolved candidate head M='$M_SHA' is not a 40-hex OID"
          [ -d "$GITHUB_WORKSPACE/_candidate/.git" ] || fail "_candidate checkout missing"
          CAND_HEAD="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse HEAD)"
          [ "$CAND_HEAD" = "$M_SHA" ] || fail "_candidate HEAD=$CAND_HEAD != resolved M=$M_SHA"
          M_TREE="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse 'HEAD^{tree}')" \
            || fail "cannot resolve M^{tree} from the candidate checkout"
          B_TREE="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            || fail "cannot resolve B^{tree} from the executor checkout"
          printf '%s' "$M_TREE" | grep -qE "^[0-9a-f]{40}\$" || fail "M^{tree} is not a 40-hex OID"
          printf '%s' "$B_TREE" | grep -qE "^[0-9a-f]{40}\$" || fail "B^{tree} is not a 40-hex OID"
          # M's tree objects must be resolvable in the EXECUTOR's object
          # store before the plan reads them (closure component 5 shells
          # `git ls-tree -r <tested-tree>` against THIS repository). The
          # fetch is a local-path fetch from the candidate checkout — no
          # network, no credentials (both checkouts run
          # persist-credentials: false).
          git -C "$GITHUB_WORKSPACE" fetch --no-tags "$GITHUB_WORKSPACE/_candidate" "$M_SHA" \
            || fail "cannot fetch M objects into the executor object store"
          git -C "$GITHUB_WORKSPACE" cat-file -e "$M_TREE^{tree}" \
            || fail "M^{tree} unresolvable in the executor object store after fetch"
          # Overlay manifest digest — sorted (path, blob sha) list of the
          # overlaid paths of the CANDIDATE tree (the identity of WHAT
          # will be overlaid; deterministic from M). The composition is
          # byte-identical to the attest-stage recomputation.
          OVERLAY_LIST="$(git -C "$GITHUB_WORKSPACE/_candidate" ls-tree -r --full-tree "$M_TREE" -- src tests/golden ${{ matrix.tests }} | LC_ALL=C sort)"
          [ -n "$OVERLAY_LIST" ] || fail "overlay manifest list empty — the candidate tree carries no src/"
          OVERLAY_DIGEST="$(printf '%s\n' "$OVERLAY_LIST" | sha256sum | awk '{print $1}')"
          {
            echo "m_sha=$M_SHA"
            echo "m_tree=$M_TREE"
            echo "b_tree=$B_TREE"
            echo "overlay_manifest_digest=$OVERLAY_DIGEST"
          } >> "$GITHUB_OUTPUT"
          {
            echo "AXIOM_JUDGMENT_OVERLAY_MANIFEST_DIGEST=$OVERLAY_DIGEST"
          } >> "$GITHUB_ENV"
          {
            echo "[candidate-identity] M(candidate) sha=$M_SHA tree=$M_TREE"
            echo "[candidate-identity] B(executor) tree=$B_TREE"
            echo "[candidate-identity] overlay_manifest_digest=$OVERLAY_DIGEST (src + tests/golden + ${{ matrix.tests }})"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────────
      # Judgment CAS plan — per-lane restriction of the serial step's plan
      # (docs/spec/test_judgment_cas_contract.md, SL-15 scope): identical
      # vocabulary, THIS lane's subjects only. Resolves each subject's
      # reuse decision (read-only ledger consult through the B-built
      # bin/ax) and writes the per-subject decision file the loop below
      # consumes (basis=REUSED is the sanctioned skip) and the armed attest
      # in the admission-check job consumes (basis=EXECUTED means the
      # subject's evidence file is required there).
      #
      # ORDER (fail-closed, not an optimization): the plan runs BEFORE the
      # M overlay, in a B-clean workspace.
      #   * the B-built bin/ax self-checks SourceCoherence against the
      #     LIVE src/ (src/cli/main.nim) — once M's src/ is overlaid the
      #     B-built binary refuses to run at all;
      #   * the armed attest re-derives the closure in a B-pristine
      #     workspace, so the plan must observe the SAME closure — the two
      #     evidence keys must agree or the attest refuses the decision.
      # The tested tree stays the CANDIDATE's (M^{tree}) — the closure's
      # semantic-set probe anchor and the decision provenance bind to the
      # tree the overlay is cut from, never B's. A record minted under any
      # other tested tree (the pre-split B-only era, a different candidate)
      # can never re-derive this closure.
      # ────────────────────────────────────────────────────────────────
      - name: "[lane] Judgment CAS plan (subjects: ${{ matrix.subjects }} — SL-15 scope)"
        if: steps.slice-engine.outputs.scope_sl15 == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANE_SUBJECTS: ${{ matrix.subjects }}
          # Landing venue MARKER (redecision 2026-10-18) — the callee inherits
          # the caller event_name; the env only MARKS the landing venue for the
          # plan (no consult block — eligible REUSED is admissible on the
          # landing venue with its rootRecord marker). PR preflight keeps
          # reuse, unchanged.
          AXIOM_JUDGMENT_CAS_FORCE_EXECUTED: ${{ github.event_name == 'merge_group' && '1' || '' }}
        run: |
          set -euo pipefail
          BIN_AX="$GITHUB_WORKSPACE/bin/ax"
          [ -x "$BIN_AX" ] || { echo "[lane] bin/ax missing — B build failed" >&2; exit 1; }
          # B/M split: the TESTED tree is the CANDIDATE's (M^{tree}) — the
          # closure's semantic-set probe anchor and the decision provenance
          # bind to the tree the overlay is cut from, never B's.
          JUDG_TESTED_TREE="${{ steps.candidate-identity.outputs.m_tree }}"
          printf '%s' "$JUDG_TESTED_TREE" | grep -qE "^[0-9a-f]{40}\$" \
            || { echo "[lane] FAIL-CLOSED: candidate tree OID missing/invalid — the candidate-identity step must run before the plan" >&2; exit 1; }
          export AXIOM_JUDGMENT_CAS_ENABLED=1
          export AXIOM_JUDGMENT_CAS_TESTED_TREE_OID="$JUDG_TESTED_TREE"
          {
            echo "AXIOM_JUDGMENT_CAS_ENABLED=1"
            echo "AXIOM_JUDGMENT_CAS_TESTED_TREE_OID=$JUDG_TESTED_TREE"
          } >> "$GITHUB_ENV"
          # Per-subject plan: one decision/record/evidence file triple per
          # subject (s1a keeps its landed unsuffixed names — byte-identical
          # wire; the extension subjects are suffixed). The per-subject
          # judgment-plan consults the SAME ledger read-only under the
          # subject's own closure key.
          for s in $LANE_SUBJECTS; do
            case "$s" in
              s1a)
                DEC="$GITHUB_WORKSPACE/judgment-decision.json"
                REC="$GITHUB_WORKSPACE/judgment-record.json"
                EV="$GITHUB_WORKSPACE/judgment-evidence.json"
                DEC_ENV="AXIOM_JUDGMENT_CAS_DECISION_PATH"
                REC_ENV="AXIOM_JUDGMENT_CAS_RECORD_PATH"
                EV_ENV="AXIOM_JUDGMENT_CAS_EVIDENCE_PATH"
                ;;
              proof_integrity)
                DEC="$GITHUB_WORKSPACE/judgment-decision-proof-integrity.json"
                REC="$GITHUB_WORKSPACE/judgment-record-proof-integrity.json"
                EV="$GITHUB_WORKSPACE/judgment-evidence-proof-integrity.json"
                DEC_ENV="AXIOM_JUDGMENT_CAS_DECISION_PATH_PROOF_INTEGRITY"
                REC_ENV="AXIOM_JUDGMENT_CAS_RECORD_PATH_PROOF_INTEGRITY"
                EV_ENV="AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_PROOF_INTEGRITY"
                ;;
              d2_golden)
                DEC="$GITHUB_WORKSPACE/judgment-decision-d2-golden.json"
                REC="$GITHUB_WORKSPACE/judgment-record-d2-golden.json"
                EV="$GITHUB_WORKSPACE/judgment-evidence-d2-golden.json"
                DEC_ENV="AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_GOLDEN"
                REC_ENV="AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_GOLDEN"
                EV_ENV="AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_GOLDEN"
                ;;
              d2_persist)
                DEC="$GITHUB_WORKSPACE/judgment-decision-d2-persist.json"
                REC="$GITHUB_WORKSPACE/judgment-record-d2-persist.json"
                EV="$GITHUB_WORKSPACE/judgment-evidence-d2-persist.json"
                DEC_ENV="AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_PERSIST"
                REC_ENV="AXIOM_JUDGMENT_CAS_RECORD_PATH_D2_PERSIST"
                EV_ENV="AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_PERSIST"
                ;;
            esac
            # SourceCoherence belt: the B-built bin/ax hashes the LIVE src/
            # and refuses to run when it is not B's — so the plan MUST run
            # before the M overlay. Fail closed if src/ already drifted.
            git -C "$GITHUB_WORKSPACE" diff --quiet HEAD -- src \
              || { echo "[lane] FAIL-CLOSED: workspace src/ is not B's — the Judgment CAS plan must run BEFORE the overlay" >&2; exit 1; }
            env "$DEC_ENV=$DEC" "$REC_ENV=$REC" "$EV_ENV=$EV" \
              "$BIN_AX" cert judgment-plan --subject "$s" --decision "$DEC"
            echo "$DEC_ENV=$DEC" >> "$GITHUB_ENV"
            echo "$REC_ENV=$REC" >> "$GITHUB_ENV"
            echo "$EV_ENV=$EV" >> "$GITHUB_ENV"
            [ -f "$DEC" ] \
              || { echo "[lane] FAIL-CLOSED: judgment plan[$s] produced no decision file" >&2; exit 1; }
            echo "[lane] judgment plan[$s] decision staged: $DEC"
          done

      # ────────────────────────────────────────────────────────────────
      # B/M OVERLAY — the lane tests the CANDIDATE, executed by B:
      #   * workspace src/ := M's src/ EXACTLY (delete + copy — no stale B
      #     files survive under src/),
      #   * the lane's explicit test files + their runtime fixtures
      #     (tests/golden/) := M's bytes (the GO-critical tests are the
      #     admission contract — the candidate's versions of exactly these
      #     files ride along),
      #   * EVERYTHING ELSE stays B: Makefile, config.nims, tests/config.nims,
      #     toolchain, bin/ax — the candidate never supplies the build system
      #     or the executor (no candidate-controlled Makefile/config/workflow
      #     execution).
      # The overlay is content-addressed: overlay_manifest_digest = sha256
      # over the sorted (path, blob sha) list of the overlaid candidate tree
      # paths — derived pre-overlay by the candidate-identity step and
      # re-derived here as an equality belt — consumed by the execution
      # records + the attest-stage cross-check, so a record can never
      # outlive the exact bytes it was minted under.
      #
      # ORDER: the overlay runs AFTER the Judgment CAS plan — the plan
      # executes the B-built bin/ax, whose SourceCoherence self-check hashes
      # the LIVE src/ and refuses to run once M's src/ is in place.
      # ────────────────────────────────────────────────────────────────
      - name: "[lane] Overlay M src/+GO-critical tests onto the B workspace (manifest digest, identity log)"
        id: overlay
        run: |
          set -euo pipefail
          fail() { echo "[overlay] FAIL — $1 (fail-closed)" >&2; exit 1; }
          B_SHA="${{ inputs.baseSha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          M_SHA="${{ steps.candidate-head.outputs.m_sha }}"
          [ -d "$GITHUB_WORKSPACE/_candidate/.git" ] || fail "_candidate checkout missing"
          CAND_HEAD="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse HEAD)"
          [ "$CAND_HEAD" = "$M_SHA" ] || fail "_candidate HEAD=$CAND_HEAD != resolved M=$M_SHA"
          M_TREE="$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse 'HEAD^{tree}')" \
            || fail "cannot resolve M^{tree} from the candidate checkout"
          B_TREE="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            || fail "cannot resolve B^{tree} from the executor checkout"
          # Identity belt: the overlay re-derives the identities
          # INDEPENDENTLY of the candidate-identity step and must agree with
          # it exactly (fail-closed on drift — the identity the execution
          # records carry must describe the same candidate the plan was
          # minted for).
          [ "$M_SHA" = "${{ steps.candidate-identity.outputs.m_sha }}" ] \
            || fail "candidate sha drifted from the pre-overlay derivation"
          [ "$M_TREE" = "${{ steps.candidate-identity.outputs.m_tree }}" ] \
            || fail "M^{tree} drifted from the pre-overlay derivation"
          [ "$B_TREE" = "${{ steps.candidate-identity.outputs.b_tree }}" ] \
            || fail "B^{tree} drifted from the pre-overlay derivation"
          # Executor-tree immutability pre-record: the five executor-owned
          # surfaces are hashed BEFORE the overlay; the post-overlay guard
          # below proves the overlay never touched them.
          : > /tmp/go-overlay-executor-before.txt
          for f in Makefile config.nims tests/config.nims config/effects.nims nimble.lock; do
            printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f" >> /tmp/go-overlay-executor-before.txt
          done
          # (1) candidate src/ — exact replacement.
          rm -rf "$GITHUB_WORKSPACE/src"
          cp -a "$GITHUB_WORKSPACE/_candidate/src" "$GITHUB_WORKSPACE/src"
          # (2) the lane's explicit test files — M's bytes.
          for t in ${{ matrix.tests }}; do
            [ -f "$GITHUB_WORKSPACE/_candidate/$t" ] || fail "candidate test file missing: $t"
            mkdir -p "$(dirname "$GITHUB_WORKSPACE/$t")"
            cp -f "$GITHUB_WORKSPACE/_candidate/$t" "$GITHUB_WORKSPACE/$t"
          done
          # (3) the runtime fixtures of the overlaid tests (tests/golden/).
          mkdir -p "$GITHUB_WORKSPACE/tests/golden"
          for f in "$GITHUB_WORKSPACE"/_candidate/tests/golden/*.nim; do
            [ -e "$f" ] || continue
            cp -f "$f" "$GITHUB_WORKSPACE/tests/golden/$(basename "$f")"
          done
          # (4) executor-owned surfaces untouched (fail-closed belt).
          : > /tmp/go-overlay-executor-after.txt
          for f in Makefile config.nims tests/config.nims config/effects.nims nimble.lock; do
            printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$f" >> /tmp/go-overlay-executor-after.txt
          done
          diff -u /tmp/go-overlay-executor-before.txt /tmp/go-overlay-executor-after.txt \
            || fail "executor-owned build surfaces changed during overlay (Makefile/config must stay B's)"
          # The candidate Makefile is NEVER read: the overlay copies only src/
          # + the lane's test files + tests/golden/, and the executor-surface
          # guard above proves B's Makefile/config survived the overlay.
          # (5) overlay manifest digest — re-derived here over the overlaid
          # paths of the CANDIDATE tree and asserted equal to the
          # pre-overlay derivation (the identity of WHAT was overlaid;
          # deterministic from M).
          OVERLAY_LIST="$(git -C "$GITHUB_WORKSPACE/_candidate" ls-tree -r --full-tree "$M_TREE" -- src tests/golden ${{ matrix.tests }} | LC_ALL=C sort)"
          [ -n "$OVERLAY_LIST" ] || fail "overlay manifest list empty — the candidate tree carries no src/"
          OVERLAY_DIGEST="$(printf '%s\n' "$OVERLAY_LIST" | sha256sum | awk '{print $1}')"
          [ "$OVERLAY_DIGEST" = "${{ steps.candidate-identity.outputs.overlay_manifest_digest }}" ] \
            || fail "overlay manifest digest drifted from the pre-overlay derivation"
          # (6) toolchain identity (the executor's — measured, never asserted).
          NIM_ID="$(nim --version 2>/dev/null | head -1 || true)"
          LEAN_ID="$(lean --version 2>/dev/null | head -1 || true)"
          [ -n "$NIM_ID" ] || fail "toolchain identity: nim not resolvable (executor provisioning failed)"
          [ -n "$LEAN_ID" ] || fail "toolchain identity: lean not resolvable (executor provisioning failed)"
          TOOLCHAIN_DIGEST="$(printf '%s' "$NIM_ID | $LEAN_ID" | sha256sum | awk '{print $1}')"
          {
            echo "b_sha=$B_SHA"
            echo "b_tree=$B_TREE"
            echo "m_sha=$M_SHA"
            echo "m_tree=$M_TREE"
            echo "overlay_manifest_digest=$OVERLAY_DIGEST"
            echo "toolchain_identity=$NIM_ID | $LEAN_ID"
            echo "toolchain_digest=$TOOLCHAIN_DIGEST"
          } >> "$GITHUB_OUTPUT"
          {
            echo "[overlay] B(executor) sha=$B_SHA tree=$B_TREE"
            echo "[overlay] M(candidate) sha=$M_SHA tree=$M_TREE"
            echo "[overlay] overlay_manifest_digest=$OVERLAY_DIGEST (src + tests/golden + ${{ matrix.tests }})"
            echo "[overlay] toolchain=$NIM_ID | $LEAN_ID"
            echo "[overlay] executor surfaces: Makefile/config.nims/tests/config.nims/config.effects/nimble.lock verified B-byte-identical"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "[lane] evidenceId contract check (B-owned checker — self-check battery, EXECUTED always)"
        run: |
          set -euo pipefail
          fail() { echo "[contract-check] FAIL — $1 (fail-closed)" >&2; exit 1; }
          mkdir -p /tmp/opencode
          # (a) The checker's own fixture battery (positive legacy + strict,
          # and every rejection class) — B-owned bytes, never overlaid, never
          # CAS-eligible: it compiles against the OVERLAID src (M's
          # kernel_acceptance_authority) but carries ITS OWN normative
          # preimage formula.
          make test-fast-one T=tools/ci/check_evidence_id_contract.nim \
            || fail "evidenceId contract self-check battery failed (tool: tools/ci/check_evidence_id_contract.nim)"
          # The tool's own self-check names the contract version it enforces
          # (the core SSOT constant) — export it for the execution records.
          CONTRACT_VERSION="$(/tmp/opencode/ax-one --self-check 2>/dev/null | grep -o 'contract evidence-id-contract\.[a-z0-9.]*' | awk '{print $2}' || true)"
          printf '%s' "$CONTRACT_VERSION" | grep -qE '^evidence-id-contract\.[a-z0-9.]+$' \
            || fail "cannot read the contract version from the checker's self-check output"
          echo "GO_CONTRACT_VERSION=$CONTRACT_VERSION" >> "$GITHUB_ENV"
          echo "[contract-check] contract version: $CONTRACT_VERSION"
          # (b) The real-chain probe: executes the canonical chain through
          # the OVERLAID candidate src/ and hands the raw CLE components to
          # the B-owned checker — claimed==recomputed or FAIL.
          make test-fast-one T=tests/unit/test_evidence_id_contract_probe.nim \
            || fail "evidenceId contract probe failed (real chain vs B-owned recomputation)"
          echo "[contract-check] PASS — contract check EXECUTED+PASS (self-check battery + real-chain probe, contract=evidence-id-contract.v1)"

      # ────────────────────────────────────────────────────────────────
      # THE GO-CRITICAL TESTS — this lane's half of the DEBT#432 set, the
      # serial step's loop vocabulary verbatim (RUN/PASS/FAIL markers,
      # REUSED skip branch, EXECUTED basis reporting, FAILS accumulation,
      # fail-closed aggregate exit) plus the parallel-era per-test LANE
      # duration rows the GO-critical economics extractor consumes
      # (tools/ci/go_critical_parallel_extraction.sh).
      # Non-zero propagation (E3): test failure → `nim c -r` non-zero →
      # make non-zero → FAILS>0 → this step exits 1 → lane job fails →
      # callee workflow red → the caller's `attest` wrapper red →
      # aggregate required check FAIL → merge blocked.
      # ────────────────────────────────────────────────────────────────
      - name: "[lane] GO-critical admission tests (DEBT#432 — lane ${{ matrix.lane }}, fail-closed)"
        run: |
          set -euo pipefail
          fail() { echo "[admission-tests] FAIL — $1 (fail-closed)" >&2; exit 1; }
          # test-fast-one writes its binary to -o:/tmp/opencode/ax-one; the
          # parent directory is not guaranteed to exist on a fresh runner.
          mkdir -p /tmp/opencode
          # J3 supply-observation line (evidence, not authority — serial-step
          # vocabulary verbatim): the B-layer restore may already carry
          # build/nimcache/test — the compile supply of this lane's tests.
          # N>0 = restored supply (warm), N=0 = cold. The judgment is
          # untouched either way — cache is acceleration, never evidence.
          TEST_SUPPLY_N=0
          if [ -d build/nimcache/test ]; then
            TEST_SUPPLY_N=$(find build/nimcache/test -type f 2>/dev/null | wc -l | tr -d ' ')
          fi
          echo "[test-supply] restored build/nimcache/test entries=$TEST_SUPPLY_N (J3 supply — acceleration only)"
          FAILS=0
          TOTAL=0
          PASS_N=0
          REUSED_N=0
          # Execution-record constants (the wire of the B/M/CAS execution
          # accounting — schema + validators live in
          # src/verification/judgment_cas.nim
          # (JudgmentExecutionRecordSchema); the attest stage cross-checks
          # these files against the subjects' decision files fail-closed).
          EXEC_SCHEMA="axiom.judgment.cas.execution.v2"
          B_TREE="${{ steps.overlay.outputs.b_tree }}"
          M_SHA="${{ steps.overlay.outputs.m_sha }}"
          M_TREE="${{ steps.overlay.outputs.m_tree }}"
          OVERLAY_DIGEST="${{ steps.overlay.outputs.overlay_manifest_digest }}"
          TOOLCHAIN_DIGEST="${{ steps.overlay.outputs.toolchain_digest }}"
          CONTRACT_VERSION="${{ env.GO_CONTRACT_VERSION }}"
          [ -n "$B_TREE" ] && [ -n "$M_TREE" ] && [ -n "$OVERLAY_DIGEST" ] \
            || fail "overlay identity outputs missing — the overlay step must run first"
          [ -n "$TOOLCHAIN_DIGEST" ] || fail "toolchain identity digest missing"
          [ -n "$CONTRACT_VERSION" ] || fail "contract version missing (the contract-check step must run first)"
          # Judgment identity belt — the tested tree the plan was minted with
          # and the overlay digest the execution records carry must be the SAME
          # values. AXIOM_JUDGMENT_CAS_TESTED_TREE_OID is the LIVE process
          # contract of the plan (the closure's probe anchor);
          # AXIOM_JUDGMENT_OVERLAY_MANIFEST_DIGEST is a workflow-internal
          # consistency value (no process reads it). The belt binds only when
          # the plan actually ran (SL-15 in scope) — a skipped plan carries no
          # CAS identity to bind.
          if [ "${AXIOM_JUDGMENT_CAS_ENABLED:-}" = "1" ]; then
            [ "${AXIOM_JUDGMENT_CAS_TESTED_TREE_OID:-}" = "$M_TREE" ] \
              || fail "AXIOM_JUDGMENT_CAS_TESTED_TREE_OID != the tested tree $M_TREE carried by the execution record (fail-closed)"
            [ "${AXIOM_JUDGMENT_OVERLAY_MANIFEST_DIGEST:-}" = "$OVERLAY_DIGEST" ] \
              || fail "AXIOM_JUDGMENT_OVERLAY_MANIFEST_DIGEST != the overlay manifest digest carried by the execution record (fail-closed)"
          fi
          mkdir -p go-exec-records
          write_exec_record() {
            local subject="$1" verdict="$2" basis="$3" key="$4" evsha="$5"
            local ts; ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq -n \
              --arg schema "$EXEC_SCHEMA" --arg subject "$subject" \
              --arg verdict "$verdict" --arg basis "$basis" \
              --arg key "$key" --arg evsha "$evsha" \
              --arg executorTree "$B_TREE" --arg candidateTree "$M_TREE" \
              --arg candidateHead "$M_SHA" --arg overlay "$OVERLAY_DIGEST" \
              --arg bundle "$TOOLCHAIN_DIGEST" --arg contract "$CONTRACT_VERSION" \
              --arg observed "$ts" \
              '{schemaVersion:$schema, subject:$subject, verdict:$verdict,
                basis:$basis, evidenceKey:$key, evidenceSha256:$evsha,
                identities:{schemaVersion:$schema, executorTreeOid:$executorTree,
                  candidateTreeOid:$candidateTree, candidateHeadSha:$candidateHead,
                  overlayManifestDigest:$overlay, toolchainBundle:$bundle,
                  contractVersion:$contract},
                observedAtUtc:$observed}' > "go-exec-records/$subject.json"
            echo "[admission-tests] exec-record[$subject] verdict=$verdict basis=$basis evidenceKey=${key:0:12} evidenceSha256=${evsha:0:12}"
          }
          subject_of() {
            case "$1" in
              tests/unit/test_s1a_lean_golden.nim) echo "s1a" ;;
              tests/unit/proof_integrity_test.nim) echo "proof_integrity" ;;
              tests/unit/test_d2_golden.nim) echo "d2_golden" ;;
              tests/unit/test_d2_persist.nim) echo "d2_persist" ;;
              *) echo "" ;;
            esac
          }
          decision_of() {
            case "$1" in
              tests/unit/test_s1a_lean_golden.nim) echo "${AXIOM_JUDGMENT_CAS_DECISION_PATH:-}" ;;
              tests/unit/proof_integrity_test.nim) echo "${AXIOM_JUDGMENT_CAS_DECISION_PATH_PROOF_INTEGRITY:-}" ;;
              tests/unit/test_d2_golden.nim) echo "${AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_GOLDEN:-}" ;;
              tests/unit/test_d2_persist.nim) echo "${AXIOM_JUDGMENT_CAS_DECISION_PATH_D2_PERSIST:-}" ;;
            esac
          }
          evidence_file_of() {
            case "$1" in
              tests/unit/test_s1a_lean_golden.nim) echo "${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH:-}" ;;
              tests/unit/proof_integrity_test.nim) echo "${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_PROOF_INTEGRITY:-}" ;;
              tests/unit/test_d2_golden.nim) echo "${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_GOLDEN:-}" ;;
              tests/unit/test_d2_persist.nim) echo "${AXIOM_JUDGMENT_CAS_EVIDENCE_PATH_D2_PERSIST:-}" ;;
            esac
          }
          for t in ${{ matrix.tests }}; do
            SUB="$(subject_of "$t")"
            [ -n "$SUB" ] || fail "unmapped GO-critical test '$t' — every lane test must have a judgment subject identity"
            DEC="$(decision_of "$t")"
            if [ -n "$DEC" ] && [ -f "$DEC" ]; then
              # Decision-file identity belt: the decision the plan minted must
              # name the SAME tested tree the execution record carries, and
              # its basis must be one of the two admissible verdicts.
              DEC_PROBE_TREE="$(jq -r '.probeTreeOid // ""' "$DEC" 2>/dev/null || true)"
              [ "$DEC_PROBE_TREE" = "$M_TREE" ] \
                || fail "decision[$SUB] probeTreeOid='$DEC_PROBE_TREE' != the tested tree $M_TREE (fail-closed)"
              DEC_BASIS="$(jq -r '.basis // ""' "$DEC" 2>/dev/null || true)"
              case "$DEC_BASIS" in
                EXECUTED|REUSED) : ;;
                *) fail "decision[$SUB] basis='$DEC_BASIS' is neither EXECUTED nor REUSED (fail-closed)" ;;
              esac
            fi
            if [ -n "$DEC" ] && [ -f "$DEC" ] \
               && grep -q '"basis":"REUSED"' "$DEC" 2>/dev/null; then
              # The REUSED skip is admissible for EVERY judgment subject —
              # s1a included (v5: the 2026-10-18 redecision became the
              # contract). The authorization is never this lane: the stored
              # record is re-fetched and FULLY re-verified by the armed
              # attest (the 5 conditions of docs/spec/
              # test_judgment_cas_contract.md §5), and the exec row records
              # the skip as UNKNOWN/REUSED (a skip is not an outcome).
              case "$SUB" in
                s1a|proof_integrity|d2_golden|d2_persist)
                  RKEY="$(jq -r '.evidenceKey // ""' "$DEC" 2>/dev/null || true)"
                  echo "[admission-tests] SKIP — $t (AXIOM_JUDGMENT_CAS basis=REUSED — record re-verified at plan time, re-verified again at attest; rootRecord provenance required)"
                  write_exec_record "$SUB" "UNKNOWN" "REUSED" "$RKEY" ""
                  REUSED_N=$((REUSED_N + 1))
                  continue
                ;;
              esac
            fi
            TOTAL=$((TOTAL + 1))
            echo "[admission-tests] RUN make test-fast-one T=$t"
            t0=$(date +%s%3N)
            if make test-fast-one T="$t"; then
              t1=$(date +%s%3N)
              echo "[admission-tests] LANE lane=${{ matrix.lane }} $(basename "$t" .nim) duration_ms=$((t1 - t0)) — $t"
              EVF="$(evidence_file_of "$t")"
              EVSHA=""
              if [ -n "$EVF" ] && [ -f "$EVF" ]; then
                EVSHA="$(sha256sum "$EVF" | awk '{print $1}')"
              fi
              write_exec_record "$SUB" "PASS" "EXECUTED" \
                "$(jq -r '.evidenceKey // ""' "$DEC" 2>/dev/null || true)" "$EVSHA"
              PASS_N=$((PASS_N + 1))
              if [ "${AXIOM_JUDGMENT_CAS_ENABLED:-}" = "1" ]; then
                echo "[admission-tests] PASS — $t (basis=EXECUTED — fresh judgment measured)"
              else
                echo "[admission-tests] PASS — $t"
              fi
            else
              t1=$(date +%s%3N)
              echo "[admission-tests] LANE lane=${{ matrix.lane }} $(basename "$t" .nim) duration_ms=$((t1 - t0)) result=FAIL — $t"
              echo "[admission-tests] FAIL — $t (make test-fast-one non-zero)"
              write_exec_record "$SUB" "FAIL" "EXECUTED" \
                "$(jq -r '.evidenceKey // ""' "$DEC" 2>/dev/null || true)" ""
              FAILS=$((FAILS + 1))
            fi
          done
          # Outcome-only rejection (v5): a lane must carry at least one
          # OUTCOME — EXECUTED or verified-REUSED. A zero-outcome lane is
          # never green (the theater prohibition). An all-REUSED lane IS
          # admissible for every subject of the v5 generation: each REUSED
          # row passed the 5 contract conditions at plan time and is fully
          # re-verified by the armed attest — the lane itself never
          # authorizes a skip.
          if [ "$TOTAL" -lt 1 ] && [ "$REUSED_N" -lt 1 ]; then
            fail "outcome-less lane — 0/$((TOTAL + REUSED_N)) GO-critical judgments carried an outcome (EXECUTED or verified-REUSED); a zero-outcome lane is never green (fail-closed)"
          fi
          # The s1a lane must show EXACTLY one GO-critical judgment — the
          # terminal admission contract's own judgment — and its exec record
          # must be EITHER the fresh EXECUTED+PASS row OR the UNKNOWN/REUSED
          # row the reuse path writes (v5: the s1a judgment follows the same
          # 5-condition machinery as the probe subjects; the attest re-checks
          # the REUSED leg field-by-field against the re-fetched record).
          if [ "${{ matrix.lane }}" = "0" ]; then
            [ "$((TOTAL + REUSED_N))" -eq 1 ] || fail "s1a lane executed $((TOTAL + REUSED_N)) test(s) — expected exactly 1 (the 1/1 GO-critical contract)"
            [ "$FAILS" -eq 0 ] || fail "s1a lane FAILED — the admission verdict cannot rest on an unexecuted/failed judgment"
            # jq -e, not grep: the record is jq-pretty-printed
            # ("verdict": "PASS" — with a space), so a byte-grep on the
            # compact form can never match and the lane would fail after a
            # PASSING test (measured: run 39480186867, lane-0 job — the
            # record was written verdict=PASS/basis=EXECUTED and the guard
            # still failed). jq validates the parsed value, independent of
            # formatting.
            [ -f go-exec-records/s1a.json ] \
              && jq -e '(.verdict == "PASS" and .basis == "EXECUTED") or (.verdict == "UNKNOWN" and .basis == "REUSED")' go-exec-records/s1a.json >/dev/null 2>&1 \
              || fail "s1a execution record missing or verdict/basis inconsistent — an EXECUTED+PASS row or a REUSED (UNKNOWN) row is required (fail-closed)"
            echo "[admission-tests] s1a 1/1 — the s1a judgment is EXECUTED+PASS or REUSED (the 5-condition reuse path; the attest re-verifies the REUSED leg)"
          fi
          [ "$FAILS" -eq 0 ] || fail "$FAILS/$TOTAL GO-critical admission test(s) failed — the admission verdict cannot rest on an unsound verifier"
          echo "[admission-tests] PASS — EXECUTED $PASS_N/$TOTAL, REUSED(skip) $REUSED_N (lane=${{ matrix.lane }}: ${{ matrix.tests }}); every GO-critical judgment carries an outcome (EXECUTED or REUSED — never none)"

      # Judgment files → the attest job's armed attest (consumption
      # needs-edge; artifact identity mirrors the judgment-record upload
      # convention: <candidate head>-<run_attempt>). always(): post-mortem
      # reachability when a lane failed AFTER producing records (the
      # attest-side fail-closed record loop still decides). s1a's files are
      # unsuffixed; the extension subjects are suffixed — the union of both
      # lane artifacts is exactly the 12-file set the serial pipeline
      # staged in one workspace.
      - name: "[lane] Upload judgment files (post-mortem reachability — always)"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-judgment-lane-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: |
            judgment-decision.json
            judgment-record.json
            judgment-evidence.json
            judgment-decision-proof-integrity.json
            judgment-record-proof-integrity.json
            judgment-evidence-proof-integrity.json
            judgment-decision-d2-golden.json
            judgment-record-d2-golden.json
            judgment-evidence-d2-golden.json
            judgment-decision-d2-persist.json
            judgment-record-d2-persist.json
            judgment-evidence-d2-persist.json
            go-exec-records/
          if-no-files-found: warn
          retention-days: 30

      # Test-mode compile supply → the attest job's J3 fold (union into the
      # published `admission-check-base-nimcache` carrier — the serial
      # pipeline's fold contract, supply re-sourced). Success-gated (not
      # always) mirroring the serial fold: only a green lane's cache feeds
      # the published carrier. Absence is a J3 degrade, never a failure.
      - name: "[lane] Upload nimcache (test supply — J3 fold input)"
        if: inputs.stage == 'attest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-nimcache-lane-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}-${{ github.run_attempt }}
          path: build/nimcache
          if-no-files-found: warn
          retention-days: 3

  # ────────────────────────────────────────────────────────────────
  # go-critical-rollup — fail-closed all-lanes-success enforcement for the
  # landing venue (pre-registration §2-(v): skipped/cancelled lanes are
  # NEVER green). needs.go-critical-lane.result is the matrix's WORST leg
  # result — 'success' is reachable only when every lane succeeded. The
  # rollup carries the same landing `if` as the lanes, so on the PR
  # preflight and the verdict stage it skips like them (the caller's
  # aggregate ignores callee skips — GitHub native); on the landing venue
  # it runs even when the lanes failed or were cancelled (always()), and
  # any non-success result REDS the callee workflow → the caller's
  # `attest` wrapper → the aggregate required check. This job consumes the
  # existing fail-closed aggregation — it introduces no new aggregation
  # authority (Authority ≠ Adapter): the caller's wrapper-result rule
  # remains the sole required-check authority, this is the callee-side
  # skip-guard that keeps a vanished lane matrix from ever reading as
  # green. Per-lane conclusions and runner isolation remain externally
  # observable in the run's native job list (the S1 measurement tooling
  # reads them there); this job needs no extra token scope for that.
  # ────────────────────────────────────────────────────────────────
  go-critical-rollup:
    needs: [go-critical-lane]
    if: >-
      always() &&
      inputs.stage == 'attest' &&
      (github.event_name == 'merge_group' || github.event_name == 'workflow_call')
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "[go-rollup] Every lane must be success (skipped/cancelled → FAILURE, never green)"
        env:
          LANE_RESULT: ${{ needs.go-critical-lane.result }}
        run: |
          set -euo pipefail
          fail() { echo "[go-rollup] FAIL — $1 (fail-closed)" >&2; exit 1; }
          echo "[go-rollup] needs.go-critical-lane.result=$LANE_RESULT"
          case "$LANE_RESULT" in
            success) ;;
            *) fail "go-critical-lane matrix result=$LANE_RESULT — the landing verdict requires every lane == success; a skipped or cancelled lane is never green (pre-registration §2-(v), fail-closed)" ;;
          esac
          echo "[go-rollup] PASS — all lanes success; landing aggregate fail-closed rollup verified"
