# axiom-operational-slice — the product's operational slice, as a required check.
#
# This job runs the REAL `ax prove` and replays the SAME certificate through the
# Lean kernel via `make verify-contract-release-e2e-full` — the certificate the
# prove produced is the certificate the kernel accepts.
# The job id IS the check-run context; the job is designed to become a required
# check. It must NEVER be conditionally skipped: a skipped required check reports
# success — so no job-level or step-level `if:` may gate it. `if: always()` on
# the artifact upload only widens execution (evidence survives a failure).
# Producers: `tools/ci/run_manifest.jq` + Makefile `verify-contract-release-e2e-full`.

name: axiom-operational-slice

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-operational-slice-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  # The job id IS the check-run context — do not add a job-level `name:` key
  # (it would rename the context and break required-check registration).
  axiom-operational-slice:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-axiom-toolchain
        id: setup-tc
        with:
          cache-build-source: ${{ github.sha }}
      - name: "S5 gate: B-verified supply-reuse eligibility (5-member SHA-256 + 4x SourceCoherence)"
        id: s5-gate
        if: steps.setup-tc.outputs.b-cache-hit == 'true'
        env:
          EXPECT_B_IDENTITY: ${{ steps.setup-tc.outputs.b-identity }}
          EXPECT_B_KEY: ${{ steps.setup-tc.outputs.b-key }}
        run: |
          set -uo pipefail
          probe_fail=0
          if [ ! -f build/.axiom-b-fingerprint.json ]; then
            echo "[S5] gate: FAIL — build/.axiom-b-fingerprint.json missing; eligibility withheld"
            probe_fail=1
          elif ! jq -e --arg bsha "$EXPECT_B_IDENTITY" --arg bkey "$EXPECT_B_KEY" \
            '.schema == "axiom-b-fingerprint-v1" and .buildSha == $bsha and .bKey == $bkey' \
            build/.axiom-b-fingerprint.json >/dev/null 2>&1; then
            echo "[S5] gate: FAIL — fingerprint manifest identity mismatch; eligibility withheld"
            probe_fail=1
          else
            for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas proofs/.lake/build/bin/ircheck; do
              if [ ! -x "$f" ]; then
                echo "[S5] gate: FAIL — required supply binary missing or not executable: $f"
                probe_fail=1
              else
                exp_sha="$(jq -r --arg k "$f" '.files[$k] // empty' build/.axiom-b-fingerprint.json 2>/dev/null || true)"
                act_sha="$(sha256sum "$f" | cut -d' ' -f1)"
                if [ -z "$exp_sha" ] || [ "$exp_sha" != "$act_sha" ]; then
                  echo "[S5] gate: FAIL — SHA-256 mismatch for $f (expected=$exp_sha actual=$act_sha)"
                  probe_fail=1
                fi
              fi
            done
          fi
          for b in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas; do
            if [ -x "$b" ] && AXIOM_ROOT= "$b" --check-provenance >/dev/null 2>&1; then
              echo "[S5] gate: OK — restored $b embedded BuildSourceHash == live trusted tree"
            else
              echo "[S5] gate: FAIL — restored $b provenance mismatch (SourceCoherence FATAL); eligibility withheld"
              probe_fail=1
            fi
          done
          if [ "$probe_fail" -eq 0 ]; then
            echo "s5-skip=true" >> "$GITHUB_OUTPUT"
            echo "[S5] gate: ELIGIBLE — 5/5 SHA-256 digests and 4/4 SourceCoherence probes passed; 4-binary recompile skipped"
          else
            echo "[S5] gate: DISCARD — purging B-cache paths to enforce clean cold build"
            rm -rf build/nimcache .axiom/cache proofs/.lake proofs/build
            rm -f build/.axiom-b-fingerprint.json bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas
          fi
      - name: Build the release verifier (ci-compile authority)
        # make ci-compile (ci/checker.mk) is THE release build authority:
        # -d:release + AXIOM_HERMETIC_BUILDING=1 for ax/gate_hook/precompile_gates/
        # install_ax_cas; on a B-layer cache HIT it skips recompiles and instead
        # re-asserts each restored binary's provenance via --check-provenance
        # (fail-closed). `make build` was a -d:allowMissingZ3 nim-check build.
        env:
          AXIOM_S5_BUILD_SKIP: ${{ steps.s5-gate.outputs.s5-skip == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$AXIOM_S5_BUILD_SKIP" = "1" ]; then
            echo "SUPPLY REUSE — verified payload restored; measuring build_env.nim VerifierBuildId then skipping 4-binary recompile (J3 §3.1)"
            make -f ci/checker.mk ci-compile-hermetic-measure
            AXIOM_S5_BUILD_SKIP=1 make ci-compile -j4
          else
            echo "S5 COLD BUILD — verified supply absent; purging residual B-cache paths and compiling from clean state with -j4"
            rm -rf build/nimcache .axiom/cache proofs/.lake proofs/build
            rm -f build/.axiom-b-fingerprint.json bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas
            make ci-compile -j4
          fi
      - name: Build the Lean reference extractor (ircheck)
        # The canonical prove path seals subject binding via
        # proofs/.lake/build/bin/ircheck (lakefile.lean: `lean_exe ircheck`).
        # On a cold B-layer cache (new head SHA) it is not restored, and the
        # reference-extractor miss demotes the node to NOT_VERIFIABLE — so
        # build it from the checked-out tree before proving. On a verified
        # B-layer HIT, Lake's content-addressed .trace files verify that
        # proofs/**/*.lean hashes match and replay in ~5s without recompiling.
        run: lake build ircheck
        working-directory: proofs
      - name: Restore tracked build metadata after make build
        run: git restore src/generated/build_metadata.json

      - name: R3 relocation-invariance measurement (wp5)
        run: |
          set -euo pipefail
          AXIOM_HERMETIC_BUILDING=1 nim c --path:src -d:release --hints:off -o:bin/wp5_relocation_measure tools/ci/wp5_relocation_measure.nim
          mkdir -p logs
          bin/wp5_relocation_measure --repo-root . --out logs/r3_relocation.json
          jq -e --arg head "$GITHUB_SHA" \
                --arg td "$(printf '%s' "$(git ls-tree -r HEAD)" | sha256sum | cut -d' ' -f1)" '
            .schemaVersion == 1 and .invariantId == "R3" and
            .repoIdentity.workingTreeClean == true and
            .repoIdentity.head == $head and .repoIdentity.treeDigest == $td and
            ([.observations[] | select(.key=="pathIndependentProjectionEqual")  | .value] == [true]) and
            ([.observations[] | select(.key=="subjectRunProjectionHashEqual")  | .value] == [true]) and
            ([.observations[] | select(.key=="negativeControlDigestDifferent") | .value] == [true]) and
            ([.observations[] | select(.key=="commentOnlyProjectionStable")    | .value] == [true]) and
            ([.incidents[]? | select(.severity == "warning")] | length == 0)
          ' logs/r3_relocation.json
          sha256sum logs/r3_relocation.json | awk '{print $1}' | tee logs/r3_relocation.sha256
      - name: Prove, replay the same certificate through the kernel, assert the verdict
        run: make verify-contract-release-e2e-full
      - name: Emit the run manifest and assert provenance (expected vs actual, fail-closed)
        # expected: git + src/generated/build_env.nim (declared identity of this
        #   checkout; hermetic_build is the SSOT writer of that file)
        # actual:   the built binary's own verdict (bin/ax --check-provenance)
        # engineBuild mirrors attestation_orchestrator.verifierEngineBuildId:
        # a 64-hex VerifierBuildId is recorded ONLY when the source hash it was
        # measured for equals the compiled BuildSourceHash; every other value
        # (including the .default "unmeasured" seed) is a measurement regression
        # and fails closed. Furthermore, measured VerifierBuildId on disk must
        # equal the binary's persisted state (.executionIdentity.verifierBuildId)
        # and the emitted manifest (.toolchain.engineBuild) — 3-way identity.
        run: |
          set -euo pipefail
          fail() { echo "PROVENANCE ASSERT FAIL: $1" >&2; exit 1; }
          EXPECTED_GIT_HEAD="$(git rev-parse HEAD)"
          EXPECTED_BIN_SHA="$(sha256sum bin/ax | cut -d' ' -f1)"
          ENV_FILE="src/generated/build_env.nim"
          RAW_ENGINE_BUILD="$(sed -n 's/^  VerifierBuildId\* = "\(.*\)"$/\1/p' "$ENV_FILE")"
          FILE_BUILD_SOURCE_HASH="$(sed -n 's/^  BuildSourceHash\* = "\(.*\)"$/\1/p' "$ENV_FILE")"
          FILE_VB_SOURCE_HASH="$(sed -n 's/^  VerifierBuildSourceHash\* = "\(.*\)"$/\1/p' "$ENV_FILE")"
          [ -n "$FILE_BUILD_SOURCE_HASH" ] || fail "$ENV_FILE has an empty BuildSourceHash (seeded .default, seed guard did not run)"
          PROV_OUT="$(bin/ax --check-provenance)" || fail "--check-provenance rejected bin/ax"
          ACTUAL_BUILD_SOURCE_HASH="$(printf '%s\n' "$PROV_OUT" | sed -n 's/.*live src tree (\(.*\))$/\1/p')"
          [ -n "$ACTUAL_BUILD_SOURCE_HASH" ] || fail "unparseable provenance verdict: $PROV_OUT"
          [ "$ACTUAL_BUILD_SOURCE_HASH" = "$FILE_BUILD_SOURCE_HASH" ] || fail "binary-embedded tree hash $ACTUAL_BUILD_SOURCE_HASH != $ENV_FILE BuildSourceHash $FILE_BUILD_SOURCE_HASH"
          if printf '%s' "$RAW_ENGINE_BUILD" | grep -Eq '^[0-9a-f]{64}$' && [ "$FILE_VB_SOURCE_HASH" = "$FILE_BUILD_SOURCE_HASH" ]; then
            ENGINE_BUILD="$RAW_ENGINE_BUILD"
          else
            fail "engineBuild is unmeasured for this tree (VerifierBuildId='$RAW_ENGINE_BUILD' VerifierBuildSourceHash='$FILE_VB_SOURCE_HASH' BuildSourceHash='$FILE_BUILD_SOURCE_HASH') — fail-closed"
          fi
          STATE_ENGINE_BUILD="$(jq -r '.executionIdentity.verifierBuildId // empty' logs/ax_proof_state.json)"
          [ "$STATE_ENGINE_BUILD" = "$ENGINE_BUILD" ] || fail "state verifierBuildId '$STATE_ENGINE_BUILD' != measured ENGINE_BUILD '$ENGINE_BUILD' (split-brain between restored binary and build_env.nim)"
          DIRTY="$(git status --porcelain -- src ':(exclude)src/generated' config.nims config/effects.nims src/gate/config.nims Makefile axiom.nimble axiom.lock proofs/lean-toolchain)"
          [ -z "$DIRTY" ] || fail "verifier build inputs dirty vs HEAD: $DIRTY"
          CERT="$(cat logs/verify_contract_e2e_cert_path.txt)"
          jq -n -S -c -j --slurpfile cert "$CERT" --slurpfile st logs/ax_proof_state.json --slurpfile rep logs/verify_contract_e2e_report.json --arg certPath "$CERT" --arg scopeHash "$(bin/ax scope hash)" --arg gitHead "$EXPECTED_GIT_HEAD" --arg binSha "$EXPECTED_BIN_SHA" --arg engineBuild "$ENGINE_BUILD" --arg buildSourceHash "$ACTUAL_BUILD_SOURCE_HASH" --arg lockSha "$(sha256sum data/verification_scope.lock | cut -d' ' -f1)" --arg canon "$(bin/ax report --canonical-digest)" --arg certSha "$(sha256sum "$CERT" | cut -d' ' -f1)" --arg node "src/core/orchestrator/orchestrator_api.nim::normalizeMaxWorkers" --argjson proveExit 0 --argjson kernelExit 0 --argjson reportExit "$(cat logs/verify_contract_e2e_report_exit.txt)" --arg kernelOut "$(cat logs/verify_contract_e2e_kernel.out)" -f tools/ci/run_manifest.jq > logs/run-manifest.json
          [ "$(jq -r '.sourceTree.gitHead' logs/run-manifest.json)" = "$EXPECTED_GIT_HEAD" ] || fail "manifest gitHead != $EXPECTED_GIT_HEAD"
          [ "$(jq -r '.binary.sha256' logs/run-manifest.json)" = "$EXPECTED_BIN_SHA" ] || fail "manifest binary.sha256 != $EXPECTED_BIN_SHA"
          [ "$(jq -r '.toolchain.engineBuild' logs/run-manifest.json)" = "$ENGINE_BUILD" ] || fail "manifest engineBuild != $ENGINE_BUILD"
          [ "$(jq -r '.sourceTree.buildSourceHash' logs/run-manifest.json)" = "$ACTUAL_BUILD_SOURCE_HASH" ] || fail "manifest buildSourceHash != $ACTUAL_BUILD_SOURCE_HASH"
          sha256sum logs/run-manifest.json | awk '{print $1}' | tee logs/run-manifest.sha256
          cat logs/run-manifest.json
          echo "PROVENANCE ASSERTION: OK — gitHead/binary.sha256/engineBuild/buildSourceHash expected==actual==state (tree=$ACTUAL_BUILD_SOURCE_HASH engine=$ENGINE_BUILD)"
      - name: Determinism ratchet — cold serial↔parallel prove equality (DEBT#508)
        # The end-to-end determinism ratchet (DEBT#508 closure). Two COLD
        # `ax prove --limit 20` legs (workers=1 / workers=2, sibling vaults
        # under one base temp dir, .axiom/cache snapshot-restored before each
        # leg) must agree on: the SHA-256 normalized-output digest, the vault
        # certificate substance digest, the documented exit pair serial=1 /
        # parallel=0 (the PR #1085 "Known non-claims" VS-1 Phase-1 accounting
        # divergence — pinned, drift fails loudly), and ZERO timeout lines
        # (guarded on the RAW output before any normalization — a timeout is
        # a failure, never a filter target). Wired here because this check is
        # the live required surface that runs the real prove path on every
        # PR/merge_group/main push; the gateway landing lane that would carry
        # it via the LG policy is SL-09 (not yet promoted — epoch N+7).
        # Coherent generation (AGENTS.md §2.5): single atomic step addition to
        # this workflow's existing job — the check identity is unchanged and
        # this PR's own run of this check self-validates the new step.
        run: |
          set -euo pipefail
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/debt508_ratchet -o:build/debt508_ratchet tests/gateway/deterministic_parallel_proof_test.nim
          ./build/debt508_ratchet
      - name: Observation-reuse contract — L4 acceptance reader (state transitions + call budget)
        # The L4 reader (tools/ci/landing_observe.sh --main <sha>) is the surface
        # every observation-cost claim would be reported from: its exit codes
        # (one per state: 0 SUCCESS / 1 FAILURE / 2 UNKNOWN / 3 PENDING /
        # 4 STALE / 5 NOT_RUN) and its API-call budget (cold 3, warm cache 2,
        # --offline 0). The same file is listed in `make test-unit`, which no CI
        # target runs — a check no CI target executes is a declaration, not a
        # check (AGENTS.md §0.9). Executed here, in this job, so the guard runs
        # on every pull_request / merge_group / main push.
        # Zero network: a stub `gh` on PATH plus fixture artifacts in a temp dir.
        # Coherent generation (AGENTS.md §2.5): single atomic step addition to
        # this workflow's existing job — the check identity is unchanged and
        # this PR's own run of this check self-validates the new step.
        run: |
          set -euo pipefail
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/landing_observe_contract -o:build/landing_observe_contract tests/ci/test_landing_observe_acceptance.nim
          ./build/landing_observe_contract
      - name: "Expose this run's certificate to the evidence artifact (fixed alias)"
        # The certificate lives in this workspace at the vault path recorded in
        # logs/verify_contract_e2e_cert_path.txt, but the evidence artifact
        # below carried only logs/* files — the readiness job's collector never
        # saw the cert and measured R2/R3/R4 fail-closed (null/false) even
        # though this E2E had produced and kernel-replayed it (PR #121 run
        # 43870500798). Fix: copy the declared certificate to the fixed alias
        # logs/e2e_certificate.json so it rides the SAME artifact — the layout
        # stays single-rooted (no flip when the cert is absent) and the
        # collector resolves the alias as its 4th candidate. Content binding is
        # enforced by the R4 joins (manifest.certificate.identityDigest and
        # manifest.certificate.sha256 vs the resolved file) — a foreign file
        # fails R4, never a silent pass. Absence stays honest: no cert -> no
        # alias file -> the upload warns for the missing listed path and the
        # collector measures null (fail-closed verdict, not an infra failure).
        if: always()
        run: |
          set -eu
          CERT_PATH=logs/verify_contract_e2e_cert_path.txt
          if [ -s "$CERT_PATH" ]; then
            CERT="$(cat "$CERT_PATH")"
            if [ -n "$CERT" ] && [ -f "$CERT" ]; then
              cp "$CERT" logs/e2e_certificate.json
              echo "certificate alias: logs/e2e_certificate.json <- $CERT"
            else
              echo "declared certificate '$CERT' not on disk — honest absence (collector measures null, fail-closed)"
            fi
          else
            echo "no $CERT_PATH (E2E did not reach certificate emission) — honest absence (collector measures null, fail-closed)"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: axiom-operational-slice-evidence
          path: |
            logs/verify_contract_e2e_report.json
            logs/verify_contract_e2e_report_exit.txt
            logs/verify_contract_e2e_cert_path.txt
            logs/verify_contract_e2e_kernel.out
            logs/run-manifest.json
            logs/run-manifest.sha256
            logs/ax_proof_state.json
            logs/e2e_certificate.json
          # upload-artifact v4+ artifacts are immutable and name-unique per run;
          # a re-run re-uploads this fixed name — overwrite replaces it
          # deterministically instead of failing (Q1: docs/spec/github_artifact_attempt_quirks.md).
          overwrite: true
      - name: Upload R3 relocation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiom-operational-slice-r3
          path: |
            logs/r3_relocation.json
            logs/r3_relocation.sha256
          retention-days: 30
          # upload-artifact v4+ artifacts are immutable and name-unique per run;
          # a re-run re-uploads this fixed name — overwrite replaces it
          # deterministically instead of failing (Q1: docs/spec/github_artifact_attempt_quirks.md).
          overwrite: true

  # readiness-verdict — DEBT#537 closure: the R1–R8 evidence → evaluator →
  # verdict → exit chain as a merge-admission check (the 7th required
  # context; the ruleset PUT is the operator's POST-landing step — ADR-0037
  # operator-PUT-first ordering). Contract: docs/spec/readiness_verdict_check.md.
  # The job id IS the check-run context — no job-level `name:` key (it would
  # rename the context and break required-check registration; same rule as the
  # job above). Designed to become a required check, so it must NEVER be
  # conditionally skipped — a skipped required check reports success: the only
  # job-level `if:` is `!cancelled()` (the job runs even when the producer job
  # failed — fail-closed: the verdict is still computed over whatever evidence
  # the producer's `if: always()` uploads preserved; an absent artifact fails
  # this job red, never green), and no step may gain a conditional `if:`
  # except the upload's `always()`. Triggers are the workflow's `on:` header —
  # no path filter.
  # Coherent generation (AGENTS.md §2.5, the DEBT#508 step pattern above):
  # single atomic job addition to this workflow — the existing check identity
  # (job id `axiom-operational-slice`) is unchanged, and this PR's own run of
  # that check self-validates the new job.
  readiness-verdict:
    needs: [axiom-operational-slice]
    if: ${{ !cancelled() }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-axiom-toolchain
        # Same key inputs as the producer job: cache-build-source = the run's
        # SHA (the merge-group synthetic commit for merge_group, the PR
        # merge-ref commit for pull_request). There is NO same-run B-layer
        # handoff to consume — the producer never writes B (one-writer rule:
        # the sole writer is ci-cache-publisher on workflow_run, ADR-0025
        # Amendment B), so this job restores whatever a PREVIOUS run
        # published for this tree's input-closure key. Exact HIT → the
        # restored bin/ax bytes are the published bytes, which the producer
        # job also ran whenever its S5 gate was eligible (recompile skipped)
        # — the run-manifest .binary.sha256 comparison in the supply step
        # below holds on that lane. MISS → cold fallback compiles this job's
        # own supply (`make ci-compile`, the release compile authority, the
        # producer's own cold path); byte identity with the producer's build
        # is NOT a guarantee the build system makes (action contract:
        # per-TREE, never per-byte — same-tree rebuilds differ), so the cold
        # lane binds to the evidence run semantically (--check-provenance +
        # the manifest's buildSourceHash). Cold fallback is normal
        # operation, not a degraded lane.
        with:
          cache-build-source: ${{ github.sha }}
      - name: Restore the operational-slice evidence artifacts (same run, needs-scoped)
        # The producer's uploads (above) carry logs/* files — upload-artifact
        # strips the least-common ancestor `logs/`, so each artifact root
        # holds the files themselves; a named download into `path: logs`
        # reconstructs the producer's layout (logs/run-manifest.json,
        # logs/r3_relocation.json, …). Fail-closed: if the producer died
        # before its `if: always()` uploads (runner death), the download
        # fails and THIS job is red — missing evidence is UNKNOWN, never a
        # silent green.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axiom-operational-slice-evidence
          path: logs
      - name: Restore the R3 relocation evidence artifact (same run, needs-scoped)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axiom-operational-slice-r3
          path: logs
      - name: "Supply verification: bin/ax provenance + run-manifest binary binding"
        # The verdict this job computes consumes artifacts produced by the
        # producer job's verifier binary; run-manifest.json is that binary's
        # attestation (.binary.sha256, .sourceTree.buildSourceHash). This
        # step first re-verifies the manifest's own digest files (a corrupted
        # download must fail before any judgment reads it), then proves
        # (a) the verifier at hand is built from THIS tree (--check-provenance,
        # fail-closed) and (b) the binding to the evidence run — byte-level
        # on the restored-supply lane, tree-closure-level on the cold lane
        # (see the setup comment for why an independent rebuild is not
        # byte-comparable). bin/ax is also the precondition tests/config.nims
        # asserts before any tests/ compile.
        run: |
          set -euo pipefail
          fail() { echo "SUPPLY VERIFY FAIL: $1" >&2; exit 1; }
          [ -f logs/run-manifest.json ] || fail "logs/run-manifest.json missing (evidence artifact incomplete)"
          [ -f logs/run-manifest.sha256 ] || fail "logs/run-manifest.sha256 missing (evidence artifact incomplete)"
          EXPECTED_MANIFEST_SHA="$(cat logs/run-manifest.sha256)"
          ACTUAL_MANIFEST_SHA="$(sha256sum logs/run-manifest.json | cut -d' ' -f1)"
          [ "$EXPECTED_MANIFEST_SHA" = "$ACTUAL_MANIFEST_SHA" ] || fail "run-manifest.json digest $ACTUAL_MANIFEST_SHA != run-manifest.sha256 $EXPECTED_MANIFEST_SHA (evidence corrupted in transit)"
          [ -f logs/r3_relocation.json ] || fail "logs/r3_relocation.json missing (R3 evidence artifact incomplete)"
          [ -f logs/r3_relocation.sha256 ] || fail "logs/r3_relocation.sha256 missing (R3 evidence artifact incomplete)"
          EXPECTED_R3_SHA="$(cat logs/r3_relocation.sha256)"
          ACTUAL_R3_SHA="$(sha256sum logs/r3_relocation.json | cut -d' ' -f1)"
          [ "$EXPECTED_R3_SHA" = "$ACTUAL_R3_SHA" ] || fail "r3_relocation.json digest $ACTUAL_R3_SHA != r3_relocation.sha256 $EXPECTED_R3_SHA (evidence corrupted in transit)"
          MANIFEST_BIN_SHA="$(jq -r '.binary.sha256 // empty' logs/run-manifest.json)"
          [ -n "$MANIFEST_BIN_SHA" ] || fail "run-manifest.json has no .binary.sha256"
          if [ -x bin/ax ]; then
            # Restored-supply lane (B-layer exact HIT the producer also
            # reused): provenance + byte identity with the evidence run's
            # verifier binary.
            AXIOM_ROOT= bin/ax --check-provenance || fail "restored bin/ax --check-provenance rejected (SourceCoherence FATAL — supply not built from this tree)"
            ACTUAL_BIN_SHA="$(sha256sum bin/ax | cut -d' ' -f1)"
            [ "$ACTUAL_BIN_SHA" = "$MANIFEST_BIN_SHA" ] || fail "restored bin/ax sha256 $ACTUAL_BIN_SHA != run-manifest .binary.sha256 $MANIFEST_BIN_SHA (byte binding to the evidence run broken)"
            echo "SUPPLY VERIFY: OK (restored lane) — provenance + byte binding to the evidence run's verifier binary"
          else
            # Cold fallback (B-layer MISS / discarded payload): purge residual
            # B-cache paths (a prefix-matched non-exact restore may have left
            # files) and compile through the release compile authority — the
            # producer job's own cold path, verbatim.
            rm -rf build/nimcache .axiom/cache proofs/.lake proofs/build
            rm -f build/.axiom-b-fingerprint.json bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas
            make ci-compile -j4
            PROV_OUT="$(AXIOM_ROOT= bin/ax --check-provenance)" || fail "cold-compiled bin/ax --check-provenance rejected (SourceCoherence FATAL — compiled supply does not match this tree)"
            MANIFEST_BSH="$(jq -r '.sourceTree.buildSourceHash // empty' logs/run-manifest.json)"
            [ -n "$MANIFEST_BSH" ] || fail "run-manifest.json has no .sourceTree.buildSourceHash"
            ACTUAL_BSH="$(printf '%s\n' "$PROV_OUT" | sed -n 's/.*live src tree (\(.*\))$/\1/p')"
            [ -n "$ACTUAL_BSH" ] || fail "unparseable provenance verdict: $PROV_OUT"
            [ "$ACTUAL_BSH" = "$MANIFEST_BSH" ] || fail "cold-compiled bin/ax live tree hash $ACTUAL_BSH != run-manifest .sourceTree.buildSourceHash $MANIFEST_BSH (semantic binding to the evidence run broken)"
            echo "SUPPLY VERIFY: OK (cold lane) — provenance + tree-closure binding to the evidence run (byte binding N/A for an independent rebuild: per-TREE, never per-byte)"
          fi
      - name: "Identity chain: HEAD==GITHUB_SHA + verdict-input tree invariance"
        # GITHUB_SHA is the identity authority (merge_group: the merge-group
        # synthetic commit; pull_request: the PR merge-ref commit; push main:
        # the pushed commit). The verdict must be computed over exactly this
        # tree: outside the declared derived-output paths (data/readiness/
        # evidence, logs, build, bin, .axiom, proofs, src/generated) the
        # working tree must be byte-identical to HEAD. The treeDigest the
        # gate consumes is `git ls-tree -r HEAD` — the COMMITTED tree,
        # immune to derived-path writes.
        run: |
          set -euo pipefail
          fail() { echo "IDENTITY CHAIN FAIL: $1" >&2; exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$HEAD_SHA" = "$GITHUB_SHA" ] || fail "HEAD $HEAD_SHA != GITHUB_SHA $GITHUB_SHA (checkout is not the identity authority's tree)"
          DIRTY="$(git status --porcelain -- . ':(exclude)data/readiness/evidence' ':(exclude)logs' ':(exclude)build' ':(exclude)bin' ':(exclude).axiom' ':(exclude)proofs' ':(exclude)src/generated')"
          [ -z "$DIRTY" ] || fail "verdict-input tree dirty vs HEAD outside the declared derived paths: $DIRTY"
          echo "IDENTITY CHAIN: OK — HEAD=$GITHUB_SHA; tree invariant outside derived paths"
      - name: "Collect R1–R8 evidence from the operational-slice artifacts"
        # Collector: tools/ci/readiness_collect_ci (interface contract:
        # --repo-root/--artifacts/--out; exit 0 = evidence written, exit 2 =
        # tool broken). Both nonzero codes fail this job — absence of
        # evidence is UNKNOWN, never a green.
        # The R8 §10.6 cargo sequence runs in a TEMP COPY of the Rust probe
        # crate, never in the tracked fixture directory: cargo writes
        # target/ build output that is not gitignored, which would mutate
        # the verdict-input tree AFTER the identity-chain assertion above —
        # the tree at verdict time must stay byte-identical to HEAD outside
        # the declared derived paths for the whole job, not just until the
        # collector starts. $RUNNER_TEMP is runner-scoped scratch (CI);
        # locally the fallback mktemp dir keeps the same property.
        run: |
          set -euo pipefail
          AXIOM_HERMETIC_BUILDING=1 nim c --path:src -d:release --hints:off --nimcache:build/nimcache/readiness_collect -o:bin/readiness_collect_ci tools/ci/readiness_collect_ci.nim
          PROBE_ROOT="${RUNNER_TEMP:-$(mktemp -d)}"
          PROBE_DIR="$PROBE_ROOT/axiom_rust_probe"
          rm -rf "$PROBE_DIR"
          cp -r tests/fixtures/rust/axiom_rust_probe "$PROBE_DIR"
          rm -rf "$PROBE_DIR/target"
          cargo --version
          export AXIOM_CI_REPO_HEAD="$GITHUB_SHA"
          export AXIOM_CI_TREE_DIGEST="$(printf '%s' "$(git ls-tree -r HEAD)" | sha256sum | cut -d' ' -f1)"
          set +e
          bin/readiness_collect_ci --repo-root . --artifacts logs --out data/readiness/evidence --rust-probe-dir "$PROBE_DIR"
          rc=$?
          set -e
          case "$rc" in
            0) echo "COLLECT: OK — R1–R8 evidence written to data/readiness/evidence" ;;
            2) echo "COLLECT: FAIL — collector tool broken (exit 2); fail-closed" >&2; exit 1 ;;
            *) echo "COLLECT: FAIL — collector exit $rc (outside the 0|2 contract); fail-closed" >&2; exit 1 ;;
          esac
      - name: "Run the readiness gate (verdict → exit)"
        # The gate is the decision authority's projection: productization E2E
        # leg + evaluator over the collected evidence, `READINESS_VERDICT
        # <GO|CONDITIONAL GO|NO-GO|UNKNOWN> CONDITIONS <...>` on stdout, exit
        # 0 for GO / CONDITIONAL GO and 1 for NO-GO / UNKNOWN / any identity
        # mismatch (READINESS_IDENTITY_MISMATCH: the evidence's repoIdentity
        # must equal the env-declared AXIOM_CI_REPO_HEAD / AXIOM_CI_TREE_DIGEST
        # below, derived from the same committed tree both jobs checked out).
        # The gate's exit code IS this job's verdict — no post-processing.
        run: |
          set -euo pipefail
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/readiness_gate -o:bin/readiness_start_gate src/gate/runners/readiness_start_gate.nim
          AXIOM_CI=1 AXIOM_CI_PRESERVE_CACHE=1 AXIOM_CI_REPO_HEAD="$GITHUB_SHA" \
            AXIOM_CI_TREE_DIGEST="$(printf '%s' "$(git ls-tree -r HEAD)" | sha256sum | cut -d' ' -f1)" \
            ./bin/readiness_start_gate
      - name: "Readiness decision test suite (3^8 property + golden + verdict mapping + collector independence)"
        # Each test compiled and run separately (the DEBT#508 / L4 step
        # pattern above — unique nimcache, -o:build/…): the 3^8 property
        # sweep + golden fixture (readiness_policy_test), the R8
        # prepare-order machine check, the observed-state vs outcome
        # classification (decision algebra), and the two contract tests
        # (verdict→exit mapping, collector independence). tests/config.nims
        # asserts bin/ax exists before any tests/ compile — satisfied by the
        # supply step above.
        run: |
          set -euo pipefail
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/readiness_verdict_mapping -o:build/readiness_verdict_mapping tests/ci/test_readiness_verdict_mapping.nim
          ./build/readiness_verdict_mapping
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/readiness_collect_independence -o:build/readiness_collect_independence tests/ci/test_readiness_collect_independence.nim
          ./build/readiness_collect_independence
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/readiness_policy_test -o:build/readiness_policy_test tests/readiness/readiness_policy_test.nim
          ./build/readiness_policy_test
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/readiness_r8_sequence_test -o:build/readiness_r8_sequence_test tests/readiness/readiness_r8_sequence_test.nim
          ./build/readiness_r8_sequence_test
          AXIOM_HERMETIC_BUILDING=1 nim c --hints:off --nimcache:build/nimcache/readiness_outcome_test -o:build/readiness_outcome_test tests/unit/test_readiness_outcome_test.nim
          ./build/readiness_outcome_test
      - name: "Step summary: the readiness decision record"
        # Visible verdict/conditions record on the check run — the same JSON
        # artifact uploaded below.
        run: |
          set -euo pipefail
          {
            echo "## Readiness verdict (build/readiness_start_decision.json)"
            echo ""
            echo '```json'
            cat build/readiness_start_decision.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat build/readiness_start_decision.json
      - name: Upload readiness-verdict evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-verdict-evidence
          path: |
            data/readiness/evidence/*.json
            build/readiness_start_decision.json
            logs/run-manifest.json
            logs/r3_relocation.json
            logs/r3_relocation.sha256
          retention-days: 30
          # upload-artifact v4+ artifacts are immutable and name-unique per run;
          # a re-run re-uploads this fixed name — overwrite replaces it
          # deterministically instead of failing (Q1: docs/spec/github_artifact_attempt_quirks.md).
          overwrite: true
