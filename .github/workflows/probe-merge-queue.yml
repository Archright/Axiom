# probe-merge-queue — MERGE QUEUE 착지 그래프 측정 전용 (ADR-0027 Phase 0).
# MEASUREMENT ONLY — git/API 읽기 + 아티팩트 업로드만 수행한다. status check/
# commit-status/check-run API를 호출하지 않으며 무엇도 막거나 블로킹하지
# 않는다(merge authority 변경 없음). required check 이름(admission-check)을
# 흉내 내지 않도록 job 이름은 probe-*로 유지한다.
#
# ── 목적 ──────────────────────────────────────────────────────────────────
# 4b56ad4fc(2026-09-24)에서 삭제된 probe-merge-queue.yml을 복원·개정한다.
# 원본의 개방 질문: "merge_group이 temp branch(gh-readonly-queue/..., PR과
# SHA가 다름)에서 검증됐을 때, 실제 타깃 브랜치에 착지하는 SHA는 그 검증된
# SHA와 같은가?" — ADR-0027 불변식 6/7의 큐 경로 의미론(α/β/γ 판정)을 실행
# 증거로 확정한다. 일회성 관측 = 증거이지 계약이 아니다 — 관측을 정확히
# 포착하는 것이 전부다.
#
# ── 2026-09-29 복원 수정 (역사 실패: 과거 11회 런 전수 artifact-download
#    단계 FAIL → judge 0회 실행, PROBE_VERDICT 0건) ─────────────────────────
#   [FIX-1 권한] gh api 호출부에 `GH_TOKEN: ${{ github.token }}`을 명시 —
#     gh가 GITHUB_TOKEN 환경 변수를 자동 수용한다는 폴백에 의존하지 않는다.
#   [FIX-2 다운로드 경로] 아티팩트 목록 응답의 archive_download_url 필드로
#     다운로드한다 — artifact_id 기반 경로 호출 대신 목록이 주는 정본 URL을
#     쓰며, REST API 표면 변경에 격리된다.
#     (https://docs.github.com/en/rest/about-the-rest-api/breaking-changes)
#   [FIX-3 이름] 다운로드 필터(merge-group-payload-*)와 업로드 이름이 동일
#     접두어 상수로 결속된다 — 이름 분기로 인한 무수신 제거.
#   [FIX-4 run-id 비의존] 특정 run-id를 참조하지 않는다 — 리포지토리 전체
#     아티팩트를 페이지네이션 열거해 merge-group-payload-* 류를 모두 수신,
#     G(그룹 SHA)별 전부 판정(측정 손실 없음). 동일 페이로드의 큐 재평가
#     중복도 전부 기록한다.
#   [FIX-5 스코프] push 트리거는 queue-probe 브랜치 한정(원본의 push@main
#     대체 — main 머지 이벤트 Actions 실행 0 정책은 ADR-0025 Amendment B의
#     불변으로 유지). pull_request 트리거는 queue-probe 타깃 PR 한정으로
#     두어 큐 진입 eligibility(required check 이름 parity)를 공급한다.
#   [FIX-6 페이로드] 판정에 필요한 head_commit.tree_id를 페이로드에 원문
#     기록 — G 객체가 judge 러너에 없어도 tree(L) == tree(G)를 문자열 비교로
#     판정할 수 있다(원본은 G^{tree} git 해상도에 의존해 무수신 시 판정 불가).
#
# ── 2-단계 구조 ──────────────────────────────────────────────────────────
# [capture] merge_group(checks_requested) 이벤트 순간 G(head_sha)·B(base_sha)·
#   head_ref 원문·base_ref·head_commit.tree_id·GITHUB_SHA·GITHUB_REF를
#   페이로드에서 즉시 포착해 아티팩트 `merge-group-payload-<G>`로 저장하고
#   job summary에도 기록한다. ref(gh-readonly-queue/...)는 휘발성이므로
#   payload에서 빼내는 것이 유일하게 안전한 경로다.
# [judge] push@queue-probe(착지) 또는 workflow_dispatch에서 실행 — 타깃
#   브랜치의 착지 커밋 L을 취득하고 페이로드(G/B/tree_id)와 대조해
#   PROBE_VERDICT 라인을 낸다: L==G? parent1(L)==B? parent2(L)==G?
#   tree(L)==tree(G)? parents(L)=[?] (ADR-0027 Phase 0 판정 질의 4종).
#
# ── SHA 필드 검증 (공식 문서) ────────────────────────────────────────────
# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflows-run/events-that-trigger-workflows#merge_group
#   GITHUB_SHA = "SHA of the merge group"
# https://docs.github.com/en/webhooks/webhook-events-and-payloads#merge_group
#   merge_group.head_sha = "The SHA of the merge group."
#   merge_group.base_sha = "The SHA of the merge group's parent commit."  ← G^1
#   merge_group.head_ref/base_ref = full refs (문자열 형식은 비계약 — ADR-0027 P1)
#   merge_group.head_commit.id/tree_id = 그룹 커밋 자체의 SHA/트리
# 캡처 프라이머리 = github.event.merge_group.head_sha (payload),
# 보조(교차검증) = github.sha (GITHUB_SHA = merge group SHA).
#
# 이 파일은 ADR-0027 Phase 0 측정 + 판정 질의의 유일한 설명 위치다
# (docs 분리 생성 없음).

name: probe-merge-queue

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [queue-probe]
  push:
    branches: [queue-probe]
  workflow_dispatch:
    inputs:
      # 착지 L을 수동 지정해야 하는 경우(기본: push@queue-probe의 github.sha)
      landed_sha:
        description: 'Landing SHA to judge against (default: push github.sha)'
        required: false
        default: ''

# actions: read — 아티팩트 열거/다운로드에만 필요. 읽기 전용이며 status/check
# 작성·실행 취소·merge 차단은 구조적으로 불가 → 제로 권한 유지.
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  # ── capture: merge_group 이벤트 순간의 페이로드 (ref 휘발 전 포착) ─────
  probe-capture:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          fetch-depth: 0

      - name: Verify merge-group payload shape (fail-closed, measurement only)
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          # payload에서 명시 필드가 존재하는지 점검한다. schema에 없는 필드
          # (pull_requests 등)는 있으면 기록하고 없으면 null — schema UNKNOWN.
          jq -e '.merge_group.head_sha' "$GITHUB_EVENT_PATH" >/dev/null
          jq -e '.merge_group.base_sha' "$GITHUB_EVENT_PATH" >/dev/null
          echo "event merge_group action=${{ github.event.action }}"
          echo "event merge_group present fields: $(jq -c '.merge_group | keys' "$GITHUB_EVENT_PATH")"

      - name: Dump merge-group payload (artifact + job summary)
        if: github.event_name == 'merge_group'
        id: evidence
        run: |
          set -euo pipefail
          # ── G: payload head_sha(프라이머리) vs github.sha(교차검증) ─────────
          G_PAYLOAD="${{ github.event.merge_group.head_sha }}"
          G_CTX="${{ github.sha }}"
          if [ -z "$G_PAYLOAD" ]; then
            echo "FAIL: github.event.merge_group.head_sha is empty — cannot capture evidence"
            exit 1
          fi
          # payload는 검증된 그룹 SHA지만, git 객체가 실제 존재하는지 확인(fail-closed).
          git rev-parse --verify --quiet "${G_PAYLOAD}^{commit}" >/dev/null \
            || { echo "FAIL: recorded G=$G_PAYLOAD not a resolvable commit object"; exit 1; }
          G="$G_PAYLOAD"
          G_CTX_RESOLVED="$(git rev-parse "${G_CTX}^{commit}")"
          if [ "$G_CTX_RESOLVED" = "$G" ]; then
            echo "capture G(payload)=$G == G(github.sha)=$G_CTX_RESOLVED (cross-check OK)"
          else
            echo "WARN: G(github.sha)=$G_CTX_RESOLVED != G(payload)=$G"
          fi

          # ── 원문(verbatim) 필드 — head_ref 문자열 형식은 비계약 (ADR-0027 P1):
          # 기록 목적으로만 보존하고 파싱하지 않는다.
          HEAD_REF="${{ github.event.merge_group.head_ref }}"
          BASE_REF="${{ github.event.merge_group.base_ref }}"
          BASE_SHA="${{ github.event.merge_group.base_sha }}"
          TREE_ID="${{ github.event.merge_group.head_commit.tree_id }}"
          GITHUB_SHA_CTX="${{ github.sha }}"
          GITHUB_REF_CTX="${{ github.ref }}"

          ISO_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_ID="${{ github.run_id }}"

          jq -n \
            --arg schema "axiom/probe-merge-queue/payload/v2" \
            --arg G "$G" \
            --arg baseSha "$BASE_SHA" \
            --arg headRef "$HEAD_REF" \
            --arg baseRef "$BASE_REF" \
            --arg treeId "$TREE_ID" \
            --arg githubSha "$GITHUB_SHA_CTX" \
            --arg githubRef "$GITHUB_REF_CTX" \
            --arg runId "$RUN_ID" \
            --arg capturedAt "$ISO_TS" \
            '{schema:$schema, G:$G, baseSha:$baseSha, headRef:$headRef,
              baseRef:$baseRef, treeId:$treeId, githubSha:$githubSha,
              githubRef:$githubRef, runId:$runId, capturedAt:$capturedAt}' \
            > "payload.json"

          # 안정 접두어(PROBE_PAYLOAD) 로그 마커 — 로그로도 증거를 남긴다.
          echo "PROBE_PAYLOAD run=$RUN_ID"
          echo "PROBE_PAYLOAD G=$G"
          echo "PROBE_PAYLOAD head_ref(verbatim)=${HEAD_REF}"
          echo "PROBE_PAYLOAD base_sha=$BASE_SHA"
          echo "PROBE_PAYLOAD base_ref=${BASE_REF}"
          echo "PROBE_PAYLOAD head_commit.tree_id=${TREE_ID}"
          echo "PROBE_PAYLOAD GITHUB_SHA=$GITHUB_SHA_CTX"
          echo "PROBE_PAYLOAD GITHUB_REF=${GITHUB_REF_CTX}"

          # job summary 동시 기록 (2차 증거 — 아티팩트 분실에도 요약·로그 보존)
          {
            echo "## merge-group payload (run $RUN_ID)"
            echo '| field | value |'
            echo '|---|---|'
            echo "| merge_group.head_sha (G) | \`$G\` |"
            echo "| merge_group.head_ref (verbatim) | \`${HEAD_REF}\` |"
            echo "| merge_group.base_sha | \`$BASE_SHA\` |"
            echo "| merge_group.base_ref | \`${BASE_REF}\` |"
            echo "| merge_group.head_commit.tree_id | \`${TREE_ID}\` |"
            echo "| GITHUB_SHA | \`$GITHUB_SHA_CTX\` |"
            echo "| GITHUB_REF | \`${GITHUB_REF_CTX}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merge-group payload artifact (identity = candidate head, P2 naming)
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (repo sha-pin)
        with:
          name: merge-group-payload-${{ github.event.merge_group.head_sha }}
          path: payload.json
          if-no-files-found: error
          retention-days: 90

      - name: PR-event check-name parity marker (queue entry eligibility)
        if: github.event_name == 'pull_request'
        run: |
          echo "probe-capture (pull_request, queue-probe): check-name parity marker only — no measurement on PR events."

  # ── judge: 착지(L)를 페이로드와 대조해 판정 (원본 메커니즘 유지:
  #    push@타깃 + workflow_dispatch) ──────────────────────────────────────
  probe-judge:
    needs: [probe-capture]
    if: ${{ always() && github.event_name != 'merge_group' }}
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (repo sha-pin)
        with:
          fetch-depth: 0

      - name: Download payload artifacts (cross-run, repo-wide)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payloads
          PAGE=1
          : > /tmp/payload_urls
          while :; do
            # ── artifacts 목록 fetch — 보호된 취득 (fetch-fallback hardening,
            #    2026-11-02). 수리 전 무보호 파이프라인은 API 실패 시 에러 본문이
            #    jq에 유입되거나(`.artifacts`가 null → 하류 `.[]` exit 5) pipefail
            #    즉사로 사망했다(Q18/Q19 감사). 수리: exit-code 게이트 + 수용 전
            #    봉투 검증(has("artifacts") + has("message") 오염 탐지 — Q18 치료
            #    계약)으로 명시적 오류로 전환. 실패 방향은 현행 fail-closed 유지
            #    (빨간 프로브)이며, 스트림 분리로 판정값과 gh stderr 관측 로그의
            #    생명주기를 분리한다(Q17 교훈). endpoint·jq 표현식 불변 —
            #    happy path의 BATCH는 수리 전과 byte-identical.
            ART_RC=0
            ART_ERR_FILE="${RUNNER_TEMP:-/tmp}/probe_artifacts_fetch_stderr.txt"
            ART_BODY="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$PAGE" 2>"$ART_ERR_FILE")" || ART_RC=$?
            if [ "$ART_RC" != "0" ] || ! printf '%s' "$ART_BODY" | jq -se 'length > 0 and all(.[]; (type == "object") and has("artifacts") and (has("message") | not))' >/dev/null 2>&1; then
              echo "::error::[probe] artifact listing fetch failed (rc=$ART_RC, page=$PAGE) — acquisition error, not probe evidence; no artifacts accepted (fail-closed; quirks Q18: gh api prints 4xx bodies to stdout)"
              if [ -s "$ART_ERR_FILE" ]; then sed 's/^/[probe artifacts-fetch gh-stderr] /' "$ART_ERR_FILE" >&2 || true; fi
              exit 1
            fi
            BATCH="$(printf '%s' "$ART_BODY" | jq -c '.artifacts')"
            COUNT="$(jq 'length' <<<"$BATCH")"
            # 업로드 이름(merge-group-payload-<G>)과 동일 접두어로 결속 (FIX-3)
            jq -r '.[] | select((.name | startswith("merge-group-payload-")) and .expired == false) | "\(.archive_download_url)"' <<<"$BATCH" >> /tmp/payload_urls
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
          if [ ! -s /tmp/payload_urls ]; then
            # 관측 대상이 없으면 아무것도 막지 않는다 — 판정 없음(no-evidence)만 기록.
            echo "PROBE_VERDICT no-evidence L=${{ github.sha }}"
            exit 0
          fi
          # archive_download_url(= 정본 URL) 기준 다운로드 (FIX-2) — 아티팩트별
          # 디렉터리로 압축 풀어 payload.json 충돌을 막는다 (id = url 경로의
          # archive id).
          sort -u /tmp/payload_urls | while read -r URL; do
            ART_ID="$(basename "$(dirname "$URL")")"
            echo "download payload id=$ART_ID url=$URL"
            # ── payload 다운로드 — 수용 전 게이트 (fetch-fallback hardening,
            #    2026-11-02). 수리 전 무보호 리다이렉트는 gh api 에러 JSON(Q18:
            #    4xx 본문이 stdout에 출력됨)을 .zip에 착지시킨 뒤 unzip에서
            #    모호하게 사망했다. 수리: exit-code 게이트 + 수용 전 검증(zip
            #    PK 서명 + unzip -t 무결성)을 통과한 응답만 payloads/에 수용 —
            #    실패는 명시적 오류로 fail-closed 방향 유지.
            ZIP_TMP="payloads/$ART_ID.zip.partial"
            DL_RC=0
            gh api -H "Accept: application/vnd.github+json" "$URL" > "$ZIP_TMP" 2>"payloads/$ART_ID.dl_stderr" || DL_RC=$?
            if [ "$DL_RC" != "0" ]; then
              echo "::error::[probe] payload download failed (rc=$DL_RC, artifact $ART_ID) — acquisition error, not probe evidence; nothing accepted into payloads/ (fail-closed)"
              if [ -s "payloads/$ART_ID.dl_stderr" ]; then sed 's/^/[probe payload-download gh-stderr] /' "payloads/$ART_ID.dl_stderr" >&2 || true; fi
              exit 1
            fi
            if [ "$(head -c 2 "$ZIP_TMP" 2>/dev/null || true)" != "PK" ]; then
              echo "::error::[probe] payload for artifact $ART_ID is not a zip archive (bad PK signature — gh api error body suspected, quirks Q18) — refusing acceptance (fail-closed)"
              if [ -s "$ZIP_TMP" ]; then head -c 400 "$ZIP_TMP" >&2 || true; fi
              exit 1
            fi
            if ! unzip -t -q "$ZIP_TMP" >/dev/null 2>&1; then
              echo "::error::[probe] payload zip for artifact $ART_ID failed integrity test (unzip -t) — refusing acceptance (fail-closed)"
              exit 1
            fi
            mv "$ZIP_TMP" "payloads/$ART_ID.zip"
            mkdir -p "payloads/$ART_ID"
            (cd "payloads/$ART_ID" && unzip -o -q "../$ART_ID.zip")
          done
          ls -1 payloads
          find payloads -name 'payload.json' | wc -l

      - name: Judge landing against recorded payloads
        run: |
          set -euo pipefail
          # 착지 L: push@queue-probe면 github.sha(= 새 타깃 tip)가 L.
          # workflow_dispatch면 landed_sha input(없으면 github.sha).
          LANDED_OVERRIDE="${{ inputs.landed_sha }}"
          if [ -n "$LANDED_OVERRIDE" ]; then
            L="$LANDED_OVERRIDE"
          else
            L="${{ github.sha }}"
          fi
          L="$(git rev-parse "$L^{commit}")"
          echo "PROBE judge L=$L"
          {
            echo "## PROBE judge L=$L (event=${{ github.event_name }})"
          } >> "$GITHUB_STEP_SUMMARY"

          VERDICTS=0
          for F in payloads/*/payload.json; do
            [ -e "$F" ] || continue
            VERDICTS=$((VERDICTS + 1))
            # ── 페이로드 읽기 (G/B/tree_id — 원문) ────────────────────────
            G="$(jq -r '.G' "$F")"
            B="$(jq -r '.baseSha' "$F")"
            HEAD_REF="$(jq -r '.headRef' "$F")"
            TREE_G="$(jq -r '.treeId' "$F")"
            echo "PROBE_RULE payload=$F G=$G B=$B treeId=$TREE_G headRef=$HEAD_REF"

            # ── L 구조 해상도 (로컬 객체 — 착지 커밋) ──────────────────────
            L_PARENT_COUNT="$(git rev-list --parents -n 1 "$L" | tr ' ' '\n' | wc -l)"
            L_PARENT_COUNT=$((L_PARENT_COUNT - 1))
            L1="$(git rev-parse "${L}^1" 2>/dev/null || echo '')"
            L2="$(git rev-parse "${L}^2" 2>/dev/null || echo '')"
            L_TREE="$(git rev-parse "${L}^{tree}")"
            PARENTS="$L1"
            [ -n "$L2" ] && PARENTS="$L1,$L2"
            echo "PROBE_RULE L parents=$L_PARENT_COUNT L1=$L1 L2=$L2 LTree=$L_TREE"

            # ── 질의 4종 + parents (문자열 비교 — G 객체 부재에도 판정 가능) ──
            EQ_LG=false; EQ_P1B=false; EQ_P2G=false; EQ_TREE=false
            [ "$L" = "$G" ] && EQ_LG=true
            [ -n "$L1" ] && [ "$L1" = "$B" ] && EQ_P1B=true
            [ -n "$L2" ] && [ "$L2" = "$G" ] && EQ_P2G=true
            [ -n "$TREE_G" ] && [ "$L_TREE" = "$TREE_G" ] && EQ_TREE=true

            VERDICT_LINE="PROBE_VERDICT payload=$(basename "$F") L==G:$EQ_LG parent1(L)==B:$EQ_P1B parent2(L)==G:$EQ_P2G tree(L)==tree(G):$EQ_TREE parents(L)=[$PARENTS]"
            echo "$VERDICT_LINE"
            echo "$VERDICT_LINE" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$VERDICTS" -eq 0 ]; then
            echo "PROBE_VERDICT no-evidence L=$L"
          fi