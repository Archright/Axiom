# fresh-prove-observation — non-authoritative observation of a FRESH, full-scope
# `ax prove` for the exact subject commit.
#
# [Authority — READ BEFORE PROMOTING]
# This workflow is NOT a required check and MUST NOT be promoted to the ruleset
# required list without an explicit #549 epoch decision (required-check
# promotion is a human/policy action). It grants and denies no merge authority:
# no merge_group trigger (decision #20(a): a non-required, contents:read
# observation workflow is not an authority surface), and the v101 DEBT#545
# class — a merge_group-triggered CONTROLLED exact that nullifies the
# .github/** FROZEN glob — is deliberately not re-opened. Merge-queue binding
# belongs to the #549 epoch where this file would become trust-surface-pinned.
#
# [What it observes]
#   fresh full-scope prove (--fresh bypasses the 4 reuse paths) -> report.json
#   -> fresh_prove_verdict (4-state projection + canonical evidence digest).
# The job conclusion is an OBSERVATION, not an admission verdict: PROVED green,
# REFUTED red, UNKNOWN/OUT_OF_SCOPE green-with-warning (annotated), because a
# red non-required check would be indistinguishable from a broken lane while
# DEBT#547 (ckIfStmt unsupported) keeps full-scope at UNKNOWN. The artifact
# carries the observation payload; the workflow never publishes an admission
# check and never claims merge authority.
#
# [Self-report boundary] pull_request runs use the workflow file from the PR
# merge commit (GitHub docs: pull_request event), so a PR can alter what this
# run reports. The result is therefore PR-code self-report, never independent
# evidence. Independent evidence verification is the Axiom App + #549.
#
# [Q4 quirk] No GitHub expression tokens inside run: blocks — event-sourced
# values stay in env:/with: (docs/spec/gh_run_observation_quirks.md Q4).

name: fresh-prove-observation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-prove-observation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id IS the check-run context — no job-level `name:` key
  # (same discipline as axiom-operational-slice.yml).
  fresh-prove-observation:
    runs-on: [ "${{ fromJSON(vars.CI_RUNNER_MAP).x64 }}" ]
    timeout-minutes: 60
    env:
      # The exact commit under observation: PR head (not the merge ref), the
      # pushed main tip, or the dispatched ref SHA.
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Determinism: one worker (AXIOM_PROVE_WORKERS=1 is the current
      # determinism policy; lifting it is a J4 decision, not this workflow's).
      AXIOM_PROVE_WORKERS: "1"
      # State lives OUTSIDE the subject tree ($RUNNER_TEMP), so the prove
      # cannot write into the checkout's tracked paths.
      AXIOM_STATE_DIR: ${{ runner.temp }}/axiom-fresh-observation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork PRs must be checked out from the head repository; same-repo PRs
          # and push/dispatch fall back to this repository.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-axiom-toolchain
        with:
          provision-scope: full
          cache-build-source: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the release verifier (ci-compile authority)
        run: make ci-compile -j4
      - name: Build the Lean reference extractor (ircheck)
        # The canonical prove path seals subject binding via
        # proofs/.lake/build/bin/ircheck; a missing extractor demotes the node
        # to NOT_VERIFIABLE, which would be an infrastructure artifact rather
        # than an honest observation.
        run: lake build ircheck
        working-directory: proofs
      - name: Restore tracked build metadata after the build
        run: git restore src/generated/build_metadata.json
      - name: Fresh full-scope prove (all reuse paths bypassed)
        # `ax prove` exits 1 when the canonical run outcome is FAIL (today:
        # DEBT#547 unsupported IR). The exit code is captured as observation
        # data; the verdict projection below owns the state semantics.
        run: |
          set -uo pipefail
          mkdir -p "$AXIOM_STATE_DIR"
          set +e
          ./bin/ax prove --fresh
          prove_exit=$?
          set -e
          printf '%s\n' "$prove_exit" > "$AXIOM_STATE_DIR/prove_exit.txt"
          echo "prove_exit=$prove_exit"
      - name: Emit the report JSON
        run: |
          set -uo pipefail
          set +e
          ./bin/ax report --json > "$AXIOM_STATE_DIR/report.json"
          report_exit=$?
          set -e
          printf '%s\n' "$report_exit" > "$AXIOM_STATE_DIR/report_exit.txt"
          echo "report_exit=$report_exit"
      - name: Compile the fresh-verdict projector
        run: |
          set -euo pipefail
          nim c --hints:off --nimcache:build/nimcache/fresh_prove_verdict \
            -o:bin/fresh_prove_verdict tools/ci/fresh_prove_verdict.nim
      - name: Project the 4-state verdict and canonical evidence
        # PROVED -> green; REFUTED (machine-readable witness) -> red;
        # UNKNOWN/OUT_OF_SCOPE -> green with a warning annotation; a projection
        # failure (missing state / usage error) -> red (observation pipeline
        # failure, distinguishable from a proof verdict in the log/artifact).
        run: |
          set -uo pipefail
          EVID="$AXIOM_STATE_DIR/evidence"
          mkdir -p "$EVID"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          set +e
          ./bin/fresh_prove_verdict \
            --state "$AXIOM_STATE_DIR/logs/ax_proof_state.json" \
            --scope-lock data/verification_scope.lock \
            --out "$EVID/fresh-verdict.json" \
            --subject-sha "$SUBJECT_SHA" \
            --subject-tree "$TREE" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --runner "$RUNNER_NAME"
          vexit=$?
          set -e
          if [ -f "$EVID/fresh-verdict.json" ]; then
            jq '{verdict, reasons, counts, coverage, closureComplete,
                 subjectSha, canonicalEvidenceDigest, checkConclusion}' \
              "$EVID/fresh-verdict.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "verdict artifact missing (projection exit $vexit)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$vexit" in
            0) echo "fresh-prove-observation: PROVED (non-authoritative)";;
            1) echo "::error title=fresh-prove-observation::REFUTED — machine-readable witness present"; exit 1;;
            3) echo "::warning title=fresh-prove-observation::UNKNOWN or OUT_OF_SCOPE — see the artifact";;
            *) echo "::error title=fresh-prove-observation::verdict projection failed (exit $vexit)"; exit "$vexit";;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fresh-prove-observation
          path: |
            ${{ runner.temp }}/axiom-fresh-observation/evidence/fresh-verdict.json
            ${{ runner.temp }}/axiom-fresh-observation/report.json
            ${{ runner.temp }}/axiom-fresh-observation/logs/ax_proof_state.json
            ${{ runner.temp }}/axiom-fresh-observation/prove_exit.txt
            ${{ runner.temp }}/axiom-fresh-observation/report_exit.txt
          retention-days: 30
          # upload-artifact v4+ artifacts are immutable and name-unique per run;
          # a re-run re-uploads this fixed name — overwrite replaces it
          # deterministically instead of failing (Q1:
          # docs/spec/github_artifact_attempt_quirks.md).
          overwrite: true