# hardware-falsification-smoke.yml — CI-pareto cheap falsification (실험 도구)
#
# 목적 (v11 scope amendment): arm64/slim 후보를 full run 전에 cheap falsification으로 판정.
#   H2 arm:     arch → Z3 aarch64 artifact → toolchain(Nim/Lean) → minimal verify smoke
#               어느 단계 실패든 즉시 중단 → "H2 INVALID — toolchain compatibility" 기록용.
#   H3 slim:    LIGHT-class(select/surface 유사)만 — HEAVY(Nim LTO/Lean/Z3/gateway)은 금지.
# 정적 판정(docs/evidence/hardware_smoke_static.md, H2-COMPATIBLE) 반영:
#   - choosenim init.sh는 arm64 fail-closed → 공식 nim-2.2.10-linux_arm64.tar.xz fallback
#     (compiler/ast.nim 포함 검증됨) — fallback 경로도 smoke의 검증 대상이다.
#   - Z3 arm64-glibc 자산은 tag z3-4.13.3에 실존(HTTP 200 사전 검증).
# 신뢰 계약 변경 없음(관측 도구 전용), large runner 금지, 자동 발화는 자기 파일 변경만.
# 예산: 단일 run ~10 runner-min (data/ci_pareto_baseline.json budgetLedger에 기록 대상).
# 실패 판정 규약: exit 2 = FALSIFIED(후보 무효), exit 1 = 인프라 오류(판정 아님).
name: hardware-falsification-smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "falsification target"
        type: choice
        options: [arm, slim-light, both]
        default: arm
  push:
    branches: [optimize/ci-pareto]
    paths: [.github/workflows/hardware-falsification-smoke.yml]

permissions:
  contents: read

concurrency:
  group: hw-smoke-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  arm-falsification:
    if: github.event_name == 'push' || inputs.target == 'arm' || inputs.target == 'both'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: "1/4 arch check"
        run: |
          set -euo pipefail
          arch=$(uname -m); echo "arch=$arch"
          [ "$arch" = "aarch64" ] || { echo "::error::FALSIFIED: expected aarch64, got $arch"; exit 2; }

      - name: "2/4 Z3 aarch64 artifact (x64-only URL = 등록된 blocker)"
        id: z3
        run: |
          set -euo pipefail
          Z3V=4.13.3
          X64="https://github.com/Z3Prover/z3/releases/download/z3-${Z3V}/z3-${Z3V}-x64-glibc-2.35.zip"
          c=$(curl -s -o /dev/null -w '%{http_code}' -I "$X64" || true)
          echo "hardcoded x64 asset HTTP $c (존재해도 aarch64 실행 불가 — action.yml:341 blocker)"
          # 정적 판정 사전 검증: tag에 arm64-glibc 자산 실존 (hardware_smoke_static.md §3)
          # GitHub release download은 CDN으로 302 리다이렉트 — 404만 결손, 2xx/3xx=실존
          arm="https://github.com/Z3Prover/z3/releases/download/z3-${Z3V}/z3-${Z3V}-arm64-glibc-2.34.zip"
          ac=$(curl -s -o /dev/null -w '%{http_code}' -I "$arm" || true)
          case "$ac" in
            2*|3*) : ;;   # 실존 (redirect 포함)
            404) echo "::error::FALSIFIED: arm64 Z3 asset missing (HTTP 404)"; exit 2 ;;
            *)   echo "::error::FALSIFIED: arm64 Z3 asset unverifiable (HTTP $ac)"; exit 2 ;;
          esac
          echo "arm asset: $arm (HTTP $ac)"
          curl -sL "$arm" -o /tmp/z3.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          Z3BIN=$(find /tmp/z3 -type f -name z3 | head -1)
          "$Z3BIN" --version
          echo "z3=OK" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "3/4 toolchain 실행 (elan Lean + Nim arm64 fallback 포함)"
        run: |
          set -euo pipefail
          # Lean — lean-toolchain(4.33.0)이 checkout 후 현 디렉터리에 있으므로 elan proxy가 자동 설치
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version
          lean --version   # repo 루트(lean-toolchain) 기준 4.33.0 자동 설치+실행 검증
          # Nim — choosenim을 먼저 시도(arm64 fail-closed 가능성, 정적 판정 B5),
          # 실패 시 공식 linux_arm64 tarball fallback (compiler/ast.nim 포함 검증됨)
          if curl -sSfL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh \
             && sh /tmp/choosenim-init.sh -y 2>/tmp/choosenim.log; then
            export PATH="$HOME/.nimble/bin:$PATH"
            echo "choosenim path OK"
          else
            echo "choosenim failed on arm64 (expected per static B5) — official tarball fallback"
            tail -5 /tmp/choosenim.log || true
            NIMV=2.2.10
            curl -sSfL "https://nim-lang.org/download/nim-${NIMV}-linux_arm64.tar.xz" -o /tmp/nim.tar.xz
            # config.nims:331-335(§-1 불변)는 compiler 소스를
            # ~/.choosenim/toolchains/nim-<NimVersion>/ 에서 찾는다 — choosenim 레이아웃에
            # 동일하게 배치해야 ci-compile이 compiler/parser를 해석한다.
            NMROOT="$HOME/.choosenim/toolchains/nim-${NIMV}"
            mkdir -p "$NMROOT"
            tar -xJf /tmp/nim.tar.xz -C "$NMROOT" --strip-components=1
            export PATH="$NMROOT/bin:$PATH"
          fi
          nim --version
          # 커널 임포트 전제 (action.yml:253-258 self-heal 조건)
          # choosenim 레이아웃($HOME/.choosenim/toolchains/nim-*/compiler/) 기준 깊이 5 — maxdepth 6 필요
          if ! find "$HOME" -maxdepth 6 -path '*/compiler/ast.nim' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::FALSIFIED: compiler/ast.nim 없음 — 커널 빌드 불가"; exit 2
          fi
          echo "compiler/ast.nim present"

      - name: "4/4 minimal verify smoke (LIGHT selector 빌드 → bin/ax ci-compile)"
        run: |
          set -euo pipefail
          # PATH: choosenim 또는 arm64 tarball fallback(choosenim 레이아웃) 모두 식별
          export PATH="$HOME/.nimble/bin:$HOME/.choosenim/toolchains/nim-2.2.10/bin:$HOME/.elan/bin:$PATH"
          # step 2/4 downloaded Z3 but did not put it on PATH; hermetic_build
          # hard-fails when `z3 --version` is unavailable.
          z3bin="$(dirname "$(find /tmp/z3 -type f -name z3 | head -1)")"
          export PATH="$z3bin:$PATH"
          command -v z3 >/dev/null || { echo "::error::FALSIFIED: z3 not on PATH after download"; exit 2; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # nimble 의존성 (axiom.nimble: malebolgia/checksums/fusion/nimcrypto — 순수 Nim, 아치 무관)
          # setup-axiom-toolchain action이 x64에서 담당하던 부분 (action.yml:346-360 상당)
          nimble install -y --depsOnly
          # libpcre3 런타임 (action.yml:235-251 상당 — x64 러너 이미지에 사전 포함, arm 러너는 apt 설치 필요)
          sudo apt-get update -qq && sudo apt-get install -y libpcre3
          # 4a LIGHT: select job과 동일 빌드 (tools/ci/impact_closure_selector.nim)
          nim c --hints:off --skipParentCfg --skipProjCfg --path:src \
            -o:/tmp/impact-closure tools/ci/impact_closure_selector.nim
          echo "LIGHT smoke: impact_closure_selector build OK"
          # 4b HEAVY 최소 (verification engine = bin/ax): make ci-compile ≈ x64 baseline 4.5-5분
          make ci-compile
          echo "HEAVY smoke: ci-compile (bin/ax + 3 binaries, LTO) OK on aarch64"
          bin/ax --help >/dev/null 2>&1 || bin/ax --version
          echo "VERDICT: arm64 toolchain+verification smoke PASS — full candidate 측정 자격 부여"

  slim-light-falsification:
    if: inputs.target == 'slim-light' || inputs.target == 'both'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: "resources + awk 확인 (정적 판정 UNKNOWN 해소)"
        run: |
          set -euo pipefail
          echo "nproc=$(nproc)"; free -m | head -2; df -h / | tail -1
          command -v awk >/dev/null || { echo "::error::FALSIFIED: awk absent (config.nims:28 compile-time dep)"; exit 2; }
          echo "awk: $(command -v awk)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "LIGHT smoke (repository-surface 유사: Nim + surface_guard 빌드)"
        run: |
          set -euo pipefail
          # choosenim 우선, 실패 시 공식 linux_x64 tarball fallback (B10: 15분 cap 대비)
          if curl -sSfL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh \
             && sh /tmp/choosenim-init.sh -y 2>/tmp/choosenim.log; then
            "$HOME/.nimble/bin/choosenim" 2.2.10
            export PATH="$HOME/.nimble/bin:$PATH"
            echo "choosenim path OK"
          else
            echo "choosenim failed/slow-path — official tarball fallback"
            tail -5 /tmp/choosenim.log || true
            NIMV=2.2.10
            curl -sSfL "https://nim-lang.org/download/nim-${NIMV}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
            mkdir -p "$HOME/.nim-official"
            tar -xJf /tmp/nim.tar.xz -C "$HOME/.nim-official" --strip-components=1
            export PATH="$HOME/.nim-official/bin:$PATH"
          fi
          nim --version
          nim --version | grep -q 'Version 2\.2\.10' || { echo "::error::FALSIFIED: Nim != 2.2.10 (repo pin)"; exit 2; }
          nimble install -y checksums@0.2.2 || true   # fallback tarball엔 nimble 바이너리가 별도일 수 있음
          if ! command -v nimble >/dev/null; then
            echo "nimble unavailable — surface_guard는 checksums import 불필요 경로로 검증"
          fi
          nim c --hints:off -d:release -o:/tmp/surface_guard tools/surface_guard.nim
          echo "VERDICT: ubuntu-slim LIGHT-class PASS — select/surface/observation job routing 자격 부여"
          echo "NOTE: HEAVY(Nim LTO/Lean/Z3/gateway)는 본 스모크 범위 밖 — 정적 판정(hardware_smoke_static.md) 따름"
