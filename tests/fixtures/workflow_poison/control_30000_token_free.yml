# workflow_poison fixture: control_30000_token_free.yml
# Parse-poison lint boundary fixture for tools/ci/validate_workflow_shell.sh.
# Rule under test: a run scalar carrying an expression token and longer
# than 21000 chars must FAIL (docs/spec/gh_run_observation_quirks.md Q4).
# Construction: plain-scalar-form run scalar, parsed scalar length exactly 30004
# chars, carries NO expression token. Padding is spaces only; the run content holds no comment
# text. Expected lint verdict: PASS (no token -> not subject to the expression cap). Local fixture only - never dispatch.
# Boundary semantics: the rule fails on length > 21000 (mirrors the
# platform error text); whether EXACTLY 21000 passes on the platform is
# an open oracle question, documented in the spec file above.

name: workflow-poison-fixture-control-token-free
on:
  workflow_dispatch: {}
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - name: "[fixture] token-free plain scalar, 30004 chars (cap-exempt class)"
