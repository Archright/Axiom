# workflow_poison fixture: poison_21001_tokenized.yml
# Parse-poison lint boundary fixture for tools/ci/validate_workflow_shell.sh.
# Rule under test: a run scalar carrying an expression token and longer
# than 21000 chars must FAIL (docs/spec/gh_run_observation_quirks.md Q4).
# Construction: literal-block-form run scalar, parsed scalar length exactly 21001
# chars, carries the expression token. Padding is spaces only; the run content holds no comment
# text. Expected lint verdict: FAIL (first char over the 21000 cap). Local fixture only - never dispatch.
# Boundary semantics: the rule fails on length > 21000 (mirrors the
# platform error text); whether EXACTLY 21000 passes on the platform is
# an open oracle question, documented in the spec file above.

name: workflow-poison-fixture-poison-21001
on:
  workflow_dispatch: {}
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - name: "[fixture] tokenized block scalar, 21001 chars (cap-busting)"
