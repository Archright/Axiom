# h4-routing-measure — H4 라우팅 스윕 측정 워크플로 (DRAFT — 비집행 설계)
#
# ⚠ 설계 산출물 전용: docs/evidence/ 아래에 두며 `.github/`에 두지 않는다
# (ratchet/required-check 등록 전까지). 이 YAML은 GitHub에서 실행되지 않는다 —
# 등록 시점에 h4_routing_protocol.md §6 시퀀싱 + s2_protocol.md runbook을 따른다.
#
# 설계 원칙 (docs/evidence/h4_routing_protocol.md):
#   - dispatch-only, required check 아님 (Owner 결정 #14 — s2_protocol.md:5-6).
#   - dispatch 1회 = 측정 run 1회: provision(warm)/measure if: 격리 — gateway-jobs-measure.yml:65-66,174-175 패턴.
#   - 고정 ref 체크아웃 → byte-identical workload, 단일요인 = runner class (H1/H2/H3).
#   - n=2 역균형 쌍: iter=1 A->B, iter=2 B->A (s2_protocol.md:171-191).
#   - warm run은 절대 ingest하지 않는다 (초기상태가 구성적으로 다름).
#   - measured run fail-closed 사전조건: B 페이로드/아티팩트 존재 + arch/버전 확인
#     (gateway-jobs-measure.yml:196-202 패턴).
#   - H3(slim) 측은 apt 불가(B13 — hardware_smoke_static.md:116): slim-프로파일 툴체인
#     (elan + nim tarball + z3 zip)만 사용. libpcre3 존재는 fail-closed 프로브.
#   - 생산 전송 경로 준수: R2/R3는 actions/artifact로 페이로드 전달 (B-cache는
#     image-bound 키라 slim/arm에 복원 불가 — action.yml:85-95; restore-keys 금지 :28-30).

name: h4-routing-measure

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: '측정 실험 R1(select H1vsH3) / R2(admission job-2 H1vsH3) / R3(gateway-shard H1vsH2)'
        type: choice
        options: [r1-select, r2-admission, r3-shard]
      runner:
        description: 'candidate runner class. r1/r2: h1-x64|h3-slim. r3: h1-x64|h2-arm64'
        type: choice
        options: [h1-x64, h2-arm64, h3-slim]
      iter:
        description: 'Pre-registered pair slot (1..n) — 주문은 trace 매핑 표를 따른다'
        type: number
        default: 1
      ref:
        description: '고정 측정 ref (SHA) — 모든 측정 run의 check-out 대상'
        type: string
        default: 0000000000000000000000000000000000000000
      main-ref:
        description: 'R1b diff 기준 main SHA (고정) — 빈 값이면 미사용'
        type: string
        default: ''
      pr-number:
        description: 'R2 pin-identity 입력: 고정 실측 PR 번호 (PR API 재도출 대체)'
        type: number
        default: 0
      b-sha:
        description: 'R2 pin-identity 입력: 고정 측정 PR의 base.sha (B)'
        type: string
        default: '0000000000000000000000000000000000000000'
      h-sha:
        description: 'R2 pin-identity 입력: 고정 측정 PR의 head.sha (H)'
        type: string
        default: '0000000000000000000000000000000000000000'
      tree-oid:
        description: 'R2 pin-identity 입력: H의 HEAD^{tree} OID'
        type: string
        default: '0000000000000000000000000000000000000000'
      warm:
        description: 'true = provisioning run (B 페이로드/아티팩트 생성; 절대 ingest 금지)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── warm: 실험별 페이로드 provisioning (미수집) ──────────────────────────────
  provision:
    if: ${{ inputs.warm == true }}
    # R2 warm은 항상 H1 (x64 bin/ax가 H1/H3 양쪽 측정 레그에 공급됨 — 프로토콜 §2 R2)
    # R3 warm은 아치별 1회 (H1 키트는 H1 레그, H2 키트는 H2 레그)
    runs-on: ${{ inputs.experiment == 'r2-admission' && 'ubuntu-24.04' || inputs.runner == 'h3-slim' && 'ubuntu-slim' || (inputs.runner == 'h2-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write   # artifact upload (B-cache가 아닌 아티팩트 경로)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          clean: true
          fetch-depth: 1

      # 공통 툴체인 (arm: hw-smoke yml:73-107 recipe / slim: 프로파일 — apt 없음)
      - name: Provision toolchain (arch/class-conditional bootstrap)
        run: |
          set -euo pipefail
          echo "arch=$(uname -m) nproc=$(nproc)"
          if [ "${{ inputs.runner }}" = "h3-slim" ]; then
            # slim-프로파일: elan Lean + nim 공식 tarball + z3 zip (apt 금지)
            curl -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
            if curl -sSfL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh \
               && sh /tmp/choosenim-init.sh -y; then
              export PATH="$HOME/.nimble/bin:$PATH"
            else
              NIMV=2.2.10
              curl -sSfL "https://nim-lang.org/download/nim-${NIMV}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
              mkdir -p "$HOME/.nim-official"
              tar -xJf /tmp/nim.tar.xz -C "$HOME/.nim-official" --strip-components=1
              export PATH="$HOME/.nim-official/bin:$PATH"
            fi
            Z3V=4.13.3
            curl -sL "https://github.com/Z3Prover/z3/releases/download/z3-${Z3V}/z3-${Z3V}-x64-glibc-2.35.zip" -o /tmp/z3.zip
            unzip -q /tmp/z3.zip -d /tmp/z3 && find /tmp/z3 -name z3 -type f -exec cp {} /tmp/z3bin \; -quit
            export PATH="/tmp/z3bin:$PATH"
          else
            # H1/H2: 하드웨어 스모크 실증 recipe (hw-smoke yml:84-107) — arm은 tarball fallback
            curl -sSfL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh
            if sh /tmp/choosenim-init.sh -y; then
              export PATH="$HOME/.nimble/bin:$PATH"
            else
              NIMV=2.2.10
              ARCH=$([ "$(uname -m)" = "aarch64" ] && echo arm64 || echo x64)
              curl -sSfL "https://nim-lang.org/download/nim-${NIMV}-linux_${ARCH}.tar.xz" -o /tmp/nim.tar.xz
              NMROOT="$HOME/.choosenim/toolchains/nim-${NIMV}"
              mkdir -p "$NMROOT" && tar -xJf /tmp/nim.tar.xz -C "$NMROOT" --strip-components=1
              export PATH="$NMROOT/bin:$PATH"
            fi
            [ "${{ inputs.runner }}" = "h2-arm64" ] && sudo apt-get update -qq && sudo apt-get install -y -qq libpcre3
          fi
          nim --version | head -1
        timeout-minutes: 25

      # ── R2 warm: build-base-artifacts recipe (admission-check.yml:100-177) ──
      - name: R2 provision — base artifacts (bin/ax, ircheck) + manifest
        if: ${{ inputs.experiment == 'r2-admission' }}
        run: |
          set -euo pipefail
          make ci-bootstrap
          cd proofs && lake build ircheck && cd ..
          test -x proofs/.lake/build/bin/ircheck
          : > manifest.txt
          { echo "build_sha = ${{ inputs.ref }}"
            echo "recipe_id = ci-bootstrap@$(sha256sum Makefile | cut -d' ' -f1)"
          } >> manifest.txt
          for f in bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck; do
            test -x "$f" || { echo "FAIL: $f"; exit 1; }
            sha256sum "$f" >> manifest.txt
          done
        timeout-minutes: 25

      # ── R3 warm: ci-bootstrap recipe (runner-pool:240-304), 아치별 1회 ──
      - name: R3 provision — bootstrap binaries + manifest
        if: ${{ inputs.experiment == 'r3-shard' }}
        run: |
          set -euo pipefail
          make ci-compile
          : > manifest.txt
          { echo "build_sha = ${{ inputs.ref }}"
            echo "recipe_id = ci-compile@$(sha256sum Makefile | cut -d' ' -f1)"
          } >> manifest.txt
          for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas; do
            test -x "$f" || { echo "FAIL: $f"; exit 1; }
            sha256sum "$f" >> manifest.txt
          done
        timeout-minutes: 25

      - name: Upload experiment payload (exp- 네임스페이스 artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # R2: 페이로드는 항상 H1 빌드(h1-x64 접미사 고정) — H3 레그가 동일 바이트 소비
          # R3: 아치별 1회 빌드 → runner 접미사로 분리 (동일 이름 중복 다운로드 방지)
          name: exp-h4-${{ inputs.experiment }}-${{ inputs.experiment == 'r2-admission' && 'h1-x64' || inputs.runner }}-payload
          path: |
            bin/ax
            bin/gate_hook
            bin/precompile_gates
            bin/install_ax_cas
            proofs/.lake/build/bin/ircheck
            manifest.txt
          if-no-files-found: error
          retention-days: 14

  # ── measure: 실험별 measured recipe (warm=false일 때 단독 실행) ──────────────
  measure:
    if: ${{ inputs.warm != true }}
    runs-on: ${{ inputs.runner == 'h3-slim' && 'ubuntu-slim' || (inputs.runner == 'h2-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: ${{ inputs.runner == 'h3-slim' && 14 || 45 }}
    permissions:
      contents: read
      actions: read   # exp 페이로드 download-artifact
    env:
      AXIOM_PROVE_WORKERS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          clean: true
          fetch-depth: 0

      # 툴체인: H1/H2 = setup-axiom-toolchain restore-only / H3 = slim-프로파일
      - uses: ./.github/actions/setup-axiom-toolchain
        if: ${{ inputs.runner != 'h3-slim' }}
        with:
          cache-save-enabled: 'false'
          cache-build-source: exp-${{ inputs.ref }}
      - name: Slim-profile toolchain (H3 전용 — apt 불가, B13)
        if: ${{ inputs.runner == 'h3-slim' }}
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          if curl -sSfL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim-init.sh \
             && sh /tmp/choosenim-init.sh -y; then
            export PATH="$HOME/.nimble/bin:$PATH"
          else
            NIMV=2.2.10
            curl -sSfL "https://nim-lang.org/download/nim-${NIMV}-linux_x64.tar.xz" -o /tmp/nim.tar.xz
            mkdir -p "$HOME/.nim-official"
            tar -xJf /tmp/nim.tar.xz -C "$HOME/.nim-official" --strip-components=1
            export PATH="$HOME/.nim-official/bin:$PATH"
          fi
          Z3V=4.13.3
          curl -sL "https://github.com/Z3Prover/z3/releases/download/z3-${Z3V}/z3-${Z3V}-x64-glibc-2.35.zip" -o /tmp/z3.zip
          unzip -q /tmp/z3.zip -d /tmp/z3 && find /tmp/z3 -name z3 -type f -exec cp {} /tmp/z3bin \; -quit
          export PATH="/tmp/z3bin:$PATH"
          # libpcre3 slim 존재 프로브 (action.yml:250 패턴) — 부재 시 fail-closed
          ldconfig -p | grep -q 'libpcre\.so\.3' \
            || { echo "::error::FAIL: libpcre.so.3 absent on slim (B13) — H3 job-2 실행 불가"; exit 1; }

      # provisioning 전제 확인 (fail-closed — gateway-jobs-measure.yml:196-202 패턴)
      - name: 'Download exp payload (R2: H1 키트 / R3: 해당 아치 키트)'
        if: ${{ inputs.experiment != 'r1-select' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exp-h4-${{ inputs.experiment }}-${{ inputs.experiment == 'r2-admission' && 'h1-x64' || inputs.runner }}-payload
          path: ${{ github.workspace }}

      - name: Verify provisioned prerequisites (fail-closed)
        run: |
          set -euo pipefail
          case "${{ inputs.experiment }}" in
            r1-select)
              git rev-parse --verify HEAD >/dev/null
              echo "r1: fixed ref checked out (${{ inputs.ref }})" ;;
            r2-admission)
              test -x bin/ax && test -x bin/install_ax_cas && test -x proofs/.lake/build/bin/ircheck \
                || { echo "FAIL: payload missing — warm dispatch 먼저 (${{ inputs.experiment }})"; exit 1; }
              awk -F' = ' '/^build_sha =/{print $2; exit}' manifest.txt | grep -qx "${{ inputs.ref }}" \
                || { echo "FAIL: build_sha != ref — B 페이로드 아님"; exit 1; }
              ./bin/ax --version >/dev/null ;;
            r3-shard)
              for f in bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas; do
                test -x "$f" || { echo "FAIL: $f missing — warm dispatch 먼저"; exit 1; }
              done
              awk -F' = ' '/^build_sha =/{print $2; exit}' manifest.txt | grep -qx "${{ inputs.ref }}" ;;
          esac
          echo "iter=${{ inputs.iter }} runner=${{ inputs.runner }} ref=${{ inputs.ref }} arch=$(uname -m)"

      # ── R1 measured: select recipe (runner-pool:92-158), 양쪽 byte-동일 ──
      - name: 'Measured R1 — select (impact-closure, --require-certain)'
        if: ${{ inputs.experiment == 'r1-select' }}
        run: |
          set -euo pipefail
          export CHOOSENIM_NO_COLOR=1 CHOOSE_NIM_QUIET=1
          curl -sSf https://nim-lang.org/choosenim/init.sh | sh -s -- -y
          "$HOME/.nimble/bin/choosenim" 2.2.10
          export PATH="$HOME/.nimble/bin:$PATH"
          nim --version | grep -F '2.2.10'
          nim c --hints:off --skipParentCfg --skipProjCfg --path:src -o:bin/impact-closure tools/ci/impact_closure_selector.nim
          nim c --hints:off --skipParentCfg --skipProjCfg --path:src -o:bin/proof_reconcile_gate tools/ci/proof_reconcile_gate.nim
          set +e
          bin/impact-closure --base HEAD~1 --head HEAD --output decision-report.json --decision-out decision.json --require-certain
          rc=$?
          set -e
          case "$rc" in 0|2) ;; *) echo "FAIL: selector exit $rc"; exit 1;; esac
          jq -r .mode decision.json
        timeout-minutes: 12

      # ── R2 measured: admission job-2 커널 실행부 (admission-check.yml:193-507) ──
      - name: '[candidate] Checkout H into _candidate/ (data-only, R2 전용)'
        if: ${{ inputs.experiment == 'r2-admission' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.h-sha }}
          path: _candidate
          clean: true
          fetch-depth: 1

      - name: 'Measured R2 — admission job-2 kernel (B-built bin/ax)'
        if: ${{ inputs.experiment == 'r2-admission' }}
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          # pin-identity: production의 PR-API 재도출(admission-check.yml:262-293) 대체 —
          # API 지연은 러너 클래스와 무관한 노이즈라 양측 공통 제외(프로토콜 §2 R2).
          B="${{ inputs.b-sha }}"; H="${{ inputs.h-sha }}"; TREE="${{ inputs.tree-oid }}"
          printf '%s' "$B" | grep -qE '^[0-9a-f]{40}$' || { echo "FAIL: b-sha"; exit 1; }
          printf '%s' "$H" | grep -qE '^[0-9a-f]{40}$' || { echo "FAIL: h-sha"; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE/_candidate" rev-parse 'HEAD^{tree}')" = "$TREE" \
            || { echo "FAIL: treeOID mismatch"; exit 1; }
          chmod +x bin/ax bin/install_ax_cas proofs/.lake/build/bin/ircheck
          # (1) D9 evidence staging (admission-check.yml:305-369 포트 — draft@B + funcSource@H)
          WORK="$GITHUB_WORKSPACE"; CAND="$WORK/_candidate"
          DRAFT="$WORK/data/certification/evidence-draft.json"
          OUT="$WORK/data/trusted/evidence/draft-assembled.json"
          [ -f "$DRAFT" ] || { echo "FAIL: evidence-draft.json missing at ref"; exit 1; }
          mkdir -p "$WORK/data/trusted/evidence"
          parsed="$(sed -E 's|^[[:space:]]*//.*$||' "$DRAFT" | jq -e .)" || exit 1
          LEAN_SOURCE="$(printf '%s' "$parsed" | jq -r '.leanSource')"
          SMTLIB2="$(printf '%s' "$parsed" | jq -r '.smtlib2')"
          FUNC_SOURCE="$(printf '%s' "$parsed" | jq -r '.funcSource')"
          FUNC_PATH="$(printf '%s' "$parsed" | jq -r '.funcPath')"
          TID="$(printf '%s' "$parsed" | jq -r '.toolchainIdentity')"
          h_src="$(git -C "$CAND" show "$H:$FUNC_PATH" 2>/dev/null)" \
            || { echo "FAIL: git show $FUNC_PATH@H"; exit 1; }
          [ "$h_src" = "$FUNC_SOURCE" ] || { echo "FAIL: funcSource byte-match vs H"; exit 1; }
          POLICY_DIGEST="$(sha256sum "$WORK/config/policy/merge_admission.json" | cut -d' ' -f1)"
          SCOPE_DIGEST="$(sha256sum "$WORK/data/verification_scope.lock" | cut -d' ' -f1)"
          ENV_DIGEST="$(printf 'axiom-attestation-env-v1|%s' "$TID" | sha256sum | cut -d' ' -f1)"
          jq -n --arg pr "${{ inputs.pr-number }}" --arg lean "$LEAN_SOURCE" \
            --arg smt "$SMTLIB2" --arg func "$FUNC_SOURCE" --arg fp "$FUNC_PATH" \
            --arg pd "$POLICY_DIGEST" --arg sd "$SCOPE_DIGEST" --arg ed "$ENV_DIGEST" \
            --arg tid "$TID" \
            '{schemaVersion:"axiom.attestation.evidence.v1", subjectId:"0000000000000000000000000000000000000000",
              prNumber:$pr, prHeadSha:"${{ inputs.h-sha }}", leanSource:$lean, smtlib2:$smt,
              funcSource:$func, funcPath:$fp, policyDigest:$pd, scopeDigest:$sd,
              envDigest:$ed, toolchainIdentity:$tid}' > "$OUT"
          jq -e . "$OUT" >/dev/null
          # (2) subject-register + attest --witness-only (admission-check.yml:377-439)
          REG_OUT="$(bin/ax cert subject-register --base "$B" --head-tree "$TREE" \
            --pr "${{ inputs.pr-number }}" --evidence "$OUT" 2>&1)" || { echo "$REG_OUT"; exit 1; }
          SID="$(printf '%s\n' "$REG_OUT" | sed -n 's/.*Subject registered: \([0-9a-f]\{64\}\).*/\1/p')"
          printf '%s' "$SID" | grep -qE '^[0-9a-f]{64}$' || { echo "FAIL: subjectId parse"; exit 1; }
          jq --arg sid "$SID" '.subjectId = $sid' "$OUT" > "data/trusted/evidence/$SID.json"
          bin/ax cert attest --witness-only --ref "$H" --pr "${{ inputs.pr-number }}" \
            --evidence "$WORK/data/trusted/evidence/$SID.json" --merge-sha "${{ github.sha }}" \
            --tool-commit "$B" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" \
            --out witness.json
          sha256sum witness.json | awk '{print $1}' > witness.sha256
          # (3) D6 ledger consult + scope/baseline + merge dry-run (:449-507)
          GITHUB_TOKEN="$GITHUB_TOKEN" bin/ax cert ledger-list | grep -qx "$SID" || true
          ./bin/install_ax_cas
          bin/ax scope hash
          bin/ax baseline check
          GITHUB_TOKEN="$GITHUB_TOKEN" bin/ax merge "${{ inputs.pr-number }}" --dry-run --json \
            > admission-verdict.log 2>&1 || { tail -20 admission-verdict.log; exit 1; }
          echo "R2 KERNEL OK — B=${B:0:12} H=${H:0:12} PR=#${{ inputs.pr-number }}"
        timeout-minutes: 30

      # ── R3 measured: gateway-shard SHARD_COUNT=8 INDEX=0 (runner-pool:382-429) ──
      - name: 'Measured R3 — gateway shard partition 0/8'
        if: ${{ inputs.experiment == 'r3-shard' }}
        run: |
          set -euo pipefail
          chmod +x bin/ax bin/gate_hook bin/precompile_gates bin/install_ax_cas
          make ci-bootstrap-cheap
          make test-gateway-shard-audit SHARD_COUNT=8
          mkdir -p bin build
          nim c --hints:off -d:release -o:bin/run_gate src/cli/run_gate.nim
          nim c --hints:off -d:release -o:bin/nimtry src/gate/nimtry.nim
          nim c --hints:off -d:release -o:build/git_wrapper src/gate/utils/git_wrapper.nim
          nim c --hints:off -d:release -o:build/command_policy_gate src/gate/utils/command_policy_gate.nim
          nim c --hints:off -d:release -o:bin/hotspot_coverage_gate src/gate/runners/hotspot_coverage_gate.nim
          nim c --hints:off -d:release -o:bin/conflict_marker_gate src/gate/runners/conflict_marker_gate.nim
          nim c --hints:off -d:release -o:bin/golden_master_gate src/gate/runners/golden_master_gate.nim
          nim c --hints:off -d:release -o:bin/all_gateway_runner tests/gateway/all_gateway_runner.nim
          mapfile -t FILES < <(ls tests/gateway/*_feature_test.nim | sort | awk -v s=0 -v n=8 'NR % n == s')
          echo "shard_files=${#FILES[@]}"
          AXIOM_JOBS=2 ./bin/all_gateway_runner --skip-known-failing=config/known_failing_gateway.txt \
            --probe-known-failing --junit-output=build/gateway-junit.xml "${FILES[@]}"
          test -f build/gateway-junit.xml
        timeout-minutes: 30

      - name: Upload measured junit/records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exp-h4-${{ inputs.experiment }}-${{ inputs.runner }}-i${{ inputs.iter }}
          path: |
            build/gateway-junit.xml
            decision.json
            decision-report.json
            witness.json
          if-no-files-found: warn
          retention-days: 14